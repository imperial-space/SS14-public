- type: ambientMusic
  id: General
  sound:
    params:
      volume: -12
    collection: AmbienceGeneral
  rules: AlwaysTrue

- type: soundCollection
  id: AmbienceGeneral
  files:
    - /Audio/Ambience/ambicave.ogg
    - /Audio/Ambience/ambicave1.ogg
    - /Audio/Ambience/ambicave2.ogg
    - /Audio/Ambience/ambicave3.ogg
    - /Audio/Ambience/ambicave4.ogg
    - /Audio/Ambience/ambicave5.ogg
    - /Audio/Ambience/ambicave6.ogg
    - /Audio/Ambience/ambicave7.ogg
    - /Audio/Ambience/ambicave8.ogg
    - /Audio/Ambience/ambicave9.ogg
    - /Audio/Ambience/ambicave10.ogg

## Background noise on station, separate to ambient music.
- type: soundCollection
  id: AmbienceStation
  files:
    - /Audio/Ambience/shipambience.ogg

- type: rules
  id: AlwaysTrue
  rules:
    - !type:AlwaysTrueRule

- type: rules
  id: InSpace
  rules:
    - !type:InSpaceRule
    - !type:GridInRangeRule
      inverted: true
      range: 3

# TODO
- type: rules
  id: NearEngineering
  rules:
    - !type:NearbyAccessRule
      access:
        - Engineering
      range: 2.5

- type: rules
  id: NearMaintenance
  rules:
    - !type:NearbyTilesPercentRule
      ignoreAnchored: true
      percent: 0.25
      tiles:
        - Plating
      range: 2

- type: rules
  id: NearTrain
  rules:
    - !type:NearbyTilesPercentRule
      ignoreAnchored: true
      percent: 0.05
      tiles:
        - TrainLattice
      range: 4

- type: rules
  id: NearMedical
  rules:
    - !type:NearbyTilesPercentRule
      ignoreAnchored: true
      percent: 0.5
      tiles:
      - FloorWhite
      range: 3

- type: rules
  id: NearPrayable
  rules:
    - !type:NearbyComponentsRule
      anchored: true
      components:
        - type: Prayable
      range: 5

- type: rules
  id: NearMorgue
  rules:
    - !type:NearbyComponentsRule
      anchored: true
      count: 2
      components:
        - type: Morgue
      range: 3

- type: rules
  id: NearSpookyFog
  rules:
    - !type:NearbyEntitiesRule
      count: 5
      whitelist:
        tags:
          - SpookyFog
      range: 4

- type: rules
  id: OnMapGrid
  rules:
    - !type:OnMapGridRule
