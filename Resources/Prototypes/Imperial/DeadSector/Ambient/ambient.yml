- type: entity
  id: TimedSpawnerAmbientbirds
  parent: MarkerBase
  suffix: DeadSector, SFX
  components:
    - type: Sprite
      layers:
        - sprite: Markers/cross.rsi
          state: red
        - state: timed
    - type: Timer
    - type: TimedSpawner
      prototypes:
        - Ambientbirds1
        - Ambientbirds2
        - Ambientbirds3
        - Ambientbirds4
      chance: 0.8
      intervalSeconds: 85
      minimumEntitiesSpawned: 1
      maximumEntitiesSpawned: 1

- type: entity
  id: Ambientbirds1
  components:
  - type: AmbientSound
    volume: -5
    range: 11
    sound:
      path: /Audio/Imperial/DeadSector/Sound/Ambient/Alive/birds1.ogg
  - type: TimedDespawn
    lifetime: 40
  - type: Tag
    tags:
    - HideContextMenu

