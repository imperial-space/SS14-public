
- type: entity
  parent: BaseItem
  id: spacecash1
  name: federation spacecash
  description: You gotta have money.
  suffix: DeadSector, Other
  components:
  - type: Cash
  - type: Item
    shape:
    - 0,0,1,0
    storedOffset: 0,-2
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Credit: 5
  - type: StaticPrice
    price: 0
  - type: Stack
    stackType: spacecashCredit
    count: 1
    baseLayer: base
    layerStates:
    - spacecash1
    - spacecash10
    - spacecash100
    - spacecash500
    - spacecash1000
    - spacecash2500
    - spacecash5000
    - spacecash10000
    - spacecash20000
    - spacecash30000
    - spacecash100000
    - spacecash1000000
    layerFunction: Threshold
  - type: StackLayerThreshold
    thresholds: [10, 100, 100, 500, 1000, 2500, 5000, 10000, 20000, 30000, 100000, 1000000]
  - type: Sprite
    sprite: Imperial/DeadSector/items/Cash.rsi
    state: spacecash1
    layers:
    - state: spacecash1
      map: ["base"]
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        density: 30
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.2,0.25,0.1"
        mask:
        - ItemMask
  - type: Appearance
  - type: Currency
    price:
      spacecashCredit: 1

- type: currency
