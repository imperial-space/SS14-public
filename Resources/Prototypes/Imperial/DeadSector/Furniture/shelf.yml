- type: entity
  parent: BaseStructure
  id: ShelfDeadSector
  name: shelf
  suffix: DeadSector, Structure
  description: A floor-standing shelf, ready to hold anything you can fit on it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Objects
    sprite: Imperial/DeadSector/Furniture/shelf.rsi
    state: base
    offset: 0, 0.5
  - type: Storage
    grid:
    - 0,0,7,3
    maxItemSize: Normal
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
