- type: entity
  parent: FoodMeatBase
  id: SausagePopularDeadSector
  name: popular sausage
  suffix: DeadSector, Food
  description: Slightly fatty, the most ordinary sausage, for soft people.
  components:
  - type: Sprite
    sprite: Imperial/DeadSector/Food/sausage_1.rsi
    state: full
    scale: 0.85, 0.85
  - type: SliceableFood
    count: 5
    slice: SausagePopularSliceDeadSector
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 20
  - type: Tag
    tags:
    - Meat

- type: entity
  parent: FoodMeatBase
  id: SausagePopularSliceDeadSector
  name: sausage slice
  suffix: DeadSector, Food
  description: Slightly fatty, the most ordinary sausage, for soft people.
  components:
  - type: Item
    size: Tiny
    shape:
    - 0,0,0,0
  - type: Sprite
    sprite: Imperial/DeadSector/Food/sausage_1.rsi
    state: slice
    scale: 0.85, 0.85
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
  - type: Tag
    tags:
    - Meat
  - type: FoodSequenceElement
    entries:
      DeadSectorSandwich: DeadSectorSausagePopularElement

