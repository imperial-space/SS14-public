- type: entity
  parent: BaseFoodCondiment
  id: KetchupBottleDeadSector
  name: ketchup bottle
  suffix: DeadSector, Food
  description: A bottle of ketchup. You feel more American already.
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Ketchup
          Quantity: 30
  - type: Sprite
    sprite: Imperial/DeadSector/Food/ketchup.rsi
    layers:
    - state: icon
      map: ["enum.OpenableVisuals.Layer"]
  - type: Icon
    sprite: Imperial/DeadSector/Food/ketchup.rsi
    state: icon
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "icon-open"}
          False: {state: "icon"}
  - type: Edible
    edible: Drink
    solution: food
    destroyOnEmpty: false
    utensil: None
  - type: Openable
    sound:
      collection: pop
    closeable: true
  - type: RefillableSolution
    solution: food
  - type: Spillable
    solution: food
  - type: SolutionTransfer
    canChangeTransferAmount: true
    minTransferAmount: 5
    maxTransferAmount: 30
  - type: PhysicalComposition
    materialComposition:
      Glass: 50
  - type: Tag
    tags:
    - Ketchup

