# Food sequence tags for the DeadSector bread slices and sausage slices.

- type: Tag
  id: DeadSectorSandwich

- type: Tag
  id: DeadSectorSausagePopular

- type: Tag
  id: DeadSectorSausageProfsoyuznaya

# Layers shown while a sausage slice lies on a bread slice.

- type: foodSequenceElement
  id: DeadSectorSausagePopularElement
  sprites:
  - sprite: Imperial/DeadSector/Food/sausage_1.rsi
    state: slice
  scale: 0.5, 0.5
  tags:
  - DeadSectorSausagePopular

- type: foodSequenceElement
  id: DeadSectorSausageProfsoyuznayaElement
  sprites:
  - sprite: Imperial/DeadSector/Food/sausage_2.rsi
    state: slice
  scale: 0.5, 0.5
  tags:
  - DeadSectorSausageProfsoyuznaya

- type: metamorphRecipe
  id: DeadSectorSandwichPopular
  key: DeadSectorSandwich
  result: SandwichWhitePopularDeadSector
  rules:
  - !type:SequenceLength
    range:
      min: 1
      max: 1
  - !type:IngredientsWithTags
    tags:
    - DeadSectorSausagePopular
    count:
      min: 1
      max: 1

- type: metamorphRecipe
  id: DeadSectorSandwichProfsoyuznaya
  key: DeadSectorSandwich
  result: SandwichWhiteProfsoyuznayaDeadSector
  rules:
  - !type:SequenceLength
    range:
      min: 1
      max: 1
  - !type:IngredientsWithTags
    tags:
    - DeadSectorSausageProfsoyuznaya
    count:
      min: 1
      max: 1
