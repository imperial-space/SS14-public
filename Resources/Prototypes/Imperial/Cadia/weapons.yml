# Кадия: оружие Астра Милитарум и Адептус Астартес. Стрелковое питается от сменных обойм (War/ammo.yml), спрайты свои:
# иконка, в руках и за спиной во всех четырёх направлениях.

# Основа стрелкового оружия: сменная обойма в слоте, заряжают её, а не само оружие.
- type: entity
  abstract: true
  parent: BaseItem
  id: CadiaMagGunBase
  components:
  - type: Item
    size: Large
  - type: Clothing
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: MagazineAmmoProvider
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: Appearance

# ─── Лазерное оружие ───

- type: entity
  parent: CadiaMagGunBase
  id: CadiaLasgun
  name: Kantrael M36 lasgun
  description: The standard-issue lasgun of the Cadian Shock Troops. Reliable, rechargeable and as Cadian as a frown.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/Weapons/lasgun.rsi
    state: icon
  - type: Item
    size: Large
    sprite: Imperial/Cadia/Weapons/lasgun.rsi
  - type: Clothing
    sprite: Imperial/Cadia/Weapons/lasgun.rsi
  - type: Gun
    fireRate: 3
    projectileSpeed: 30
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/Imperial/Cadia/Weapons/las_fire.ogg
      params:
        variation: 0.06
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CadiaLasPack
        insertSound: /Audio/Imperial/Cadia/Weapons/laspack_in.ogg
        ejectSound: /Audio/Imperial/Cadia/Weapons/laspack_out.ogg
        priority: 2
        whitelist:
          tags:
          - CadiaLasPack
        whitelistFailPopup: gun-magazine-whitelist-fail

- type: entity
  parent: CadiaMagGunBase
  id: CadiaLaspistol
  name: Kantrael laspistol
  description: A compact laspistol carried by Cadian officers and sergeants.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/Weapons/laspistol.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Imperial/Cadia/Weapons/laspistol.rsi
  - type: Clothing
    sprite: Imperial/Cadia/Weapons/laspistol.rsi
    slots:
    - belt
  - type: Gun
    fireRate: 2
    projectileSpeed: 28
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Imperial/Cadia/Weapons/laspistol_fire.ogg
      params:
        variation: 0.06
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CadiaLaspistolPack
        insertSound: /Audio/Imperial/Cadia/Weapons/laspack_in.ogg
        ejectSound: /Audio/Imperial/Cadia/Weapons/laspack_out.ogg
        priority: 2
        whitelist:
          tags:
          - CadiaLaspistolPack
        whitelistFailPopup: gun-magazine-whitelist-fail

- type: entity
