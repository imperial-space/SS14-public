    sprite: Imperial/Cadia/Weapons/krak.rsi
  - type: Item
    sprite: Imperial/Cadia/Weapons/krak.rsi
  - type: Explosive
    explosionType: Default
    maxIntensity: 40
    intensitySlope: 10
    totalIntensity: 160
    canCreateVacuum: false
