- type: entity
  parent: CadiaMagGunBase
  id: CadiaPlasmaGun
  name: plasma gun
  description: A sacred and temperamental weapon that fires bolts of superheated plasma. Pray to the machine spirit before pulling the trigger.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/Weapons/plasmagun.rsi
    state: icon
  - type: Item
    size: Large
    sprite: Imperial/Cadia/Weapons/plasmagun.rsi
  - type: Clothing
    sprite: Imperial/Cadia/Weapons/plasmagun.rsi
  - type: Gun
    fireRate: 1
    projectileSpeed: 22
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Imperial/Cadia/Weapons/plasma_fire.ogg
      params:
        variation: 0.06
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CadiaPlasmaFlask
        insertSound: /Audio/Imperial/Cadia/Weapons/laspack_in.ogg
