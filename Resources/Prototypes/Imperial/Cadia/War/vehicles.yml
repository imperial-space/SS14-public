# ─── Кабина ───

- type: entity
  abstract: true
  id: CadiaCabinFixtureBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static

- type: entity
  abstract: true
  parent: CadiaCabinFixtureBase
  id: CadiaCabinSeatBase
  components:
  - type: Strap
    position: Stand
    buckleOffset: "0,-0.05"

- type: entity
  parent: CadiaCabinSeatBase
  id: CadiaVehicleDriverSeat
  name: driver's seat
  description: Levers, a vision slit and a worn seat. Buckle in to take the controls.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/cabin.rsi
    state: driver_seat
    noRot: true
  - type: CadiaVehicleSeat
    seat: Driver

- type: entity
  parent: CadiaCabinSeatBase
  id: CadiaVehicleGunnerSeat
  name: gunner's seat
  description: The auspex scope and traverse wheel of the main gun. Buckle in to take the turret.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/cabin.rsi
    state: gunner_seat
    noRot: true
  - type: CadiaVehicleSeat
    seat: Gunner

- type: entity
  parent: CadiaCabinSeatBase
  id: CadiaVehicleBench
  name: troop bench
  description: A hard steel bench with a harness for one guardsman.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/cabin.rsi
    state: bench
    noRot: true
  - type: CadiaVehicleSeat
    seat: Passenger

- type: entity
  parent: CadiaCabinFixtureBase
  id: CadiaVehicleHatch
  name: vehicle hatch
  description: The way out. Use the key on it to lock or unlock the vehicle.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/cabin.rsi
    state: hatch
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: CadiaVehicleHatch

- type: entity
  parent: CadiaCabinFixtureBase
  id: CadiaVehicleBreech
  name: cannon breech
  description: The breech of the main gun. Each shell is loaded by hand, and the gun will not fire without one.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/cabin.rsi
    noRot: true
    layers:
    - state: breech
      map: [ "base" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 1000
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CadiaVehicleVisuals.Loaded:
        base:
          True: { state: breech }
          False: { state: breech_empty }
  - type: CadiaVehicleBreech

- type: entity
  parent: CadiaCabinFixtureBase
  id: CadiaAmmoRack
  name: ammunition rack
  description: Racked shells for the main gun. Take one by hand; spare shells can be put back.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/cabin.rsi
    noRot: true
    layers:
    - state: rack
      map: [ "base" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 1000
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CadiaVehicleVisuals.RackFull:
        base:
          True: { state: rack }
          False: { state: rack_empty }
  - type: CadiaAmmoRack

- type: entity
  parent: CadiaVoxSpeaker
  id: CadiaVehicleSpeaker
  name: vehicle vox speaker
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/cabin.rsi
    state: speaker
    drawdepth: WallMountedItems
    noRot: true

- type: entity
  parent: BaseItem
  id: CadiaVehicleKey
  name: vehicle key
  description: A heavy iron key stamped with the vehicle's hull number. Use it on the hull or the hatch to lock or unlock the vehicle.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/cabin.rsi
    state: key
  - type: Item
    size: Tiny
  - type: CadiaVehicleKey

- type: entity
  parent: BaseItem
  id: CadiaTankShell
  name: battle cannon shell
  description: A brass-cased shell as long as a guardsman's arm. It goes into the breech of a battle cannon.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/cabin.rsi
    state: shell
  - type: Item
    size: Large
  - type: CadiaTankShell

# Голограмма визора: висит перед владельцем, пока открыта карта.
- type: entity
  id: CadiaHoloProjection
  name: hololith projection
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: Imperial/Cadia/War/holo_projection.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: map
      shader: unshaded
  - type: PointLight
    radius: 1.5
    energy: 0.9
    color: "#5aff78"
  - type: Tag
    tags:
    - HideContextMenu

# ─── Действия экипажа ───

- type: entity
  parent: BaseAction
  id: ActionCadiaVehicleExit
  name: Leave vehicle
  description: Climb out of the vehicle.
  components:
  - type: Action
    icon: { sprite: Imperial/Cadia/War/vehicle_icons.rsi, state: exit }
    useDelay: 1
  - type: InstantAction
    event: !type:CadiaVehicleExitActionEvent

- type: entity
  parent: BaseAction
  id: ActionCadiaVehicleSwitch
  name: Switch weapon
  description: Switch between the vehicle's weapons.
  components:
  - type: Action
    icon: { sprite: Imperial/Cadia/War/vehicle_icons.rsi, state: switch }
  - type: InstantAction
    event: !type:CadiaVehicleSwitchActionEvent

- type: entity
  parent: BaseAction
  id: ActionCadiaVehicleSmoke
  name: Smoke launchers
  description: Fire the smoke launchers to screen the vehicle.
  components:
  - type: Action
    icon: { sprite: Imperial/Cadia/War/vehicle_icons.rsi, state: smoke }
    useDelay: 3
  - type: InstantAction
    event: !type:CadiaVehicleSmokeActionEvent
