# Техника Кадии: Леман Расс и Химера с кабиной (люк, ключ, кресла, казённик), Часовой — экипаж прямо в корпусе.

# Броня техники: лазганы и пули почти бессильны, выручают взрывчатка (ракеты, крак-гранаты, снаряды) и мельта.
- type: damageModifierSet
  id: CadiaVehicleArmor
  coefficients:
    Blunt: 0.35
    Slash: 0.1
    Piercing: 0.25
    Heat: 0.35
    Shock: 0.5
    Structural: 1.5
  flatReductions:
    Blunt: 4
    Piercing: 6
    Heat: 4
    Slash: 8

- type: entity
  abstract: true
  id: CadiaVehicleBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    noRot: false
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CadiaVehicleArmor
  - type: ExplosionResistance
    damageCoefficient: 1.2
  - type: Repairable
    fuelCost: 20
    doAfterDelay: 12
  - type: AmbientSound
    range: 10
    volume: -4
    sound:
      path: /Audio/Effects/Vehicle/vehicleengineidle.ogg
  - type: Appearance

# ─── Леман Расс: основной боевой танк ───

- type: entity
  parent: CadiaVehicleBase
  id: CadiaLemanRuss
  name: Leman Russ battle tank
  description: The iron backbone of the Astra Militarum. Thick armour, a battle cannon that levels buildings and a hull-mounted heavy bolter. Driver steers with W/S and turns with A/D; the gunner traverses the turret with the mouse.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/vehicles.rsi
    drawdepth: OverMobs
    noRot: false
    layers:
    - state: russ_hull
    - state: russ_turret
      offset: 0,0.25
      map: [ "turret" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.2,-1.35,1.2,1.35"
        density: 4000
        mask:
        - MobMask
        - DoorPassable
        layer:
        - LargeMobLayer
  - type: PointLight
    radius: 4
    energy: 1.2
    color: "#fff2c8"
    offset: 0,1.6
  - type: CadiaVehicle
    wreck: CadiaWreckRuss
    maxIntegrity: 1400
    interior: true
    rackShells: 12
    hasGunnerSeat: true
    passengers: 0
    tankControls: true
    speed: 2.6
    reverseSpeed: 1.4
    turnRate: 55
    hasTurret: true
    turretTurnRate: 45
    muzzleOffset: 2.1
    weapons:
    - name: cadia-vehicle-weapon-battlecannon
      projectile: CadiaBattleCannonShell
      speed: 30
      spread: 0.8
      cooldown: 5
      ammo: 40
      maxAmmo: 40
      kick: 3
      breech: true
      sound:
        path: /Audio/Imperial/Cadia/Weapons/battlecannon_fire.ogg
    - name: cadia-vehicle-weapon-heavybolter
      projectile: CadiaHeavyBoltRound
      speed: 35
      spread: 4
      cooldown: 0.15
      automatic: true
      ammo: 600
      maxAmmo: 600
      sound:
        path: /Audio/Imperial/Cadia/Weapons/heavybolter_fire.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/explosion_small1.ogg
      - !type:ExplodeBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Explosive
    explosionType: Default
    maxIntensity: 10
    intensitySlope: 3
    totalIntensity: 120
    canCreateVacuum: false

