# Корабли Хаоса: декор отсеков (спрайты PixelLab, 32×32), свет и звук. Корпуса строятся по chaos_dropship.txt и chaos_bomber.txt.

- type: entity
  parent: CadiaDecorPassableBase
  id: CadiaShipBannerLegion
  name: Black Legion banner
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/chaos_ship.rsi
    state: banner_legion

- type: entity
  parent: CadiaDecorPassableBase
  id: CadiaShipBannerStar
  name: chaos war banner
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/chaos_ship.rsi
    state: banner_star

- type: entity
  parent: CadiaDecorBase
