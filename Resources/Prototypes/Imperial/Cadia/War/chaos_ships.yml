    sprite: Imperial/Cadia/War/chaos_ship.rsi
    state: trophy_rack

- type: entity
  parent: CadiaDecorBase
  id: CadiaShipBrazier
  name: chaos brazier
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/chaos_ship.rsi
    state: brazier
  - type: PointLight
    radius: 4
    energy: 2
    color: "#ff5a2a"
  - type: LightBehaviour
    behaviours:
    - !type:RandomizeBehaviour
      interpolate: Nearest
      minDuration: 0.08
      maxDuration: 0.3
      startValue: 1.6
      endValue: 2.4
      property: Energy
      isLooped: true
      enabled: true
  - type: AmbientSound
    range: 4
    volume: -8
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg

