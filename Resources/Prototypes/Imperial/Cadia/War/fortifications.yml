# Укрепления: ДОТ, ПТО, пулемётное гнездо, миномёт, противотанковая мина.
# Орудия — это неподвижная техника: та же наводка, боезапас и табло, что у машин.

- type: entity
  abstract: true
  parent: CadiaVehicleBase
  id: CadiaFortBase
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
    fixedRotation: true
  - type: AmbientSound
    enabled: false
    range: 1
    volume: -20
    sound:
      path: /Audio/Effects/Vehicle/vehicleengineidle.ogg

# ─── Открытые орудийные позиции: боец садится за орудие прямо на позиции ───

- type: entity
  abstract: true
  parent: CadiaFortBase
  id: CadiaGunPostBase
  components:
  # Боец пристёгивается к позиции и остаётся на виду.
  - type: Strap
    position: Stand
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.48,-0.48,0.48,0.48"
        density: 800
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
  parent: CadiaGunPostBase
  id: CadiaAtGun
  name: anti-tank gun
  description: A long-barrelled gun in a sandbag pit. One shell can gut a tank, and it is little use against anything smaller. Refill it with a flak ammunition crate.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/fort.rsi
    drawdepth: Objects
    noRot: true
    layers:
    - state: atgun_base
    - state: atgun_gun
      map: [ "turret" ]
  - type: CadiaVehicle
    maxIntegrity: 500
    gunPost: true
    hasGunnerSeat: false
    driverIsGunner: true
    passengers: 0
    tankControls: true
    speed: 0
    reverseSpeed: 0
    turnRate: 0
    hasTurret: true
    turretTurnRate: 35
    muzzleOffset: 1.1
    maxSmokeCharges: 0
    engineStartSound:
      path: /Audio/Machines/door_lock_off.ogg
    weapons:
    - name: cadia-vehicle-weapon-atcannon
      projectile: CadiaAtShell
      speed: 38
      spread: 0.8
      cooldown: 3.5
      ammo: 24
      maxAmmo: 24
      kick: 2
      sound:
        path: /Audio/Imperial/Cadia/Weapons/battlecannon_fire.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ExplodeBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Explosive
    explosionType: Default
    maxIntensity: 5
    intensitySlope: 3
    totalIntensity: 30
    canCreateVacuum: false

- type: entity
  parent: CadiaGunPostBase
  id: CadiaBolterNest
  name: heavy bolter nest
  description: A heavy bolter behind a horseshoe of sandbags. It chews through infantry. Refill it with a flak ammunition crate.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/fort.rsi
    drawdepth: Objects
    noRot: true
    layers:
    - state: nest_base
    - state: nest_gun
      map: [ "turret" ]
  - type: CadiaVehicle
    maxIntegrity: 400
    gunPost: true
    hasGunnerSeat: false
    driverIsGunner: true
    passengers: 0
    tankControls: true
    speed: 0
    reverseSpeed: 0
    turnRate: 0
    hasTurret: true
    turretTurnRate: 110
    muzzleOffset: 1
    maxSmokeCharges: 0
    engineStartSound:
      path: /Audio/Weapons/Guns/Cock/lmg_cock.ogg
    weapons:
    - name: cadia-vehicle-weapon-heavybolter
      projectile: CadiaHeavyBoltRound
      speed: 26
      spread: 3.5
      cooldown: 0.16
      automatic: true
      ammo: 400
      maxAmmo: 400
      sound:
        path: /Audio/Imperial/Cadia/Weapons/heavybolter_fire.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# ─── ДОТ: бетонная коробка со стенами-фикстурами, проход в южной стене, внутри можно стоять и стрелять наружу ───

- type: entity
  id: CadiaPillbox
  name: pillbox
  description: A squat ferrocrete pillbox with a gun on its cupola. Enter through the door on the south side. You can fire out of it from inside, while shots from outside nearly always stick. A grenade can be tossed in with a click.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Imperial/Cadia/War/fort_large.rsi
    state: pillbox
    drawdepth: OverMobs
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      north:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.4,1.1,1.4,1.3"
        density: 2000
        mask:
        - FullTileMask
        layer:
        - WallLayer
      west:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.4,-1.3,-1.2,1.1"
        density: 2000
        mask:
        - FullTileMask
        layer:
        - WallLayer
      east:
        shape:
          !type:PhysShapeAabb
          bounds: "1.2,-1.3,1.4,1.1"
        density: 2000
        mask:
        - FullTileMask
        layer:
        - WallLayer
      southwest:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.2,-1.3,-0.45,-1.1"
        density: 2000
        mask:
        - FullTileMask
        layer:
        - WallLayer
      southeast:
        shape:
          !type:PhysShapeAabb
          bounds: "0.45,-1.3,1.2,-1.1"
        density: 2000
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: PointLight
    radius: 2.5
    energy: 0.8
    color: "#ffd38a"
    offset: 0,-1
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Repairable
    fuelCost: 20
    doAfterDelay: 12
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2600
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/explosion_small1.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          CadiaRubble:
            min: 3
            max: 5
      - !type:ExplodeBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Explosive
    explosionType: Default
    maxIntensity: 8
    intensitySlope: 3
    totalIntensity: 70
    canCreateVacuum: false
  - type: CadiaCover
    block: 0.85
    overRange: 0
  - type: CadiaPillboxPart
  - type: CadiaPillbox

# Орудие на куполе: обычная открытая позиция, только стоит не по сетке, а точно на куполе спрайта.
- type: entity
  parent: CadiaGunPostBase
  id: CadiaPillboxGun
  name: pillbox gun
  description: A twin mount on the pillbox cupola, an anti-tank gun and a heavy bolter. Refill it with a flak ammunition crate.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: false
    noRot: true
  - type: Sprite
    sprite: Imperial/Cadia/War/fort.rsi
    drawdepth: Doors
    noRot: true
    layers:
    - state: pillbox_gun
      scale: 0.72,0.72
      map: [ "turret" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 800
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: CadiaVehicle
    maxIntegrity: 900
    gunPost: true
    hasGunnerSeat: false
    driverIsGunner: true
    passengers: 0
    tankControls: true
    speed: 0
    reverseSpeed: 0
    turnRate: 0
    hasTurret: true
    turretTurnRate: 70
    muzzleOffset: 1.1
    maxSmokeCharges: 0
    engineStartSound:
      path: /Audio/Machines/door_lock_off.ogg
    weapons:
    - name: cadia-vehicle-weapon-atcannon
      projectile: CadiaAtShell
      speed: 38
      spread: 0.6
      cooldown: 4
      ammo: 24
      maxAmmo: 24
      kick: 2
      sound:
        path: /Audio/Imperial/Cadia/Weapons/battlecannon_fire.ogg
    - name: cadia-vehicle-weapon-heavybolter
      projectile: CadiaHeavyBoltRound
      speed: 26
      spread: 3
      cooldown: 0.16
      automatic: true
      ammo: 600
      maxAmmo: 600
      sound:
        path: /Audio/Imperial/Cadia/Weapons/heavybolter_fire.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 900
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/explosion_small1.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# Декор, который теперь стреляет: своей поворотной части у этих спрайтов нет, поэтому стрельба по кругу без башни.
- type: entity
  parent: CadiaAtGun
  id: CadiaFieldGun
  name: field gun
  components:
  - type: Sprite
    sprite: Imperial/Cadia/decor.rsi
    drawdepth: Objects
    noRot: true
    layers:
    - state: field_gun
  - type: CadiaVehicle
    hasTurret: false
    fireArc: 180
    muzzleOffset: 0.8

- type: entity
  parent: CadiaBolterNest
  id: CadiaHeavyBolterNest
  name: heavy bolter emplacement
  components:
  - type: Sprite
    sprite: Imperial/Cadia/decor.rsi
    drawdepth: Objects
    noRot: true
    layers:
    - state: heavy_bolter_nest
  - type: CadiaVehicle
    hasTurret: false
    fireArc: 180
    muzzleOffset: 0.8

- type: entity
  parent: CadiaBolterNest
  id: CadiaMortar
  name: field mortar
  description: A squad mortar. Shells drop on the point under the crosshair after a few seconds, and everyone there sees the marker. Refill it with a flak ammunition crate.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/decor.rsi
    drawdepth: Objects
    noRot: true
    layers:
    - state: mortar
  - type: CadiaVehicle
    hasTurret: false
    fireArc: 180
    muzzleOffset: 0.5
    gunnerZoom: 2
    weapons:
    - name: cadia-vehicle-weapon-mortar
      projectile: CadiaBattleCannonShell
      spread: 1.5
      cooldown: 5
      ammo: 24
      maxAmmo: 24
      indirect: true
      indirectRange: 22
      indirectIntensity: 70
      sound:
        path: /Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg

# ─── Противотанковая мина: пехота проходит поверх, рвётся только под гусеницами ───

- type: entity
  parent: BaseStructure
  id: CadiaAtMine
  name: anti-tank mine
  description: A flat buried mine. It ignores anyone on foot and tears the tracks off anything heavy.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/fort_small.rsi
    state: at_mine
    drawdepth: FloorObjects
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        hard: false
        layer:
        - MidImpassable
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: CadiaTankMine

- type: entity
  parent: CadiaBoltRoundBase
  id: CadiaAtShell
  name: anti-tank shell
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 30
        Structural: 60
  - type: CadiaMassReactive
    radius: 1.2
    effect: CadiaHeavyBoltBlast
    blast:
      types:
        Piercing: 30
        Blunt: 20
        Structural: 200
    sound:
      path: /Audio/Imperial/Cadia/Weapons/heavybolt_blast.ogg
      params:
        variation: 0.08
