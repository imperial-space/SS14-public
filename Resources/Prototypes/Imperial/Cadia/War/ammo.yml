# ─── Зарядная станция и ящики ───

- type: entity
  id: CadiaPackCharger
  name: power pack charger
  description: A sanctified capacitor bank with four cradles. Place spent power packs and plasma flasks in it, and take them back charged. Right-click to take a pack out.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Imperial/Cadia/War/ammo.rsi
    state: charger
    noRot: true
    scale: 1.3,1.3
  - type: PointLight
    radius: 1.8
    energy: 1
    color: "#5aff78"
  - type: AmbientSound
    range: 4
    volume: -8
    sound:
      path: /Audio/Ambience/Objects/engine_hum.ogg
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 300
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Anchorable
  - type: ItemSlots
    slots:
      pack1:
        name: Cradle
        insertSound: /Audio/Imperial/Cadia/Weapons/laspack_in.ogg
        ejectSound: /Audio/Imperial/Cadia/Weapons/laspack_out.ogg
        whitelist:
          components:
          - CadiaEnergyPack
      pack2:
        name: Cradle
        insertSound: /Audio/Imperial/Cadia/Weapons/laspack_in.ogg
        ejectSound: /Audio/Imperial/Cadia/Weapons/laspack_out.ogg
        whitelist:
          components:
          - CadiaEnergyPack
      pack3:
        name: Cradle
        insertSound: /Audio/Imperial/Cadia/Weapons/laspack_in.ogg
        ejectSound: /Audio/Imperial/Cadia/Weapons/laspack_out.ogg
        whitelist:
          components:
          - CadiaEnergyPack
      pack4:
        name: Cradle
        insertSound: /Audio/Imperial/Cadia/Weapons/laspack_in.ogg
        ejectSound: /Audio/Imperial/Cadia/Weapons/laspack_out.ogg
        whitelist:
          components:
          - CadiaEnergyPack
  - type: ContainerContainer
    containers:
      pack1: !type:ContainerSlot
      pack2: !type:ContainerSlot
      pack3: !type:ContainerSlot
      pack4: !type:ContainerSlot
  - type: CadiaPackCharger

# ─── Депо снабжения: копит очки, выдаёт ящики. Ящик тащат руками или везут шаттлом ───

- type: entity
  id: CadiaDepot
  name: Munitorum depot
  description: The regiment's supply dump. It accumulates supplies over time; right-click to order a crate, then haul it to the line by hand or by shuttle.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Imperial/Cadia/War/fort_large.rsi
    state: depot
    drawdepth: Objects
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.3,-1.2,1.3,1.2"
        density: 2000
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/explosion_small1.ogg
      - !type:ExplodeBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Explosive
    explosionType: Default
    maxIntensity: 10
    intensitySlope: 3
    totalIntensity: 150
    canCreateVacuum: false
  - type: CadiaDepot
    entries:
    - proto: CadiaSupplyCrateAmmo
      name: cadia-depot-ammo
      cost: 10
    - proto: CadiaSupplyCrateShells
      name: cadia-depot-shells
      cost: 15
    - proto: CadiaFlakAmmoBox
      name: cadia-depot-flak
      cost: 8
    - proto: CadiaSupplyCrateBombs
      name: cadia-depot-bombs
      cost: 20
    - proto: CadiaSupplyCrateMedical
      name: cadia-depot-medical
      cost: 12
    - proto: CadiaParachutePack
      name: cadia-depot-parachute
      cost: 3
    - proto: CadiaPackCharger
      name: cadia-depot-charger
      cost: 15
    - proto: CadiaBoltTin
      name: cadia-depot-bolts
      cost: 6
    - proto: CadiaEntrenchingTool
      name: cadia-depot-shovel
      cost: 2
    - proto: SmokeGrenade
      name: cadia-depot-smoke
      cost: 2
    - proto: SheetSteel
      name: cadia-depot-steel
      cost: 5
    - proto: CadiaFieldStretcher
      name: cadia-depot-stretcher
      cost: 3

- type: entity
  parent: CadiaDepot
  id: CadiaDepotChaos
  name: looted supply dump
  description: Stolen munitions heaped under a blood-daubed tarp. Right-click to order a crate.
  components:
  - type: CadiaDepot
    faction: Chaos
  - type: Sprite
    sprite: Imperial/Cadia/War/fort_large.rsi
    state: depot
    drawdepth: Objects
    noRot: true
    color: "#d89a8a"

# Ящик под куполом: рисуется клиентом, при посадке заменяется настоящим грузом.
- type: entity
  id: CadiaSupplyDrop
  name: supply drop
  description: A crate coming down under a parachute. Mind your head.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    drawdepth: Overdoors
    noRot: true
    layers:
    - sprite: Imperial/Cadia/War/fort_small.rsi
      state: drop_shadow
      map: [ "shadow" ]
    - sprite: Imperial/Cadia/War/ammo.rsi
      state: crate
      map: [ "crate" ]
    - sprite: Imperial/Cadia/War/ship_weapons.rsi
      state: canopy
      map: [ "canopy" ]
  - type: Tag
    tags:
    - HideContextMenu
  - type: CadiaSupplyDrop

- type: entity
  abstract: true
  parent: BaseStructureDynamic
  id: CadiaSupplyCrateBase
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Pullable
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.3,0.35,0.3"
        density: 150
        mask:
        - CrateMask
        layer:
        - MachineLayer
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: CadiaSupplyCrateBase
  id: CadiaSupplyCrateAmmo
  name: ammunition crate
  description: Click with a gun in hand to take a magazine or power pack for it. Pull it to the line.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/decor.rsi
    state: ammo_crate
    noRot: true
  - type: CadiaSupply
    charges: 30
    deleteWhenEmpty: true

- type: entity
  parent: CadiaSupplyCrateBase
  id: CadiaSupplyCrateShells
  name: shell crate
  description: Heavy shells for tank and field gun breeches. Click to take one.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/decor.rsi
    state: shell_crate
    noRot: true
  - type: CadiaSupply
    charges: 12
    deleteWhenEmpty: true
    items:
    - CadiaTankShell

- type: entity
  parent: CadiaSupplyCrateBase
  id: CadiaSupplyCrateBombs
  name: bomb crate
  description: Aerial bombs for shuttle bays. Click to take one.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/ship_weapons.rsi
    state: bomb
    noRot: true
    scale: 0.8,0.8
  - type: CadiaSupply
    charges: 6
    deleteWhenEmpty: true
    items:
    - CadiaShipBomb

- type: entity
  parent: CadiaSupplyCrateBase
  id: CadiaSupplyCrateMedical
  name: medical crate
  description: Field dressings and medkits. Click to take one.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/decor.rsi
    state: medicae_station
    noRot: true
  - type: CadiaSupply
    charges: 8
    deleteWhenEmpty: true
    items:
    - MedkitFilled
    - MedkitBruteFilled

- type: entity
  parent: CrateGenericSteel
  id: CadiaAmmoCrateImperium
  name: Munitorum ammunition crate
  description: Spare magazines, power packs and tins of bolt shells for the regiment.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/crate_munitorum.rsi
  - type: Icon
    sprite: Imperial/Cadia/War/crate_munitorum.rsi
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CadiaLasPack
          amount: 8
        - id: CadiaLaspistolPack
          amount: 4
        - id: CadiaHotShotPack
          amount: 4
        - id: CadiaLongLasPack
          amount: 2
        - id: CadiaBoltMag
          amount: 4
        - id: CadiaBoltPistolMag
          amount: 4
        - id: CadiaHeavyBoltBox
          amount: 2
        - id: CadiaBoltTin
          amount: 2
        - id: BoxShotgunSlug
          amount: 2

- type: entity
  parent: CrateGenericSteel
  id: CadiaAmmoCrateChaos
  name: looted ammunition crate
  description: Stolen and scavenged munitions, daubed with the eight-pointed star.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/crate_chaos.rsi
  - type: Icon
    sprite: Imperial/Cadia/War/crate_chaos.rsi
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: CadiaLasPack
          amount: 6
        - id: CadiaAutogunMag
          amount: 8
        - id: CadiaAutopistolMag
          amount: 4
        - id: CadiaBoltMag
          amount: 4
        - id: CadiaBoltPistolMag
          amount: 4
        - id: CadiaBoltTin
          amount: 2
