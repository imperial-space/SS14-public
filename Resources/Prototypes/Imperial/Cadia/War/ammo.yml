# Боеприпасы Кадии по канону. Лазган стреляет сгустком, а не лучом, и питается от обоймы: заряжают её на станции,
# а не само оружие. Болтер стреляет масс-реактивными мини-ракетами: основной урон — подрыв в цели.

- type: Tag
  id: CadiaLasPack

- type: Tag
  id: CadiaLaspistolPack

- type: Tag
  id: CadiaHotShotPack

- type: Tag
  id: CadiaLongLasPack

- type: Tag
  id: CadiaPlasmaFlask

- type: Tag
  id: CadiaBoltCartridge

- type: Tag
  id: CadiaHeavyBoltCartridge

- type: Tag
  id: CadiaBoltMag

- type: Tag
  id: CadiaBoltPistolMag

- type: Tag
  id: CadiaHeavyBoltBox

- type: Tag
  id: CadiaAutogunMag

- type: Tag
  id: CadiaAutopistolMag

- type: Tag
  id: CadiaEnergyCharge

# ─── Снаряды лазерного оружия ───

