# ─── Вспышки подрыва ───

- type: entity
  abstract: true
  id: CadiaBlastBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: TimedDespawn
    lifetime: 0.42
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: CadiaBlastBase
  id: CadiaBoltBlast
  name: bolt detonation
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/blasts.rsi
    drawdepth: Effects
    noRot: true
    scale: 0.75,0.75
    layers:
    - state: fire
      shader: unshaded
  - type: PointLight
    radius: 2.2
    energy: 2
    color: "#ff9a4a"

- type: entity
  parent: CadiaBoltBlast
  id: CadiaHeavyBoltBlast
  name: heavy bolt detonation
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/blasts.rsi
    drawdepth: Effects
    noRot: true
    scale: 1.1,1.1
    layers:
    - state: fire
      shader: unshaded

- type: entity
  parent: CadiaBlastBase
  id: CadiaPlasmaBlast
  name: plasma detonation
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/blasts.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: plasma
      shader: unshaded
  - type: PointLight
    radius: 3
    energy: 2.5
    color: "#5fd8ff"

# ─── Заряды и патроны: заряд исчезает при выстреле, гильза болта падает на пол ───

- type: entity
