# Плита телекинетического купола: держит пули и пехоту десять секунд.
- type: entity
  id: CadiaPsyDomePlate
  name: telekinetic barrier
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: Imperial/Cadia/War/psy_fx.rsi
    drawdepth: Effects
    color: "#8fd0ff"
    noRot: true
    layers:
    - state: plate
      shader: unshaded
  - type: PointLight
    radius: 1.5
    energy: 0.8
    color: "#8fd0ff"
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.5
        density: 100
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: TimedDespawn
    lifetime: 10
