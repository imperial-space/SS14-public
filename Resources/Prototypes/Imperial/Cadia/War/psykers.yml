  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/psy_fx.rsi
    drawdepth: Effects
    color: "#ffe9a8"
    scale: 2,2
    noRot: true
    layers:
    - state: ring
      shader: unshaded
  - type: PointLight
    radius: 5
    energy: 2
    color: "#ffe9a8"

- type: entity
  parent: CadiaPsyEffectBase
  id: CadiaPsyPerilsEffect
  name: warp breach
  components:
  - type: TimedDespawn
    lifetime: 0.8
  - type: Sprite
    sprite: Imperial/Cadia/War/psy_fx.rsi
    drawdepth: Effects
    color: "#c04aff"
    noRot: true
    layers:
    - state: flame
      shader: unshaded
  - type: PointLight
    radius: 3
    energy: 2.5
    color: "#c04aff"

- type: entity
  parent: CadiaPsyPerilsEffect
  id: CadiaPsyFuryEffect
  name: psychic flame
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/psy_fx.rsi
