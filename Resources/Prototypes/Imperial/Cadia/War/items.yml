# Снаряжение войны за Кадию: одежда ролей, связь, оружие. Спрайты — PixelLab, во всех четырёх направлениях.

# ═══════════════ Базы ═══════════════

# Силовой доспех Астартес: полный, со шлемом, тяжёлый, держит болт и осколки.
- type: entity
  abstract: true
  parent: ClothingOuterArmorBasic
  id: CadiaPowerArmorBase
  components:
  - type: CadiaPowerArmor
  - type: Item
    size: Huge
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.4
        Slash: 0.4
        Piercing: 0.35
        Heat: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: HideLayerClothing
    slots:
    - Hair
    - FacialHair
    - Snout
    - SnoutCover
    - HeadTop
    - HeadSide
    - Head
    - Eyes
    - Chest
    - RArm
    - LArm
    - RHand
    - LHand
    - RLeg
    - LLeg
    - RFoot
    - LFoot
    - UndergarmentTop
    - UndergarmentBottom
    - Tail

# Отсеки в ранце силового доспеха: занимают слот спины вместо рюкзака, сами на теле не видны.
- type: entity
  parent: ClothingBackpack
  id: CadiaAstartesPack
  name: power armour stowage
  description: Compartments built into a power armour's backpack. They do not come off.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/ammo.rsi
    state: hotshot_pack
  - type: Clothing
    sprite: Imperial/Cadia/War/ammo.rsi
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,9,5
  - type: Unremoveable
    deleteOnDrop: false

# Роба до пят с капюшоном.
- type: entity
  abstract: true
  parent: ClothingOuterBase
  id: CadiaRobeBase
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.9
        Heat: 0.95
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide

