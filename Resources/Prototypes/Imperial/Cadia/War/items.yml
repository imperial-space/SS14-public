# ═══════════════ Связь ═══════════════

- type: entity
  parent: EncryptionKey
  id: CadiaEncryptionKey
  name: Cadian vox key
  description: An encryption key for the Cadian regimental vox net.
  components:
  - type: EncryptionKey
    channels:
    - CadiaVox
    - CadiaSquad
    defaultChannel: CadiaVox
  - type: Sprite
    sprite: Imperial/Cadia/War/Clothing/keys.rsi
    layers:
    - state: imperium

- type: entity
  parent: CadiaEncryptionKey
  id: CadiaEncryptionKeyCommand
  name: Cadian command vox key
  description: An encryption key for the Cadian command net.
  components:
  - type: EncryptionKey
    channels:
    - CadiaCommand
    defaultChannel: CadiaCommand

- type: entity
  parent: EncryptionKey
  id: CadiaEncryptionKeyChaos
  name: warband vox key
  description: A crudely rewired encryption key. Whispers bleed through the static.
  components:
  - type: EncryptionKey
    channels:
    - CadiaWarband
    - CadiaWarbandSquad
    defaultChannel: CadiaWarband
  - type: Sprite
    sprite: Imperial/Cadia/War/Clothing/keys.rsi
    layers:
    - state: chaos

- type: entity
  parent: ClothingHeadset
