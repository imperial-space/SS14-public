# ─── Разломы ───

- type: entity
  id: CadiaWarpRift
  name: warp rift
  description: A wound in reality. Those sworn to the Dark Gods may spend the warp's power here to call daemons through. Right-click to summon.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Imperial/Cadia/War/warp_rift.rsi
    drawdepth: Objects
    noRot: true
    layers:
    - state: rift
      shader: unshaded
  - type: PointLight
    radius: 6
    energy: 2.5
    color: "#c02a6a"
  - type: AmbientSound
    range: 11
    volume: 1
    sound:
      path: /Audio/Imperial/Cadia/Ambience/rift_drone.ogg
  - type: CadiaWarpRift
    summons:
    - proto: CadiaMobBloodletter
      name: cadia-summon-bloodletter
      cost: 10
    - proto: CadiaMobPlaguebearer
      name: cadia-summon-plaguebearer
      cost: 12
    - proto: CadiaMobPinkHorror
      name: cadia-summon-pink-horror
      cost: 12
    - proto: CadiaMobDaemonette
      name: cadia-summon-daemonette
      cost: 8
    - proto: CadiaMobHeldrake
      name: cadia-summon-heldrake
      cost: 40
      delay: 12
    - proto: CadiaMobDaemonPrince
      name: cadia-summon-prince
      cost: 80
      requiresFallenPylons: true
      delay: 20

- type: entity
  parent: CadiaWarpRift
  id: CadiaWarpRiftSmall
  name: lesser warp rift
  description: A small tear in reality, already closing. Right-click to summon lesser daemons.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/warp_rift.rsi
    drawdepth: Objects
    noRot: true
    scale: 0.6,0.6
    layers:
    - state: rift
      shader: unshaded
  - type: CadiaWarpRift
    lifetime: 60
    summons:
    - proto: CadiaMobBloodletter
      name: cadia-summon-bloodletter
      cost: 10
    - proto: CadiaMobDaemonette
      name: cadia-summon-daemonette
      cost: 8

# ─── Действия ───

- type: entity
  parent: BaseAction
  id: ActionCadiaFlyUp
  name: Fly up
  description: Rise to the level above.
  components:
  - type: Action
    icon: { sprite: Imperial/Cadia/War/psy_icons.rsi, state: flyup }
    useDelay: 4
  - type: InstantAction
    event: !type:CadiaFlyUpActionEvent

- type: entity
  parent: BaseAction
  id: ActionCadiaFlyDown
  name: Fly down
  description: Descend to the level below.
  components:
  - type: Action
    icon: { sprite: Imperial/Cadia/War/psy_icons.rsi, state: flydown }
    useDelay: 4
  - type: InstantAction
    event: !type:CadiaFlyDownActionEvent

- type: entity
  abstract: true
  parent: BaseAction
  id: ActionCadiaMarkBase
  components:
  - type: Action
    useDelay: 1

- type: entity
  parent: ActionCadiaMarkBase
  id: ActionCadiaMarkKhorne
  name: Mark of Khorne
  description: Pledge yourself to the Blood God. Your melee strikes harder. The choice is final.
  components:
  - type: Action
    icon: { sprite: Imperial/Cadia/War/psy_icons.rsi, state: khorne }
  - type: InstantAction
    event: !type:CadiaChooseMarkActionEvent
      god: Khorne

- type: entity
  parent: ActionCadiaMarkBase
  id: ActionCadiaMarkNurgle
  name: Mark of Nurgle
  description: Pledge yourself to the Plague Father. You endure more. The choice is final.
  components:
  - type: Action
    icon: { sprite: Imperial/Cadia/War/psy_icons.rsi, state: nurgle }
  - type: InstantAction
    event: !type:CadiaChooseMarkActionEvent
      god: Nurgle

- type: entity
  parent: ActionCadiaMarkBase
  id: ActionCadiaMarkTzeentch
  name: Mark of Tzeentch
  description: Pledge yourself to the Changer of Ways. A warp ward absorbs one hit every thirty seconds. The choice is final.
  components:
  - type: Action
    icon: { sprite: Imperial/Cadia/War/psy_icons.rsi, state: tzeentch }
  - type: InstantAction
    event: !type:CadiaChooseMarkActionEvent
      god: Tzeentch

- type: entity
  parent: ActionCadiaMarkBase
  id: ActionCadiaMarkSlaanesh
  name: Mark of Slaanesh
  description: Pledge yourself to the Dark Prince. You move faster. The choice is final.
  components:
  - type: Action
    icon: { sprite: Imperial/Cadia/War/psy_icons.rsi, state: slaanesh }
  - type: InstantAction
    event: !type:CadiaChooseMarkActionEvent
      god: Slaanesh

- type: entity
  parent: BaseAction
  id: ActionCadiaJump
  name: Jump pack strike
  description: Blast forward and crash down on the enemy.
  components:
  - type: Action
    icon: { sprite: Imperial/Cadia/War/psy_icons.rsi, state: jump }
    useDelay: 12
  - type: TargetAction
    range: 8
  - type: WorldTargetAction
    event: !type:CadiaJumpActionEvent

- type: entity
  parent: BaseAction
  id: ActionCadiaPrayer
  name: Litany of Faith
  description: Allies nearby are healed and psykers' minds are steadied.
  components:
  - type: Action
    icon: { sprite: Imperial/Cadia/War/psy_icons.rsi, state: prayer }
    useDelay: 25
  - type: InstantAction
    event: !type:CadiaPrayerActionEvent

- type: entity
  parent: BaseAction
  id: ActionCadiaActOfFaith
  name: Act of Faith
  description: For eight seconds the Emperor shields you from most harm, and your wounds close.
  components:
  - type: Action
    icon: { sprite: Imperial/Cadia/War/psy_icons.rsi, state: faith }
    useDelay: 90
  - type: InstantAction
    event: !type:CadiaActOfFaithActionEvent

- type: entity
  parent: BaseAction
  id: ActionCadiaExterminatus
  name: Declare Exterminatus
  description: The last resort. After thirty seconds of unbroken ritual the fleet is ordered to burn Cadia. Everyone will know.
  components:
  - type: Action
    icon: { sprite: Imperial/Cadia/War/psy_icons.rsi, state: exterminatus }
    useDelay: 120
  - type: InstantAction
    event: !type:CadiaExterminatusActionEvent

# ─── Предметы ───

- type: entity
  parent: BaseItem
  id: CadiaReductor
  name: reductor
  description: An apothecary's gauntlet drill. It takes back the progenoid glands of a fallen Astartes.
  components:
