# Демоны Хаоса: четыре бога, Хелдрейк и принц демонов. Призываются у разлома за силу варпа, пока пилоны стоят — слабее.

- type: entity
  abstract: true
  parent: [ SimpleMobBase, MobCombat ]
  id: CadiaDaemonBase
  categories: [ HideSpawnMenu ]
  components:
  - type: InputMover
  - type: MobMover
  - type: CadiaFactionMember
    faction: Chaos
    role: CadiaDaemonRole
  - type: CadiaBriefingPending
  - type: CadiaMoraleAura
    radius: 7
    friendRate: 0.5
    enemyRate: -2
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound

# Призванный демон: пока никто не занял тело, дерётся сам.
- type: entity
  abstract: true
  parent: CadiaDaemonBase
  id: CadiaSummonedDaemonBase
  components:
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: GhostRole
    name: cadia-daemon-ghost-name
    description: cadia-daemon-ghost-desc
    rules: cadia-rules-chaos
  - type: GhostTakeoverAvailable

- type: entity
  parent: CadiaSummonedDaemonBase
  id: CadiaMobBloodletter
  name: bloodletter
  description: A blood-red daemon of Khorne, its hellblade hungry for skulls.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/mob_bloodletter.rsi
    drawdepth: Mobs
    noRot: true
    layers:
    - state: mob
      map: [ "movement" ]
  - type: CadiaDaemon
    god: Khorne
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: MeleeWeapon
    angle: 60
    animation: WeaponArcSlash
    attackRate: 1.1
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    damage:
      types:
        Slash: 26
        Structural: 15
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.6
    baseSprintSpeed: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.38
        density: 200
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FootstepModifier
    footstepSoundCollection:
      collection: CadiaStepHooves
      params:
        volume: 0
        variation: 0.1
- type: entity
  parent: CadiaSummonedDaemonBase
  id: CadiaMobPlaguebearer
  name: plaguebearer
  description: A shambling rotting daemon of Nurgle. It feels little and spreads much.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/mob_plaguebearer.rsi
    drawdepth: Mobs
    noRot: true
    layers:
    - state: mob
      map: [ "movement" ]
  - type: CadiaDaemon
    god: Nurgle
  - type: MobThresholds
    thresholds:
      0: Alive
      260: Dead
  - type: MeleeWeapon
    angle: 60
    animation: WeaponArcSlash
    attackRate: 0.8
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    damage:
      types:
        Slash: 12
        Poison: 10
        Structural: 8
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2.6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FootstepModifier
    footstepSoundCollection:
      collection: CadiaStepSquelch
      params:
        volume: 0
        variation: 0.1
- type: entity
  parent: CadiaSummonedDaemonBase
  id: CadiaMobPinkHorror
  name: pink horror
  description: A cackling daemon of Tzeentch that hurls warpfire. Slain, it splits in two sulking blue horrors.
