    sprite: Imperial/Cadia/War/psy_icons.rsi
    state: reductor
  - type: Item
    size: Small
  - type: CadiaReductor

- type: entity
  parent: BaseItem
  id: CadiaGeneSeed
  name: gene-seed
  description: The future of a Chapter in a sealed vial. Use it in hand. Loyalists consecrate it so a new brother joins the next wave; heretics sacrifice it to the warp.
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/psy_icons.rsi
    state: seed
  - type: Item
    size: Tiny
  - type: CadiaGeneSeed

