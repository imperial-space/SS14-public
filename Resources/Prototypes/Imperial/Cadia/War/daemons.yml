    god: Tzeentch
    splitInto: CadiaMobBlueHorror
    splitCount: 2
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: MobThresholds
    thresholds:
      0: Alive
      110: Dead
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcClaw
    damage:
