    sprite: Imperial/Cadia/War/psy_icons.rsi
    state: cradle
  - type: Item
    size: Normal
  - type: SpawnItemsOnUse
    items:
    - id: CadiaMobServitor
    sound:
      path: /Audio/Machines/scan_finish.ogg
