# Подбитая техника: у каждой машины свой обгоревший остов, за ним можно укрыться.

- type: entity
  parent: CadiaVehicleWreck
  id: CadiaWreckRuss
  name: burnt-out Leman Russ
  components:
  - type: Sprite
    sprite: Imperial/Cadia/War/wrecks.rsi
    state: russ
    drawdepth: Objects
    noRot: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.1,-1.3,1.1,1.3"
        density: 4000
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: CadiaCover
    block: 0.75
    overRange: 2

