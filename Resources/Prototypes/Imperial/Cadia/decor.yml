# Кадия: декор обороны (спрайты PixelLab, 32×32). Твёрдые — блокируют проход, как столы и баррикады;
# лёгкие — можно пройти; напольные — рисуются под мобами.

- type: entity
  abstract: true
  parent: BaseStructure
  id: CadiaDecorBase
  components:
  - type: Rotatable
  - type: Sprite
    noRot: true
    sprite: Imperial/Cadia/decor.rsi
    drawdepth: Objects
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  abstract: true
  parent: CadiaDecorBase
  id: CadiaDecorPassableBase
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        hard: false
        mask:
        - MachineMask

- type: entity
  abstract: true
  parent: CadiaDecorPassableBase
  id: CadiaDecorFloorBase
  components:
  - type: Sprite
    drawdepth: FloorObjects

- type: entity
  parent: CadiaDecorBase
  id: CadiaSandbags
  name: sandbag wall
  components:
  - type: Sprite
    state: sandbags
  - type: CadiaCover

- type: entity
  parent: CadiaDecorBase
  id: CadiaSandbagsCorner
  name: sandbag corner
  components:
  - type: Sprite
    state: sandbags_corner
  - type: CadiaCover

- type: entity
  parent: CadiaDecorBase
  id: CadiaTankTrap
  name: anti-tank hedgehog
  components:
  - type: Sprite
    state: tank_trap
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 1000
        layer:
        - DoorPassable

- type: entity
  parent: CadiaDecorPassableBase
  id: CadiaRazorWire
  name: razor wire
  components:
  - type: Sprite
    state: razor_wire
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        hard: false
        layer:
        - MidImpassable
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.35
    sprintSpeedModifier: 0.35
  - type: DamageContacts
    damage:
      types:
        Slash: 3
        Piercing: 2
  - type: CadiaTankCrushable

- type: entity
  parent: CadiaDecorBase
  id: CadiaAmmoCrate
  name: ammo crate
  components:
  - type: Sprite
    state: ammo_crate
  - type: CadiaSupply
    charges: 20

- type: entity
