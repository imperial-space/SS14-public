    - CadiaRation

- type: entity
  parent: CadiaDecorBase
  id: CadiaFuelBarrel
  name: promethium barrel
  components:
  - type: Sprite
    state: fuel_barrel
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/explosion_small1.ogg
      - !type:ExplodeBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Explosive
    explosionType: Default
    maxIntensity: 12
    intensitySlope: 4
    totalIntensity: 90
    canCreateVacuum: false

