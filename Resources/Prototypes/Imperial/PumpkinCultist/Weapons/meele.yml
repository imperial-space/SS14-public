- type: entity
  name: pumpkinite scythe
  parent: BaseItem
  id: PumpkinCultScythe
  description: Basic weapon of cultist.
  suffix: Pumpkin Cultist
  components:
  - type: Sharp
  - type: Sprite
    sprite: Imperial/PumpkinCult/cult_cosa.rsi
    state: icon
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    wideAnimationRotation: -135
    attackRate: 0.8
    damage:
      types:
        Slash: 25
        Structural: 30
  - type: Item
    size: Normal
  - type: DisarmMalus

- type: entity
  name: ritual dagger
  parent: CombatKnife
  id: PumpkinCultDagger
  description: Used to create runes.
  suffix: Pumpkin Cultist
  components:
  - type: CultistKnife
    damage:
      types:
          Bloodloss: 25
  - type: Sprite
    sprite: Imperial/PumpkinCult/cult_knife.rsi
    state: icon
  - type: MeleeWeapon
    attackRate: 1.0
    damage:
      types:
        Slash: 12
  - type: Item
    sprite: Imperial/PumpkinCult/cult_knife.rsi
    storedSprite: null
  - type: Clothing
    sprite: Imperial/PumpkinCult/cult_knife.rsi
    slots:
    - belt

- type: entity
  name: pumpkinite halberd
  parent: BaseItem
  id: PumpkiniteHalberd
  description: A poleaxe that seems to be linked to its wielder.
  suffix: Pumpkin Cultist
  components:
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: HeldSpeedModifier
  - type: Sharp
  - type: Sprite
    sprite: Imperial/PumpkinCult/cult_halberd.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.5
    damage:
      types:
        Blunt: 15
        Slash: 30
        Structural: 60
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 5
        Slash: 30
        Structural: 110
  - type: Item
    size: Large
  - type: UseDelay
    delay: 1


- type: entity
  name: pumpkinite blade
  parent: BaseItem
  id: PumpkinCultBlade
  description: A sword humming with unholy energy.
  suffix: Pumpkin Cultist
  components:
  - type: DamageOnHolding
    damage:
      types:
        Poison: 1
        Bloodloss: 1
  - type: Sharp
  - type: Sprite
    sprite: Imperial/PumpkinCult/cult_blade.rsi
    state: icon
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    wideAnimationRotation: -135
    attackRate: 1.0
    damage:
      types:
        Slash: 15
        Heat: 15
  - type: Item
    size: Normal
  - type: Clothing
    sprite: Imperial/PumpkinCult/cult_blade.rsi
    slots:
    - back
  - type: DisarmMalus