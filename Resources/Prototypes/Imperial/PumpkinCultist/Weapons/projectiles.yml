- type: entity
  parent: ImmovableRod
  id: ImmovableRodCultist
  suffix: Pumpkin Cultist
  components:
  - type: TimedDespawn
    lifetime: 3
  - type: ImmovableRod
    maxSpeed: 15
    destroyTiles: false
    randomizeVelocity: false
    shouldGib: false
    damage:
      types:
        Blunt: 190

- type: entity
  id: LightFireProjectile
  name: firebullet
  description: meeeoow
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#E25822"
    radius: 2.0
    energy: 5.0
  - type: Projectile
    damage:
      types:
        Heat: 17
  - type: Sprite
    sprite: Imperial/PumpkinCult/tikovki.rsi
    layers:
    - state: red
      shader: unshaded
  - type: IgnitionSource
    temperature: 400
    ignited: true
  - type: IgniteOnCollide
    fireStacks: 0.35
  - type: ExplodeOnTrigger

