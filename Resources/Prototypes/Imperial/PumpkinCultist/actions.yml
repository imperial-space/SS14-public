- type: entity
  parent: BaseAction
  id: ActionPumpkinCultOpenShop
  name: Cult Shop
  description: Devour your pumpkinite.
  components:
  - type: Action
    icon: Interface/Actions/shop.png
  - type: InstantAction
    event: !type:CultistShopActionEvent
  
- type: entity
  parent: BaseEntitySpellAction
  id: ActionStunGrab
  name: Stun Grab
  components:
  - type: Action
    useDelay: 30
    icon:
      sprite: Imperial/PumpkinCult/tikovki.rsi
      state: stun1
  - type: EntityTargetAction
    event: !type:PumpkinGrab1SpellEvent
  - type: ActionUpgrade
    effectedLevels:
      2: ActionStunGrabTwo

- type: entity
  parent: BaseEntitySpellAction
  id: ActionStunGrabTwo
  name: Stun Grab 2
  components:
  - type: Action
    useDelay: 25
    icon:
      sprite: Imperial/PumpkinCult/tikovki.rsi
      state: stun2
  - type: EntityTargetAction
    event: !type:PumpkinGrab2SpellEvent

- type: entity
  parent: BaseAction
  id: ActionPumpkinCultRod
  name: PumpkinRod
  description: FIRES FUCKING IMMOVABLE ROD
  components:
  - type: Magic
  - type: Action
    useDelay: 120
    itemIconStyle: BigAction
    raiseOnUser: true
    sound: !type:SoundPathSpecifier
      path: /Audio/Imperial/PumpkinCultist/cultist_effect.ogg
    icon:
      sprite: Objects/Fun/immovable_rod.rsi
      state: icon
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ImmovableRodCultist

- type: entity
  parent: BaseEntitySpellAction
