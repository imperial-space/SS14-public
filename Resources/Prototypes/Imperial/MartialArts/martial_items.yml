# gloves/kaza_ruk/combatglovesplus
- type: entity
  parent: [ ClothingHandsGlovesCombat, BaseSyndicateContraband ]
  id: ClothingHandsGlovesCombatPlus
  name: боевые перчатки плюс
  description: Эти тактические перчатки огнестойки и защищают от тока. Кажется, они обучают упрощённому варианту тизирского боевого искусства Каза Рук.
