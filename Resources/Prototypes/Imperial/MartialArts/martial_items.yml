# uplink_item/stealthy_weapons/martialarts: cost = 17, не для ядерщиков.
- type: listing
  id: UplinkSleepingCarpKit
  name: Свиток и одежда боевых искусств
  description: Свиток с секретами древнего боевого искусства. Вы овладеете рукопашным боем и научитесь отбивать пули, а в подходящей одежде — уклоняться от ударов. Но вы откажетесь от бесчестного стрелкового оружия, а броня будет мешать уклоняться. В комплекте — одежда для боевых искусств!
  productEntity: BoxSleepingCarpKit
  cost:
    Telecrystal: 17
  categories:
  - UplinkWeaponry
  conditions:
  - !type:StoreWhitelistCondition
    blacklist:
      tags:
      - NukeOpsUplink

