# ─── Оружие ───

# staff/bostaff
- type: entity
  parent: BaseItem
  id: BoStaff
  name: посох бо
  description: Длинный, высокий посох из полированного дерева. Традиционно используется в древних боевых искусствах старой Земли. Может использоваться как для убийства, так и для выведения из строя.
  components:
  - type: Sprite
    sprite: Imperial/MartialArts/bostaff.rsi
    layers:
    - state: icon
      map: [ "enum.WieldableVisuals.Wielded" ]
  - type: Item
    size: Huge
    sprite: Imperial/MartialArts/bostaff.rsi
  - type: Clothing
    quickEquip: false
    slots:
    - back
    sprite: Imperial/MartialArts/bostaff.rsi
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Blunt: 10
    soundHit:
      path: /Audio/Imperial/MartialArts/woodhit.ogg
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 14
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WieldableVisuals.Wielded:
        enum.WieldableVisuals.Wielded:
          True: { state: icon-wielded }
          False: { state: icon }
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 20
  - type: BoStaff

# ─── Гриб ───

# obj/item/mushpunch
- type: entity
  parent: BaseItem
  id: MartialOddMushroom
  name: странный гриб
  description: Sapienza Ophioglossoides — странный гриб из плоти грибного человека. Похоже, он сохранил часть врождённой силы своего хозяина и дрожит от едва сдерживаемой МОЩИ!
  components:
  - type: Sprite
    sprite: Imperial/MartialArts/odd_mushroom.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: MartialArtFood
    art: MartialArtMushroomPunch

# ─── Импланты ───

- type: entity
  parent: BaseSubdermalImplant
  id: KazaRukImplant
  name: имплант Каза Рук
  description: Обучает тизирскому боевому искусству Каза Рук пятью короткими обучающими видео, проецируемыми прямо в глаза.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionMartialImplantToggle
  - type: MartialArtImplant
    art: MartialArtKazaRuk

- type: entity
  parent: BaseSubdermalImplant
  id: CqcImplant
  name: имплант CQC
  description: Обучает навыкам Close Quarters Combat пятью короткими видео-инструкциями, проецируемыми прямо в глаза.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionMartialImplantToggle
  - type: MartialArtImplant
    art: MartialArtCqc

- type: entity
  parent: BaseImplantOnlyImplanter
  id: KazaRukImplanter
  name: имплантер (Каза Рук)
  components:
  - type: Implanter
    implant: KazaRukImplant

- type: entity
  parent: BaseImplantOnlyImplanterSyndi
  id: CqcImplanter
  name: имплантер (CQC)
  components:
  - type: Implanter
    implant: CqcImplant

