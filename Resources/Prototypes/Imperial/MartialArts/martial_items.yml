# gloves/kaza_ruk/sec: перчатки смотрителя
- type: entity
  parent: [ ClothingHandsGlovesColorBlack, BaseSecurityContraband ]
  id: ClothingHandsGlovesKazaRukSec
  name: перчатки Каза Рук
  description: Эти перчатки обучают упрощённому варианту тизирского боевого искусства Каза Рук, доступному не только ящерам. Неясно, как именно они это делают. Скорее всего, наниты.
  components:
  - type: Sprite
    sprite: Imperial/MartialArts/fight_gloves.rsi
    color: "#c41e0d"
  - type: Clothing
    sprite: Imperial/MartialArts/fight_gloves.rsi
    clothingVisuals:
      gloves:
      - state: equipped-HAND
        color: "#c41e0d"
  - type: MartialArtGiver
    art: MartialArtKazaRuk

# reskin: blue
- type: entity
  parent: ClothingHandsGlovesKazaRukSec
