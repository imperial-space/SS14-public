# ─── Наборы ───

# storage/box/syndicate/sleeping_carp
- type: entity
  parent: [ BoxCardboard, BaseSyndicateContraband ]
  id: BoxSleepingCarpKit
  name: набор боевых искусств
  description: Свиток с секретами древнего боевого искусства и подходящая к нему одежда.
  components:
  # Ги размера Normal, поэтому коробке нужен больший лимит.
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,4,3
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MartialScrollSleepingCarp
        - id: ClothingHeadBandSnakeEater
        - id: ClothingUniformMartialGi
        - id: ClothingShoesMartialSandals

# storage/toolbox/guncase/cqc
- type: entity
  parent: [ ToolboxSyndicate, BaseSyndicateContraband ]
  id: CaseCqcEquipment
  name: кейс снаряжения CQC
  description: Руководство по CQC, имплант CQC, пачка сигарет и стильная бандана.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: MartialManualCqc
        - id: CqcImplanter
        - id: ClothingHeadBandSnakeEater
        - id: CigPackSyndicate

