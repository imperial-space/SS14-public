# gloves/fingerless/punch_mitts
- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsPunchMitts
  name: ударные рукавицы
  description: Перчатки без пальцев с мерзкими шипами. Позволяют пользоваться сомнительной техникой охотничьего бокса — молотить диких зверей в клочья. Отличная тренировка. Крайне неразумно для собственного выживания.
  components:
  - type: Sprite
    sprite: Imperial/MartialArts/punch_mitts.rsi
    state: icon
  - type: Clothing
    sprite: Imperial/MartialArts/punch_mitts.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.95
        Heat: 0.95
  - type: MartialArtGiver
    art: MartialArtHunterBoxing

# gloves/gauntlets (лут Лаваленда)
- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsConcussiveGauntlets
  name: концессионные перчатки
  description: Пара тяжёлых латных перчаток с Лаваленда. Позволяют выбивать дух из местной фауны охотничьим боксом.
  components:
  - type: Sprite
    sprite: Imperial/MartialArts/gauntlets.rsi
    state: icon
  - type: Clothing
    sprite: Imperial/MartialArts/gauntlets.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.75
        Heat: 0.85
  - type: MartialArtGiver
    art: MartialArtHunterBoxing

