# Предметы боевых искусств 1 в 1 с tgstation/BandaStation.

# ─── Учебники и свитки (book/granter/martial) ───

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMartialManual
  components:
  - type: Item
    size: Small
  - type: Tag
    tags:
    - Book

- type: entity
  parent: [ BaseMartialManual, BaseSyndicateContraband ]
  id: MartialManualCqc
  name: старое руководство
  description: Небольшое чёрное руководство. В нём представлены наглядные инструкции по тактическому рукопашному бою.
  components:
  - type: Sprite
    sprite: Imperial/MartialArts/manual.rsi
    state: icon
  - type: MartialArtManual
    art: MartialArtCqc
    martialName: martial-manual-name-cqc
    greet: martial-manual-greet-cqc
    recoil: Explode
    remarks:
    - martial-remark-cqc-1
    - martial-remark-cqc-2
    - martial-remark-cqc-3
    - martial-remark-cqc-4
    - martial-remark-cqc-5
    - martial-remark-cqc-6
    - martial-remark-cqc-7

- type: entity
  parent: BaseMartialManual
  id: MartialScrollBlank
  name: пустой свиток
  description: Свиток абсолютно пуст.
  components:
  - type: Sprite
    sprite: Imperial/MartialArts/scrolls.rsi
    state: blankscroll

- type: entity
  parent: [ BaseMartialManual, BaseSyndicateContraband ]
  id: MartialScrollSleepingCarp
  name: загадочный свиток
  description: Свиток, испещрённый странными знаками. Похоже, это зарисовки какого-то боевого искусства.
  components:
  - type: Sprite
    sprite: Imperial/MartialArts/scrolls.rsi
    state: sleepingcarp
  - type: MartialArtManual
    art: MartialArtSleepingCarp
    martialName: martial-manual-name-carp
    greet: martial-manual-greet-carp
    spentProto: MartialScrollBlank
    remarks:
    - martial-remark-carp-1
    - martial-remark-carp-2
    - martial-remark-carp-3
    - martial-remark-carp-4
    - martial-remark-carp-5
    - martial-remark-carp-6
    - martial-remark-carp-7

- type: entity
  parent: [ BaseMartialManual, BaseMagicalContraband ]
  id: MartialScrollPlasmaFist
  name: потрёпанный свиток
  description: Старый и потрёпанный клочок бумаги, исписанный переменчивыми рунами. На нём нарисованы иллюстрации кулачного боя.
  components:
  - type: Sprite
    sprite: Imperial/MartialArts/scrolls.rsi
    state: plasmafist
  - type: MartialArtManual
    art: MartialArtPlasmaFist
    martialName: martial-manual-name-plasma
    greet: martial-manual-greet-plasma
    spentProto: MartialScrollBlank
    remarks:
    - martial-remark-plasma-1
    - martial-remark-plasma-2
    - martial-remark-plasma-3
    - martial-remark-plasma-4
    - martial-remark-plasma-5
    - martial-remark-plasma-6

- type: entity
  parent: MartialScrollPlasmaFist
  id: MartialScrollPlasmaFistNovice
  suffix: Новичок
  components:
  - type: MartialArtManual
    art: MartialArtPlasmaFistNovice
    martialName: martial-manual-name-plasma
    greet: martial-manual-greet-plasma
    spentProto: MartialScrollBlank
    remarks:
    - martial-remark-plasma-1
    - martial-remark-plasma-2
    - martial-remark-plasma-3

- type: entity
  parent: [ BaseMartialManual, BaseSyndicateContraband ]
  id: MartialScrollSpidersBite
  name: загадочный свиток
  suffix: Укус паука
  description: Свиток, испещрённый странными знаками. Похоже, это зарисовки какого-то боевого искусства.
  components:
  - type: Sprite
    sprite: Imperial/MartialArts/scrolls.rsi
    state: sleepingcarp
  - type: MartialArtManual
    art: MartialArtSpidersBite
    martialName: martial-manual-name-spider
    greet: martial-manual-greet-spider
    spentProto: MartialScrollBlank
    remarks:
    - martial-remark-spider-1
    - martial-remark-spider-2
    - martial-remark-spider-3
    - martial-remark-spider-4
    - martial-remark-spider-5
    - martial-remark-spider-6
    - martial-remark-spider-7

