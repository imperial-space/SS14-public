# /obj/item/fish_genegun
- type: entity
  parent: BaseItem
  id: ImperialFishGenegun
  name: генная пушка для рыб
  description: Устройство для ввода и извлечения черт рыб. Принимает пустой шприц, который после извлечения черты превращается в инъектор гена. Повторная обработка может убить рыбу.
  components:
  - type: Sprite
    sprite: Imperial/Fishing/fishing.rsi
    layers:
    - state: fish_gun
      map: [ "enum.ImperialFishGenegunVisuals.State" ]
  - type: Item
    size: Small
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ImperialFishGenegunVisuals.State:
        enum.ImperialFishGenegunVisuals.State:
          Empty: { state: fish_gun }
          Extract: { state: fish_gun_extract }
          Inject: { state: fish_gun_inject }
  - type: ImperialFishGenegun
  - type: UserInterface
    interfaces:
      enum.ImperialFishGenegunUiKey.Key:
        type: ImperialFishGenegunBoundUserInterface
  - type: ItemSlots
    slots:
      genegun_injector:
        name: imperial-fish-genegun-slot
        whitelist:
          tags:
          - Syringe
          components:
          - ImperialFishGene
  - type: ContainerContainer
    containers:
      genegun_injector: !type:ContainerSlot
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 7
  - type: StaticPrice
    price: 150

# /obj/item/fish_gene
- type: entity
  parent: BaseItem
  id: ImperialFishGene
  name: инъектор черты рыбы
  description: Одноразовый инъектор с определённой чертой, которую можно ввести любой (живой) совместимой рыбе.
  components:
  - type: Sprite
    sprite: Imperial/Fishing/fishing.rsi
    state: fish_trait_injector
  - type: Item
    size: Tiny
  - type: ImperialFishGene
  - type: StaticPrice
    price: 50

# /obj/item/clothing/gloves/fishing: перчатки сами служат удочкой (крючок есть, лески и наживки нет).
- type: entity
  parent: ClothingHandsBase
  id: ImperialClothingHandsFishing
  name: атлетические рыболовные перчатки
  description: Перчатки, чтобы рыбачить без удочки, одной лишь атлетической силой. Заодно отличный тренажёр. ВНИМАНИЕ — крупная рыба может травмировать.
  components:
  - type: Sprite
    sprite: Imperial/Fishing/fishing_gloves.rsi
  - type: Clothing
    sprite: Imperial/Fishing/fishing_gloves.rsi
  - type: ImperialProfoundFisher
    athletic: true
  - type: ImperialFishingRod
    uiDescription: imperial-fishing-rod-desc-athletic
  - type: ImperialFishingDifficultyModifier
    modifier: -4
    slots: GLOVES
  - type: ItemSlots
    slots:
      rod_line:
        name: imperial-fishing-slot-line
        whitelist:
