- type: entity
  abstract: true
  parent: FoodInjectableBase
  name: Unknown creature
  description: An unknown creature from the depths of the seabed.
  id: FoodFishBase
  suffix: Fish
  components:
  - type: Sprite
    sprite: Imperial/Fishing/Fish.rsi
    state: angelfish
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: UncookedAnimalProteins
          Quantity: 1
        - ReagentId: Fat
          Quantity: 5
  - type: Item
    shape:
    - 0,0,1,0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        # less mass so it can cook faster, a single strip of bacon isnt 5kg
        density: 1
        mask:
        - ItemMask
        restitution: 0.3  # fite me
        friction: 0.2
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Meaterial: 300
  - type: RandomWeight
    priceCoefficent: 3
    maxWeight: 2

