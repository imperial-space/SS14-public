# Автомат мороженого TG (/obj/machinery/icecream_vat) и вкусы (/datum/ice_cream_flavour).

- type: entity
  parent: BaseStructureDynamic
  id: ImperialIcecreamVat
  name: автомат мороженого
  description: Смотря на машину, вы вспоминаете мелодию вашего любимого кафе с мороженым. Теперь таким кафе стало Нанотрейзен!
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/utensils.rsi
    state: icecream_vat
    noRot: true
  - type: ImperialIcecreamVat
    cones:
    - ImperialFoodIcecream
    - ImperialFoodIcecreamChocolate
    - ImperialFoodIcecreamKorta
  - type: SolutionContainerManager
    solutions:
      vat:
        maxVol: 300
        canReact: false
        reagents:
        - ReagentId: Milk
          Quantity: 6
        - ReagentId: ImperialKortaMilk
          Quantity: 6
        - ReagentId: Flour
          Quantity: 6
        - ReagentId: ImperialKortaFlour
          Quantity: 6
        - ReagentId: Sugar
          Quantity: 12
        - ReagentId: Ice
          Quantity: 6
        - ReagentId: CocoaPowder
          Quantity: 6
        - ReagentId: ImperialVanilla
          Quantity: 6
        - ReagentId: JuiceBerry
          Quantity: 6
        - ReagentId: Singulo
          Quantity: 6
        - ReagentId: JuiceLemon
          Quantity: 6
        - ReagentId: JuiceBanana
          Quantity: 6
        - ReagentId: JuiceOrange
          Quantity: 6
        - ReagentId: Cream
          Quantity: 6
        - ReagentId: ImperialPeachjuice
          Quantity: 6
        - ReagentId: ImperialCherryjelly
          Quantity: 6
  - type: RefillableSolution
    solution: vat
  - type: DrainableSolution
    solution: vat
  - type: ExaminableSolution
    solution: vat
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Anchorable
  - type: Pullable
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 4
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

