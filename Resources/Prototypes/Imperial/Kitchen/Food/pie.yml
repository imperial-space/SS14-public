# Блюда TG /obj/item/food/pie (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodPiePlain
  name: "простой пирог"
  description: "Простой пирог, но всё равно вкусный."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/piecake.rsi
    state: pie
  - type: Item
    size: Normal
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 14
        reagents:
        - ReagentId: Nutriment
          Quantity: 8
        - ReagentId: Vitamin
          Quantity: 1
  - type: FlavorProfile
    flavors:
    - food

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodPieEmpty
  name: "пирог"
  description: "Пирог на заказ от сумасшедшего шефа."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/piecake.rsi
    state: pie_custom
  - type: Item
    size: Normal
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 17
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Vitamin
          Quantity: 2
  - type: FlavorProfile
    flavors:
    - food
  - type: ImperialProcessable
    entries:
    - tool: Knife
      result: ImperialFoodPiesliceEmpty
      amount: 3
      time: 2
      tableRequired: true

