# Блюда TG /obj/item/food/bowled (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodBowledHuaMulanCongee
  name: "конджи «Хуа Мулань»"
  description: "Никто не знает, почему эта улыбчивая миска рисовой каши с яйцами и беконом названа в честь мифической китаянки — просто так повелось."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/martian.rsi
    state: hua_mulan_congee
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 27
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: Vitamin
          Quantity: 10
        - ReagentId: Protein
          Quantity: 6
  - type: FlavorProfile
    flavors:
    - bacon
    - egg
  - type: Edible
    trash:
    - FoodBowlBig

