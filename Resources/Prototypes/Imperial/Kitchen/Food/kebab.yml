# Блюда TG /obj/item/food/kebab (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodKebabPicossSkewers
  name: "шашлычок пикосс"
  description: "Популярная тизирская уличная еда: маринованная в уксусе бронерыба на шпажке с луком и перцем чили."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/lizard.rsi
    state: picoss_skewer
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 19
        reagents:
        - ReagentId: Protein
          Quantity: 8
        - ReagentId: Vitamin
          Quantity: 4
        - ReagentId: Vinegar
          Quantity: 1
        - ReagentId: CapsaicinOil
          Quantity: 1
  - type: FlavorProfile
    flavors:
    - acid
    - fishy
    - onion
  - type: Edible
    trash:
    - PartRodMetal1

