# Блюда TG /obj/item/food/snowcones (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodSnowconesLime
  name: "лаймовый снежок"
  description: "Лаймовый сироп на снежке в бумажном стаканчике."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/frozen_treats.rsi
    state: lime_sc
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 22
        reagents:
        - ReagentId: Nutriment
          Quantity: 1
        - ReagentId: JuiceLime
          Quantity: 5
        - ReagentId: Water
          Quantity: 11
  - type: FlavorProfile
    flavors:
    - cold
    - water
  - type: Edible
    trash:
    - DrinkWaterCup

