# Блюда TG /obj/item/food/burger (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodBurgerFish
  name: "филе-о-карп"
  description: "Словно где-то вопит карп... Отдай моё филе-о-карп, отдай карпа."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/burgerbread.rsi
    state: fishburger
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 18
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Protein
          Quantity: 6
        - ReagentId: Vitamin
          Quantity: 4
  - type: FlavorProfile
    flavors:
    - bun
    - fishy

