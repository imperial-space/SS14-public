# Блюда TG /obj/item/food/pizzaslice (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodPizzasliceMothicMargherita
  name: "кусок нианской «Маргариты»"
  description: "Кусок нианской «Маргариты», скромнейшей из пицц."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/moth.rsi
    state: margherita_slice
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
  - type: FlavorProfile
    flavors:
    - bread
    - cheesy
    - tomato

