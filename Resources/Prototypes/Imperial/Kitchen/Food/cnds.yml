# Блюда TG /obj/item/food/cnds (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodCndsCaramel
  name: "карамельные C&D"
  description: "С приторной карамелью внутри — кошмар диабетика."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/food.rsi
    state: cnds
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 9
        reagents:
        - ReagentId: Sugar
          Quantity: 3
        - ReagentId: CocoaPowder
          Quantity: 1
  - type: FlavorProfile
    flavors:
    - chocolate
    - sweet

