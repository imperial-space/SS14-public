# Блюда TG /obj/item/food/raw_patty (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodRawPattyHuman
  name: "странная сырая котлета"
  description: "Я.....НЕ ГОТОООВА."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/meat.rsi
    state: raw_patty
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 7
        reagents:
        - ReagentId: Protein
          Quantity: 2
  - type: FlavorProfile
    flavors:
    - meaty
  - type: ImperialGrillable
    result: ImperialFoodPattyHuman
    time: 35

