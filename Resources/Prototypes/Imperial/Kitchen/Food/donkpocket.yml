# Блюда TG /obj/item/food/donkpocket (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodDonkpocketGondola
  name: "гондола-покет"
  description: "Решение использовать в рецепте настоящее мясо гондолы, мягко говоря, спорное."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/food.rsi
    state: donkpocketgondola
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Protein
          Quantity: 2
  - type: FlavorProfile
    flavors:
    - dough
    - meaty
  - type: ImperialBakeable
    result: ImperialFoodDonkpocketWarmGondola
    time: 30

