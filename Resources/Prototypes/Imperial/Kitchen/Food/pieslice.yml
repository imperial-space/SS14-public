# Блюда TG /obj/item/food/pieslice (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodPiesliceEmpty
  name: "кусок пирога"
  description: "Кусок пирога на заказ от сумасшедшего шефа."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/piecake.rsi
    state: pie_custom_slice
  - type: Item
    size: Tiny
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 7
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
  - type: FlavorProfile
    flavors:
    - food

