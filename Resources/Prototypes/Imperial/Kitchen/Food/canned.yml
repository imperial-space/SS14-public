# Блюда TG /obj/item/food/canned (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodCannedJellyfish
  name: "консервированная медуза-стрелок"
  description: "Банка медуз-стрелков в рассоле. Содержит лёгкий галлюциноген, разрушающийся при готовке."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/canned.rsi
    state: jellyfish
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 16
        reagents:
        - ReagentId: Protein
          Quantity: 8
        - ReagentId: MindbreakerToxin
          Quantity: 2
        - ReagentId: TableSalt
          Quantity: 1
  - type: FlavorProfile
    flavors:
    - salty

