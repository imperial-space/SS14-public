# Блюда TG /obj/item/food/cake (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodCakePlainVegan
  name: "простой веганский торт"
  description: "Простой веганский торт, и это не ложь."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/piecake.rsi
    state: plaincake
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 42
        reagents:
        - ReagentId: Nutriment
          Quantity: 30
        - ReagentId: Vitamin
          Quantity: 7
  - type: FlavorProfile
    flavors:
    - food
  - type: ImperialProcessable
    entries:
    - tool: Knife
      result: ImperialFoodCakeslicePlainVegan
      amount: 3
      time: 3
      tableRequired: true

