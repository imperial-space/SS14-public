# Блюда TG /obj/item/food/cornchips (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodCornchipsBlue
  name: "«Боритос» «Крутейшее ранчо»"
  description: "Что было первым — ранчо или крутое ранчо?"
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/food.rsi
    state: boritos
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: OilOlive
          Quantity: 2
        - ReagentId: TableSalt
          Quantity: 3
        - ReagentId: ImperialYoghurt
          Quantity: 1
        - ReagentId: Allicin
          Quantity: 1
  - type: FlavorProfile
    flavors:
    - corn

