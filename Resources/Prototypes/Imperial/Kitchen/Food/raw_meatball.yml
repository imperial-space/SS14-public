# Блюда TG /obj/item/food/raw_meatball (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodRawMeatballHuman
  name: "странная сырая фрикаделька"
  description: "Отличная еда. Не вязанка дров. Сыровата."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/meat.rsi
    state: raw_meatball
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 7
        reagents:
        - ReagentId: Protein
          Quantity: 2
  - type: FlavorProfile
    flavors:
    - meaty
  - type: ImperialGrillable
    result: ImperialFoodMeatballHuman
    time: 35
  - type: ImperialProcessable
    entries:
    - tool: RollingPin
      result: ImperialFoodRawPattyHuman
      amount: 1
      time: 2
      tableRequired: true

