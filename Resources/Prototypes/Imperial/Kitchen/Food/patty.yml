# Блюда TG /obj/item/food/patty (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodPattyHuman
  name: "странная котлета"
  description: "Котлета от Nanotrasen — котлета для нас с тобой!"
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/meat.rsi
    state: patty
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 7
        reagents:
        - ReagentId: Protein
          Quantity: 2
  - type: FlavorProfile
    flavors:
    - meaty

