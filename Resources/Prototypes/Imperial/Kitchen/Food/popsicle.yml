# Блюда TG /obj/item/food/popsicle (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodPopsicleLicoriceCreamsicle
  name: "батончик «Пустота»™"
  description: "Солёное лакричное мороженое. Солёное замороженное лакомство."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/frozen_treats.rsi
    state: popsicle_stick_s
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 17
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: TableSalt
          Quantity: 1
        - ReagentId: Cream
          Quantity: 2
        - ReagentId: ImperialVanilla
          Quantity: 1
        - ReagentId: Sugar
          Quantity: 4
  - type: FlavorProfile
    flavors:
    - food
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash

