# Блюда TG /obj/item/food/cookie (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodCookiePeanutButter
  name: "печенье с арахисовым маслом"
  description: "Вкусное тягучее печенье с арахисовым маслом."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/food.rsi
    state: peanut_butter_cookie
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: ImperialPeanutButter
          Quantity: 5
  - type: FlavorProfile
    flavors:
    - butter

