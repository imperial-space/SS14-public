# Блюда TG /obj/item/food/meat (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodMeatSlabHumanMutantGolem
  name: "мясо"
  description: "Съедобные камни — добро пожаловать в будущее."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/meat.rsi
    state: golemmeat
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 11
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Iron
          Quantity: 3
  - type: FlavorProfile
    flavors:
    - food
  - type: ImperialGrillable
    result: FoodMeatCooked
    time: 60
  - type: ImperialProcessable
    entries:
    - tool: Knife
      result: FoodMeatCutlet
      amount: 3
      time: 3
      tableRequired: true

