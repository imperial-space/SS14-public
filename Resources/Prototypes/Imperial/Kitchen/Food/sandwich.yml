# Блюда TG /obj/item/food/sandwich (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodSandwichCheese
  name: "сырный сэндвич"
  description: "Лёгкая закуска для тёплого дня. ...а что, если его поджарить?"
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/burgerbread.rsi
    state: sandwich
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 16
        reagents:
        - ReagentId: Nutriment
          Quantity: 7
        - ReagentId: Protein
          Quantity: 3
        - ReagentId: Vitamin
          Quantity: 1
  - type: FlavorProfile
    flavors:
    - bread
    - cheesy
  - type: ImperialGrillable
    result: FoodBakedGrilledCheeseSandwich
    time: 45

