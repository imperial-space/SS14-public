# Блюда TG /obj/item/food/fishmeat (scratchpad/kitchen/kgen.pl).

- type: entity
  parent: FoodInjectableBase
  id: ImperialFoodFishmeatQuality
  name: "качественное рыбное филе"
  description: "Филе ценной рыбы."
  components:
  - type: Sprite
    sprite: Imperial/Kitchen/Food/meat.rsi
    state: fishfillet
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
        - ReagentId: Protein
          Quantity: 4
        - ReagentId: Vitamin
          Quantity: 3
  - type: FlavorProfile
    flavors:
    - fishy

