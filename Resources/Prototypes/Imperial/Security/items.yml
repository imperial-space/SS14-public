# Снаряжение СБ 1 в 1 с tgstation/BandaStation: Compli-o-nator, мегафоны, телескопическая дубинка, электростул.

# ─── Compli-o-nator (clothing/mask/gas/sechailer) ───

- type: entity
  parent: BaseAction
  id: ActionSecHailerHalt
  name: СТОЯТЬ!
  description: Проиграть одну из записанных фраз Compli-o-Nator 3000.
  components:
  - type: Action
    itemIconStyle: BigItem
    useDelay: 3
  - type: InstantAction
    event: !type:SecHailerHaltActionEvent {}

# ─── Мегафоны (obj/item/megaphone) ───

- type: speechVerb
  id: ImperialMegaphone
  name: chat-speech-verb-name-megaphone
  speechVerbStrings:
  - chat-speech-verb-megaphone-1
  bold: true
  fontSize: 17

- type: speechVerb
  id: ImperialMegaphoneEmagged
  name: chat-speech-verb-name-megaphone
  speechVerbStrings:
  - chat-speech-verb-megaphone-emagged-1
  bold: true
  fontSize: 26

- type: entity
