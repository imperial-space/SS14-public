  components:
  - type: Sprite
    sprite: Imperial/Security/megaphone.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Imperial/Security/megaphone.rsi
  - type: Megaphone

- type: entity
  parent: Megaphone
  id: MegaphoneSecurity
  name: мегафон СБ
  components:
  - type: Sprite
    sprite: Imperial/Security/megaphone-sec.rsi
  - type: Item
    sprite: Imperial/Security/megaphone-sec.rsi

- type: entity
  parent: Megaphone
  id: MegaphoneCommand
  name: командный мегафон
  components:
  - type: Sprite
    sprite: Imperial/Security/megaphone-command.rsi
  - type: Item
    sprite: Imperial/Security/megaphone-command.rsi

- type: entity
  parent: Megaphone
  id: MegaphoneCargo
  name: мегафон снабжения
  components:
  - type: Sprite
    sprite: Imperial/Security/megaphone-cargo.rsi
  - type: Item
    sprite: Imperial/Security/megaphone-cargo.rsi

- type: entity
