# Снаряжение должностей SS13 в редакторе персонажа — как у остальных должностей (одежда, сумки, верхняя одежда,
# аксессуары, коробки выживания). Постоянное (КПК, гарнитура, ваучер) — в startingGear должностей.

# ─── Генетик (научный отдел) ───

- type: roleLoadout
  id: JobGeneticist
  groups:
  - GroupTankHarness
  - ScientistHead
  - ScientistNeck
  - ImperialGeneticistJumpsuit
  - ImperialGeneticistBackpack
  - ImperialGeneticistOuterClothing
  - ScientistGloves
  - ScientistShoes
  - Glasses
  - Survival
  - Trinkets
  - GroupSpeciesBreathTool

- type: loadoutGroup
  id: ImperialGeneticistJumpsuit
  name: loadout-group-imperial-geneticist-jumpsuit
  loadouts:
  - ImperialGeneticistJumpsuit
  - ImperialGeneticistJumpskirt

- type: loadoutGroup
  id: ImperialGeneticistBackpack
  name: loadout-group-imperial-geneticist-backpack
  loadouts:
  - ImperialGeneticistBackpack
  - ImperialGeneticistSatchel
  - ImperialGeneticistDuffel

- type: loadoutGroup
  id: ImperialGeneticistOuterClothing
  name: loadout-group-imperial-geneticist-outerclothing
  minLimit: 0
  loadouts:
  - ImperialGeneticistLabCoat
  - RegularLabCoat
  - ImperialGeneticistWintercoat

- type: loadout
  id: ImperialGeneticistJumpsuit
  equipment:
    jumpsuit: ClothingUniformJumpsuitImperialGeneticist

- type: loadout
  id: ImperialGeneticistJumpskirt
  equipment:
    jumpsuit: ClothingUniformJumpskirtImperialGeneticist

- type: loadout
  id: ImperialGeneticistBackpack
  equipment:
    back: ClothingBackpackGenetics

- type: loadout
  id: ImperialGeneticistSatchel
  equipment:
    back: ClothingBackpackSatchelGenetics

- type: loadout
  id: ImperialGeneticistDuffel
  equipment:
    back: ClothingBackpackDuffelGenetics

- type: loadout
  id: ImperialGeneticistLabCoat
  equipment:
    outerClothing: ClothingOuterCoatLabGene

- type: loadout
  id: ImperialGeneticistWintercoat
  equipment:
    outerClothing: ClothingOuterWinterGen

