# =============================================================================
# Xenobiology: Custom Slime Items
# Уникальные предметы, спавнящиеся из экстрактов ксено-слаймов.
# =============================================================================

# =============================================================================
# ЗАРЯЖЕННЫЕ ЯДРА СЛАЙМОВ (Crossbreeding System)
# Создаются когда взрослый слайм поглощает 10 экстрактов другого цвета.
# Нужно вколоть 10u плазмы, затем активировать в руке.
# =============================================================================

- type: entity
  parent: BaseItem
  id: BaseXenoChargedCore
  name: заряженное ядро слайма
  description: Пульсирующий сгусток слаймовой материи. Вколите 10u плазмы и активируйте в руке.
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Mobs/Aliens/slimes.rsi
    state: rainbow_slime_extract
  - type: StaticPrice
    price: 1000
  - type: SolutionContainerManager
    solutions:
      chemicals:
        maxVol: 50
  - type: InjectableSolution
    solution: chemicals
  - type: XenoChargedSlimeCore

