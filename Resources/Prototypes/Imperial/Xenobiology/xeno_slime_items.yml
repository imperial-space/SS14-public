# =============================================================================
# ДРОБИЛКА КСЕНО-СЛАЙМОВ
# Стационарная машина. Кликните, чтобы включить/выключить.
# В активном состоянии автоматически дробит мёртвых и недееспособных
# ксено-слаймов в радиусе, производя из них экстракты.
# =============================================================================

- type: entity
  parent: [ BaseMachine, ConstructibleMachine ]
  id: XenoSlimeGrinder
  name: дробилка ксено-слаймов
  description: Стационарная машина, перерабатывающая мёртвых и недееспособных ксено-слаймов в экстракты. Кликните, чтобы включить. При осмотре видно, сколько слаймов в обработке.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Imperial/xenobiology/processor.rsi
    noRot: false
    layers:
    - state: processor
      map: [ "base" ]
    - state: processor_open
      visible: false
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.XenoSlimeGrinderVisuals.State:
        base:
          Off: { state: processor }
          On: { state: processor_on }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
  - type: WiresPanel
  - type: Machine
    board: XenoSlimeGrinderMachineCircuitboard
  - type: StaticPrice
    price: 2500
  - type: XenoSlimeCrusher
    absorbRange: 2.0
    scanInterval: 2.0
    processTime: 8.0
    crushSound:
      path: /Audio/Machines/blender.ogg

- type: entity
  parent: BaseMachineCircuitboard
  id: XenoSlimeGrinderMachineCircuitboard
  name: плата дробилки ксено-слаймов
  description: Печатная плата для сборки дробилки ксено-слаймов.
  components:
  - type: MachineBoard
    prototype: XenoSlimeGrinder
    stackRequirements:
      Manipulator: 2
      Steel: 5
      CableHV: 1