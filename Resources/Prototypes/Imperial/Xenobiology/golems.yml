# ── Оболочка голема ───────────────────────────────────────────────────────────

- type: entity
  id: GolemShellAdamantine
  parent: IngotBase
  name: оболочка голема
  description: Пустая адамантитовая оболочка голема. Наполните её 30 единицами материала, чтобы создать голема соответствующего типа.
  components:
  - type: Sprite
    sprite: Imperial/xenobiology/golem.rsi
    layers:
    - state: adamantine_m_s
  - type: Item
    size: Large
  - type: GolemShell
    requiredCount: 30
    materialToGolem:
      IngotGold: MobGolemGold
      IngotSilver: MobGolemSilver
      SheetPlasma: MobGolemPlasma
      SheetGlass: MobGolemGlass
      SheetUranium: MobGolemUranium
      MaterialWoodPlank: MobGolemWood

# ── Базовый голем (абстрактный) ───────────────────────────────────────────────

- type: entity
  id: BaseGolem
  parent: BaseMobAsteroid
  abstract: true
  components:
  - type: Sprite
    sprite: Imperial/xenobiology/golem.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: golem_m_s
  - type: MobThresholds
    thresholds:
      0: Alive
      250: Dead
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: DamageModifierGolemBase
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 2.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Items/gavel.ogg
    angle: 0
    attackRate: 1.0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 20
        Structural: 5
  - type: NpcFactionMember
    factions: []
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
  - type: NoSlip
  - type: Destructible
    thresholds: []
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepBorg
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
  - type: Vocal
    sounds:
      Unsexed: UnisexSilicon
    wilhelmProbability: 0

# ── Золотой голем ─────────────────────────────────────────────────────────────

- type: entity
  id: MobGolemGold
  parent: BaseGolem
  name: золотой голем
  description: Голем из золота, заключённый в адамантитовую оболочку.
  components:
  - type: Sprite
    sprite: Imperial/xenobiology/golem.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: golem_m_s
      color: "#FFD700"
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: DamageModifierGolemGold
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.8
    baseSprintSpeed: 3.5
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Items/gavel.ogg
    angle: 0
    attackRate: 1.5
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 20
        Structural: 5
  - type: GhostRole
    name: ghost-role-information-golem-gold-name
    description: ghost-role-information-golem-gold-desc
    rules: ghost-role-information-rules-golem
    raffle:
      settings: short
  - type: GhostTakeoverAvailable

