# =============================================================================
# Xenobiology: Old & Ancient Xeno Slimes (22 цвета × 2 стадии = 44 прото)
# =============================================================================

# -- БАЗОВЫЙ СТАРЫЙ СЛАЙМ -----------------------------------------------------

- type: entity
  id: BaseXenoSlimeOld
  parent: [ SimpleMobBase, MobCombat ]
  name: ксено-слайм (старый)
  abstract: true
  description: Знатно отъевшийся слайм. Прожил уже больше 10 минут. При делении порождает крупных потомков.
  components:
  - type: XenoSlime
    isAdult: true
    ageStage: Old
  - type: XenoSlimeCrossbreed
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/slimes.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: blue_adult_slime
      scale: 1.35, 1.35
  - type: DamageStateVisuals
    states:
      Alive:
        Base: blue_adult_slime
      Dead:
        Base: blue_adult_slime_dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.40
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.8
    baseSprintSpeed: 3.8
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSlime
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: FoodMeatSlime
      amount: 3
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.2
    damageRecovery:
      types:
        Asphyxiation: -1.0
    maxSaturation: 15
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Slime
  - type: Bloodstream
    bloodReagents:
      reagents:
      - ReagentId: Slime
        Quantity: 1
    bloodlossDamage:
      types:
        Bloodloss: 0.5
    bloodlossHealDamage:
      types:
        Bloodloss: -0.25
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.45
  - type: Body
    prototype: Slimes
    requiredLegs: 1
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      path: /Audio/Weapons/punch3.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 12
        Caustic: 6
  - type: NpcFactionMember
    factions:
    - XenoSlimeFaction
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-slimes
    interactFailureString: petting-failure-generic
  - type: Speech
    speechVerb: Slime
    speechSounds: Slime
  - type: TypingIndicator
    proto: slime
  - type: InjectableSolution
    solution: chemicals

