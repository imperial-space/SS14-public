# Скрещенные экстракты слаймов (crossbreeding). Сгенерировано по таблицам SS13.

- type: entity
  id: BaseSlimeCross
  parent: BaseItem
  abstract: true
  name: скрещенный экстракт слайма
  description: Чрезвычайно мощный экстракт слайма, полученный скрещиванием.
  components:
  - type: Sprite
    sprite: Imperial/Xenobiology/slimecrossing.rsi
    state: base
  - type: Item
    size: Tiny
  - type: StaticPrice
    price: 400

- type: entity
  id: BaseSlimeCrossActivated
  parent: BaseSlimeCross
  abstract: true
  components:
  - type: SolutionContainerManager
    solutions:
      crossbreed:
        maxVol: 10
  - type: InjectableSolution
    solution: crossbreed
  - type: DrawableSolution
    solution: crossbreed
  - type: SlimeCrossActivated

- type: entity
  id: SlimeCrossBurningGrey
  parent: BaseSlimeCrossActivated
  name: жгучий серый экстракт
  description: Он кипит едва сдерживаемой энергией.
  components:
  - type: Sprite
    state: burning
    color: "#FFFFFF"
  - type: SlimeCrossbreed
    slimeType: SlimeGrey
    effect: burning
    effectDesc: slime-cross-desc-burning-grey

