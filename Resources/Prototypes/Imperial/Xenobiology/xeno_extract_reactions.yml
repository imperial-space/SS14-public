# =============================================================================
# Xenobiology: Xeno Extract Reactions
#
# Механика grinding:
#   1. Измельчить экстракт в блендере → получить XenoRaw<Цвет> в стакане.
#   2. Смешать с катализатором (Blood / Plasma / Water) → реакция даёт продукт.
#
# Количество: 5u XenoRaw + 5u катализатор = 10u продукта (ProduceReagent)
#          или спавн сущности/эффект (SpawnEntity, Emp, Ignite...).
#
# Для эффектов SpawnRandom, SnapCool — всё ещё работает старый инъекционный
# механизм (slime-контейнер), т.к. нет стандартного EntityEffect для них.
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# 0 — СЕРЫЙ (Grey)
# ─────────────────────────────────────────────────────────────────────────────

# Grey + Blood → MonkeyCube ×3
- type: reaction
  id: XenoGreyBlood
  quantized: true
  reactants:
    XenoRawGrey:
      amount: 5
    Blood:
      amount: 5
  effects:
    - !type:SpawnEntity
      entity: MonkeyCube
      number: 3
      predicted: false

# Grey + Plasma → XenoSlimeGrowthFactor
- type: reaction
  id: XenoGreyPlasma
  reactants:
    XenoRawGrey:
      amount: 5
    Plasma:
      amount: 5
  products:
    XenoSlimeGrowthFactor: 10

# Grey + Water → Epinephrine
- type: reaction
  id: XenoGreyWater
  reactants:
    XenoRawGrey:
      amount: 5
    Water:
      amount: 5
  products:
    Epinephrine: 10

