# Готовые слаймы каждого типа и возраста для меню спавна.

- type: entity
  parent: MobXenoSlime
  id: MobXenoSlimeGreyBaby
  name: серый слайм-детёныш
  suffix: Ксенобиология
  components:
  - type: Slime
    slimeType: SlimeGrey
    stage: Baby
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/Xenobiology/slimes.rsi
    layers:
    - map: [ "enum.SlimeVisualLayers.Base" ]
      state: grey-baby
    - map: [ "enum.SlimeVisualLayers.Mood" ]
      state: aslime-smile
      visible: false

