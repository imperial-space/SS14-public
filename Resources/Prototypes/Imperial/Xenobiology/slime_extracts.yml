# obj/item/slime_extract

- type: entity
  id: BaseSlimeExtract
  parent: BaseItem
  abstract: true
  name: экстракт слайма
  description: Слизь, извлечённая из слайма. Легенды гласят, что у неё есть «магические силы».
  components:
  - type: Sprite
    sprite: Imperial/Xenobiology/slimes.rsi
  - type: Item
    size: Tiny
  - type: SolutionContainerManager
    solutions:
      extract:
        maxVol: 100
      grind:
        reagents:
        - ReagentId: SlimeJelly
          Quantity: 20
  - type: InjectableSolution
    solution: extract
  - type: DrawableSolution
    solution: extract
  - type: Extractable
    grindableSolutionName: grind
  - type: StaticPrice
    price: 75
  - type: Tag
    tags:
    - SlimeExtract

- type: entity
  id: SlimeExtractGrey
  parent: BaseSlimeExtract
  name: серый экстракт слайма
  components:
  - type: Sprite
    state: grey-core
  - type: SlimeExtract
    slimeType: SlimeGrey
    crossbreedModification: reproductive

