# Фракции, обезьяна-жертва, базовые и цветные прототипы слаймов
# =============================================================================

# -- ФРАКЦИИ ------------------------------------------------------------------

- type: npcFaction
  id: XenoSlimeFaction
  hostile:
  - XenoMonkeyFaction

- type: npcFaction
  id: XenoMonkeyFaction

# -- ОБЕЗЬЯНА-ЖЕРТВА ----------------------------------------------------------

- type: entity
  id: XenoMonkey
  parent: MobMonkey
  name: обезьяна
  suffix: Xenobiology
  description: Обезьяна для кормления слаймов в ксенобиологической лаборатории.
  components:
  - type: XenoSlimeFood
  - type: NpcFactionMember
    factions:
    - XenoMonkeyFaction

# -- БАЗОВЫЙ МАЛЕНЬКИЙ СЛАЙМ --------------------------------------------------

- type: entity
  id: BaseXenoSlimeSmall
  parent: [ SimpleMobBase, MobCombat ]
  name: ксено-слайм
  abstract: true
  description: Маленький слайм из ксенобиологической лаборатории. Покорми его обезьяной, чтобы он вырос.
  components:
  - type: XenoSlime
    isAdult: false
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/slimes.rsi
    scale: 0.5, 0.5
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: blue_adult_slime
  - type: DamageStateVisuals
    states:
      Alive:
        Base: blue_adult_slime
      Dead:
        Base: blue_adult_slime_dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.18
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3.5
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSlime
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: FoodMeatSlime
      amount: 1
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.2
    damageRecovery:
      types:
        Asphyxiation: -1.0
    maxSaturation: 15
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Slime
  - type: Bloodstream
    bloodReagents:
      reagents:
      - ReagentId: Slime
        Quantity: 1
    bloodlossDamage:
      types:
        Bloodloss: 0.5
    bloodlossHealDamage:
      types:
        Bloodloss: -0.25
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.45
  - type: Body
    prototype: Slimes
    requiredLegs: 1
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      path: /Audio/Weapons/punch3.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 4
        Caustic: 2
  - type: NpcFactionMember
    factions:
    - XenoSlimeFaction
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-slimes
    interactFailureString: petting-failure-generic
  - type: Speech
    speechVerb: Slime
    speechSounds: Slime
  - type: TypingIndicator
    proto: slime
  - type: SolutionContainerManager
    solutions:
      chemicals:
        maxVol: 50
  - type: InjectableSolution
    solution: chemicals


# -- БАЗОВЫЙ БОЛЬШОЙ СЛАЙМ ----------------------------------------------------

- type: entity
  id: BaseXenoSlimeLarge
  parent: [ SimpleMobBase, MobCombat ]
  name: ксено-слайм (взрослый)
  abstract: true
  description: Большой слайм из ксенобиологической лаборатории. Покорми его ещё одной обезьяной, и он разделится на 4.
  components:
  - type: XenoSlime
    isAdult: true
  - type: XenoSlimeCrossbreed
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/slimes.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: blue_adult_slime
  - type: DamageStateVisuals
    states:
      Alive:
        Base: blue_adult_slime
      Dead:
        Base: blue_adult_slime_dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 4
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSlime
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: FoodMeatSlime
      amount: 2
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.2
    damageRecovery:
      types:
        Asphyxiation: -1.0
    maxSaturation: 15
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Slime
  - type: Bloodstream
    bloodReagents:
      reagents:
      - ReagentId: Slime
        Quantity: 1
    bloodlossDamage:
      types:
        Bloodloss: 0.5
    bloodlossHealDamage:
      types:
        Bloodloss: -0.25
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.45
  - type: Body
    prototype: Slimes
    requiredLegs: 1
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      path: /Audio/Weapons/punch3.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 8
        Caustic: 4
  - type: NpcFactionMember
    factions:
    - XenoSlimeFaction
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-slimes
    interactFailureString: petting-failure-generic
  - type: Speech
    speechVerb: Slime
    speechSounds: Slime
  - type: TypingIndicator
    proto: slime
  - type: SolutionContainerManager
    solutions:
      chemicals:
        maxVol: 50
  - type: InjectableSolution
    solution: chemicals

