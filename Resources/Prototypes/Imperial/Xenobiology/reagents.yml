# Реагенты ксенобиологии SS13.

# reagent/toxin/slimejelly
- type: reagent
  id: SlimeJelly
  name: reagent-name-slime-jelly
  group: Toxins
  desc: reagent-desc-slime-jelly
  physicalDesc: reagent-physical-desc-slimy
  flavor: slimy
  color: "#801E28"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        probability: 0.05
        damage:
          types:
            Poison: 40
      - !type:PopupMessage
        probability: 0.05
        type: Local
        messages: [ "slime-jelly-burning" ]
      - !type:EvenHealthChange
        probability: 0.23
        damage:
          Brute: -5

# reagent/medicine/regen_jelly
- type: reagent
  id: RegenJelly
  name: reagent-name-regen-jelly
  group: Medicine
  desc: reagent-desc-regen-jelly
  physicalDesc: reagent-physical-desc-slimy
  flavor: slimy
  color: "#CC23FF"
  metabolisms:
    Bloodstream:
      effects:
      - !type:EvenHealthChange
        damage:
          Brute: -0.75
          Burn: -0.75
          Airloss: -0.75
          Toxin: -0.75

