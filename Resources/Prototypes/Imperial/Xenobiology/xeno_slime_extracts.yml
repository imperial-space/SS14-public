# =============================================================================
# Xenobiology: Xeno Slime Extracts
# 22 ������� ��������� (SS13 Xenobiology)
#
# ��������:
#   1. ����� ������ ����� / ������ / ���� ������� � ������� "slime" ���������.
#   2. XenoSlimeExtractSystem ������������ ������� � ��������� ������ ������.
#   3. ��� ProduceReagent � ������� �������� � ������� "food"; �����������
#      ����� ������� (All-in-One Grinder) ��� �������.
# =============================================================================

# -- ������� �������� --------------------------------------------------------

- type: entity
  parent: MaterialSmileExtract
  id: BaseXenoSlimeExtract
  abstract: true
  description: Базовый экстракт ксено-слайма, добываемый дробилкой.
  components:
  - type: SolutionContainerManager
    solutions:
      slime:
        maxVol: 10
      food:
        maxVol: 80
  - type: InjectableSolution
    solution: slime

# Примечание: механизм grinding (All-in-One Grinder) заполняет раствор "food".
# Каждый экстракт получает заполненный food после помещения в дробилку.
# Рецепт реакции: XenoRaw<Цвет> + Blood/Plasma/Water > нужный результат.

# -- 22 цвета экстрактов (SS13 Xenobiology) ----------------------------------

# 0 — серый (Grey) #808080
- type: entity
  parent: BaseXenoSlimeExtract
  id: XenoSlimeExtractGrey
  name: экстракт серого слайма
  description: Экстракт серого ксено-слайма. Кровь → обезьяньи кубы; Плазма → фактор роста; Вода → адреналин.
  components:
  - type: Sprite
    sprite: Mobs/Aliens/slimes.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: rainbow_slime_extract
      color: "#808080"
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 80
        reagents:
        - ReagentId: XenoRawGrey
          Quantity: 25
  - type: XenoSlimeExtract
    bloodEffect:
      type: SpawnItems
      spawnEntities:
      - MonkeyCube
      - MonkeyCube
      - MonkeyCube
    plasmaEffect:
      type: ProduceReagent
      produceReagent: XenoSlimeGrowthFactor
      produceAmount: 5
    waterEffect:
      type: ProduceReagent
      produceReagent: Epinephrine
      produceAmount: 5

