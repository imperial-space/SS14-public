  - type: ClothingSpeedModifier
    walkModifier: 0.5
    sprintModifier: 0.5
  - type: Reflect
    reflectProb: 0.4
    reflects:
    - Energy
    - NonEnergy

# capturedevice
- type: entity
  id: SlimeCaptureDevice
  parent: BaseItem
  name: золотое устройство захвата
  description: Блюспейс-технология в яйцевидном корпусе для хранения нечеловеческих существ. Всех не поймаешь — внутри только одно место.
  components:
  - type: Sprite
    sprite: Imperial/Xenobiology/slimecrossing.rsi
    state: capturedevice
  - type: Item
    size: Small
  - type: SlimeCaptureDevice
  - type: ContainerContainer
    containers:
      capture: !type:ContainerSlot

# pet/dog/corgi/puppy/slime
- type: entity
  id: MobSlimeCorgiPuppy
  parent: MobCorgiPuppy
  name: слаймовый щенок корги
  description: Невыносимо милый розовый слаймовый щенок корги.
  components:
  - type: Sprite
    color: "#FF9CD0"

