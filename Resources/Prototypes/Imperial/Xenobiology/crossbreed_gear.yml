# Полиморфы кроссбридинга.
- type: polymorph
  id: SlimeCrossSlimeForm
  configuration:
    entity: MobXenoSlime
    transferName: true
    transferDamage: true
    inventory: None
    revertOnCrit: true
    revertOnDeath: true
    ignoreAllowRepeatedMorphs: true

- type: polymorph
  id: SlimeCrossSpeciesDwarf
  configuration:
    entity: MobDwarf
    forced: true
    transferName: true
    transferHumanoidAppearance: true
    inventory: Transfer
    revertOnCrit: false
    revertOnDeath: false
    ignoreAllowRepeatedMorphs: true

- type: polymorph
  id: SlimeCrossSpeciesArachnid
  configuration:
    entity: MobArachnid
    forced: true
    transferName: true
    transferHumanoidAppearance: true
    inventory: Transfer
    revertOnCrit: false
    revertOnDeath: false
    ignoreAllowRepeatedMorphs: true

- type: polymorph
