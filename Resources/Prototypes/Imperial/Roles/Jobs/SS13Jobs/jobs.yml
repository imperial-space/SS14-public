# Должности SS13 для перенесённого контента: генетик (генетика, ДНК-хранилище), вирусолог (вирусология,
# PanD.E.M.I.C), битраннер (битраннинг), ксенобиолог (ксенобиология) и шахтёр (Лаваленд, сразу с ваучером).
# На станции добавляются в availableJobs карты; отделы — Resources/Prototypes/Roles/Jobs/departments.yml;
# одежда и сумки на выбор — Imperial/Loadouts/Common/Jobs/SS13Jobs (roleLoadout Job<должность>).

# ─── Генетик (/datum/job/geneticist, научный отдел — как в tg) ───
- type: job
  id: Geneticist
  name: job-name-imperial-geneticist
  description: job-description-imperial-geneticist
  playTimeTracker: JobGeneticist
  startingGear: ImperialGeneticistGear
  icon: JobIconImperialGeneticist
  supervisors: job-supervisors-rd
  access:
  - Research
  - Maintenance

- type: startingGear
  id: ImperialGeneticistGear
  equipment:
    ears: ClothingHeadsetScience
    id: ImperialGeneticistPDA

- type: jobIcon
  parent: JobIcon
  id: JobIconImperialGeneticist
  icon:
    sprite: /Textures/Imperial/Roles/SS13Jobs/job_icons.rsi
    state: Geneticist
  jobName: job-name-imperial-geneticist

- type: playTimeTracker
  id: JobGeneticist

- type: entity
  parent: SpawnPointPassenger
  id: SpawnPointGeneticist
  name: geneticist
  components:
  - type: SpawnPoint
    job_id: Geneticist
  - type: Sprite
    layers:
    - state: green
    - sprite: Imperial/Roles/SS13Jobs/job_icons.rsi
      state: Geneticist

