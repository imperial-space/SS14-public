# ─── КПК ───

- type: entity
  parent: BasePDA
  id: ImperialGeneticistPDA
  name: geneticist PDA
  description: It's covered in a faint smell of mutagen.
  components:
  - type: Pda
    id: ImperialGeneticistIDCard
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-genetics
  - type: PdaBorderColor
    borderColor: "#d7d7d0"
    accentVColor: "#447ed6"
  - type: Icon
    state: pda-genetics

- type: entity
  parent: BasePDA
  id: ImperialVirologistPDA
  name: virologist PDA
  description: It's covered in a faint smell of disinfectant.
  components:
