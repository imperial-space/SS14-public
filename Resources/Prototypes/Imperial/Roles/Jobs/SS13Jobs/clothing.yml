# ─── ID-карты: полосы отдела и значок должности ───

- type: entity
  parent: IDCardStandard
  id: ImperialGeneticistIDCard
  name: geneticist ID card
  components:
  - type: Sprite
    layers:
    - state: default
    - state: stripe_top
      color: "#a53aaa"
    - state: stripe_bottom
      color: "#652368"
    - sprite: Imperial/Roles/SS13Jobs/job_icons.rsi
      offset: -0.09375, 0.0625
      state: Geneticist
  - type: PresetIdCard
    job: Geneticist

