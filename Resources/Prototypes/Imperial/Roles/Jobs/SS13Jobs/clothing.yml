    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-virology
  - type: PdaBorderColor
    borderColor: "#d7d7d0"
    accentVColor: "#3e9a3e"
  - type: Icon
    state: pda-virology

- type: entity
