# Зарплаты TG (code/modules/jobs/job_types/*.dm, modular_bandastation/jobs): paycheck и paycheck_department.
# PAYCHECK_LOWER = 25, PAYCHECK_CREW = 50, PAYCHECK_COMMAND = 100.
# На старте смены начисляется STARTING_PAYCHECKS = 5 зарплат, дальше раз в 5 минут — одна (не больше 50).
# ACCOUNT_CIV (гражданский бюджет) в SS14 — бюджет обслуживания (Service).
# Должность без department не получает счёт.

- type: imperialPayroll
  id: Default
  jobs:
    # Командование
    Captain: { paycheck: 100, department: Security }
    HeadOfPersonnel: { paycheck: 100, department: Service }
    HeadOfSecurity: { paycheck: 100, department: Security }
    ChiefEngineer: { paycheck: 100, department: Engineering }
    ChiefMedicalOfficer: { paycheck: 100, department: Medical }
    ResearchDirector: { paycheck: 100, department: Science }
    Quartermaster: { paycheck: 100, department: Cargo }
    # Региональный инспектор — как представитель НТ и магистрат BandaStation.
    RFI: { paycheck: 100, department: Security }
    # Адъютант — как ассистент мостика (bridge_assistant).
    Adjutant: { paycheck: 50, department: Service }

    # Служба безопасности
    Warden: { paycheck: 50, department: Security }
    Detective: { paycheck: 50, department: Security }
    SecurityOfficer: { paycheck: 50, department: Security }
    SeniorOfficer: { paycheck: 50, department: Security }
    SecurityCadet: { paycheck: 50, department: Security }
    Brigmedic: { paycheck: 50, department: Security }

    # Инженерия
