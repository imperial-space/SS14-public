    SeniorEngineer: { paycheck: 50, department: Engineering }

    # Медицина
    MedicalDoctor: { paycheck: 50, department: Medical }
    Chemist: { paycheck: 50, department: Medical }
    Paramedic: { paycheck: 50, department: Medical }
    Coroner: { paycheck: 50, department: Medical }
    SeniorPhysician: { paycheck: 50, department: Medical }

    # Наука
    Scientist: { paycheck: 50, department: Science }
    SeniorResearcher: { paycheck: 50, department: Science }

    # Снабжение
    CargoTechnician: { paycheck: 50, department: Cargo }
    SalvageSpecialist: { paycheck: 50, department: Cargo }

    # Обслуживание
    Bartender: { paycheck: 50, department: Service }
    Botanist: { paycheck: 50, department: Service }
    Chef: { paycheck: 50, department: Service }
    Janitor: { paycheck: 50, department: Service }
    StationMaid: { paycheck: 50, department: Service }
    Clown: { paycheck: 50, department: Service }
    Mime: { paycheck: 50, department: Service }
    Musician: { paycheck: 50, department: Service }
