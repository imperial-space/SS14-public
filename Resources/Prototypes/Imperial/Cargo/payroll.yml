    Reporter: { paycheck: 50, department: Service }
    ServiceWorker: { paycheck: 50, department: Service }

    # Ассистенты и гости: PAYCHECK_LOWER из гражданского бюджета.
    Passenger: { paycheck: 25, department: Service }
    Visitor: { paycheck: 25, department: Service }

    # Без счёта: ЦК, ОБР, эскадроны смерти и силиконы.
    CentralCommandOfficial: { paycheck: 0 }
    ERTLeader: { paycheck: 0 }
    ERTChaplain: { paycheck: 0 }
    ERTEngineer: { paycheck: 0 }
    ERTSecurity: { paycheck: 0 }
    ERTMedical: { paycheck: 0 }
    ERTJanitor: { paycheck: 0 }
    CBURN: { paycheck: 0 }
    DeathSquad: { paycheck: 0 }
