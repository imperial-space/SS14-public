    Borg: { paycheck: 0 }

  # payday_modifier: люди 1.1, вульпканины 0.8, остальные TG-расы 1.0.
  # Дварфы — подвид людей.
  species:
    Human: 1.1
    Dwarf: 1.1
    Vulpkanin: 0.8
