# Сундук Некрополя — выпадает из шипа некрополя после его уничтожения.
# Содержит рандомный набор ценных предметов Лаваленда.
- type: entity
  parent: CrateGeneric
  id: NecropolisCrate
  suffix: Lavaland
  name: сундук некрополя
  description: Обитый тёмным металлом сундук, оставшийся от шипа некрополя. Внутри — сокровища тёмных сил.
  components:
  - type: Sprite
    noRot: true
    sprite: Imperial/lava/mining/create.rsi
    layers:
    - state: necrocrate
      map: ["enum.StorageVisualLayers.Door"]
  - type: EntityStorageVisuals
    stateDoorOpen: necrocrate_open
    stateDoorClosed: necrocrate
  - type: EntityTableContainerFill
    containers:
      # Гарантированно 1–2 предмета: каждый бросок выбирает один предмет по весу (бывшие шансы).
      entity_storage: !type:GroupSelector
        rolls: !type:RangeNumberSelector
          range: 1, 2
        children:
        # ── Культовая одежда ─────────────────────────────────────────────
        - !type:EntSelector
          id: CultHeavyRobe
          weight: 20
        - !type:EntSelector
          id: CultSoulStone
          weight: 20
        - !type:EntSelector
          id: ClothingOuterCultFlagellantRobes
          weight: 15
        # ── Оружие ───────────────────────────────────────────────────────
        - !type:EntSelector
          id: MiningDrillDiamond
          weight: 20
        - !type:EntSelector
          id: LavalandWeaponMeatHook
          weight: 20
        - !type:EntSelector
          id: WeaponSpectralBlade
          weight: 15
        - !type:EntSelector
          id: ClusterGrenade
          weight: 25
        # ── Артефакты и утилиты ──────────────────────────────────────────
        - !type:EntSelector
          id: LibraryRecallSpellbook
          weight: 15
        - !type:EntSelector
          id: RodOfAsclepiusLavaland
          weight: 10
        - !type:EntSelector
          id: TalismanImmortality
          weight: 15
        - !type:EntSelector
          id: ClothingOuterChampionArmor
          weight: 10
        # Трофеи дробителя от существ, которых нет на имперском Лаваленде
        - !type:EntSelector
          id: CrusherTrophyLobsterClaw
          weight: 1
        - !type:EntSelector
          id: CrusherTrophyBrimdemonFang
          weight: 1
        - !type:EntSelector
          id: CrusherTrophyBilewormSpewlet
          weight: 1
        - !type:EntSelector
          id: CrusherTrophyIceDemonCube
          weight: 1
        - !type:EntSelector
          id: CrusherTrophyWolfEar
          weight: 1
        - !type:EntSelector
          id: CrusherTrophyBearPaw
          weight: 1
        - !type:EntSelector
          id: CrusherTrophyRaptorFeather
          weight: 1
        - !type:EntSelector
          id: CrusherTrophyIceBlockTalisman
          weight: 1
        - !type:EntSelector
          id: CrusherTrophyBroodmotherTongue
          weight: 1
        - !type:EntSelector
          id: CrusherTrophyLegionnaireSpine
          weight: 1
        - !type:EntSelector
          id: CrusherTrophyFleshGlob
          weight: 1
        - !type:EntSelector
          id: CrusherTrophyAshenSkull
          weight: 1
        # Редкие модули КА (spawner/random/mining/rare_modkit)
        - !type:EntSelector
          id: PKAMiningUpgradeLifeSteal
          weight: 3
        - !type:EntSelector
          id: PKAMiningUpgradeAoEAndTurfs
          weight: 3
        - !type:EntSelector
          id: PKAMiningUpgradeRepeater
          weight: 3
        - !type:EntSelector
          id: PKAMiningUpgradeResonator
          weight: 3
        - !type:EntSelector
          id: PKAMiningUpgradeBounty
          weight: 3
        # ── Кубики-телепорты (спавнятся парой — оба или ни одного) ─────
        - !type:EntSelector
          id: PrisonCubeTeleportPair
          weight: 20
  - type: StaticPrice
    price: 0
