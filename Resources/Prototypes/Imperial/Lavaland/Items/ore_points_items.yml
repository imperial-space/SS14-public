# ==================================================
#  Ore Points Vending Machine — Custom Items
#  Lavaland Mining Gear
# ==================================================

# ─── Горнодобывающая разгрузка ───
- type: entity
  parent: [ClothingBeltStorageBase, ContentsExplosionResistanceBase]
  id: ClothingBeltMiningWebbing
  suffix: Lavaland
  name: горнодобывающая разгрузка
  description: Прочная тактическая разгрузка для горняков. Вмещает всё необходимое снаряжение и защищает от взрывов. Не числится среди контрабанды.
  components:
  - type: Sprite
    sprite: Clothing/Belt/militarywebbing.rsi
  - type: Clothing
    sprite: Clothing/Belt/militarywebbing.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.1
  - type: StaticPrice
    price: 300

# belt/mining/vendor: разгрузка исследователя с капсулой внутри.
- type: entity
  parent: ClothingBeltMiningWebbing
  id: ClothingBeltMiningWebbingFilled
  suffix: Lavaland, Filled
  components:
  - type: StorageFill
    contents:
    - id: RescueCapsule

# ─── Горнодобывающая рудная сумка ───
- type: entity
  parent: OreBag
  id: OreBagMining
  suffix: Lavaland
  name: большая рудная сумка
  description: Увеличенная рудная сумка для опытных горняков — вмещает значительно больше руды.
  components:
  - type: Sprite
    sprite: Objects/Specific/Mining/ore_bag.rsi
    state: icon
    color: "#888888"
  - type: Item
    sprite: Objects/Specific/Mining/ore_bag.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,9,3
    - 0,4,5,4
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
        - ArtifactFragment
        - Ore

# ─── Точильный камень горняка ───
- type: entity
  parent: BaseItem
  id: MiningWhetstone
  suffix: Lavaland
  name: точильный камень горняка
  description: Прочный оселок, заряженный энергией лавного поля. Используйте на оружии ближнего боя для усиления. Одно использование.
  components:
  - type: Sprite
    sprite: Imperial/lava/mining/whetstone.rsi
    layers:
    - state: whetstone
      map: ["base"]
  - type: Item
    size: Small
  - type: CultWhetstone
    damageBonus: 4

# ─── Горнодобывающий медипен ───
- type: entity
  parent: ChemicalMedipen
  id: MiningMedipen
  suffix: Lavaland
  name: горнодобывающий медипен
  description: Многокомпонентный инъектор для горняков. Содержит обезболивающее, жаропонижающее, адреналин и регенерационный компонент.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: firstaid
      map: ["enum.SolutionContainerLayers.Fill"]
    color: "#e06030"
  - type: Item
    sprite: Objects/Specific/Medical/medipen.rsi
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#e06030"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#e06030"
      - state: base-colorB-inhand-right
    size: Tiny
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 45
        reagents:
        - ReagentId: Barozine
          Quantity: 20
        - ReagentId: Leporazine
          Quantity: 10
        - ReagentId: Epinephrine
          Quantity: 10
        - ReagentId: Omnizine
          Quantity: 5

# ─── Снаряд горного акселератора (projectile/kinetic) ───
# 40 урона, дальность 3 клетки. При давлении выше 50 кПа (на Лаваленде — выше давления его
# атмосферы) урон ×0.25.
- type: entity
  id: BulletKineticMiningLavaland
  suffix: Lavaland
  name: кинетическая сила
  parent: BulletKinetic
  categories: [ HideSpawnMenu ]
  description: Кинетический импульс. В плотной атмосфере почти рассеивается.
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 40
  - type: TimedDespawn
    lifetime: 0.12 # 3 клетки при скорости 25
  - type: KineticProjectile

# ─── Горный кинетический акселератор (gun/energy/recharge/kinetic_accelerator) ───
- type: entity
  parent: WeaponProtoKineticAcceleratorBase
  id: WeaponMiningAccelerator
  suffix: Lavaland
  name: протокинетический акселератор
  description: Самозаряжающийся дальнобойный шахтёрский инструмент. Наносит полный урон только при низком давлении — например, на Лаваленде. Поддерживает модули.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
    layers:
    - state: icon
    - state: animation-icon
      visible: false
      map: [ "empty-icon" ]
  - type: Gun
    fireRate: 10
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1.6
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletKineticMiningLavaland
    capacity: 1
    count: 1
  - type: KineticAccelerator
  - type: ContainerContainer
    containers:
      mining_upgrades: !type:Container

# ─── Модули акселератора (borg/upgrade/modkit) ───
- type: entity
  id: BaseMiningPKAUpgrade
  parent: BaseItem
  name: модуль кинетического акселератора
  description: Модуль для кинетического акселератора.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Tools/upgrade.rsi
  - type: Item
    size: Small
  - type: KineticModkit
  - type: StaticPrice
    price: 500

# modkit/range
- type: entity
  parent: BaseMiningPKAUpgrade
  id: PKAMiningUpgradeRange
  suffix: Lavaland
  name: модуль акселератора (дальность)
  description: Увеличивает дальность выстрела кинетического акселератора на 1 клетку.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#2decec"
    - state: overlay-2
      color: "#1012a7"
    - state: overlay-3
      color: "#1373eb"
  - type: KineticModkit
    cost: 25
    range: 1

# modkit/damage
- type: entity
  parent: BaseMiningPKAUpgrade
  id: PKAMiningUpgradeFortification
  suffix: Lavaland
  name: модуль акселератора (урон)
  description: Увеличивает урон кинетического акселератора на 10.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec4d2d"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#eb1313"
  - type: KineticModkit
    cost: 30
    damage: 10

# modkit/cooldown
- type: entity
  parent: BaseMiningPKAUpgrade
  id: PKAMiningUpgradeFireRate
  suffix: Lavaland
  name: модуль акселератора (перезарядка)
  description: Уменьшает время перезарядки кинетического акселератора на 0.32 секунды.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#bbf134"
    - state: overlay-2
      color: "#07901b"
    - state: overlay-3
      color: "#9bf134"
  - type: KineticModkit
    cost: 30
    cooldown: 0.32

# modkit/cooldown/aoe/mobs
- type: entity
  parent: BaseMiningPKAUpgrade
  id: PKAMiningUpgradeAoE
  suffix: Lavaland
  name: модуль акселератора (наступательный взрыв)
  description: Выстрелы кинетического акселератора взрываются, раня существ Лаваленда вокруг цели.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec8a2d"
    - state: overlay-2
      color: "#a75010"
    - state: overlay-3
      color: "#eb7a13"
  - type: KineticModkit
    cost: 10
    group: aoe
    aoe: true
    aoeMobDamage: 1

# modkit/cooldown/aoe/turfs
- type: entity
  parent: BaseMiningPKAUpgrade
  id: PKAMiningUpgradeAoETurfs
  suffix: Lavaland
  name: модуль акселератора (горный взрыв)
  description: Выстрелы кинетического акселератора дробят породу вокруг цели, но перезарядка дольше на 0.32 секунды.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#acacac"
    - state: overlay-2
      color: "#606060"
    - state: overlay-3
      color: "#ec8a2d"
  - type: KineticModkit
    cost: 10
    group: aoe
    aoe: true
    aoeTurfs: true
    cooldown: -0.32

# modkit/cooldown/aoe/mobs/andturfs (редкий)
- type: entity
  parent: BaseMiningPKAUpgrade
  id: PKAMiningUpgradeAoEAndTurfs
  suffix: Lavaland
  name: модуль акселератора (наступательный горный взрыв)
  description: Выстрелы кинетического акселератора дробят породу и ранят существ Лаваленда вокруг цели.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ec4d2d"
    - state: overlay-2
      color: "#606060"
    - state: overlay-3
      color: "#eb7a13"
  - type: KineticModkit
    cost: 10
    group: aoe
    aoe: true
    aoeTurfs: true
    aoeMobDamage: 1
    cooldown: -0.1

# modkit/cooldown/repeater (редкий)
- type: entity
  parent: BaseMiningPKAUpgrade
  id: PKAMiningUpgradeRepeater
  suffix: Lavaland
  name: модуль акселератора (скорострельный повторитель)
  description: Попадание по живой цели или породе вчетверо сокращает перезарядку, но базовая перезарядка сильно увеличена.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#f1e134"
    - state: overlay-2
      color: "#907c07"
    - state: overlay-3
      color: "#f1d434"
  - type: KineticModkit
    cost: 50
    group: repeater
    cooldown: -1.4
    repeater: true

# modkit/lifesteal (редкий)
- type: entity
  parent: BaseMiningPKAUpgrade
  id: PKAMiningUpgradeLifeSteal
  suffix: Lavaland
  name: кристалл вампиризма
  description: Выстрелы кинетического акселератора слегка лечат стрелка при попадании по живой цели.
  components:
  - type: Sprite
    sprite: Imperial/Seriozha/Fredik21/cargo/crystal.rsi
    state: icon3
  - type: KineticModkit
    cost: 20
    lifesteal: 2.5

# modkit/resonator_blasts (редкий)
- type: entity
  parent: BaseMiningPKAUpgrade
  id: PKAMiningUpgradeResonator
  suffix: Lavaland
  name: модуль акселератора (резонансный взрыв)
  description: Выстрелы кинетического акселератора оставляют резонансные поля и подрывают уже стоящие.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#2d6cec"
    - state: overlay-2
      color: "#1012a7"
    - state: overlay-3
      color: "#8b13eb"
  - type: KineticModkit
    cost: 30
    group: resonator
    resonatorBlasts: true

# modkit/bounty (редкий)
- type: entity
  parent: BaseMiningPKAUpgrade
  id: PKAMiningUpgradeBounty
  suffix: Lavaland
  name: модуль акселератора (сифон смерти)
  description: Убийство или помощь в убийстве существа навсегда увеличивает урон по существам этого вида.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#7a0000"
    - state: overlay-2
      color: "#300000"
    - state: overlay-3
      color: "#b01010"
  - type: KineticModkit
    cost: 30
    group: bounty
    bounty: true

# modkit/indoors (синдикат)
- type: entity
  parent: BaseMiningPKAUpgrade
  id: PKAMiningUpgradeIndoors
  suffix: Lavaland
  name: модуль акселератора (снижение штрафа давления)
  description: Модуль синдиката, увеличивающий урон кинетического акселератора в среде с высоким давлением.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#303030"
    - state: overlay-2
      color: "#a71010"
    - state: overlay-3
      color: "#303030"
  - type: KineticModkit
    cost: 35
    group: indoors
    maxOfGroup: 2
    pressureMultiplier: 2

# modkit/human_passthrough
- type: entity
  parent: BaseMiningPKAUpgrade
  id: PKAMiningUpgradeHumanPassthrough
  suffix: Lavaland
  name: модуль акселератора (сквозь людей)
  description: Выстрелы кинетического акселератора проходят сквозь гуманоидов — защита от огня по своим.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#ffffff"
    - state: overlay-2
      color: "#606060"
    - state: overlay-3
      color: "#2decec"
  - type: KineticModkit
    cost: 0
    group: passthrough
    humanPassthrough: true

# ─── Дестабилизатор дробителя (projectile/destabilizer) ───
- type: entity
  id: BulletCrusherDestabilizer
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  name: дестабилизирующая сила
  description: Метит крупных существ для подрыва ударом дробителя.
  components:
  - type: Reflective
    reflective:
    - NonEnergy
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: chronobolt
      shader: unshaded
  - type: GatheringProjectile
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 0
  - type: TimedDespawn
    lifetime: 0.24 # 6 клеток при скорости 25

# ─── Протокинетический дробитель (item/kinetic_crusher) ───
- type: entity
  parent: BaseItem
  id: WeaponKineticCrusher
  suffix: Lavaland
  name: протокинетический дробитель
  description: Ранняя версия протокинетического акселератора — по сути высокотехнологичная дубина. Бьёт только взятым в обе руки. ПКМ метит крупное существо, удар по метке подрывает её; удар со спины сильнее.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/crusher.rsi
    layers:
    - state: icon
  - type: Item
    size: Huge
    sprite: Objects/Weapons/Melee/crusher-inhands.rsi
    shape:
    - 0,0,1,1
  - type: Clothing
    sprite: Objects/Weapons/Melee/crusher.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    soundGunshot: /Audio/Weapons/plasma_cutter.ogg
    fireRate: 10
    useKey: false
  - type: GunRequiresWield
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1.5
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletCrusherDestabilizer
    capacity: 1
    count: 1
  - type: Wieldable
  - type: MeleeRequiresWield
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.25
    range: 1.5
    damage:
      types:
        Slash: 20
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: KineticCrusher
  - type: Appearance
  - type: ContainerContainer
    containers:
      crusher_trophies: !type:Container
  - type: StaticPrice
    price: 500

# temp_visual/explosion/fast модулей акселератора.
- type: entity
  id: KineticExplosionFastEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    drawdepth: Effects
    sprite: Imperial/blob/effects96.rsi
    state: explosionfast
    color: "#ffffff96"
  - type: TimedDespawn
    lifetime: 0.4

# temp_visual/fire трофея tail_spike.
- type: entity
  id: CrusherTailSpikeFireEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    drawdepth: Effects
    sprite: Imperial/lava/boss/megafauna/effects.rsi
    state: fire_light
    shader: unshaded
  - type: TimedDespawn
    lifetime: 0.7

# ─── Прыжковый имплант ───
- type: entity
  parent: BaseSubdermalImplant
  id: MiningJumpImplant
  suffix: Lavaland
  name: прыжковый имплант
  description: Субдермальный имплант, усиливающий ноги. Позволяет прыгать на расстояние 4 тайла. Требует нормальной гравитации для активации.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionGravityJump
  - type: JumpAbility
    jumpDistance: 4
    jumpThrowSpeed: 10

# ─── Имплантер прыжкового импланта ───
- type: entity
  parent: BaseImplantOnlyImplanter
  id: MiningJumpImplanter
  suffix: Lavaland
  name: имплантер прыжкового импланта
  description: Одноразовый имплантер с прыжковым имплантом для горняков.
  components:
  - type: Implanter
    implant: MiningJumpImplant

# ─── Генератор червоточин ───
- type: entity
  parent: BaseItem
  id: MiningWormholeGenerator
  suffix: Lavaland
  name: генератор червоточин
  description: Нестабильное устройство, открывающее микропорталы. Если вы провалитесь в яму — автоматически спасёт вас из любого кармана. Одноразовое.
  components:
  - type: Sprite
    sprite: Imperial/lava/mining/jaunter.rsi
    layers:
      - state: Jaunter
  - type: Item
    size: Small
  - type: WormholeGenerator
  - type: StaticPrice
    price: 400

# ─── Шахтёрский ваучер ───
- type: entity
  parent: BaseItem
  id: MiningVoucher
  suffix: Lavaland
  name: шахтёрский ваучер
  description: Одноразовый ваучер на набор снаряжения. Примените на шахтёрский автомат — откроется меню выбора комплекта.
  components:
  - type: Sprite
    sprite: Imperial/lava/mining/mining.rsi
    layers:
      - state: mining_voucher
  - type: Item
    size: Small
  - type: MiningVoucher
  - type: UserInterface
    interfaces:
      enum.MiningVoucherUiKey.Key:
        type: MiningVoucherBoundUserInterface
  - type: StaticPrice
    price: 100

# ─── Фонарик шахтёрский (без контрабанды) ───
- type: entity
  parent: FlashlightLantern
  id: FlashlightSecliteMining
  suffix: Lavaland
  name: фонарик горняка
  description: Надёжный фонарик без маркировки СБ — просто светит в темноте.
  components:
  - type: Tag
    tags: []
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: HandheldLight
    addPrefix: false
    wattage: 0.5
  - type: Sprite
    sprite: Objects/Tools/seclite.rsi
    layers:
      - state: seclite
      - state: seclite-overlay
        shader: unshaded
        visible: false
        map: [ "light" ]
  - type: StaticPrice
    price: 100

# ─── Спасательная капсула ───
- type: entity
  parent: BaseItem
  id: RescueCapsule
  suffix: Lavaland
  name: спасательная капсула
  description: Экстренная капсула с мобильной базой горняка. После активации мгновенно развёртывает базу прямо под вами. Требует свободную площадку 7x7 тайлов без стен и пропастей.
  components:
  - type: Sprite
    sprite: Imperial/lava/mining/capsule.rsi
    layers:
      - state: capsule
  - type: Item
    size: Normal
  - type: RescueCapsule
  - type: StaticPrice
    price: 400

# ─── Боевой секач (трофей мегафауны) ───
- type: entity
  parent: BaseItem
  id: MeleeWeaponCleavingSaw
  suffix: Lavaland
  name: боевой секач
  description: Складной трофейный секач из Лаваленда. В сложенном виде быстрее, в разложенном — намного мощнее.
  components:
  - type: ItemToggle
    soundActivate:
      path: /Audio/Items/change_jaws.ogg
    soundDeactivate:
      path: /Audio/Items/change_jaws.ogg
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Slash: 20
    deactivatedDamage:
      types:
        Slash: 12
  - type: CleavingSaw
    deactivatedAttackRate: 2.5
    activatedAttackRate: 1.0
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 2.5
    damage:
      types:
        Slash: 12
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        base:
          True: { state: cleaving_saw_open }
          False: { state: cleaving_saw }
  - type: Sprite
    sprite: Imperial/lava/mining/artefact.rsi
    layers:
