- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesEyeOfGod
  suffix: Lavaland
  name: Глаз Бога
  description: По легендам это часть древнего павшего божества. Носитель видит сущности в темноте и ощущает их присутствие сквозь преграды.
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: eyeball-l
  - type: Clothing
    sprite: Mobs/Species/Human/organs.rsi
  - type: EyeOfGod
  - type: ThermalEntityVision
  - type: PointLight
    enabled: true
    radius: 2.2
    energy: 3.2
    color: "#b8e0ff"
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - Inorganic

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckVoiceOfGod
  suffix: Lavaland
  name: Голосовые связки Бога
  description: Древний орган, позволяющий произносить волевые команды через :~ в чате. Ключевые слова работают только на русском.
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: tongue
  - type: Clothing
    sprite: Mobs/Species/Human/organs.rsi
  - type: VoiceOfGod

- type: entity
  parent: BaseAction
  id: ActionVoiceOfGodPrepare
  suffix: Lavaland
  name: Глас Бога
  description: Подготовить следующую реплику как команду Гласа Бога.
  components:
  - type: Action
    useDelay: 0.5
    icon:
      sprite: Imperial/lava/boss/xeno_organs.rsi
      state: bubblegum1
  - type: InstantAction
    event: !type:VoiceOfGodPrepareActionEvent
