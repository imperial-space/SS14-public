# Трофеи протокинетического дробителя (kinetic_crusher/trophies_*.dm).
# Ставятся в дробитель рукой, снимаются ломом или через меню «Извлечь».
# Трофеи одной группы (denied_type) несовместимы.

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseCrusherTrophy
  components:
  - type: Sprite
    sprite: Imperial/lava/mining/artefact.rsi
  - type: Item
    size: Small
  - type: StaticPrice
    price: 300

# ── Фауна ─────────────────────────────────────────────────────────────────────

- type: entity
  parent: BaseCrusherTrophy
  id: CrusherTrophyWatcherWing
  name: крыло наблюдателя
  description: Крыло, вырванное у наблюдателя. Подходит как трофей для кинетического дробителя.
  components:
  - type: Sprite
    state: watcher_wing
  - type: CrusherTrophy
    trophy: WatcherWing
    bonusValue: 5
    group: watcher_wing
    effect: crusher-trophy-effect-watcher-wing

- type: entity
  parent: BaseCrusherTrophy
