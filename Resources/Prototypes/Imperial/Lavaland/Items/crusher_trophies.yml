# ── Эффекты трофеев ───────────────────────────────────────────────────────────

# projectile/bileworm_acid
- type: entity
  id: CrusherBileProjectile
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  name: едкая желчь
  components:
  - type: Sprite
    noRot: false
    sprite: Imperial/lava/mining/crusher_effects.rsi
    layers:
    - state: bile_glob
  - type: Projectile
    damage:
      types:
        Blunt: 20
    soundHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
  - type: TimedDespawn
    lifetime: 2 # 20 клеток при скорости 10

# goliath_tentacle/broodmother
- type: entity
  id: CrusherBroodTentacleEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    drawdepth: Effects
    sprite: Mobs/Aliens/Asteroid/goliath.rsi
    state: goliath_tentacle_spawn
  - type: TimedDespawn
    lifetime: 1.3

- type: npcFaction
  id: CrusherSummon
  hostile:
  - SimpleHostile

# mob/living/basic/mining/demon_afterimage/crusher
- type: entity
  id: MobCrusherDemonAfterimage
  parent: [SimpleSpaceMobBase, MobCombat]
  categories: [ HideSpawnMenu ]
  name: демонический призрак-наблюдатель
  description: Это какая-то иллюзия?
  components:
  - type: NpcFactionMember
    factions:
    - CrusherSummon
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        10.0
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/mining/crusher_effects.rsi
    color: "#ffffff50"
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: ice_demon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 40
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 5
  - type: MeleeWeapon
    hidden: true
    altDisarm: false
    attackRate: 1
    range: 1.2
    damage:
      types:
        Slash: 10
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Dead
  - type: MegafaunaVanishOnDeath
  - type: TimedDespawn
    lifetime: 7
  - type: LavalandStormImmune

# mob/living/basic/mining/legion_brood с assign_creator(): череп-союзник.
- type: entity
  id: MobCrusherLegionSkull
  parent: [SimpleSpaceMobBase, MobCombat]
  categories: [ HideSpawnMenu ]
  name: череп легиона
  description: Призванный череп, верный своему хозяину.
  components:
  - type: NpcFactionMember
    factions:
    - CrusherSummon
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        10.0
      MeleeRange: !type:Single
        1.0
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/mining/legion.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: legion_head
  - type: DamageStateVisuals
    states:
      Alive:
        Base: legion_head
      Dead:
        Base: legion_head
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 40
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: MeleeWeapon
    hidden: true
    altDisarm: false
    attackRate: 1.0
    range: 1.0
    animation: WeaponArcBite
    damage:
      types:
        Blunt: 12
  - type: MobThresholds
    thresholds:
      0: Alive
      1: Dead
  - type: MegafaunaVanishOnDeath
  - type: TimedDespawn
    lifetime: 10
  - type: LavalandStormImmune
