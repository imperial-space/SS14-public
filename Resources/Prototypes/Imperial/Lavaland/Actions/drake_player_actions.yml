- type: entity
  parent: BaseActionPolymorph
  id: ActionPolymorphLesserDragon
  suffix: Lavaland
  name: Облик дракона
  description: Снова превращает вас в малого дракона.
  components:
  - type: Action
    icon:
      sprite: Imperial/lava/boss/drake/64x64megafauna.rsi
      state: dragon
    useDelay: 1
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: DragonBloodLesserDragon

- type: entity
  parent: BaseAction
  id: ActionDrakeFireCone
  suffix: Lavaland
  name: Огненное дыхание
  description: Выпускает три огненные полосы в направлении курсора.
  components:
  - type: Action
    icon:
      sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
      state: fireball
    itemIconStyle: BigAction
    useDelay: 2
    priority: 2
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:DrakeFireConeEvent

- type: entity
  parent: BaseAction
  id: ActionDrakeFlight
  suffix: Lavaland
  name: Взлёт
  description: Перелетает к выбранной точке.
  components:
  - type: Action
    icon:
      sprite: Imperial/lava/boss/drake/64x64megafauna.rsi
      state: swoop
    itemIconStyle: BigAction
    useDelay: 15
    priority: 1
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:DrakeFlightEvent