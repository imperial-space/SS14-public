# ── Кровожадный шахтёр (SS13 basic/boss/blood_drunk_miner) ──────────────────

# projectile/kinetic/miner: 18 урона, дальность 4 клетки.
- type: entity
  id: ImperialDeadMinerKinetic
  suffix: Lavaland
  name: kinetic force
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: false
    sprite: Imperial/lava/boss/megafauna/effects.rsi
    layers:
    - state: ka_tracer
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 18
  - type: GatheringProjectile
  - type: TimedDespawn
    lifetime: 0.2

# temp_visual/dir_setting/miner_death
- type: entity
  id: ImperialDeadMinerDeath
  suffix: Lavaland
  name: blood-drunk miner
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/boss/megafauna/effects.rsi
    state: miner_death
  - type: TimedDespawn
    lifetime: 1.5
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: MobDeadMiner
  suffix: Lavaland
  name: blood-drunk miner
  parent: ImperialMegafaunaBase
  description: A miner destined to wander forever, engaged in an endless hunt.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/boss/megafauna/miner.rsi
    layers:
    - state: miner
  - type: MegafaunaAppearance
    baseState: miner
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 150
        mask:
        - MobMask
        layer:
        - MobLayer
  # movement_delay = 0.25 с.
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: MeleeWeapon
    hidden: true
    altDisarm: false
    attackRate: 1
    range: 1.5
    damage:
      types:
        Slash: 8
  - type: MobThresholds
    thresholds:
      0: Alive
      1300: Dead
  - type: LavalandMegafaunaSleep
  - type: ImperialGps
    tagLoc: imperial-gps-signal-resonant
  - type: MegafaunaAi
    openFireInterval: 0.25
    deathSound:
      collection: BodyFall
    deathMessage: dead-miner-death
  - type: DeadMiner
  # DEL_ON_DEATH
  - type: MegafaunaVanishOnDeath
  - type: CrusherLoot
    trophies:
    - CrusherTrophyMinerEye
    guaranteedDrop: 0.6
  - type: BossLoot
    loot:
    - prototype: MeleeWeaponCleavingSaw
      chance: 1.0
      minCount: 1
      maxCount: 1
    - prototype: WeaponProtoKineticAccelerator
      chance: 1.0
      minCount: 1
      maxCount: 1
  - type: MegafaunaBossMusic
    music:
      path: /Audio/Imperial/boss/heavy_boss_battle_2_bpm110.ogg
