# ── Пепельный дракон ─────────────────────────────────────────────────────────

- type: entity
  id: MobAshDrake
  suffix: Lavaland
  name: ash drake
  parent: ImperialMegafaunaBase
  description: Guardians of the necropolis.
  components:
  # lava_swoop даёт TRAIT_LAVA_IMMUNE и TRAIT_NOFIRE.
  - type: Flammable
    damage:
      types:
        Heat: 0
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/boss/megafauna/megafauna96.rsi
    offset: 0,1
    layers:
    - state: dragon
  - type: MegafaunaAppearance
    baseState: dragon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  # move_to_delay = 5 — две клетки в секунду.
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2
  - type: MeleeWeapon
    hidden: true
    altDisarm: false
    attackRate: 0.5
    range: 1.5
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Imperial/boss/sound_misc_demon_attack1.ogg
    damage:
      types:
        Piercing: 40
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  - type: LavalandMegafaunaSleep
  - type: ImperialGps
    tagLoc: imperial-gps-signal-fiery
  - type: MegafaunaAi
    deathSound:
      path: /Audio/Imperial/boss/sound_misc_demon_dies.ogg
    deathMessage: ash-drake-death
  - type: AshDrake
  - type: CrusherLoot
    trophies:
    - CrusherTrophyTailSpike
    guaranteedDrop: 0.6
  - type: BossLoot
    loot:
    - prototype: MaterialDragonHide10
      chance: 1.0
      minCount: 1
      maxCount: 1
    - prototype: LavalandDrakeChest
      chance: 1.0
      minCount: 1
      maxCount: 1
  - type: MegafaunaBossMusic
    music:
      path: /Audio/Imperial/boss/the_fire_dragon_full_version.ogg
