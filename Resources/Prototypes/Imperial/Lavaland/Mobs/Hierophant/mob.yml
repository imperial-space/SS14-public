# obj/effect/hierophant: маяк, к которому иерофант возвращается.
- type: entity
  id: ImperialHierophantBeacon
  suffix: Lavaland
  name: hierophant beacon
  description: A strange beacon, allowing mass teleportation for those able to use it.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: Imperial/lava/boss/megafauna/effects.rsi
    state: hierophant_tele_off
  - type: PointLight
    radius: 2
    energy: 1
    color: "#9933FF"
  - type: Transform
    anchored: true
  - type: Clickable

- type: entity
  id: MobHierophant
  suffix: Lavaland
  name: hierophant
  parent: ImperialMegafaunaBase
  description: A massive metal club that hangs in the air as though waiting. It'll make you dance to its beat.
  components:
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        21
      AggroVisionRadius: !type:Single
        21
      NavSmash: !type:Bool
        true
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/boss/megafauna/hierophant.rsi
    offset: 0,0.5
    layers:
    - state: hierophant
  - type: MegafaunaAppearance
    baseState: hierophant
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  # move_to_delay = 10 — клетка в секунду.
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1
  - type: MeleeWeapon
    hidden: true
    altDisarm: false
    attackRate: 0.5
    range: 1.5
    soundHit:
      path: /Audio/Imperial/boss/sound_weapons_sonic_jackhammer.ogg
    damage:
      types:
        Blunt: 15
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  - type: LavalandMegafaunaSleep
  - type: ImperialGps
    tagLoc: imperial-gps-signal-zealous
  - type: MegafaunaAi
    aggroRange: 21
    devourMessage: hierophant-devour
    deathSound:
      path: /Audio/Imperial/boss/sound_magic_repulse.ogg
  - type: Hierophant
  # del_on_death
  - type: MegafaunaVanishOnDeath
  - type: CrusherLoot
    trophies:
    - CrusherTrophyVortexTalisman
    guaranteedDrop: 0.6
  - type: BossLoot
    loot:
    - prototype: MeleeWeaponHierophantClub
      chance: 1.0
  - type: MegafaunaBossMusic
    music:
      path: /Audio/Imperial/boss/sound_lavaland_hiero_boss.ogg
