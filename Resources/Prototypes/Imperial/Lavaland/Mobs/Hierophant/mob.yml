# ── Иерофант (SS13 megafauna/hierophant) ────────────────────────────────────

# Визуальные эффекты дубины иерофанта.
- type: entity
  id: ImperialHierophantBlast
  suffix: Lavaland
  name: hierophant blast
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    sprite: Imperial/lava/boss/megafauna/effects.rsi
    state: hierophant_blast
    shader: unshaded
  - type: TimedDespawn
    lifetime: 0.9
  - type: Transform
    anchored: true
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
