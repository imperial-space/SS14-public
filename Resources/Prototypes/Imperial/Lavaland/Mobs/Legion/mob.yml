- type: entity
  id: MobLegionSmallLavaland
  suffix: Lavaland
  parent: ImperialMegaLegionBase
  name: Legion
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/boss/megafauna/legion32.rsi
    noRot: false
    layers:
    - state: mega_legion
    - state: mega_legion_e
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: MegaLegion
    size: 1

# mining/legion_brood: череп легиона, живёт 10 секунд.
- type: entity
  id: ImperialMegaLegionBrood
  suffix: Lavaland
  name: legion
  description: One of many.
  parent: [ SimpleSpaceMobBase, MobCombat ]
  categories: [ HideSpawnMenu ]
  components:
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        12
      AggroVisionRadius: !type:Single
        12
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/boss/megafauna/legion32.rsi
    layers:
    - state: legion_head_1
      map: [ "random" ]
  - type: RandomSprite
    available:
    - random:
        legion_head_1: ""
        legion_head_2: ""
        legion_head_3: ""
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 20
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: MeleeWeapon
    hidden: true
    altDisarm: false
    attackRate: 1
    range: 1
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    damage:
      types:
        Piercing: 12
  - type: MobThresholds
    thresholds:
      0: Alive
      1: Dead
  - type: MegafaunaVanishOnDeath
  - type: TimedDespawn
    lifetime: 10
  - type: LavalandStormImmune
  - type: Tag
    tags:
    - CannotSuicide
    - LavalandMob

# structure/legionturret: Legion sentinel.
- type: entity
  id: ImperialLegionTurret
  suffix: Lavaland
  name: Legion sentinel
  description: The eye pierces your soul.
  parent: BaseStructure
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/boss/megafauna/legion32.rsi
    state: legion_turret
  - type: PointLight
    radius: 2
    energy: 0.5
    color: "#FF6666"
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 100
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# Трассер стража (beam blood_light).
- type: entity
  id: ImperialLegionTracer
  suffix: Lavaland
  name: blood tracer
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    sprite: Imperial/lava/boss/megafauna/effects.rsi
    state: blood_light
    shader: unshaded
    color: "#FFFFFF88"
  - type: TimedDespawn
    lifetime: 0.8
  - type: Transform
    anchored: true
  - type: Tag
    tags:
    - HideContextMenu

# projectile/beam/legion: blood pulse.
- type: entity
  id: ImperialLegionBeam
  suffix: Lavaland
  name: blood pulse
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    sprite: Imperial/lava/boss/megafauna/effects.rsi
    state: blood_beam
    shader: unshaded
  - type: PointLight
    radius: 1.5
    energy: 1
    color: "#FF6666"
  - type: TimedDespawn
    lifetime: 0.3
  - type: Transform
    anchored: true
  - type: Tag
    tags:
    - HideContextMenu
