  parent: ImperialMegaLegionMediumBase
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/boss/megafauna/legion64.rsi
    offset: 0,0.25
    noRot: false
    layers:
    - state: mega_legion_right

- type: entity
  id: MobLegionMediumEyeLavaland
  suffix: Lavaland
  parent: ImperialMegaLegionMediumBase
  components:
  - type: Sprite
