# ── Легион (SS13 megafauna/legion) ──────────────────────────────────────────

- type: entity
  abstract: true
  id: ImperialMegaLegionBase
  parent: ImperialMegafaunaBase
  description: One of many.
  components:
  - type: ImperialGps
    tagLoc: imperial-gps-signal-echoing
  # retreat_distance = 5, minimum_distance = 5.
  - type: HTN
    rootTask:
      task: ImperialMegafaunaKeepDistanceCompound
    blackboard:
      KeepDistanceRange: !type:Single
        5
      VisionRadius: !type:Single
        13
      AggroVisionRadius: !type:Single
        18
      NavSmash: !type:Bool
        true
  # move_to_delay = 3.
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.33
    baseSprintSpeed: 3.33
  - type: NoRotateOnMove
  - type: MeleeWeapon
    hidden: true
    altDisarm: false
    attackRate: 0.5
    range: 1.5
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Imperial/boss/sound_misc_demon_attack1.ogg
    damage:
      types:
        Piercing: 25
  # del_on_death
  - type: MegafaunaVanishOnDeath

- type: entity
  id: MobMegaLegionLavaland
  suffix: Lavaland
  name: Legion
  parent: ImperialMegaLegionBase
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/boss/megafauna/megafauna96.rsi
    offset: 0,0.5
    noRot: false
    layers:
    - state: mega_legion
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      700: Dead
  - type: LavalandMegafaunaSleep
  - type: MegaLegion
    size: 3
    splitInto:
    - MobLegionMediumLeftLavaland
    - MobLegionMediumRightLavaland
    - MobLegionMediumEyeLavaland
  - type: MegafaunaBossMusic
    music:
      path: /Audio/Imperial/boss/sound_misc_e1m1.ogg

- type: entity
  abstract: true
  id: ImperialMegaLegionMediumBase
  parent: ImperialMegaLegionBase
  name: Legion
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 500
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      350: Dead
  - type: MegaLegion
