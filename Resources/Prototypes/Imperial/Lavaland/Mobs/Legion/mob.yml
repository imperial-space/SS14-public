- type: entity
  id: MobMegaLegionLavaland
  suffix: Lavaland
  parent: [SimpleSpaceMobBase, MobCombat, BaseMobAnimal]
  components:
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: LegionPlayerHostileCompound
    blackboard:
      MeleeRange: !type:Single
        2.5
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/boss/96x96megafauna.rsi
    state: mega_legion
    noRot: false
  - type: NoRotateOnMove
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.6
        density: 120
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 1.5
  - type: MeleeWeapon
    hidden: true
    altDisarm: false
    attackRate: 0.4
    range: 2.5
    damage:
      types:
        Blunt: 25
  - type: MobThresholds
    thresholds:
      0: Alive
      800: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: mega_legion
      Dead:
        Base: mega_legion
  - type: LegionBoss
    summonedPrototype: MobLegionSummonSkullLavaland
    summonChance: 0.75
    summonRadius: 1.5
    decisionCooldown: 2.0
    chargeDuration: 10.0
    chargeAccelerationDuration: 3.0
    chargeSpeed: 4.5
    normalSpeed: 1.5
    normalMeleeRange: 2.5
    splitPrototype: MobLegionMediumLavaland
    splitCount: 2
  - type: Tag
    tags:
    - LavalandMob
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: HellSpawn
  - type: TemperatureDamage
    heatDamageThreshold: 1000000
  - type: LavalandStormImmune
  - type: BossLoot
    loot:
    - prototype: CrusherUpgradeHunterEye
      chance: 0.35
      minCount: 1
      maxCount: 1
  - type: MegafaunaVanishOnDeath
    delay: 30
  - type: LavalandMegafaunaSleep
  - type: LavalandMegafauna
  - type: MegafaunaBossMusic
    music:
      path: /Audio/Imperial/boss/sound_misc_e1m1.ogg

