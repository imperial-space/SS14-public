# ── Пузырь (SS13 megafauna/bubblegum) ───────────────────────────────────────

- type: entity
  id: MobLavalandBubblegum
  suffix: Lavaland
  name: bubblegum
  parent: ImperialMegafaunaBase
  description: In what passes for a hierarchy among slaughter demons, this one is king.
  components:
  # retreat_distance = 5, minimum_distance = 5: держится на расстоянии, пока не в ярости.
  - type: HTN
    rootTask:
      task: ImperialMegafaunaKeepDistanceCompound
    blackboard:
      KeepDistanceRange: !type:Single
        5
      VisionRadius: !type:Single
        18
      AggroVisionRadius: !type:Single
        18
      NavSmash: !type:Bool
        true
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/boss/megafauna/megafauna96.rsi
    offset: 0,1
    layers:
    - state: bubblegum
  - type: MegafaunaAppearance
    baseState: bubblegum
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  # move_to_delay = 5.
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2
  - type: MeleeWeapon
    hidden: true
    altDisarm: false
    attackRate: 0.5
    range: 1.5
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Imperial/boss/sound_misc_demon_attack1.ogg
    damage:
      types:
        Slash: 40
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  - type: LavalandMegafaunaSleep
  - type: ImperialGps
    tagLoc: imperial-gps-signal-bloody
  - type: MegafaunaAi
    deathSound:
      path: /Audio/Imperial/boss/sound_misc_enter_blood.ogg
    deathMessage: bubblegum-death
  - type: Bubblegum
  # del_on_death
  - type: MegafaunaVanishOnDeath
  - type: CrusherLoot
    trophies:
    - CrusherTrophyDemonClaws
    guaranteedDrop: 0.6
  - type: BossLoot
    loot:
    - prototype: ImperialBubblegumChest
      chance: 1.0
      minCount: 1
      maxCount: 1
  - type: MegafaunaBossMusic
    music:
      path: /Audio/Imperial/boss/Juhani_Junkala_Epic_Boss_Battle.ogg

# bubblegum/hallucination: health 1, не получает грубый урон, только рывок.
- type: damageModifierSet
  id: ImperialBubblegumHallucination
  coefficients:
    Blunt: 0
    Slash: 0
    Piercing: 0
    Heat: 0.5
    Cold: 0.5
    Shock: 0.5
    Caustic: 0.5

- type: entity
  id: ImperialBubblegumHallucination
  suffix: Lavaland
  name: bubblegum's hallucination
  description: Is that really just a hallucination?
  parent: [ BaseMob, MobDamageable ]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/boss/megafauna/megafauna96.rsi
    offset: 0,1
    color: "#FFFFFF80"
    layers:
    - state: bubblegum
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 1000
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: ImperialBubblegumHallucination
  - type: MobThresholds
    thresholds:
      0: Alive
      1: Dead
  - type: Destructible
    thresholds: []
  - type: Bubblegum
    isHallucination: true
  - type: TimedDespawn
    lifetime: 10
  - type: Tag
    tags:
    - HideContextMenu

# Ancient Sarcophagus: H.E.C.K. и один из трофеев.
- type: entity
  parent: CrateGeneric
  id: ImperialBubblegumChest
  suffix: Lavaland
  name: Ancient Sarcophagus
  description: Once guarded by the King of Demons, this sarcophagus contains the relics of an ancient soldier.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:EntSelector
          id: ClothingOuterArmorHECK
        - !type:EntSelector
          id: ClothingHeadHelmetHECK
        - !type:GroupSelector
          children:
          - !type:EntSelector
            id: ChaosBottle
          - !type:EntSelector
            id: BloodContract
          - !type:EntSelector
            id: WeaponSpellblade
  - type: StaticPrice
    price: 0

