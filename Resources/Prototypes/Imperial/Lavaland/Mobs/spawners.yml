- type: entity
  parent: MarkerBase
  id: SpawnMobMarrowWeaver
  suffix: Lavaland
  name: Костномозговой ткач (спавнер)
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: Imperial/lava/mining/weaver.rsi
      state: weaver
    - state: ai
  - type: ConditionalSpawner
    prototypes:
    - MobMarrowWeaver

