# ── Колосс (SS13 megafauna/colossus) ────────────────────────────────────────

# obj/projectile/colossus: death bolt, 25 brute, armour_penetration 100, 50 клеток.
- type: entity
  id: ImperialColossusBolt
  suffix: Lavaland
  name: death bolt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: false
    sprite: Imperial/lava/boss/megafauna/effects.rsi
    layers:
    - state: chronobolt
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 25
        Structural: 50
    armorPenetration: 1.0
  - type: GatheringProjectile
  - type: ColossusBolt
  - type: TimedDespawn
    lifetime: 5

# temp_visual/at_shield: anti-toolbox field.
- type: entity
  id: ImperialColossusShield
  suffix: Lavaland
  name: anti-toolbox field
  description: A shimmering forcefield protecting the colossus.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Overlays
    sprite: Imperial/lava/boss/megafauna/effects.rsi
    state: at_shield2
    shader: unshaded
  - type: PointLight
    radius: 2.5
    energy: 1.2
    color: "#FFFF66"
  - type: TimedDespawn
    lifetime: 0.8
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: MobColossus
  suffix: Lavaland
  name: colossus
  parent: ImperialMegafaunaBase
  description: A monstrous creature protected by heavy shielding.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/lava/boss/megafauna/megafauna96.rsi
    offset: 0,1
    layers:
    - state: eva
  - type: MegafaunaAppearance
    baseState: eva
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  # move_to_delay = 10 — клетка в секунду.
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1
  - type: MeleeWeapon
    hidden: true
    altDisarm: false
    attackRate: 0.5
    range: 1.5
    soundHit:
      path: /Audio/Imperial/boss/sound_magic_ratvar_attack.ogg
    damage:
      types:
        Blunt: 40
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  - type: LavalandMegafaunaSleep
  - type: ImperialGps
    tagLoc: imperial-gps-signal-angelic
  - type: MegafaunaAi
    deathSound:
      path: /Audio/Imperial/boss/sound_misc_demon_dies.ogg
    deathMessage: colossus-death
  - type: Colossus
  # del_on_death
  - type: MegafaunaVanishOnDeath
  - type: CrusherLoot
    trophies:
    - CrusherTrophyBlasterTubes
    guaranteedDrop: 0.6
  - type: BossLoot
    loot:
    - prototype: ImperialColossusChest
      chance: 1.0
      minCount: 1
      maxCount: 1
  - type: MegafaunaBossMusic
    music:
      path: /Audio/Imperial/boss/blackmoor_Colossus.ogg
