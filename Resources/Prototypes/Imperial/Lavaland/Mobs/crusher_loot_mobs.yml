# ==================================================
#  Моб-варианты, дропающие улучшения кинетического дробителя.
#  Используются как замена стандартных спавнов в зонах интереса
#  (пещеры, руины, точки интереса) — или спавнятся вручную.
# ==================================================

# ── Наблюдатели с крылом ─────────────────────────────────────────────────────
# Дроп: CrusherUpgradeWatcherWing (с шансом)
# Все три варианта: лавалэндский (красный), ледяной (синий), магмовый (оранжевый)

- type: entity
  id: MobWatcherLavalandLoot
  parent: MobWatcherLavaland
  suffix: CrusherLoot, Lavaland
  name: наблюдатель
  components:
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: DiamondOre1
      amount: 1
    - id: CrusherUpgradeWatcherWing
      amount: 1
      prob: 0.25   # 25% шанс
  - type: LavalandStormImmune
  - type: MegafaunaVanishOnDeath
    delay: 30
  - type: LavalandMegafaunaSleep

- type: entity
  id: MobWatcherIcewingLoot
  parent: MobWatcherIcewing
  suffix: CrusherLoot, Lavaland
  name: ледокрылый наблюдатель
