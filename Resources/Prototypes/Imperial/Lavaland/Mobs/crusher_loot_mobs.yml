    spawned:
    - id: DiamondOre1
      amount: 1
    - id: CrusherUpgradeWatcherWing
      amount: 1
      prob: 0.25   # 25% шанс
  - type: LavalandStormImmune
  - type: MegafaunaVanishOnDeath
    delay: 30
  - type: LavalandMegafaunaSleep

- type: entity
  id: MobWatcherMagmawingLoot
  parent: MobWatcherMagmawing
  suffix: CrusherLoot, Lavaland
  name: магмокрылый наблюдатель
  components:
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: DiamondOre1
