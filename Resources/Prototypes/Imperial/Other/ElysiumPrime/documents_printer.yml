- type: entity
  parent: PrinterDoc
  id: ElysiumPrimePrinterDoc
  name: document printer
  description: Stores a database of Elysium Prime documents and lets you print them as long as you have paper.
  suffix: ElysiumPrime, Structure
  components:
  - type: Sprite
    sprite: Imperial/Other/ElysiumPrime/printer_doc.rsi
  - type: Lathe
    producingSound: /Audio/Machines/printer.ogg
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    staticPacks:
    - ElysiumPrimeDocumentsStatic
  - type: Machine
    board: ElysiumPrimePrinterDocMachineCircuitboard

- type: entity
  parent: PrinterDocMachineCircuitboard
  id: ElysiumPrimePrinterDocMachineCircuitboard
  name: document printer machine board
  description: A machine printed circuit board for an Elysium Prime document printer.
  suffix: ElysiumPrime, Other
  components:
  - type: MachineBoard
    prototype: ElysiumPrimePrinterDoc
