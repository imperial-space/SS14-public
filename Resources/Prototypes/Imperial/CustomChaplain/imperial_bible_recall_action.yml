- type: entity
  parent: BaseAction
  id: ActionImperialBibleRecall
  name: "Вернуть Библию"
  description: "Вернуть вашу Библию в руку"
  components:
  - type: Action
    useDelay: 240
    raiseOnAction: true
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/forcewall.ogg
      params:
        volume: -5
        pitch: 1.2
        maxDistance: 5
        variation: 0.2
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: item_recall
  - type: InstantAction
    event: !type:ImperialBibleRecallActionEvent

