- type: entity
  parent: BaseBorgChassis
  id: K9-X
  name: K9-X
  description: #Заменить.
  components:
  - type: Sprite
    sprite: Imperial/K9-X/K9-X.rsi
    state: K9_full
  - type: MobState
    allowedStates:
    - Alive
    - Critical
  - type: MobThresholds
    thresholds:
      0: Alive
      170: Critical
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 5.2
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
    - Common
    - Security
  - type: ActiveRadio
    channels:
    - Binary
    - Common
    - Security
  - type: ZombieImmune
  - type: Repairable
    doAfterDelay: 15
    allowSelfRepair: false
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Piercing: 5.5
  - type: NoSlip
    interactSuccessSpawn: EffectHearts
  - type: ContainerContainer
    containers:
      borg_brain: !type:ContainerSlot { }
      cell_slot: !type:ContainerSlot { }
      borg_module: !type:Container { }
      part-container: !type:Container
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: true
  - type: ItemToggle
    onActivate: false
    activated: false
    onUse: false
  - type: ItemTogglePointLight
  - type: AccessToggle
  - type: PowerCellDraw
    drawRate: 0.75
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: ShowJobIcons
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: CyborgControl
    transmitFrequencyId: RoboticsConsole
    savableAddress: false
  - type: OnUseTimerTrigger
    delay: 10
    examinable: false
    beepSound:
      path: /Audio/Effects/Cargo/buzz_two.ogg
      params:
        volume: -4
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: K9-X
  - type: SiliconLawProvider
    laws: K9-XStatic
    subverted: true
  - type: PointLight
    color: "#dd200b"
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 5
    netsync: false
  - type: Access
    enabled: false
    groups:
    - AllAccess
  - type: AccessReader
    access: [["Command"], ["Research"]]
  - type: StartIonStormed
    ionStormAmount: 3
  - type: IonStormTarget
    chance: 0.07
  - type: BorgChassis
    maxModules: 5
  - type: Body
    prototype: ImperialBorg
  - type: BorgHandsImperial
    whitelistHandTag: SecurityBorgItem
  - type: K9XLunge
    leapK9XAction: ActionLeapK9X
