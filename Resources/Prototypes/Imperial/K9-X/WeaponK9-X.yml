- type: entity
  name: Навесной станнер K9-X
  parent: [ WeaponDisablerPractice, BaseSecurityCommandContraband ]
  id: DisablerK9-X
  suffix: K9-X
  description: Альтернативная разработка, основанная на системе стандартного станнера. В отличии от последнего имеет 18 зарядов и автоматическую перезарядку
  components:
  - type: Sprite
    sprite: Imperial/K9-X/LaserK9-X.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-unshaded-0
        map: ["enum.GunVisualLayers.MagUnshaded"]
        shader: unshaded
  - type: Clothing
    sprite: Imperial/K9-X/LaserK9-X.rsi
    quickEquip: false
    slots:
      - suitStorage
      - Belt
  - type: ProjectileBatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 50
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 25

- type: entity
  name: Навесной лазер K9-X
  parent: WeaponLaserBorg
  id: LaserK9-X
  suffix: K9-X
  description: Мощное лазерное оружие, призванное ослабить противника за счёт высокого урона, но малого заряда. В отличии от винтовок и пушек НТ, эта - не способна с одного заряда убить полностью здорового человека, посему признана скорее средством радикального задержания, чем орудием убийства.
  components:
  - type: HitscanBatteryAmmoProvider
    proto: RedMediumLaser
    fireCost: 250
