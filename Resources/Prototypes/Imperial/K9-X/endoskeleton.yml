- type: entity
  id: K9-XEndoskeleton
  name: Эндоскелет K9-X
  suffix: K9-X
  description: Эндоскелет Борга K9-X – основа для создания кибернетического Пса. Чёрный стальной каркас с подготовленными точками крепления для корпуса, головы и лап. Белые отметины указывают на места соединения компонентов. Зелёные провода и стальной хвост говорят о том, что это не просто скелет, а готовый к бою механизм
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    noRot: true
    drawdepth: Items
    sprite: Imperial/K9-X/Parts.rsi
    state: K9-X_suit
  - type: Appearance
  - type: ItemMapper
    sprite: Imperial/K9-X/Parts.rsi
    mapLayers:
      K9-X_l_arm+o:
        whitelist:
          tags:
          - K9-XLArm
      K9-X_r_arm+o:
        whitelist:
          tags:
          - K9-XRArm
      K9-X_l_leg+o:
        whitelist:
          tags:
          - K9-XLeg
      K9-X_r_leg+o:
        whitelist:
          tags:
          - K9-XRLeg
      K9-X_head+o:
        whitelist:
          tags:
          - K9-XHead
      K9-X_chest+o:
        whitelist:
          tags:
          - K9-XTorso
  - type: ContainerContainer
    containers:
      part-container: !type:Container
      cell_slot: !type:Container
  - type: PartAssembly
    parts:
      generic:
      - K9-XLArm
      - K9-XRArm
      - K9-XLLeg
      - K9-XRLeg
      - K9-XHead
      - K9-XTorso
  - type: Construction
    graph: GraphK9-X
    node: start
    defaultTarget: cyborg
    containers:
    - part-container
    - cell_slot
  - type: Pullable
  - type: GuideHelp
    guides:
    - Cyborgs
    - Robotics
