# ── Магазины DS ───────────────────────────────────────────────────────────────

# ── Базовые абстрактные сущности ──────────────────────────────────────────────

- type: entity
  id: BaseMagazineDSBizon
  parent: BaseItem
  abstract: true
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeDS9x18
    capacity: 64
    proto: CartridgeDS9x18
  - type: Item
    size: Small
  - type: Sprite
    sprite: Imperial/DS/Ammo/magas.rsi
    layers:
    - state: magazine-bizon-default
      map: ["enum.GunVisualLayers.Base"]
  - type: StaticPrice
    price: 10

