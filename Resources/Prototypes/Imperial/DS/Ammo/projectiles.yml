# ── Гранаты M32A1 ─────────────────────────────────────────────────────────────

- type: entity
  id: BulletDSM32A1Grenade
  suffix: DS
  name: grenade M32A1
  parent: BaseBulletTrigger
  components:
  - type: Sprite
    sprite: Imperial/DS/Ammo/cartrige.rsi
    layers:
      - state: Granade-M32A1
  - type: Projectile
    damage:
      types:
        Blunt: 7
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 3
    totalIntensity: 100
  - type: PointLight
    radius: 3.0
    color: orange
    energy: 0.5

- type: entity
  id: BulletDSSmokeM32A1
  suffix: DS
  name: smoke grenade M32A1
  parent: BaseBulletTrigger
  components:
  - type: Sprite
    sprite: Imperial/DS/Ammo/cartrige.rsi
    layers:
      - state: Smoke-M32A1
  - type: SmokeOnTrigger
    duration: 30
    spreadAmount: 50
  - type: DeleteOnTrigger

