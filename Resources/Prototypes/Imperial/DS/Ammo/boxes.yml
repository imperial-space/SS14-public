# ── Коробки и ящики с патронами DS ───────────────────────────────────────────

# ── Абстрактные базы ──────────────────────────────────────────────────────────

- type: entity
  id: BaseAmmoBoxDSSmall
  parent: BaseItem
  abstract: true
  components:
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Item
    size: Small
    shape:
    - 0,0,1,1
  - type: Appearance
  - type: StaticPrice
    price: 20

- type: entity
  id: BaseAmmoBoxDSBig
  parent: BaseItem
  abstract: true
  components:
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Item
    size: Normal
    shape:
    - 0,0,2,2
  - type: Appearance
  - type: StaticPrice
    price: 40

# ── Ящики патрон (большие) ────────────────────────────────────────────────────

- type: entity
  id: AmmoBigBoxDS5x6
  suffix: DeadSector
  name: Ящик патрон 5x6
  parent: BaseAmmoBoxDSBig
  components:
  - type: Tag
    tags:
      - DSAmmoItem
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeDS5x6
    capacity: 60
    proto: CartridgeDS5x6
  - type: Sprite
    sprite: Imperial/DS/Ammo/box.rsi
    layers:
    - state: Ammo-Box-Big-blue
      map: ["enum.GunVisualLayers.Base"]
    - state: Ammo-Box-Big-mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: Ammo-Box-Big-mag
    steps: 2
    zeroVisible: false

