# ── Трофейный ящик боезапаса ──────────────────────────────────────────────────

- type: entity
  id: AmmoCrateDSTrophy
  suffix: DeadSector
  name: Трофейный ящик боезапаса
  parent: BaseItem
  components:
  - type: Tag
    tags:
      - DSAmmoItem
  - type: Sprite
    sprite: Imperial/DS/Ammo/ammo-crate.rsi
    state: Ammo-Crate-Default
  - type: Item
    size: Huge
    shape:
    - 0,0,5,5
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,19,7
    whitelist:
      tags:
        - DSAmmoItem
  - type: StaticPrice
    price: 200
