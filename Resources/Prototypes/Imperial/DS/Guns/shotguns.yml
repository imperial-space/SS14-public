- type: entity
  id: WeaponDSBeneli
  suffix: DeadSector, Gun
  name: Beneli
  description: .
  parent: [ BaseItem, BaseGunWieldable, BaseMinorContraband ]
  components:
  - type: Sprite
    sprite: Imperial/DS/Guns/shotgun/Beneli-gun/Beneli.rsi
    layers:
    - state: bolt-open
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Item
    sprite: Imperial/DS/Guns/shotgun/Beneli-gun/Beneli-inhand.rsi
    size: Large
    shape:
    - 0,0,3,1
  - type: Clothing
    sprite: Imperial/DS/Guns/shotgun/Beneli-gun/Beneli-inhand.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: GunRequiresWield
  - type: SpeedModifiedOnWield
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Imperial/DeadSector/weapons_shots/29.ogg
  - type: BallisticAmmoProvider
    capacity: 4
    proto: CartridgeDS12x70
    whitelist:
      tags:
      - CartridgeDS12x70
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: Appearance

