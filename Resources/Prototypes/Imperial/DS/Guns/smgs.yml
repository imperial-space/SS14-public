- type: entity
  id: WeaponDSFNP90
  suffix: DeadSector, Gun
  name: FN P90
  description: .
  parent: [ BaseItem, BaseGunWieldable, BaseMinorContraband, BaseAttachmentsGun ]
  components:
  - type: Sprite
    sprite: Imperial/DS/Guns/PP/FNP90-gun/FNP90.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
      visible: false
  - type: Item
    sprite: Imperial/DS/Guns/PP/FNP90-gun/FNP90-inhand.rsi
    size: Normal
    shape:
    - 0,0,2,1
  - type: Clothing
    sprite: Imperial/DS/Guns/PP/FNP90-gun/FNP90-inhand.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 10
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/Imperial/DeadSector/weapons_shots/18.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineDSP90
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineDSP90
      gun_chamber:
        name: Chamber
        startingItem: CartridgeDS5x6
        priority: 1
        whitelist:
          tags:
          - CartridgeDS5x6
      gun_attachment_right:
        name: gun-attachment-slot-right
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: -2
        whitelist:
          tags:
            - AttachmentRight
  - type: ContainerContainer
    containers:
      gun_attachment_right: !type:ContainerSlot
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

