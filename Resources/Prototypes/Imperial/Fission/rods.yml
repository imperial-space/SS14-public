  - type: FissionRod
    category: Fuel
    heatAmount: 5
    powerAmount: 20000
    heatAmpMod: 1.6
    powerAmpMod: 1.1
    maxDurability: 5000
    radiationIntensity: 0.75
    powerEnrichThreshold: 8
    powerEnrichResult: ImperialFissionRodUranium235
    requirements: [ Moderator, Coolant ]

- type: entity
