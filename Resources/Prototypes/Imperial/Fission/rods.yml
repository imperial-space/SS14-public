- type: entity
  id: ImperialFissionRodMeltdown
  parent: [ ImperialFissionFuelRodBase, BaseSyndicateContraband ]
  name: meltdown rod
  description: A Syndicate-crafted rod capable of generating massive amounts of heat, leading to an eventual meltdown.
  components:
  - type: Sprite
    state: fuel_syndie
  - type: FissionRod
    category: Fuel
    heatAmount: 2000
    maxDurability: -1
    minimumTempModifier: 4000
    reactorOverheatModifier: -400
    radiationIntensity: 2.5

