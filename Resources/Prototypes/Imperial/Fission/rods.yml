# Ядерные стержни NGCR из SS220 Paradise (code/modules/power/engines/fission/nuclear_rods.dm).
# Требования к соседям: Fuel / Moderator / Coolant — любой стержень категории, иначе id конкретного стержня.
# maxDurability: -1 — бесконечная прочность (INFINITY).

- type: entity
  id: ImperialFissionRodBase
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: Imperial/Fission/rods.rsi
  - type: Item
    size: Huge
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 15
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 10

- type: entity
  id: ImperialFissionFuelRodBase
  parent: ImperialFissionRodBase
  abstract: true
  components:
  - type: RadiationSource
    intensity: 1
    slope: 0.5

# ────────────── Топливо ──────────────

- type: entity
  id: ImperialFissionRodUranium238
  parent: ImperialFissionFuelRodBase
  name: uranium 238 fuel rod
  description: A standard fuel rod for most NGCR reactors.
  components:
  - type: Sprite
    state: fuel_238
  - type: FissionRod
    craftable: true
    materials:
      Steel: 100
      Uranium: 50
    category: Fuel
    heatAmount: 5
    powerAmount: 20000
    heatAmpMod: 1.8
    powerAmpMod: 1.1
    radiationIntensity: 2
    heatEnrichThreshold: 10
    powerEnrichThreshold: 6.4
    heatEnrichResult: ImperialFissionRodWeakThorium
    powerEnrichResult: ImperialFissionRodWeakPlutonium
    requirements: [ Moderator ]

- type: entity
  id: ImperialFissionRodWeakThorium
  parent: ImperialFissionFuelRodBase
  name: weak thorium fuel rod
  description: A specialized fuel rod refined from uranium 238.
  components:
