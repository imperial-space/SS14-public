# Предметы культа крови (cult_items.dm, blood_magic.dm, cult_armor.dm).

# ─── Ритуальный кинжал ───
- type: entity
  parent: BaseItem
  id: CultDagger
  name: ритуальный кинжал
  description: Странный кинжал, которым, по слухам, зловещие секты «готовят» трупы к жертвоприношению своим тёмным богам.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/cult_dagger.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Objects/Weapons/Melee/cult_dagger.rsi
  - type: Clothing
    slots: [ belt ]
    quickEquip: false
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1
    armorPenetration: 0.35
    damage:
      types:
        Slash: 15
    soundHit:
      path: /Audio/Imperial/BloodCult/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 25
  - type: Sharp
  - type: CultParry
    chance: 0.25
  - type: CultDagger
  - type: CultRitualItem
    examineMessage: cult-dagger-examine
  - type: CultWeapon
    punishAttack: false
    warnPickup: false
    force: 15

# ─── Древний длинный меч ───
- type: entity
  parent: BaseItem
  id: CultBlade
  name: древний длинный меч
  description: Меч, гудящий нечестивой энергией. Он светится тусклым красным светом.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/cult_blade.rsi
    state: icon
  - type: Item
    size: Large
    sprite: Objects/Weapons/Melee/cult_blade.rsi
  - type: Clothing
    slots: [ back ]
    quickEquip: false
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 30
    soundHit:
      path: /Audio/Imperial/BloodCult/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 10
  - type: Sharp
  - type: CultParry
    chance: 0.5
  - type: CultWeapon
    force: 30

- type: entity
  parent: CultBlade
  id: CultBladeGhost
  name: древний меч
  categories: [ HideSpawnMenu ]
  components:
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 19
    soundHit:
      path: /Audio/Imperial/BloodCult/bladeslice.ogg
  - type: CultParry
    chance: 0.25
  - type: Unremoveable
  - type: CultGhostItem

# ─── Кровавая алебарда ───
- type: entity
  parent: BaseItem
  id: CultHalberd
  name: кровавая алебарда
  description: Алебарда с летучим лезвием из кристаллизованной крови. Кажется, она связана со своим создателем.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/cult_halberd.rsi
    state: icon
  - type: Item
    size: Huge
    sprite: Objects/Weapons/Melee/cult_halberd.rsi
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 7
  - type: MeleeWeapon
    wideAnimationRotation: -135
    armorPenetration: 0.3
    damage:
      types:
        Slash: 17
    soundHit:
      path: /Audio/Imperial/BloodCult/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 40
  - type: Sharp
  - type: CultParry
    chance: 0.3
    wieldedMultiplier: 2
  - type: CultHalberd

# ─── Бола культа ───
- type: entity
  parent: Bola
  id: CultBola
  name: нарсийская бола
  description: Прочная бола, связанная тёмной магией, которая позволяет ей безвредно проходить сквозь культистов Нар'Си.
  components:
  - type: Sprite
    sprite: Imperial/cult/bola.rsi
    state: bola_cult
  - type: Ensnaring
    freeTime: 2.0
    breakoutTime: 6
    walkSpeed: 0.5
    sprintSpeed: 0.5
    staminaDamage: 0
    canThrowTrigger: true
    canMoveBreakout: true
    maxEnsnares: 1
  - type: CultBola

# ─── Теневые оковы (restraints/handcuffs/cult) ───
- type: entity
  parent: Handcuffs
  id: CultShackles
  name: теневые оковы
  description: Оковы, сотканные из тёмной магии. Распадаются, если их снять.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/cult/handcuffs.rsi
    state: handcuff
  - type: Handcuff
    breakoutTime: 3
    cuffedRSI: Imperial/cult/handcuffs.rsi
    bodyIconState: body-overlay
    breakOnRemove: true
    startCuffSound:
      path: /Audio/Imperial/BloodCult/cablecuff.ogg

# ─── Точило ───
- type: entity
  parent: BaseItem
  id: CultWhetstone
  name: древнее точило
  description: Брусок, наделённый тёмной магией. Острое оружие станет сильнее, если провести им по камню.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/items.rsi
    layers:
    - state: cult_sharpener
      map: [ "enum.CultVisualLayers.Base" ]
  - type: Appearance
  - type: CultVisuals
  - type: Item
    size: Small
  - type: CultWhetstone
    damageBonus: 5
    max: 40

# ─── Фляга нечестивой воды ───
- type: entity
  parent: DrinkBase
  id: CultUnholyFlask
  name: фляга нечестивой воды
  description: Ядовита для неверующих и бодрит верных. Можно пить или бросать.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/flask.rsi
    state: icon
  - type: Item
    sprite: Imperial/BloodCult/flask.rsi
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 50
        reagents:
        - ReagentId: UnholyWater
          Quantity: 50

# ─── Сфера проклятия ───
- type: entity
  parent: BaseItem
  id: CultCursedOrb
  name: проклятая сфера
  description: Вглядываясь в эту дымчатую сферу, вы видите ужасные судьбы, постигающие эвакуационный шаттл.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/items.rsi
    state: shuttlecurse
  - type: Item
    size: Small
  - type: CultCurseOrb

# ─── Сдвигатель завесы ───
- type: entity
  parent: BaseItem
  id: CultVeilShifter
  name: сдвигатель завесы
  description: Эта реликвия мгновенно переносит вас и того, кого вы тащите, вперёд на приличное расстояние.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/items.rsi
    layers:
    - state: shifter
      map: [ "enum.CultVisualLayers.Base" ]
  - type: Appearance
  - type: CultVisuals
  - type: Item
    size: Small
  - type: CultVeilShifter

# ─── Повязка фанатика ───
- type: entity
  parent: ClothingEyesBase
  id: CultZealotBlindfold
  name: повязка фанатика
  description: Повязка, пропитанная странной тёмной магией, позволяющей культистам видеть сквозь неё.
  components:
  - type: Sprite
    sprite: Clothing/Eyes/Misc/blindfold.rsi
    color: "#960000"
  - type: Clothing
    sprite: Clothing/Eyes/Misc/blindfold.rsi
  - type: ShowHealthBars
    damageContainers:
    - Biological
  - type: FlashImmunity
  - type: EyeProtection
  - type: CultBlindfold

# ─── Зеркальный щит ───
- type: entity
  parent: BaseItem
  id: CultMirrorShield
  name: зеркальный щит
  description: Печально известный щит нарсийских сект, сбивающий врагов с толку. Его края утяжелены для метания.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/mirror_shield.rsi
    state: icon
  - type: Item
    size: Large
    sprite: Imperial/BloodCult/mirror_shield.rsi
  - type: Clothing
    slots: [ back ]
    quickEquip: false
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 15
  - type: Reflect
    reflectProb: 0.5
  - type: Blocking
    passiveBlockModifier:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
    activeBlockModifier:
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.75
  - type: CultMirrorShield

# ─── Кровавый залп ───
- type: entity
  parent: BaseItem
  id: CultBloodBarrage
  name: кровавый залп
  description: Кровь за кровь.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/barrage.rsi
    state: icon
    color: "#FF0000"
  - type: Item
    size: Huge
    sprite: Imperial/BloodCult/barrage.rsi
  - type: Gun
    fireRate: 5
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Imperial/BloodCult/wand_teleport.ogg
  - type: BasicEntityAmmoProvider
    proto: CultBloodBolt
    capacity: 30
    count: 30
  - type: Unremoveable
    deleteOnDrop: true

- type: entity
  parent: BaseBullet
  id: CultBloodBolt
  name: кровавый снаряд
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    sprite: Imperial/BloodCult/projectiles.rsi
    layers:
    - state: blood_bolt
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Blunt: 20
  - type: CultBloodBolt

# ─── Кровавый луч ───
- type: entity
  parent: BaseItem
  id: CultBloodBeam
  name: магическая аура
  description: Зловещая аура, искажающая поток реальности вокруг себя.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/aura.rsi
    state: disintegrate
    color: "#FF0000"
  - type: Item
    size: Huge
    sprite: Imperial/BloodCult/aura.rsi
  - type: Unremoveable
    deleteOnDrop: true
  - type: CultBloodBeam

# ─── Ауры магии крови (obj/item/melee/blood_magic) ───
- type: entity
  abstract: true
  parent: BaseItem
  id: BaseCultAura
  name: магическая аура
  description: Зловещая аура, искажающая поток реальности вокруг себя.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/aura.rsi
    state: disintegrate
  - type: Item
    size: Huge
    sprite: Imperial/BloodCult/aura.rsi
  - type: Unremoveable
    deleteOnDrop: true
  - type: MeleeWeapon
    wideAnimationRotation: 0
    damage:
      types:
        Blunt: 0

- type: entity
  parent: BaseCultAura
  id: CultAuraStun
  name: оглушающая аура
  description: Оглушает и лишает речи слабовольную жертву при касании.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/aura.rsi
    state: disintegrate
    color: "#FF0000"
  - type: CultAura
    spell: Stun
    invocation: "Fuu ma'jin!"

- type: entity
  parent: BaseCultAura
  id: CultAuraTeleport
  name: телепортирующая аура
  description: Переносит культиста к руне телепортации при касании.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/aura.rsi
    state: disintegrate
    color: "#551A8B"
  - type: CultAura
    spell: Teleport
    invocation: "Sas'so c'arta forbici!"

- type: entity
  parent: BaseCultAura
  id: CultAuraShackles
  name: сковывающая аура
  description: Начинает сковывать жертву при касании и лишает её речи при успехе.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/aura.rsi
    state: disintegrate
    color: "#000000"
  - type: CultAura
    spell: Shackles
    invocation: "In'totum Lig'abis!"

- type: entity
  parent: BaseCultAura
  id: CultAuraConstruction
  name: искажающая аура
  description: Оскверняет некоторые металлические предметы при касании.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/aura.rsi
    state: disintegrate
    color: "#000000"
  - type: CultAura
    spell: Construction
    invocation: "Ethra p'ni dedol!"

- type: entity
  parent: BaseCultAura
  id: CultAuraEquipment
  name: вооружающая аура
  description: Облачает культиста в боевое снаряжение при касании.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/aura.rsi
    state: disintegrate
    color: "#33CC33"
  - type: CultAura
    spell: Equipment

- type: entity
  parent: BaseCultAura
  id: CultAuraBloodRites
  name: аура кровавых обрядов
  description: Впитывает кровь из всего, чего касается. Касание культистов и конструктов лечит их. Используйте в руке для продвинутого обряда.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/aura.rsi
    state: disintegrate
    color: "#7D1717"
  - type: CultAura
    spell: BloodRites
    invocation: "Fel'th Dol Ab'orod!"

# ─── Рунный металл ───
- type: entity
  parent: BaseItem
  id: CultRunedMetal
  name: рунный металл
  description: Листы холодного металла с изменчивыми надписями.
  suffix: Full
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/runed_metal.rsi
    state: sheet-runed_3
    layers:
    - state: sheet-runed_3
      map: ["base"]
  - type: Item
    size: Normal
    sprite: Imperial/BloodCult/runed_metal.rsi
  - type: Appearance
  - type: Stack
    stackType: CultRunedMetal
    count: 50
    baseLayer: base
    layerStates:
    - sheet-runed
    - sheet-runed_2
    - sheet-runed_3
  - type: CultRunedMetal

- type: entity
  parent: CultRunedMetal
  id: CultRunedMetalTen
  suffix: 10
  components:
  - type: Stack
    stackType: CultRunedMetal
    count: 10
    baseLayer: base
    layerStates:
    - sheet-runed
    - sheet-runed_2
    - sheet-runed_3

- type: entity
  parent: CultRunedMetal
  id: CultRunedMetal1
  suffix: 1
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/runed_metal.rsi
    state: sheet-runed
    layers:
    - state: sheet-runed
      map: ["base"]
  - type: Stack
    stackType: CultRunedMetal
    count: 1
    baseLayer: base
    layerStates:
    - sheet-runed
    - sheet-runed_2
    - sheet-runed_3

- type: stack
  id: CultRunedMetal
  name: рунный металл
  spawn: CultRunedMetal1
  maxCount: 50

# ─── Камень душ ───
- type: entity
  parent: BaseItem
  id: CultSoulStone
  name: осколок камня душ
  description: Фрагмент легендарного сокровища, известного просто как «Камень душ». Осколок всё ещё мерцает частицей силы.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/soulstone.rsi
    layers:
    - state: soulstone
      map: [ "enum.CultVisualLayers.Base" ]
  - type: Appearance
  - type: CultVisuals
  - type: Item
    size: Small
  - type: CultSoulstone
  - type: ContainerContainer
    containers:
      soulstone_shade: !type:ContainerSlot

# ─── Оболочка конструкта ───
- type: entity
  parent: BaseStructureDynamic
  id: CultConstructShell
  name: пустая оболочка
  description: Зловещая машина, используемая искусными в магии. Она неактивна.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/shell.rsi
    state: construct_cult
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.4,0.3,0.4"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Pullable
  - type: CultConstructShell
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# Старые ID оболочек (Actions/cult.yml, некрополь).
- type: entity
  parent: CultConstructShell
  id: CultJuggernautShell
  suffix: Juggernaut

- type: entity
  parent: CultConstructShell
  id: CultWraithShell
  suffix: Wraith

- type: entity
  parent: CultConstructShell
  id: CultArtificerShell
  suffix: Artificer

# ─── Эктоплазма ───
- type: entity
  parent: BaseItem
  id: CultEctoplasm
  name: кроваво-красная эктоплазма
  description: Пахнет металлом.
  components:
  - type: Sprite
    sprite: Mobs/Ghosts/revenant.rsi
    state: ectoplasm
    color: "#960000"
  - type: Item
    size: Small
