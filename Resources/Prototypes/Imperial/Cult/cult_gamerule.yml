# Культ крови (dynamic roundstart blood_cult): min_pop 30, 1 + pop/20 культистов.

- type: entity
  id: Cult
  parent: BaseGameRule
  components:
  - type: GameRule
    minPlayers: 30
  - type: ImperialCultRule
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Cultist ]
      min: 2
      max: 6
      playerRatio: 20
      blacklist:
        components:
        - MindShield
      briefing:
        text: imperial-cult-role-greeting
        color: DarkRed
      mindRoles:
      - MindRoleCultist
  - type: DynamicRuleCost
    cost: 250

# Команда культа для культистов, выданных вне раунда культа (админ, мидраунд).
- type: entity
  id: CultTeam
  parent: BaseGameRule
  components:
  - type: ImperialCultRule
