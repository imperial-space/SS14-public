# Конструкты культа (basic/cult/constructs), тень, призрак культа, Нар'Си.

- type: entity
  abstract: true
  save: false
  id: BaseCultConstruct
  name: конструкт
  description: Оживлённая оболочка, несущая душу.
  parent:
  - BaseSimpleMob
  - MobCombat
  components:
  - type: Damageable
    damageContainer: ImperialCultConstruct
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 80
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: NpcFactionMember
    factions:
    - Cult
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
  - type: Appearance
  - type: ZombieImmune
  - type: ProtectedFromStepTriggers
  - type: CanMoveInAir
  - type: MovementAlwaysTouching
  - type: PressureImmunity
  - type: Speech
    speechSounds: Alto
    speechVerb: Default
  - type: Examiner
  - type: Puller
    needsHands: false
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: CombatMode

- type: entity
  parent: BaseCultConstruct
  id: MobCultJuggernaut
  name: джаггернаут
  description: Массивный бронированный конструкт, созданный, чтобы возглавлять атаки и принимать вражеский огонь.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/constructs.rsi
    layers:
    - state: juggernaut
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: glow_juggernaut_cult
      shader: unshaded
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcFist
    damage:
      types:
        Blunt: 25
        Structural: 90
    soundHit:
      path: /Audio/Imperial/BloodCult/punch3.ogg
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2
  - type: Reflect
    reflectProb: 0.35
    reflects:
    - Energy
  - type: CultConstruct
    constructType: Juggernaut
    playstyleString: cult-construct-playstyle-juggernaut
    actions:
    - ActionCultGauntletEcho
    - ActionCultForcewall
    - ActionCultRuneBarrier

- type: entity
  parent: BaseCultConstruct
  id: MobCultWraith
  name: призрак
  description: Злобный когтистый конструкт для убийства врагов и посева хаоса в их тылу.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/constructs.rsi
    layers:
    - state: wraith
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: glow_wraith_cult
      shader: unshaded
  - type: MobThresholds
    thresholds:
      0: Alive
      65: Dead
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 20
    soundHit:
      path: /Audio/Imperial/BloodCult/bladeslice.ogg
  - type: CultConstruct
    constructType: Wraith
    playstyleString: cult-construct-playstyle-wraith
    actions:
    - ActionCultPhaseShift
    - ActionCultRuneTeleport
  - type: CultSeeBlessed

- type: entity
  parent: BaseCultConstruct
  id: MobCultArtificer
  name: ремесленник
  description: Пузатый конструкт, посвящённый строительству и обслуживанию армий культа Нар'Си.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/constructs.rsi
    layers:
    - state: artificer
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: glow_artificer_cult
      shader: unshaded
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcFist
    damage:
      types:
        Blunt: 5
        Structural: 60
    soundHit:
      path: /Audio/Imperial/BloodCult/punch2.ogg
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - ImperialCultConstruct
  - type: CultConstruct
    constructType: Artificer
    playstyleString: cult-construct-playstyle-artificer
    canRepair: true
    canRepairSelf: true
    actions:
    - ActionCultMagicMissile
    - ActionCultCreateShell
    - ActionCultCreateFloor
    - ActionCultCreateWall
    - ActionCultCreateSoulstone
    - ActionCultRuneRevive

- type: entity
  parent: BaseCultConstruct
  id: MobCultHarvester
  name: жнец
  description: Длинный тонкий конструкт, созданный, чтобы возвестить о пришествии Нар'Си. Скоро всё закончится.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/constructs.rsi
    layers:
    - state: harvester
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: glow_harvester_cult
      shader: unshaded
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 17
    soundHit:
      path: /Audio/Imperial/BloodCult/bladeslice.ogg
  - type: CultConstruct
    constructType: Harvester
    playstyleString: cult-construct-playstyle-harvester
    canRepair: true
    actions:
    - ActionCultAreaConversion
    - ActionCultForcewall
    - ActionCultSeekPrey
  - type: CultWallWalker

- type: entity
  parent: BaseCultConstruct
  id: MobCultProteon
  name: протеон
  description: Слабый конструкт, ищущий добычу.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/constructs.rsi
    layers:
    - state: proteon
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: glow_proteon_cult
      shader: unshaded
  - type: MobThresholds
    thresholds:
      0: Alive
      35: Dead
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 9
    soundHit:
      path: /Audio/Imperial/BloodCult/bladeslice.ogg
  - type: CultConstruct
    constructType: Proteon
    playstyleString: cult-construct-playstyle-proteon

# ─── Тень (mob/living/basic/shade) ───
- type: entity
  parent: BaseCultConstruct
  id: MobCultShade
  name: тень
  description: Ограниченная бессмертная душа, скованная тёмной магией.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/constructs.rsi
    layers:
    - state: shade_cult
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 8
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 5
  - type: VentCrawler
  - type: CultShade

# ─── Призрак культа (human/cult_ghost) ───
- type: entity
  parent: MobHuman
  id: MobCultGhost
  suffix: Cult Ghost
  categories: [ HideSpawnMenu ]
  components:
  - type: CultTint
    color: "#FFFFFF96"
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0
    damageRecovery:
      types:
        Asphyxiation: 0

# ─── Нар'Си (obj/narsie) ───
- type: entity
  id: CultNarSie
  name: Нар'Си
  description: Ваш разум начинает пузыриться и сочиться, пытаясь осознать увиденное.
  components:
  - type: Transform
    anchored: false
    noRot: true
  - type: Clickable
  - type: Sprite
    sprite: Imperial/BloodCult/narsie.rsi
    drawdepth: Overlays
    noRot: true
    layers:
    - state: narsie_spawn_anim
      map: [ "enum.CultVisualLayers.Base" ]
  - type: Appearance
  - type: CultVisuals
  - type: PointLight
    radius: 6
    energy: 0.7
    color: "#FF0000"
  - type: CultNarSie
  - type: GhostRole
    name: cult-harvester-ghost-role
    description: cult-harvester-ghost-role-desc
    rules: cult-ghost-role-rules
  - type: GhostRoleMobSpawner
    prototype: MobCultHarvester
    deleteOnSpawn: false
    availableTakeovers: 9999
  - type: Eye
  - type: WarpPoint
    follow: true
    location: Нар'Си

# ─── Снаряды конструктов ───
- type: entity
  parent: BaseBullet
  id: CultGauntletEcho
  name: эхо перчатки
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: false
    sprite: Imperial/BloodCult/projectiles.rsi
    color: "#FFFFFFB4"
    layers:
    - state: cultfist
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Blunt: 30
    soundHit:
      path: /Audio/Imperial/BloodCult/punch3.ogg
  - type: CultGauntletProjectile
  - type: TimedDespawn
    lifetime: 35

- type: entity
  parent: BaseBullet
  id: CultMagicMissile
  name: магическая ракета
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: false
    sprite: Imperial/BloodCult/projectiles.rsi
    color: "#FF0000"
    layers:
    - state: magicm
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Blunt: 0
  - type: CultMissileProjectile
  - type: TimedDespawn
    lifetime: 2.5

# ─── Иллюзия зеркального щита (mob/living/basic/illusion) ───
- type: entity
  parent: BaseSimpleMob
  id: MobCultIllusion
  name: иллюзия
  description: Это подделка!
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/constructs.rsi
    state: cultist
  - type: CultIllusion
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: Damageable
    damageContainer: Biological
  - type: CombatMode
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.5
    baseSprintSpeed: 4.5
  - type: NpcFactionMember
    factions:
    - Cult
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer

- type: entity
  parent: MobCultIllusion
  id: MobCultIllusionEscape
  categories: [ HideSpawnMenu ]
  components:
  - type: HTN
    rootTask:
      task: IdleCompound

# ─── Враждебные конструкты портального шторма (construct/*/hostile) ───
- type: entity
  parent: MobCultJuggernaut
  id: MobCultJuggernautHostile
  suffix: Hostile
  components:
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: MeleeWeapon
    hidden: true
    angle: 0
    attackRate: 0.5
    animation: WeaponArcFist
    damage:
      types:
        Blunt: 25
    soundHit:
      path: /Audio/Imperial/BloodCult/punch3.ogg

- type: entity
  parent: MobCultWraith
  id: MobCultWraithHostile
  suffix: Hostile
  components:
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: MeleeWeapon
    hidden: true
    angle: 0
    attackRate: 0.67
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 20
    soundHit:
      path: /Audio/Imperial/BloodCult/bladeslice.ogg

- type: entity
  parent: MobCultArtificer
  id: MobCultArtificerHostile
  suffix: Hostile
  components:
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: MeleeWeapon
    hidden: true
    angle: 0
    attackRate: 0.5
    animation: WeaponArcFist
    damage:
      types:
        Blunt: 5
    soundHit:
      path: /Audio/Imperial/BloodCult/punch2.ogg
