# Фракция, иконки, алерты, звуки культа крови.

- type: npcFaction
  id: Cult
  hostile:
  - NanoTrasen
  - Syndicate
  - Passive
  - PetsNT
  - Revolutionary
  - Dragon
  - Xeno
  - AllHostile
  - SyndicateAgent
  - Wizard
  - Pirate
  - DeathSquad
  - RiotControlUnit
  - Xenoborg
  - Blob

# antag_hud.dmi "cult" / "cultmaster".
- type: factionIcon
  id: CultistFaction
  isShaded: true
  priority: 11
  showTo:
    components:
    - ShowAntagIcons
    - Cultist
  icon:
    sprite: /Textures/Imperial/BloodCult/hud.rsi
    state: cult

- type: factionIcon
  id: CultMasterFaction
  isShaded: true
  priority: 11
  showTo:
    components:
    - ShowAntagIcons
    - Cultist
  icon:
    sprite: /Textures/Imperial/BloodCult/hud.rsi
    state: cultmaster

# alert/bloodsense: 0 cult_sense, 1 runed_sense0, 2 runed_sense1, 3 runed_sense2, 4+ стрелки (дальность * 16 + направление).
