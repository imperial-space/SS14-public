# ==============================================
#  Культ Нар'Си — Графы постройки
#  Материал: CultRunedMetal
# ==============================================

# === Алтарь (3 металла) ===

- type: constructionGraph
  id: CultAltarGraph
  start: start
  graph:
    - node: start
      edges:
        - to: cultAltar
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: CultRunedMetal
              amount: 3
              doAfter: 3
    - node: cultAltar
      entity: CultAltar
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CultRunedMetal
              amount: 3
            - !type:DeleteEntity {}
          steps:
            - tool: Welding
              doAfter: 3

