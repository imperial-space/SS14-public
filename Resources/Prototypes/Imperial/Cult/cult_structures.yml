# Постройки культа (cult_structures*.dm).

- type: entity
  abstract: true
  id: BaseCultStructure
  parent: BaseStructure
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Appearance
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Imperial/BloodCult/veryfar_noise.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          CultRunedMetal:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PointLight
    radius: 1.5
    energy: 2
    color: "#FF3232"

- type: entity
  parent: BaseCultStructure
  id: CultAltar
  name: алтарь
  description: Окровавленный алтарь, посвящённый Нар'Си.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/structures.rsi
    layers:
    - state: talismanaltar
      map: [ "enum.CultVisualLayers.Base" ]
  - type: CultVisuals
    anchorState: talismanaltar
  - type: PointLight
    enabled: false
  - type: CultStructure
    structureType: Altar
    examineTip: cult-altar-tip
    successMessage: cult-altar-success
    breakMessage: cult-altar-break
    baseState: talismanaltar
    options:
    - name: cult-option-whetstone
      description: cult-option-whetstone-desc
      items: [ CultWhetstone ]
      icon:
        sprite: Imperial/BloodCult/items.rsi
        state: cult_sharpener
    - name: cult-option-shell
      description: cult-option-shell-desc
      items: [ CultConstructShell ]
      icon:
        sprite: Imperial/BloodCult/shell.rsi
        state: construct_cult
    - name: cult-option-flask
      description: cult-option-flask-desc
      items: [ CultUnholyFlask ]
      icon:
        sprite: Imperial/BloodCult/flask.rsi
        state: icon

- type: entity
  parent: BaseCultStructure
  id: CultArchives
  name: архивы
  description: Стол, заваленный тайными рукописями и томами на неизвестных языках. От взгляда на текст по коже бегут мурашки.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/structures.rsi
    layers:
    - state: tomealtar
      map: [ "enum.CultVisualLayers.Base" ]
  - type: CultVisuals
    anchorState: tomealtar
  - type: PointLight
    radius: 1.5
    energy: 2
    color: "#FA9632"
  - type: CultStructure
    structureType: Archives
    examineTip: cult-archives-tip
    successMessage: cult-archives-success
    breakMessage: cult-archives-break
    baseState: tomealtar
    options:
    - name: cult-option-blindfold
      description: cult-option-blindfold-desc
      items: [ CultZealotBlindfold ]
      icon:
        sprite: Clothing/Eyes/Misc/blindfold.rsi
        state: icon
    - name: cult-option-curse
      description: cult-option-curse-desc
      items: [ CultCursedOrb ]
      icon:
        sprite: Imperial/BloodCult/items.rsi
        state: shuttlecurse
    - name: cult-option-veil
      description: cult-option-veil-desc
      items: [ CultVeilShifter ]
      icon:
        sprite: Imperial/BloodCult/items.rsi
        state: shifter

- type: entity
  parent: BaseCultStructure
  id: CultForge
  name: демоническая кузня
  description: Кузня, в которой куют нечестивое оружие армий Нар'Си.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/structures.rsi
    layers:
    - state: forge
      map: [ "enum.CultVisualLayers.Base" ]
  - type: CultVisuals
    anchorState: forge
  - type: PointLight
    radius: 2
    energy: 2
    color: "#C48A18"
  - type: CultStructure
    structureType: Forge
    examineTip: cult-forge-tip
    successMessage: cult-forge-success
    breakMessage: cult-forge-break
    baseState: forge
    options:
    - name: cult-option-armor
      description: cult-option-armor-desc
      items: [ CultHeavyRobe ]
      icon:
        sprite: Imperial/BloodCult/Clothing/hardened.rsi
        state: icon
    - name: cult-option-blade
      description: cult-option-blade-desc
      items: [ CultBlade ]
      icon:
        sprite: Objects/Weapons/Melee/cult_blade.rsi
        state: icon

- type: entity
  parent: BaseCultStructure
  id: CultPylon
  name: пилон
  description: Парящий кристалл, медленно исцеляющий верных Нар'Си.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/structures.rsi
    layers:
    - state: pylon
      map: [ "enum.CultVisualLayers.Base" ]
  - type: CultVisuals
    anchorState: pylon
  - type: PointLight
    radius: 1.5
    energy: 2
    color: "#FA8282"
  - type: CultStructure
    structureType: Pylon
    breakMessage: cult-pylon-break
    baseState: pylon
  - type: CultPylon
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Imperial/BloodCult/glassbr2.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          CultRunedMetal:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# Рунная балка (girder/cult): кинжал рушит одним ударом.
- type: entity
  parent: BaseStructure
  id: CultRunedGirder
  name: рунная балка
  description: Каркас из рунного металла. Его можно обшить, чтобы получилась стена.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Imperial/BloodCult/structures.rsi
    state: cultgirder
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 120
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: CultGirder
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CultRunedMetal:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# Стена ремесленника: не даёт рунного металла.
- type: entity
  parent: WallCult
  id: WallCultArtificer
  suffix: Artificer
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# airlock/cult.
- type: entity
  id: CultRunedAirlock
  parent: Airlock
  name: рунный шлюз
  description: Странная дверь, покрытая рунами.
  suffix: CULT
  components:
  - type: Sprite
    sprite: Imperial/cult/air.rsi
    snapCardinals: true
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: welded
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: welded
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseBolted"]
      visible: false
    - state: closed
      shader: unshaded
      map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
      visible: false
    - state: panel_closed
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: sparks_damaged
      map: ["enum.DoorVisualLayers.BaseEmagging"]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: Imperial/cult/air.rsi
    state: closed
  - type: Airlock
    emergencyAccessLayer: false
  - type: AccessReader
    access: []
  - type: CultRunedDoor
  - type: CultVisuals
    concealedRsi: /Textures/Structures/Doors/Airlocks/Standard/maint.rsi

- type: entity
  id: CultRunedAirlockBrittle
  parent: CultRunedAirlock
  name: хрупкий рунный шлюз
  description: Он кажется непрочным, но угрожающим.
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
