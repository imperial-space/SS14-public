  name: Искать урожай
  description: "Никто не скроется от Нар'Си: выследите выжившего, бегущего от красной жатвы!"
  components:
  - type: Action
    icon:
      sprite: Imperial/BloodCult/actions.rsi
      state: cult_mark
    background:
      sprite: Imperial/cult/action.rsi
      state: bg_cult
    useDelay: 1
