      state: bg_cult
    useDelay: 180
  - type: InstantAction
    event: !type:CultCreateRuneActionEvent
      rune: CultRuneRevive
      pattern: 1

- type: entity
  parent: BaseAction
  id: ActionCultAreaConversion
  name: Обращение области
  description: "Мгновенно обращает небольшую область вокруг вас."
  components:
  - type: Action
    icon:
      sprite: Imperial/BloodCult/actions.rsi
      state: areaconvert
    background:
      sprite: Imperial/cult/action.rsi
      state: bg_cult
    useDelay: 5
  - type: InstantAction
    event: !type:CultAreaConversionActionEvent

- type: entity
  parent: BaseAction
  id: ActionCultSeekMaster
  name: Искать хозяина
  description: "Вы и ваш хозяин связаны душой, и вы чувствуете, где он."
  components:
  - type: Action
    icon:
      sprite: Imperial/BloodCult/actions.rsi
      state: cult_mark
    background:
      sprite: Imperial/cult/action.rsi
      state: bg_cult
    useDelay: 1
  - type: InstantAction
