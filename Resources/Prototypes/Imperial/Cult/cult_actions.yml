    icon:
      sprite: Imperial/BloodCult/actions.rsi
      state: lesserconstruct
    background:
      sprite: Imperial/cult/action.rsi
      state: bg_cult
    useDelay: 10
  - type: InstantAction
    event: !type:CultConjureActionEvent
      wall: true

- type: entity
  parent: BaseAction
  id: ActionCultCreateSoulstone
  name: Призвать камень душ
  description: "Тянется в царство Нар'Си, призывая один из легендарных осколков."
  components:
  - type: Action
    icon:
      sprite: Imperial/BloodCult/actions.rsi
      state: summonsoulstone
    background:
      sprite: Imperial/cult/action.rsi
      state: bg_cult
    useDelay: 240
  - type: InstantAction
    event: !type:CultConjureActionEvent
      prototype: CultSoulStone

- type: entity
  parent: BaseAction
  id: ActionCultRuneTeleport
  name: Призвать руну телепорта
  description: "Призывает руну телепорта на ваше место, будто она всегда там была."
  components:
  - type: Action
    icon:
      sprite: Imperial/BloodCult/actions.rsi
      state: telerune
    background:
      sprite: Imperial/cult/action.rsi
      state: bg_cult
    useDelay: 180
  - type: InstantAction
    event: !type:CultCreateRuneActionEvent
      rune: CultRuneTeleport
      pattern: 2

- type: entity
  parent: BaseAction
  id: ActionCultRuneBarrier
