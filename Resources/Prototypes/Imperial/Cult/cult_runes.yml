  - type: CultRune
    runeType: NarSie
    cultistName: cult-rune-narsie-name
    cultistDesc: cult-rune-narsie-desc
    invocation: "TOK-LYR RQA-NAP G'OLT-ULOFT!!"
    reqCultists: 9
    scribeDelay: 50
    scribeDamage: 40.1
    eraseTime: 5
    noScribeBoost: true
    logWhenErased: true
    runeColor: "#8B0000"
    scribeOrder: 4

- type: entity
