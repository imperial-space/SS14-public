# Руны культа крови (runes.dm). Цвета — RUNE_COLOR_*.

- type: entity
  abstract: true
  id: BaseCultRune
  name: руна
  description: Странный набор символов, начертанных чем-то похожим на кровь.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Imperial/cult/rune.rsi
    drawdepth: FloorObjects
    noRot: true
    layers:
    - state: rune1
      map: [ "enum.CultVisualLayers.Base" ]
  - type: Appearance
  - type: CultVisuals
    rune: true
  - type: PointLight
    enabled: false
    radius: 1
    energy: 1

- type: entity
  parent: BaseCultRune
  id: CultRuneMalformed
  categories: [ HideSpawnMenu ]
  components:
  - type: CultRune
    runeType: Malformed
    runeColor: "#8B0000"
    cultistName: cult-rune-malformed-name
    cultistDesc: cult-rune-malformed-desc
    invocation: "Ra'sha yoka!"
    invokeDamage: 30
    canBeScribed: false

- type: entity
  parent: BaseCultRune
  id: CultRuneOffer
  components:
  - type: Sprite
    sprite: Imperial/cult/rune.rsi
    drawdepth: FloorObjects
    noRot: true
    layers:
    - state: rune3
      map: [ "enum.CultVisualLayers.Base" ]
  - type: CultRune
    runeType: Offer
    cultistName: cult-rune-offer-name
    cultistDesc: cult-rune-offer-desc
    reqCultistsText: cult-rune-offer-req
    invocation: "Mah'weyh pleggh at e'ntrath!"
    runeColor: "#8B0000"
    scribeOrder: 1
    spawnPattern: 3

- type: entity
  parent: BaseCultRune
  id: CultRuneEmpower
  components:
  - type: Sprite
    sprite: Imperial/cult/rune.rsi
    drawdepth: FloorObjects
    noRot: true
    layers:
    - state: rune2
      map: [ "enum.CultVisualLayers.Base" ]
  - type: CultRune
    runeType: Empower
    cultistName: cult-rune-empower-name
    cultistDesc: cult-rune-empower-desc
    invocation: "H'drak v'loso, mir'kanas verbot!"
    constructInvoke: false
    runeColor: "#8B0000"
    scribeOrder: 2
    spawnPattern: 3

- type: entity
  parent: BaseCultRune
  id: CultRuneTeleport
  components:
  - type: Sprite
    sprite: Imperial/cult/rune.rsi
    drawdepth: FloorObjects
    noRot: true
    layers:
    - state: rune1
      map: [ "enum.CultVisualLayers.Base" ]
  - type: CultRune
    runeType: Teleport
    cultistName: cult-rune-teleport-name
    cultistDesc: cult-rune-teleport-desc
    invocation: "Sas'so c'arta forbici!"
    reqKeyword: true
    runeColor: "#8B0000"
    scribeOrder: 3
    spawnPattern: 2

- type: entity
  parent: BaseCultRune
