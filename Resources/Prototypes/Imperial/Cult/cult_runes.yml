# Совместимость с нуль-жезлом.
- type: entity
  id: CultRuneDestructionEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: Imperial/cult/rune_large.rsi
    drawdepth: FloorObjects
    state: rune_large_distorted
    color: "#8B0000"
  - type: TimedDespawn
    lifetime: 0.5
