# emergency_shield/cult/* — щиты.
- type: entity
  abstract: true
  id: BaseCultShield
  name: барьер культа
  description: Щит, призванный культистами, чтобы держать еретиков подальше.
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: Sprite
    sprite: Imperial/BloodCult/shields.rsi
    drawdepth: Mobs
    layers:
    - state: shield-red
      shader: unshaded
      map: [ "enum.CultVisualLayers.Base" ]
  - type: Appearance
  - type: CultVisuals
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseCultShield
  id: CultRuneBarrierShield

- type: entity
  parent: BaseCultShield
  id: CultShieldNarSie
  name: кровавый барьер
  description: Мощный щит, призванный культистами для защиты своих обрядов.
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# Щит заклинателя: не мешает проходу, только бьётся.
- type: entity
  parent: BaseCultShield
  id: CultShieldWeak
  name: щит заклинателя
  description: Слабый щит, защищающий культистов во время тонких ритуалов.
  components:
  - type: Sprite
    sprite: Imperial/BloodCult/shields.rsi
    drawdepth: Overdoors
    layers:
    - state: shield-red
      color: "#FF0000"
      shader: unshaded
      map: [ "enum.CultVisualLayers.Base" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        hard: false
        mask:
        - BulletImpassable
        layer:
        - GlassLayer
  - type: Airtight
    airBlocked: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# forcefield/cult: светящаяся стена на 20 с.
- type: entity
  id: CultWallForce
  name: светящаяся стена
  description: Нечестивый щит, блокирующий все атаки.
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: Sprite
    sprite: Imperial/BloodCult/effects.rsi
    drawdepth: Mobs
    state: cultshield
    shader: unshaded
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
  - type: TimedDespawn
    lifetime: 20

# obj/effect/blessing: видят капелланы, еретики и призраки-конструкты.
- type: entity
  id: CultBlessing
  name: святое благословение
  description: Святые энергии мешают эфирным путешествиям в этом месте.
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    sprite: Imperial/BloodCult/shields.rsi
    drawdepth: FloorObjects
    layers:
    - state: blessed
      color: "#FFFFFF40"
      visible: false
      map: [ "enum.CultVisualLayers.Base" ]
  - type: CultBlessing

