# Временные визуальные эффекты культа (temporary_visuals/cult.dm).

- type: entity
  abstract: true
  id: BaseCultEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: Imperial/BloodCult/effects.rsi
    drawdepth: Effects
    layers:
    - state: bloodsparkles
      shader: unshaded
      map: [ "enum.CultVisualLayers.Base" ]
  - type: Appearance
  - type: CultVisuals
  - type: TimedDespawn
    lifetime: 1

- type: entity
  parent: BaseCultEffect
  id: CultEffectSparks
  name: кровавые искры

- type: entity
