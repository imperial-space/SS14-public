# datum/objective/sacrifice, datum/objective/eldergod.

- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseCultObjective
  components:
  - type: Objective
    issuer: objective-issuer-cult
    difficulty: 1
  - type: RoleRequirement
    roles:
    - CultistRole

- type: entity
  parent: BaseCultObjective
  id: CultSacrificeTargetsObjective
  name: Принесите жертву
  description: Нар'Си требует жертву. Принесите цель на руне Подношения, когда вокруг неё стоят три культиста.
  components:
  - type: Objective
    issuer: objective-issuer-cult
    difficulty: 2
    icon:
      sprite: Imperial/BloodCult/rune.rsi
      state: "3"
  - type: ImperialCultSacrificeCondition

- type: entity
  parent: BaseCultObjective
  id: CultSummonNarSieObjective
  name: Призовите Нар'Си
  description: Призовите Нар'Си, начертив и призвав руну Нар'Си в одном из отсеков, где завеса тонка.
  components:
  - type: Objective
    issuer: objective-issuer-cult
    difficulty: 4
    icon:
      sprite: Imperial/BloodCult/rune96.rsi
      state: rune_large
  - type: ImperialCultSummonCondition
