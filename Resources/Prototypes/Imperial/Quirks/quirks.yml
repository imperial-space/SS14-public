# Причуды TG (code/datums/quirks). Стоимость черты = value TG: отрицательные дают очки,
# положительные тратят. Категория позволяет набрать сумму не больше 2 (default_quirk_points),
# сервер при появлении ещё раз применяет правила TG (несовместимые пары, не больше 6 положительных).

- type: traitCategory
  id: ImperialQuirks
  name: trait-category-imperial-quirks
  maxTraitPoints: 2

