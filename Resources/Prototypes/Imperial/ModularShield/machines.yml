# Модульные щиты TG (code/game/machinery/modular_shield.dm).

- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: ImperialModularShieldGenerator
  name: генератор модульного щита
  description: Генератор силового поля, куда менее подвижный, чем его собратья. Не переносит перегрузок и на подвижных судах требует частых перезапусков.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable
  - type: Sprite
    sprite: Imperial/ModularShield/machines.rsi
    offset: 0, 0.125
    layers:
    - state: gen_recovering_closed
      map: [ "base" ]
  - type: Appearance
  - type: WiresPanel
  - type: Machine
    board: ImperialModularShieldGeneratorBoard
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ImperialModularShieldGenerator
    displayName: Генератор щита
  - type: Wires
    boardName: imperial-modular-shield-wires-board
    layoutId: ImperialModularShieldGenerator
  - type: UserInterface
    interfaces:
      enum.ImperialModularShieldUiKey.Generator:
        type: ImperialModularShieldGeneratorBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: ImperialModularShieldGate
  name: модульный щитовой шлюз
  description: Генератор силового поля, ставящий плоскую стену. Не переносит перегрузок и на подвижных судах требует частых перезапусков.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        hard: false
        mask:
        - MachineMask
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable
  - type: Sprite
    sprite: Imperial/ModularShield/machines.rsi
    offset: 0, 0.125
    layers:
    - state: gate_recovering_closed
      map: [ "base" ]
  - type: Appearance
  - type: WiresPanel
  - type: Machine
    board: ImperialModularShieldGateBoard
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ImperialModularShieldGenerator
    gate: true
    internalPenalty: false
    iconType: gate
    displayName: Щитовой шлюз
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Wires
    boardName: imperial-modular-shield-wires-board
    layoutId: ImperialModularShieldGenerator
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

