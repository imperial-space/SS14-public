- type: entity
  parent: BaseMachineCircuitboard
  id: ImperialModularShieldGeneratorBoard
  name: плата генератора модульного щита
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: ImperialModularShieldGenerator
    stackRequirements:
      Plasteel: 3
    tagRequirements:
      ImperialStockPartServo:
        amount: 1
        defaultPrototype: ImperialStockPartServo1
        examineName: imperial-stock-part-type-servo
      ImperialStockPartMicroLaser:
        amount: 1
        defaultPrototype: ImperialStockPartMicroLaser1
        examineName: imperial-stock-part-type-microlaser
      ImperialStockPartCapacitor:
