# Шаблон для ImperialTgResearchSystem: дисциплины TG подставляются серверу исследований через Sync.
- type: entity
  id: ImperialTgResearchTemplate
  categories: [ HideSpawnMenu ]
  components:
  - type: TechnologyDatabase
    supportedDisciplines:
    - ImperialTgEngineering
    - ImperialTgMedical
    - ImperialTgSecurity
    - ImperialTgRobotics
    - ImperialTgService
    - ImperialTgSupply
    - ImperialTgScience
