    proto: BulletLaser
    count: 6
    spread: 15

- type: entity
  parent: BaseShellShotgun
  id: ImperialTechShell
  name: незаряженный технологический патрон
  description: Высокотехнологичный патрон, который можно снарядить материалами для особых эффектов. Варианты сборки — в меню действий.
