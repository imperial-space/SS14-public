# === Патроны дробовика (ammo_casing/shotgun) ===

- type: entity
  parent: BaseShellShotgun
  id: ImperialScatterLaserShell
  name: лазерный дробовой патрон
  description: Продвинутый патрон с микролазером, повторяющий действие лазерного дробовика в баллистическом корпусе.
  components:
  - type: Sprite
