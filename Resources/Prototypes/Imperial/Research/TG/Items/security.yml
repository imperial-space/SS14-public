# === Наборы деталей оружия (weaponcrafting/gunkit) ===

- type: entity
  parent: BaseItem
  id: ImperialBaseGunKit
  abstract: true
  components:
  - type: Sprite
    sprite: Imperial/Research/TG/gunkits.rsi
    state: kit
  - type: Item
    size: Normal

- type: entity
  parent: ImperialBaseGunKit
  id: ImperialIonCarbine
  name: набор деталей ионного карабина
  description: Чемоданчик с деталями, превращающими стандартный лазер в ионный карабин. Сборка — в меню действий, лазер нужно держать в руке или положить рядом.
