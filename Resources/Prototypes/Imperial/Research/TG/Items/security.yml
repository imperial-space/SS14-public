# Предметы СБ из исследований TG (techweb: sec_equip, riot_supression, electric_weapons, beam_weapons, exotic_ammo, explosives).

# === Бойки (code/modules/projectiles/pins.dm) ===

- type: entity
  parent: BaseItem
  id: ImperialBaseFiringPin
  abstract: true
  components:
  - type: Sprite
    sprite: Imperial/Research/TG/firing_pins.rsi
  - type: Item
    size: Tiny

- type: entity
  parent: ImperialBaseFiringPin
  id: ImperialTestRangePin
  name: боёк для тира
  description: Безопасный боёк позволяет стрелять только рядом с мишенями тира. Вставьте в оружие, кликнув им.
  components:
  - type: Sprite
    state: test
  - type: ImperialFiringPin
    mode: TestRange

- type: entity
  parent: ImperialBaseFiringPin
  id: ImperialMindshieldPin
  name: боёк защиты разума
  description: Боёк СБ разрешает стрелять только носителям импланта защиты разума. Вставьте в оружие, кликнув им.
  components:
  - type: Sprite
    state: mindshield
  - type: ImperialFiringPin
    mode: Mindshield

- type: entity
  parent: ImperialBaseFiringPin
  id: ImperialExplorerPin
  name: боёк исследователя
  description: Боёк австраликусских сил обороны, переделанный так, чтобы оружие не стреляло на станции. Вставьте в оружие, кликнув им.
  components:
  - type: Sprite
    state: explorer
  - type: ImperialFiringPin
    mode: Explorer

# === Медвежий капкан (restraints/legcuffs/beartrap) ===

- type: entity
  parent: BaseItem
  id: ImperialBearTrap
  name: медвежий капкан
  description: Ловушка для медведей и прочих существ с ногами. Взведите в руке и положите на пол.
  components:
  - type: Sprite
    sprite: Imperial/Research/TG/beartrap.rsi
    layers:
    - state: icon
      map: [ "trap" ]
  - type: Item
    size: Normal
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ImperialBearTrapVisuals.Armed:
        trap:
          True: { state: armed }
          False: { state: icon }
  - type: ImperialBearTrap
  - type: StepTrigger
    intersectRatio: 0.2
    requiredTriggeredSpeed: 0
  - type: Ensnaring
    freeTime: 10
    breakoutTime: 10
    walkSpeed: 0
    sprintSpeed: 0
    canThrowTrigger: false
    staminaDamage: 0
  - type: PhysicalComposition
    materialComposition:
      Steel: 500

# === Бумеранг (melee/baton/security/boomerang) ===

- type: entity
  parent: Stunbaton
  id: ImperialStunBoomerang
  name: бумеранг OZtek
  description: Устройство, изобретённое в 2486 году для Великой войны с космическими эму Конфедерацией Австраликуса. Эти высокотехнологичные бумеранги также исключительно хорошо оглушают членов экипажа. Только не забудьте поймать его, когда кидаете!
  components:
  - type: Sprite
    sprite: Imperial/Research/TG/boomerang.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Item
    sprite: Imperial/Research/TG/boomerang.rsi
    heldPrefix: null
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: active }
          False: { state: icon }
  - type: ImperialBoomerang
  - type: StaminaDamageOnCollide
    damage: 35
  - type: ItemTogglePrefix
    on: null
    off: null

