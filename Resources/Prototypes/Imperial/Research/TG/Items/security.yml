  - type: Sprite
    sprite: Imperial/Research/TG/shells.rsi
    layers:
    - state: techshell
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: PelletShotgunPractice
  - type: SpentAmmoVisuals
    state: techshell
    suffix: true
  - type: ImperialTgCraft
    recipes:
    - name: imperial-tg-recipe-meteorslug
      result: ImperialShellShotgunMeteor
      time: 0.5
      items:
      - protos: [ RCDAmmo ]
        name: imperial-tg-req-rcd-ammo
      - protos: [ MicroManipulatorStockPart ]
        count: 2
        name: imperial-tg-req-servo
      reagents:
        Gunpowder: 10
        Rum: 10
    - name: imperial-tg-recipe-pulseslug
      result: ImperialShellPulseSlug
      time: 0.5
      items:
      - protos: [ PowerCellMedium, PowerCellHigh, PowerCellHyper ]
        count: 2
        name: imperial-tg-req-capacitor
      - protos: [ MicroManipulatorStockPart ]
        name: imperial-tg-req-laser
    - name: imperial-tg-recipe-dragonsbreath
      result: ShellShotgunIncendiary
      time: 0.5
      reagents:
        Phosphorus: 5
    - name: imperial-tg-recipe-frag12
      result: ImperialShellFrag12
      time: 0.5
      reagents:
        Gunpowder: 5
        FluorosulfuricAcid: 10
    - name: imperial-tg-recipe-ionshell
      result: ImperialShellIon
      time: 0.5
      items:
      - protos: [ MicroManipulatorStockPart ]
        name: imperial-tg-req-laser
      - protos: [ XenoBluespaceCrystal ]
        name: imperial-tg-req-crystal

