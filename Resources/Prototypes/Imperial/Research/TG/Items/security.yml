    size: Huge
    sprite: Imperial/Research/TG/tesla_cannon_inhand.rsi
  - type: Clothing
    sprite: Imperial/Research/TG/tesla_cannon_inhand.rsi
    slots:
    - Back
  - type: GunRequiresWield
  - type: Gun
    fireRate: 10
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Effects/Lightning/lightningshock.ogg
  - type: BatteryAmmoProvider
    proto: ImperialBulletTeslaCannon
    fireCost: 30
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance

