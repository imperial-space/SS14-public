      types:
        Shock: 5
  - type: ImperialTgProjectileEffects
    shock: 10

- type: entity
  parent: [ BaseWeaponBattery, BaseGunWieldable, BaseMajorContraband ]
  id: ImperialWeaponEventHorizon
  name: антиэкзистенциальная лучевая винтовка «Горизонт событий»
  description: Безумные умы НаноТрейзен в своей гордыне и злобе породили окончательный итог гонки вооружений — оружейные чёрные дыры. Стреляет только из прицела (держа двумя руками).
