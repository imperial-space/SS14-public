    layers:
    - state: lasershell
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: ImperialScatterLaserPellets
  - type: SpentAmmoVisuals
    state: lasershell
    suffix: true

- type: entity
  id: ImperialScatterLaserPellets
