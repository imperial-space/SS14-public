  name: ионный карабин
  description: Прототип ионного проектора MK.II — облегчённая карабинная версия ионной винтовки, эргономичная и экономичная.
  components:
  - type: Sprite
    sprite: Imperial/Research/TG/ioncarbine.rsi
    layers:
    - state: icon
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-unshaded-4
      map: [ "enum.GunVisualLayers.MagUnshaded" ]
      shader: unshaded
  - type: Item
    size: Large
    sprite: Imperial/Research/TG/ioncarbine.rsi
  - type: Clothing
    sprite: Imperial/Research/TG/ioncarbine.rsi
