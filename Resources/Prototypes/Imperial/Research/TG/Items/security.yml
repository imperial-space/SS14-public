# === Корпуса химгранат (grenade/chem_grenade) ===

- type: entity
  parent: ModularGrenade
  id: ImperialBaseTgGrenadeCasing
  abstract: true
  components:
  - type: Sprite
    sprite: Imperial/Research/TG/grenades.rsi

- type: entity
  parent: ImperialBaseTgGrenadeCasing
  id: ImperialLargeGrenadeCasing
  name: корпус большой гранаты
  description: Самодельный большой корпус гранаты. Нагревает содержимое на 25 K при срабатывании. Нужны провод, триггер и химический заряд.
  components:
  - type: Sprite
    layers:
    - state: large
      map: [ "enum.ConstructionVisuals.Layer" ]
  - type: Construction
    graph: ImperialTgGrenadeLargeGraph
    node: emptyCase
  - type: ImperialTgGrenadeCasing
    temperatureDelta: 25
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          emptyCase: { state: large }
          wiredCase: { state: large-ass }
          caseWithTrigger: { state: large-ass }
          caseWithPayload: { state: large-ass }
          grenade: { state: large-locked }
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: { state: large-primed }

- type: entity
  parent: ImperialBaseTgGrenadeCasing
  id: ImperialAdvancedGrenadeCasing
  name: корпус гранаты с улучшенным выпуском
  description: Самодельный корпус, срабатывающий несколько раз — каждые 5 секунд выпускает по 10 единиц смеси. Нужны провод, триггер и химический заряд.
  components:
  - type: Sprite
    layers:
    - state: adv
      map: [ "enum.ConstructionVisuals.Layer" ]
  - type: Construction
    graph: ImperialTgGrenadeAdvGraph
    node: emptyCase
  - type: ImperialTgGrenadeCasing
    releaseUnits: 10
    temperatureDelta: 10
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          emptyCase: { state: adv }
          wiredCase: { state: adv-ass }
          caseWithTrigger: { state: adv-ass }
          caseWithPayload: { state: adv-ass }
          grenade: { state: adv-locked }
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: { state: adv-primed }

- type: entity
  parent: ImperialBaseTgGrenadeCasing
  id: ImperialPyroGrenadeCasing
  name: корпус пирогранаты
  description: Самодельный пиротехнический корпус. Нагревает содержимое на 500 K при срабатывании. Нужны провод, триггер и химический заряд.
  components:
