  components:
  - type: Sprite
    sprite: Imperial/Research/TG/holo_projectors.rsi
    state: janitor
  - type: HolosignProjector
    signProto: ImperialHolobarrierWetFloor
    chargeUse: 120

- type: entity
  parent: HolosignWetFloor
  id: ImperialHolobarrierWetFloor
  name: голобарьер «мокрый пол»
  description: Твёрдый световой барьер. Осторожно, скользко!
  components:
  - type: Sprite
    sprite: Imperial/Research/TG/holosigns.rsi
    state: holosign
  - type: Physics
