# === Машины ===

- type: entity
  parent: BaseMachineCircuitboard
  id: ImperialPortablePumpMachineCircuitboard
  name: плата портативной помпы
  description: Плата машины портативной воздушной помпы.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: ImperialPortablePump
    stackRequirements:
      Manipulator: 2
      Cable: 5
      Glass: 2

- type: entity
  parent: [ BaseMachinePowered, SmallConstructibleMachine, StructureWheeled ]
  id: ImperialPortablePump
  name: портативная воздушная помпа
  description: Качает воздух с тайла во внутренний бак или обратно. Управление — альтернативными действиями.
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: AtmosDevice
    joinSystem: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 100
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Imperial/Research/TG/portable_pump.rsi
    noRot: true
    state: icon
  - type: ImperialPortablePump
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: Machine
    board: ImperialPortablePumpMachineCircuitboard

- type: entity
  parent: BaseMachineCircuitboard
  id: ImperialAtmosShieldGeneratorBoard
  name: плата генератора атмосферного щита
  description: Плата генератора атмосферного щита.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: ImperialAtmosShieldGenerator
    stackRequirements:
      Manipulator: 1
      Cable: 5
      Glass: 1

- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: ImperialAtmosShieldGenerator
  name: генератор атмосферного щита
  description: Создаёт атмосферный щит на линии между собой и другим генератором, если оба смотрят друг на друга на расстоянии до 2 тайлов и запитаны.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: Imperial/Research/TG/atmos_shield_gen.rsi
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 190
        mask:
        - MachineMask
  - type: ImperialAtmosShieldGen
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: Rotatable
  - type: Machine
    board: ImperialAtmosShieldGeneratorBoard

- type: entity
  id: ImperialAtmosShieldField
  categories: [ HideSpawnMenu ]
  name: атмосферный щит
  description: Барьер из твёрдого света, удерживающий воздух.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Imperial/Research/TG/holosigns.rsi
    state: firelock
    drawdepth: Overdoors
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Airtight
    noAirWhenFullyAirBlocked: false
  - type: Clickable
