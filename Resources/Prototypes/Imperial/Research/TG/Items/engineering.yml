  - type: Sprite
    sprite: Imperial/Research/TG/holo_projectors.rsi
    state: service
  - type: HolosignProjector
    signProto: ImperialHolosignSeat
    chargeUse: 60

- type: entity
  parent: ImperialHolosignRestaurant
  id: ImperialHolosignBar
  name: проектор мест бара
