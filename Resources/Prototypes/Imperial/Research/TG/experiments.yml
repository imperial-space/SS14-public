# Эксперименты techweb TG (code/modules/experisci/experiment). Node — узел TG, required — обязательный,
# discount — очки TG, которые вернутся серверу (× 75). Выполняются сканером экспериментов, взрывом или победой в аркаде.

# ── Обязательные (required_experiments) ──

- type: imperialTgExperiment
  id: TgExpPlantsWild
  name: tg-exp-plants-wild
  description: tg-exp-plants-wild-desc
  node: selection
  required: true
  requirement: !type:TgConditionRequirement
    condition: PlantMutated

- type: imperialTgExperiment
  id: TgExpHaloperidol
  name: tg-exp-haloperidol
  description: tg-exp-haloperidol-desc
  node: medbay_equip_adv
  required: true
  requirement: !type:TgReagentRequirement
    reagent: Haloperidol
    minAmount: 5

- type: imperialTgExperiment
  id: TgExpLowYieldBomb
  name: tg-exp-low-yield
  description: tg-exp-low-yield-desc
  node: explosives
  required: true
  requirement: !type:TgExplosionRequirement
    minRadius: 5

- type: imperialTgExperiment
  id: TgExpFish
  name: tg-exp-fish
  description: tg-exp-fish-desc
  node: fishing_equip_adv
  required: true
  requirement: !type:TgScanRequirement
    count: 4
    targets:
    - whitelist:
        tags:
        - ImperialFish

