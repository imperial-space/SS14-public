# HUD ксеноморфа (code/_onclick/hud/alien.dm, screen_objects/alien.dm, screen_objects/alert.dm).
# Иконки из icons/hud/screen_alien.dmi и screen_alert.dmi.

# healths/alien: health0 — здоров, 1–5 — по 20 % здоровья, 6 — крит, 7 — мёртв.
- type: alert
  id: XenoHealth
  category: Health
  icons:
  - sprite: /Textures/Imperial/Xenomorph/hud.rsi
    state: health0
  - sprite: /Textures/Imperial/Xenomorph/hud.rsi
    state: health1
  - sprite: /Textures/Imperial/Xenomorph/hud.rsi
    state: health2
  - sprite: /Textures/Imperial/Xenomorph/hud.rsi
    state: health3
  - sprite: /Textures/Imperial/Xenomorph/hud.rsi
    state: health4
  - sprite: /Textures/Imperial/Xenomorph/hud.rsi
    state: health5
  - sprite: /Textures/Imperial/Xenomorph/hud.rsi
    state: health6
  - sprite: /Textures/Imperial/Xenomorph/hud.rsi
    state: health7
  minSeverity: 0
  maxSeverity: 7
  name: alerts-xeno-health-name
  description: alerts-xeno-health-desc

# alien/plasma_display: «plasma stored», число плазмы пурпурным дорисовывает клиент.
- type: alert
  id: XenoPlasma
  icons:
  - sprite: /Textures/Imperial/Xenomorph/hud.rsi
    state: power_display
  name: alerts-xeno-plasma-name
  description: alerts-xeno-plasma-desc

