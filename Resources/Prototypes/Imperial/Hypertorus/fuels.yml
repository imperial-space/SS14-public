# Рецепты топлива гиперторуса (hfr_fuel_datums.dm). Газы SS13, которых нет в SS14:
# фреон — Frezon, плюоксий — Ozonium, прото-нитрат — Phazonium, нитрий — Thermonium,
# заукер и миазмы — Ammonia, хилиум — NitrousOxide, галон — CarbonDioxide.

- type: hypertorusFuel
  id: PlasmaOxygen
  name: hypertorus-fuel-plasma-oxygen
  order: 1
  negativeTemperatureMultiplier: 2.5
  positiveTemperatureMultiplier: 0.1
  energyConcentrationMultiplier: 10
  fuelConsumptionMultiplier: 3.3
  gasProductionMultiplier: 1.4
  temperatureChangeMultiplier: 0.6
  requirements: [ Plasma, Oxygen ]
  primaryProducts: [ CarbonDioxide, WaterVapor ]
  secondaryProducts: [ CarbonDioxide, WaterVapor, Frezon, NitrousOxide, Ozonium, CarbonDioxide ]
  meltdownFlags: BaseExplosion, MinimumSpread

