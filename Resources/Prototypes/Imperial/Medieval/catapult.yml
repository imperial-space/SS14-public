    - type: RandomSpawner
      prototypes:
        - MedievalProjectileFireTank
      chance: 1
      offset: 2

- type: entity
  id: MedievalProjectileFireTank
  parent: BulletRocket
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
  - type: Explosive
    explosionType: Default
    maxIntensity: 2
    intensitySlope: 6
    totalIntensity: 20
    maxTileBreak: 0
  - type: IgniteOnCollide
    fireStacks: 3
  - type: SpawnEntityOnTrigger
    spawnedEntitiesPrototype:
      - FireballShockWaveEffect
  - type: FireballDistortion
    fireballScale: 2
    startPoint: 0.25,0
    fireColor: "#FF1800"
    fireEdgeColor: "#970000"
  - type: SingularityDistortion
    falloffPower: 2.5
    intensity: 100
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
      blackHoleExplode:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        density: 0
        layer:
        - Impassable
        hard: false
  - type: AmbientSound
    volume: 3
    range: 6
    sound:
      path: /Audio/Imperial/Medieval/fireball_inflight.ogg


