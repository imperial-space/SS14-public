
# Наёмники (вся ветка требует фракцию Merc)

# Появиться за роль наёмника
- type: achievement
  id: AchievementMercBecomeMerc
  priority: 10
  rarity: Common
  tab: AchievementTabMerc
  name: achievement-merc-become-merc-name
  description: achievement-merc-become-merc-desc
  icon:
    sprite: Imperial/Medieval/Clothing/Cloaks/clan_merc.rsi
    state: icon
  visibility: Visible
  conditions:
  - !type:LocationCondition
    progressKey: mercBecomeMercProgression
    requiredCount: 1
    requiredJobs:
    - MedievalMerc
    requiredFactions:
    - Merc
    locationId: AreaMarkerMerc

# Экипировать кожаный или железный нагрудник + стальные сапоги + стальные рукавицы
- type: achievement
  id: AchievementMercArmor
  priority: 11
  rarity: Common
  name: achievement-merc-armor-name
  description: achievement-merc-armor-desc
  icon:
    sprite: Imperial/Medieval/Clothing/Armor/iron_armor_cuirass.rsi
    state: icon
  visibility: Visible
  prerequisites:
  - AchievementMercBecomeMerc
  conditions:
  - !type:CollectAnyItemsCondition # кожаный или железный нагрудник
    progressKey: mercArmorChestProgression
    requiredCount: 1
    requiredFactions:
    - Merc
    itemPrototypes:
    - MedievalClothingOuterArmorLeatherLight
    - MedievalClothingOuterArmorLeatherHeavy
    - MedievalClothingOuterArmorIron
    - MedievalClothingOuterArmorIronCuirass
  - !type:CollectAllItemsCondition # стальные сапоги + стальные рукавицы
    progressKey: mercArmorFeetHandsProgression
    requiredFactions:
    - Merc
    itemPrototypes:
      MedievalClothingFeetSteel: 1 # стальные (латные) сапоги
      MedievalIronGloves: 1 # стальные (латные) рукавицы

# Выполнить 1 контракт
- type: achievement
  id: AchievementMercContract1
  priority: 12
  rarity: Common
  name: achievement-merc-contract1-name
  description: achievement-merc-contract1-desc
  icon:
    sprite: Imperial/Medieval/Objects/Envelope/merc.rsi
    state: icon
  visibility: Visible
  prerequisites:
  - AchievementMercBecomeMerc
  conditions:
  - !type:CompleteMercContractCondition
    progressKey: mercContract1Progression
    requiredCount: 1
    requiredFactions:
    - Merc

# Получить цвайхендер (СЕКРЕТНАЯ)
- type: achievement
  id: AchievementMercZweihander
  priority: 13
  rarity: Rare
  name: achievement-merc-zweihander-name
  description: achievement-merc-zweihander-desc
  icon:
    sprite: Imperial/Medieval/Melee/zweihander.rsi
    state: icon
  visibility: Hidden
  prerequisites:
  - AchievementMercBecomeMerc
  conditions:
  - !type:CollectAnyItemsCondition
    progressKey: mercZweihanderProgression
    requiredCount: 1
    requiredFactions:
    - Merc
    itemPrototypes:
    - MedievalIronZweihander
    - MedievalIronZweihanderSteel

# За один раунд: выполнить 2 контракта + заработать 300 ревентов
- type: achievement
  id: AchievementMercContract2Round
  priority: 14
  rarity: Uncommon
  name: achievement-merc-contract2-round-name
  description: achievement-merc-contract2-round-desc
  icon:
    sprite: Imperial/Medieval/Materials/mdv.rsi
    state: revent_6
  visibility: Visible
  roundOnly: true
  prerequisites:
  - AchievementMercContract1
  conditions:
  - !type:CompleteMercContractCondition
    progressKey: mercContract2Progression
    requiredCount: 2
    requiredFactions:
    - Merc
  - !type:CollectAllItemsCondition
    progressKey: mercContract2ReventsProgression
    requiredFactions:
    - Merc
    itemPrototypes:
      MedievalRevent: 300

