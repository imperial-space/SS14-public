# Будучи главой: попасть в кабинет одного из лидеров и получить его письмо
- type: achievement
  id: AchievementMercLeaderOfficeLetter
  priority: 16
  rarity: Epic
  name: achievement-merc-office-letter-name
  description: achievement-merc-office-letter-desc
  icon:
    sprite: Imperial/Medieval/Objects/Envelope/legion.rsi
    state: icon
  visibility: Visible
  prerequisites:
  - AchievementMercBecomeLeader
  conditions:
  # посетить любой кабинет (OR через общий progressKey)
  - !type:LocationCondition
    progressKey: mercOfficeProgression
    requiredCount: 1
    requiredJobs:
    - MedievalMercLeader
    requiredFactions:
    - Merc
    locationId: achievement-location-office-legat
  - !type:LocationCondition
    progressKey: mercOfficeProgression
    requiredCount: 1
    requiredJobs:
    - MedievalMercLeader
    requiredFactions:
    - Merc
    locationId: achievement-location-office-jarl
  - !type:LocationCondition
    progressKey: mercOfficeProgression
    requiredCount: 1
    requiredJobs:
    - MedievalMercLeader
    requiredFactions:
    - Merc
    locationId: achievement-location-office-archmage
  - !type:LocationCondition
    progressKey: mercOfficeProgression
    requiredCount: 1
    requiredJobs:
    - MedievalMercLeader
    requiredFactions:
    - Merc
    locationId: achievement-location-office-preacher
  - !type:LocationCondition
    progressKey: mercOfficeProgression
    requiredCount: 1
    requiredJobs:
    - MedievalMercLeader
    requiredFactions:
    - Merc
    locationId: achievement-location-office-miner
  - !type:LocationCondition
    progressKey: mercOfficeProgression
    requiredCount: 1
    requiredJobs:
    - MedievalMercLeader
    requiredFactions:
    - Merc
    locationId: achievement-location-office-elder
  - !type:LocationCondition
    progressKey: mercOfficeProgression
    requiredCount: 1
    requiredJobs:
    - MedievalMercLeader
    requiredFactions:
    - Merc
    locationId: achievement-location-office-chief
  # получить любое из писем лидеров
  - !type:CollectAnyItemsCondition
    progressKey: mercLetterProgression
    requiredCount: 1
    requiredJobs:
    - MedievalMercLeader
    requiredFactions:
    - Merc
    itemPrototypes:
    - MedievalPaperEnvelopeLegion # легат
    - MedievalPaperEnvelopeRebel # ярл
    - MedievalPaperEnvelopeCollegium # архимаг
    - MedievalPaperEnvelopeCult # проповедник
    - MedievalPaperEnvelopeMiner # глава шахты
    - MedievalPaperEnvelopeVillage # старейшина
    - MedievalPaperEnvelopeTribe # вождь

