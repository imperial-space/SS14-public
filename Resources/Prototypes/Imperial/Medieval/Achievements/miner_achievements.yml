
# Шахтёры (вся ветка требует фракцию Miner)
# Механика: "сделать/получить/добыть N" = иметь N в инвентаре (CollectAll/CollectAny), "за раунд" => roundOnly
# УТОЧНИТЬ: сырое железо для входа, "зелёный доспех", "магические камни" (плейсхолдеры ниже)

# Вход: за 1 раунд добыть 15 глины + 15 железа + 15 угля
- type: achievement
  id: AchievementMinerJoin
  priority: 10
  rarity: Common
  name: achievement-miner-join-name
  tab: AchievementTabMine
  description: achievement-miner-join-desc
  icon:
    sprite: Objects/Weapons/Melee/pickaxe.rsi
    state: pickaxe
  visibility: Visible
  roundOnly: true
  conditions:
  - !type:CollectAllItemsCondition
    progressKey: minerJoinProgression
    requiredFactions:
    - Miner
    itemPrototypes:
      MedievalGlina: 15 # глина
      MedievalIronIngot: 15 # железо — УТОЧНИТЬ (сырое железо/руда?)
      MedievalCoal: 15 # уголь

