
# Деревня (вся ветка требует фракцию Village)

# Вход: крестьянином или ополченцем за 1 раунд получить 1 хлеб
- type: achievement
  id: AchievementVillageJoin
  priority: 10
  rarity: Common
  name: achievement-village-join-name
  tab: AchievementTabVillage
  description: achievement-village-join-desc
  icon:
    sprite: Objects/Consumable/Food/Baked/bread.rsi
    state: plain-slice
  visibility: Visible
  roundOnly: true
  conditions:
  - !type:CollectAllItemsCondition
    progressKey: villageJoinBreadProgression
    requiredJobs:
    - MedievalVillager
    - MedievalVillagerDef
    requiredFactions:
    - Village
    itemPrototypes:
      FoodBreadPlain: 1 # хлеб

