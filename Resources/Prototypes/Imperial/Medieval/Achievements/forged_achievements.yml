# Кузнечное дело / Кованные (для всех — без фильтра фракции)

# Получить магический порошок (пыль)
- type: achievement
  id: AchievementForgedMagicDust
  priority: 40
  rarity: Common
  tab: AchievementTabMagicForge
  name: achievement-forged-magic-dust-name
  description: achievement-forged-magic-dust-desc
  icon:
    sprite: Imperial/Medieval/Forged/items.rsi
    state: magicDust
  visibility: Visible
  conditions:
  - !type:CraftItemCondition
    progressKey: forgedMagicDustProgression
    requiredCount: 1
    targetItems:
    - MedievalMagicDust

