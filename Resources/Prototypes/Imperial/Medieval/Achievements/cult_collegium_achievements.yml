# ЛЮТАЯ СВАГА (СЕКРЕТНАЯ): за один раунд собрать полный сет архимага
- type: achievement
  id: AchievementCollegiumSwag
  priority: 22
  rarity: Legendary
  name: achievement-collegium-swag-name
  description: achievement-collegium-swag-desc
  icon:
    sprite: Imperial/Medieval/Clothing/Armor/charmer_armor.rsi
    state: icon
  visibility: Hidden
  roundOnly: true
  prerequisites:
  - AchievementCollegiumBecomeArchmage
  conditions:
  # капюшон архимага + сапоги скороходы + 1000 ревентов
  - !type:CollectAllItemsCondition
    progressKey: collegiumSwagFixedProgression
    requiredJobs:
    - MedievalCollegiumLeader
    requiredFactions:
    - Collegium
    itemPrototypes:
      MedievalClothingHeadHelmetCharmer: 1 # капюшон архимага
      MedievalShoesSpeed: 1 # сапоги скороходы
      MedievalRevent: 1000
  # роба архимага
  - !type:CollectAnyItemsCondition
    progressKey: collegiumSwagRobeProgression
    requiredCount: 1
    requiredJobs:
    - MedievalCollegiumLeader
    requiredFactions:
    - Collegium
    itemPrototypes:
    - MedievalClothingOuterArmorCharmerPurple # роба архимага коллегии
    - MedievalClothingOuterArmorCharmer # броня архимага
  # любой из медальонов
  - !type:CollectAnyItemsCondition
    progressKey: collegiumSwagMedaljonProgression
    requiredCount: 1
    requiredJobs:
    - MedievalCollegiumLeader
    requiredFactions:
    - Collegium
    itemPrototypes:
    - MedaljonSpeed
    - MedaljonMana
    - MedaljonDark
    - MedaljonDef
    - MedaljonFlashImmune
    - MedaljonThieving
    - MedaljonExpl
    - MedaljonNoslip
  # форстоуновые или эбонитовые перчатки
  - !type:CollectAnyItemsCondition
    progressKey: collegiumSwagGlovesProgression
    requiredCount: 1
    requiredJobs:
    - MedievalCollegiumLeader
    requiredFactions:
    - Collegium
    itemPrototypes:
    - MedievalForstoneGloves
    - MedievalEbonitGloves
    - MedievalEbonitGloves2
  # позолоченный фальшион
  - !type:CollectAnyItemsCondition
    progressKey: collegiumSwagFalshionProgression
    requiredCount: 1
    requiredJobs:
    - MedievalCollegiumLeader
    requiredFactions:
    - Collegium
    itemPrototypes:
    - MedievalFalshionT3Gold
    - MedievalFalshionT3SteelGold

