# Центральная: быть послушником + за один раунд посетить 7 локаций коллегии
- type: achievement
  id: AchievementCollegiumInitiation
  priority: 11
  rarity: Epic
  name: achievement-collegium-initiation-name
  description: achievement-collegium-initiation-desc
  icon:
    sprite: Imperial/Medieval/Clothing/Head/charmer_weak.rsi
    state: icon
  visibility: Visible
  roundOnly: true
  prerequisites:
  - AchievementCultCollegiumJoin
  conditions:
  - !type:LocationCondition
    progressKey: collegiumInitLibraryProgression
    requiredCount: 1
    requiredJobs:
    - MedievalCollegiumRecruit
    requiredFactions:
    - Collegium
    locationId: achievement-location-collegium-library
  - !type:LocationCondition
    progressKey: collegiumInitLectureProgression
    requiredCount: 1
    requiredJobs:
    - MedievalCollegiumRecruit
    requiredFactions:
    - Collegium
    locationId: achievement-location-collegium-lecture
  - !type:LocationCondition
    progressKey: collegiumInitSpellwardProgression
    requiredCount: 1
    requiredJobs:
    - MedievalCollegiumRecruit
    requiredFactions:
    - Collegium
    locationId: achievement-location-collegium-spellward
  - !type:LocationCondition
    progressKey: collegiumInitPolygonProgression
    requiredCount: 1
    requiredJobs:
    - MedievalCollegiumRecruit
    requiredFactions:
    - Collegium
    locationId: achievement-location-collegium-polygon
  - !type:LocationCondition
    progressKey: collegiumInitHallProgression
    requiredCount: 1
    requiredJobs:
    - MedievalCollegiumRecruit
    requiredFactions:
    - Collegium
    locationId: achievement-location-collegium-hall
  - !type:LocationCondition
    progressKey: collegiumInitAlchemyProgression
    requiredCount: 1
    requiredJobs:
    - MedievalCollegiumRecruit
    requiredFactions:
    - Collegium
    locationId: achievement-location-collegium-alchemy
  - !type:LocationCondition
    progressKey: collegiumInitPrisonProgression
    requiredCount: 1
    requiredJobs:
    - MedievalCollegiumRecruit
    requiredFactions:
    - Collegium
    locationId: achievement-location-collegium-prison
  tab: AchievementTabCollegiumCult

# Ветка: пополнить барьер 1 раз
- type: achievement
  id: AchievementCollegiumRefillBarrier
  priority: 12
  rarity: Common
  name: achievement-collegium-refill-barrier-name
  description: achievement-collegium-refill-barrier-desc
  icon:
    sprite: Imperial/Medieval/Decor/medieval_decor.rsi
    state: scroll1
  visibility: Visible
  prerequisites:
  - AchievementCollegiumInitiation
  conditions:
  - !type:RefillBarrierCondition
    progressKey: collegiumRefillBarrierProgression
    requiredCount: 1
    requiredFactions:
    - Collegium

# Ветка: получить все рунические камни (рунные камни для магического посоха, range.yml)
- type: achievement
  id: AchievementCollegiumAllRuneStones
  priority: 13
  rarity: Rare
  name: achievement-collegium-rune-stones-name
  description: achievement-collegium-rune-stones-desc
  icon:
    sprite: Imperial/Medieval/MagicStone/stone.rsi
    state: vel
  visibility: Visible
  prerequisites:
  - AchievementCollegiumInitiation
  conditions:
  - !type:CollectAllItemsCondition
    progressKey: collegiumRuneStonesProgression
    requiredFactions:
    - Collegium
    itemPrototypes:
      MedievalRuneHealing: 1 # рунный камень исцеления
      MedievalRuneFireBall: 1 # рунный камень огненного шара
      MedievalRuneArrow: 1 # рунный камень магической стрелы
      MedievalRuneLighting: 1 # рунный камень оглушающей молнии
      MedievalRuneFlash: 1 # рунный камень яркой вспышки

# Ветка: получить предметы от кастов (были в руках/инвентаре)
# DivineTouchBeginner/BoostBeginner/HolyTouch — parent BaseItem (держатся в руке, ловятся). IceDagger — тоже Item.
- type: achievement
  id: AchievementCollegiumSpellItems
  priority: 14
  rarity: Rare
  name: achievement-collegium-spell-items-name
  description: achievement-collegium-spell-items-desc
  icon:
    sprite: Imperial/Medieval/Melee/ice_dagger_middle.rsi
    state: icon
  visibility: Visible
  prerequisites:
  - AchievementCollegiumInitiation
  conditions:
  - !type:CollectAllItemsCondition
    progressKey: collegiumSpellItemsProgression
    requiredFactions:
    - Collegium
    itemPrototypes:
      DivineTouchBeginner: 1 # исцеление (лечение)
      BoostBeginner: 1 # усиление
      HolyTouch: 1 # освящение
  - !type:CollectAnyItemsCondition
    progressKey: collegiumIceDaggerProgression
    requiredCount: 1
    requiredFactions:
    - Collegium
    itemPrototypes: # ледяной кинжал (любой тир)
    - IceDaggerBeginner
    - IceDaggerMiddle
    - IceDaggerSenior

# Ветка (СЕКРЕТНАЯ): надеть броню + иметь щит + амулет маны
- type: achievement
  id: AchievementCollegiumFullArmor
  priority: 15
  rarity: Epic
  name: achievement-collegium-full-armor-name
  description: achievement-collegium-full-armor-desc
  icon:
    sprite: Imperial/Medieval/CombatStance/point.rsi
    state: green
  visibility: Hidden
  prerequisites:
  - AchievementCollegiumInitiation
  conditions:
  - !type:CollectAllItemsCondition
    progressKey: collegiumFullArmorProgression
    requiredFactions:
    - Collegium
    itemPrototypes:
      MedievalClothingOuterArmorIronCuirass: 1 # железная кираса
      MedievalIronGloves: 1 # латные рукавицы (пальцевые латные перчатки)
      MedievalClothingFeetSteel: 1 # латные сапоги
      MedaljonMana: 1 # амулет маны (медальон восстановления маны)
  - !type:CollectAnyItemsCondition
    progressKey: collegiumFullArmorShieldProgression
    requiredCount: 1
    requiredFactions:
    - Collegium
    itemPrototypes:
    # любой щит
    - MedievalWoodenShield
    - MedievalWoodenShieldKnight
    - MedievalWoodenShieldBuckler
    - MedievalIronShield
    - MedievalIronShieldBuckler

