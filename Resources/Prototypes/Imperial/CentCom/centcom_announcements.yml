- type: centcomAnnounceMsg
  id: Приветствие
  desc: Зачисление операторов ЦК на смену
  message: "Станция XX-###, говорит Центральное Командование. На данную смену на службе зачислены операторы Центрального Командования. Ожидаем от вас скорое выполнение цели станции и обратную связь. Слава НТ!"

- type: centcomAnnounceMsg
  id: ЗапросЦели
  desc: Запрос о цели станции
  message: "Станция XX-###, говорит Центральное Командование. Отправлен запрос о цели станции. Ответ ожидается в течение 15 минут. Слава НТ!"

- type: centcomAnnounceMsg
  id: ОтчетПолучен
  desc: Отчёт о цели получен
  message: "Станция XX-###, говорит Центральное Командование. Внимание Командованию станции. Отчёт о цели был получен. В течении 10-ти минут ожидайте дальнейших инструкций. Слава НТ!"

- type: centcomAnnounceMsg
  id: ОтчетНеПолучен
  desc: Отчёт о цели не получен — урезание зарплаты главам
  message: "Станция XX-###, говорит Центральное Командование. По истечении 15-ти минут нами так и не был получен отчёт о цели. В связи с этим, главам будет урезана зарплата. Слава НТ!"

- type: centcomAnnounceMsg
  id: ОтчетНеверныйФорма
  desc: Отчёт юридически неверно заполнен
  message: "Станция XX-###, говорит Центральное Командование. Нами был получен юридически неправильно заполненный отчёт. Напоминание: любые отчёты не по форме автоматически утилизируются и не проверяются. Вам предписано отправить запрашиваемый юридически верный отчёт немедленно."

- type: centcomAnnounceMsg
  id: ЦельВыполнена
  desc: Цель завершена, приказ о смене сформирован
  message: "Станция XX-###, говорит Центральное Командование. Внимание командованию станции. Отчёт о завершении цели был получен. Приказ о начале смены текущего экипажа сформирован, оформлен и перенаправлен на факс. Отличная работа, Слава НТ!"

- type: centcomAnnounceMsg
  id: ЦельЕщеДостижима
  desc: Цель всё ещё может быть выполнена
  message: "Станция XX-###, говорит Центральное Командование. Проанализировав ваши отчёты, мы пришли к выводу: цель смены всё ещё может быть выполнена! В кратчайшие сроки ожидаем полного её выполнения, как и отчёта по форме согласованной стандартами NanoTrasen. Слава НТ!"

- type: centcomAnnounceMsg
  id: ЦельПровалена
  desc: Цель смены провалена, эвакуация одобрена
  message: "Станция XX-###, говорит Центральное Командование. Получили ваш отчёт. В связи с ситуацией на станции, цель смены признана проваленной! Вам одобрены протоколы эвакуации, плата за смену отменена. Слава НТ!"

- type: centcomAnnounceMsg
  id: ИнструкцииНаФакс
  desc: Инструкции отправлены на факс
  message: "Станция XX-###, говорит Центральное Командование. Для формирования общей картины о возможности выполнения цели, вам на факс были высланы инструкции. Слава НТ!"

- type: centcomAnnounceMsg
  id: ЗапросВрИО
  desc: Запрос о назначении ВрИО капитана
  message: "Станция XX-###, говорит Центральное Командование. В связи с изначальной неукомплектованностью персонала, вам были отправлены дальнейшие инструкции по назначению ВрИО капитана. Ожидаем ответ в течении 20-ти минут. Слава НТ!"

- type: centcomAnnounceMsg
  id: ВрИОНазначен
  desc: ВрИО капитана назначен
  message: "Станция XX-###, говорит Центральное Командование. Мы получили отчёт о назначении ВрИО капитана. Поздравляем нового ВрИО капитана! Надеемся на ваше плодотворное сотрудничество. Слава НТ!"

- type: centcomAnnounceMsg
  id: ВрИОНеНазначен
  desc: ВрИО капитана не назначен — угроза урезания жалования
  message: "Станция XX-###, говорит Центральное Командование. Мы так и не получили отчёт о назначении ВрИО капитана. Если в течении 10-ти минут ситуация не изменится, жалование всех сотрудников станции будет сокращено на 15%. Немедленно организуйтесь. Слава НТ!"

- type: centcomAnnounceMsg
  id: ОтчетВсеЕщеНеПолучен
  desc: Один из запрошенных отчётов не получен
  message: "Станция XX-###, говорит Центральное Командование. Так и не получили один из запрошенных отчётов. Ожидаем его получение в течении 5-ти минут. Слава НТ!"

- type: centcomAnnounceMsg
  id: НесанкционированныйШаттл
  desc: Зафиксирован вызов шаттла без разрешения
  message: "Станция XX-###, говорит Центральное Командование. Мы фиксируем попытку вызова эвакуационного шаттла без получения соответствующих разрешений или удостоверяющий процесс документов. Командованию станции предписано немедленно доложить ситуацию нам на факс. Слава НТ!"
