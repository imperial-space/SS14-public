    • Причина выдача указаний: неукомплектованность персонала.
    • Командованию станции приказано собрать Совет Глав, после чего выбрать ВрИО капитана станции.
    • Задача ВрИО капитана: найти замену всех недостающих Глав отделов.
    • Задача после выполнения: оформить документ по стандарту корпорации NanoTrasen, "Запрос о назначении ВрИО капитана", отправить на факс Центрального Командования.
