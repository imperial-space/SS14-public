    [italic]ПРИМЕЧАНИЕ: При отсутствии факта получения Центральным Командованием отчёта по форме "Запрос о назначении ВрИО капитана" при выполнении всех остальных поручений, последний обязан быть арестован по статье "Восстание". По прибытии на станцию капитана станции, назначенным NanoTrasen, текущий ВрИО должен полностью снять с себя обязанности и полномочия, вернуть все полученные доступы, и занять пост, который он занимал до вступления в должность ВрИО.[/italic]
