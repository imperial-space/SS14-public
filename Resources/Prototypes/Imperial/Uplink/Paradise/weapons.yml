# Позиции аплинка Paradise (code/datums/uplink_items), которых нет в каталоге TG: оружие.

# ── Snakesfang (melee/snakesfang + belt/sheath/snakesfang) ──

- type: Tag
  id: ImperialSnakesfang

- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialSnakesfang
  name: змеиный клык
  description: Необычно изогнутый чёрно-красный меч. Острый во всех смыслах.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Paradise/snakesfang.rsi
    state: icon
  - type: Item
    size: Large
    sprite: Imperial/Uplink/Paradise/snakesfang.rsi
  - type: Sharp
  - type: Tag
    tags:
    - ImperialSnakesfang
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 25
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 10

- type: entity
  parent: [ ClothingBeltSheath, BaseSyndicateContraband ]
  id: ImperialSnakesfangSheath
  name: ножны змеиного клыка
  description: Вмещают сабли. Точнее, одну — змеиный клык.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Paradise/snakesfang_sheath.rsi
    state: sheath
  - type: Clothing
    sprite: Imperial/Uplink/Paradise/snakesfang_sheath.rsi
  - type: ItemSlots
    slots:
      item:
        name: Snakesfang
        startingItem: ImperialSnakesfang
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - ImperialSnakesfang
  - type: ItemMapper
    mapLayers:
      sheath-sabre:
        whitelist:
          tags:
          - ImperialSnakesfang

# ── Бензопила Синдиката (chainsaw/syndie) ──

- type: entity
  parent: [ Chainsaw, BaseSyndicateContraband ]
  id: ImperialChainsawSyndicate
  name: бензопила Синдиката
  description: Идеально подходит для валки деревьев — или космонавтов.
  components:
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    wideAnimationRotation: -135
    attackRate: 4
    damage:
      types:
        Slash: 3
        Blunt: 1
        Structural: 4
    soundHit:
      path: /Audio/Weapons/chainsaw.ogg
      params:
        volume: -3
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 6
        Structural: 4
  - type: Item
    size: Large
    sprite: Objects/Weapons/Melee/chainsaw.rsi

# ── Mind Batterer (/obj/item/batterer) ──

- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialMindBatterer
  name: подавитель разума
  description: Опасное устройство Синдиката для контроля толпы и побегов. Вызывает замешательство и другие неприятные эффекты у всех вокруг.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Paradise/batterer.rsi
    layers:
    - state: icon
      map: ["batterer"]
  - type: Item
    size: Tiny
    sprite: Imperial/Uplink/Paradise/batterer.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.UplinkBattererVisuals.Burnt:
        batterer:
          True: { state: burnt }
          False: { state: icon }
  - type: UplinkMindBatterer

# ── Граната всплывающей турели (grenade/turret) ──

- type: entity
  parent: ImperialSpawnerGrenadeBase
  id: ImperialPopupTurretGrenade
  name: граната всплывающей турели
  description: Надувается во всплывающую турель, которая стреляет во всех, кроме того, кто выдернул чеку.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Paradise/turret_grenade.rsi
    layers:
    - state: icon
      map: ["enum.TriggerVisualLayers.Base"]
  - type: UplinkPopupTurretGrenade

- type: entity
  parent: [ BaseWeaponBallisticTurret, BaseSyndicateContraband ]
  id: ImperialPopupTurret
  name: всплывающая турель Синдиката
  description: С виду собрана кое-как, но ствол стреляет исправно.
  components:
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Gun
    fireRate: 2
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/gun_sentry.ogg
  - type: BallisticAmmoProvider
    proto: CartridgePistol
    capacity: 200

# ── Гаррота (/obj/item/garrote) ──

- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialGarrote
  name: оптоволоконная проволока
  description: Отрезок тончайшей проволоки с изящными деревянными ручками на концах. Похоже, пользоваться ею нужно, стоя у жертвы за спиной.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Paradise/garrote.rsi
    layers:
    - state: icon
      map: ["garrote"]
  - type: Item
    size: Tiny
  - type: Wieldable
  - type: UplinkGarrote
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.UplinkGarroteVisuals.Strangling:
        garrote:
          True: { state: unwrap }
          False: { state: icon }

# ── Кейс с ложным дном (storage/briefcase/false_bottomed) ──

- type: entity
  parent: [ BriefcaseBrown, BaseSyndicateContraband ]
  id: ImperialFalseBottomBriefcase
  name: кейс
  suffix: Ложное дно
  components:
  - type: Gun
    fireRate: 4
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: BasicEntityAmmoProvider
    proto: BulletPistol
    capacity: 1
    count: 1
  - type: UplinkFalseBottom

# ── Скоростной шприцемёт (gun/syringe/rapidsyringe) ──

- type: entity
  parent: ImperialReagentDartgun
  id: ImperialRapidSyringeGun
  name: скоростной шприцемёт
  description: Скоростной шприцемёт Синдиката на основе архивного прототипа NanoTrasen. Сам наполняет шприцы из внутреннего резервуара на 300 единиц — залейте в него реагенты.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Paradise/rsg.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: Imperial/Uplink/Paradise/rsg.rsi
  - type: SolutionContainerManager
    solutions:
      chemicals:
        maxVol: 300
  - type: SolutionAmmoProvider
    solutionId: chemicals
    proto: ImperialReagentDart
    fireCost: 5
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/syringe_gun.ogg

