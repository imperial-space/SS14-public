# /obj/item/storage/box/syndie_kit/chemical
- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: ImperialUplinkPoisonKit
  name: набор ядов
  description: Набор смертельных химикатов в компактной коробке. В комплекте шприц для точного применения.
  components:
  - type: Storage
    grid:
    - 0,0,7,3
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ImperialUplinkBottlePolonium
        - id: ImperialUplinkBottleVenom
        - id: ImperialUplinkBottleFentanyl
        - id: ImperialUplinkBottleAnacea
        - id: ImperialUplinkBottleSpewium
        - id: ImperialUplinkBottleSyndol
        - id: ImperialUplinkBottleCyanide
        - id: ImperialUplinkBottleHistamine
        - id: ImperialUplinkBottleInitropidril
        - id: ImperialUplinkBottlePancuronium
        - id: ImperialUplinkBottleSodiumThiopental
        - id: ImperialUplinkBottleConiine
        - id: ImperialUplinkBottleCurare
        - id: ImperialUplinkBottleAmanitin
        - id: Syringe
  - type: Sprite
    layers:
    - state: box_of_doom
    - state: beaker

# /obj/item/storage/box/syndie_kit/carnivorous_blood
- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: ImperialUplinkCarnivorousBloodKit
  name: набор плотоядной крови
  description: Бутылка плотоядной крови, шприц и кусок мяса для её подкормки.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ImperialUplinkBottleCarnivorousBlood
        - id: Syringe
        - id: FoodMeatHuman
  - type: Sprite
    layers:
    - state: box_of_doom
    - state: beaker
