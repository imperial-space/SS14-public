# Скрытное оружие и гаджеты аплинка TG.

# ─── Скрытное оружие ───

# /obj/item/gun/syringe/syndicate
- type: entity
  parent: [ LauncherSyringe, BaseSyndicateContraband ]
  id: ImperialDartPistol
  name: дротиковый пистолет
  description: Маленький пружинный пистолет, работающий точно как шприцемёт. Стреляет очень тихо.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/dartpistol.rsi
    layers:
    - state: icon
  - type: Item
    size: Small
    sprite: Imperial/Uplink/Stealth/dartpistol.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,0,0
    whitelist:
      tags:
      - SyringeGunAmmo
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Imperial/Uplink/shot_suppressed.ogg
      params:
        volume: -8
        maxDistance: 3
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: MiniSyringe

# /obj/item/lipstick/syndie
- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialSyndieLipstick
  name: помада Синдиката
  description: Помада фирмы Синдиката со смертельной дозой поцелуев. Соблюдайте технику безопасности! Нанесите на губы и пошлите воздушный поцелуй.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/slipstick.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: UplinkSyndieLipstick

# Воздушный поцелуй (hand_item/kisser/syndie): одноразовый выстрел лазерным поцелуем.
- type: entity
  parent: BaseItem
  id: ImperialSyndieKissBlower
  name: поцелуй Синдиката
  description: Ох, тебе нравится Синдикат.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/kiss.rsi
    state: heart
    color: "#DB0000"
  - type: Item
    size: Tiny
  - type: Unremoveable
    deleteOnDrop: true
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Imperial/Uplink/kiss.ogg
  - type: BasicEntityAmmoProvider
    proto: ImperialBulletSyndieKiss
    capacity: 1
    count: 1
  - type: UplinkSingleShot

# /obj/projectile/kiss/syndie
- type: entity
  parent: BaseBullet
  id: ImperialBulletSyndieKiss
  name: поцелуй Синдиката
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/kiss.rsi
    layers:
    - state: heart
      color: "#DB0000"
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Heat: 25
    soundHit:
      path: /Audio/Imperial/Uplink/kiss.ogg

# /obj/item/suppressor
- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialSuppressor
  name: глушитель
  description: Универсальный глушитель для малокалиберного оружия, предназначенный для максимальной скрытности. Подходит к Макарову, Ансему и C-20r.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/suppressor.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: UplinkSuppressor

# /obj/item/pen/sleepy: 20 хлоралгидрата, 15 немоты, 10 яда усталости.
- type: entity
  parent: [ Hypopen, BaseSyndicateContraband ]
  id: ImperialSleepyPen
  name: ручка
  description: Это обычная чёрная чернильная ручка.
  suffix: Сонная
  components:
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 45
        reagents:
        - ReagentId: ChloralHydrate
          Quantity: 20
        - ReagentId: MuteToxin
          Quantity: 15
        - ReagentId: ImperialStaminaToxin
          Quantity: 10

# /datum/reagent/toxin/staminatoxin
- type: reagent
  id: ImperialStaminaToxin
  name: reagent-name-imperial-stamina-toxin
  group: Toxins
  desc: reagent-desc-imperial-stamina-toxin
  physicalDesc: reagent-physical-desc-nondescript
  flavor: bitter
  color: "#6E2828"
  contrabandSeverity: Syndicate
  metabolisms:
    Bloodstream:
      metabolismRate: 0.0125
      effects:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStaminaLow
        time: 4
        type: Update
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.6
        sprintSpeedModifier: 0.6

# /obj/item/storage/box/syndie_kit/origami_bundle
- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: ImperialUplinkOrigamiKit
  name: набор оригами
  description: Коробка с руководством «Искусство оригами» и бумагой для искусно сконструированных бумажных самолётиков.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ImperialOrigamiBook
        - id: Paper
          amount: 5
  - type: Sprite
    layers:
    - state: box_of_doom

- type: entity
  parent: BaseItem
  id: ImperialOrigamiBook
  name: «Искусство оригами»
  description: Подробнейшее руководство по искусству складывания бумаги.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/origami.rsi
    state: book
  - type: Item
    size: Small
  - type: UplinkOrigamiBook

# /obj/item/paperplane/syndicate
- type: entity
  parent: BaseItem
  id: ImperialPaperPlaneSyndicate
  name: бумажный самолётик
  description: Бумага, мастерски сложенная в форме самолёта.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/origami.rsi
    state: plane
  - type: Item
    size: Tiny
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 20
  - type: UplinkPaperPlane
  - type: ThrowingAngle
    angle: 0

# /obj/item/clothing/accessory/holster/chameleon — в SS14 нет аксессуаров, кобура носится в кармане.
- type: entity
  parent: [ BaseStorageItem, BaseSyndicateContraband ]
  id: ImperialHolsterChameleon
  name: карманный протектор
  description: Может защитить вашу одежду от чернильных пятен. На деле — кобура Cybersun Inc., вмещающая почти любой небольшой пистолет или лазер.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/holster.rsi
    state: chameleon
  - type: Item
    size: Small
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,1,1
    whitelist:
      tags:
      - Sidearm
  - type: Clothing
    quickEquip: false
    slots:
    - pocket

# /obj/item/clothing/accessory/holster/tacticool — две ячейки, носится на поясе.
- type: entity
  parent: [ BaseStorageItem, BaseSyndicateContraband ]
  id: ImperialHolsterTacticool
  name: тактическая кобура
  description: Тёмная тактическая кобура с двумя карманами под оружие и прочую экипировку.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/holster.rsi
    state: tacticool
  - type: Item
    size: Normal
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,1,1
    - 2,0,3,1
  - type: Clothing
    sprite: Clothing/Belt/holster.rsi
    quickEquip: false
    slots:
    - belt

# ─── Скрытные гаджеты ───

# /obj/item/multitool/ai_detect
- type: entity
  parent: [ Multitool, BaseSyndicateContraband ]
  id: ImperialAiDetector
  suffix: Детектор ИИ
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/aidetector.rsi
    layers:
    - state: icon
      map: ["base"]
  - type: UplinkAiDetector
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.UplinkAiDetectorVisuals.State:
        base:
          None: { state: icon }
          Near: { state: yellow }
          OnScreen: { state: red }

# /obj/item/language_manual/codespeak_manual/unlimited
- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialCodespeakManual
  name: роскошный мануал кодовой речи
  description: 'На обложке написано: «Кодовая речь™ — защитите свою переписку метафорами настолько замысловатыми, что они кажутся случайными!». Чтобы говорить кодом, начните фразу с «%».'
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/origami.rsi
    state: codespeak
  - type: Item
    size: Small
  - type: UplinkCodespeakManual

# /obj/item/flashlight/emp
- type: entity
  parent: [ FlashlightLantern, BaseSyndicateContraband ]
  id: ImperialEmpFlashlight
  suffix: ЭМИ
  components:
  - type: UplinkEmpFlashlight

# /obj/item/storage/box/syndie_kit/mulligan
- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: ImperialUplinkMulliganKit
  name: набор Маллигана
  description: Шприц, полностью меняющий внешность, и набор документов для новой личности.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ImperialMulliganSyringe
        - id: ImperialFakeIdentityKit
  - type: Sprite
    layers:
    - state: box_of_doom
    - state: syringe

- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialMulliganSyringe
  name: Маллиган
  description: Шприц для полной смены личности. Используйте на себе или на другом.
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/syringe.rsi
    state: syringe_base0
    color: "#5EFF3B"
  - type: Item
    size: Tiny
  - type: UplinkMulligan

- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialFakeIdentityKit
  name: набор поддельной личности
  description: Все документы, нужные для новой жизни и идеального алиби. После «Маллигана» создаёт ID пассажира на новое имя и объявляет о вашем прибытии.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/origami.rsi
    state: docs
  - type: Item
    size: Tiny
  - type: UplinkFakeIdentityKit

# /obj/item/storage/box/syndie_kit/forensics_spoofer
- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialForensicsSpoofer
  name: подделыватель криминалистики
  description: Сканирует отпечатки и волокна и переносит их на другие предметы. Использование в руке переключает режим.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/spoofer.rsi
    state: icon
  - type: Item
    size: Small
  - type: UplinkForensicsSpoofer

