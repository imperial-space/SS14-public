# /obj/item/book/bible/syndicate
- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialSyndieTome
  name: том Синдиката
  description: Очень зловещий том, напоминающий библию.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/tome.rsi
    state: icon
  - type: Item
    size: Normal
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Imperial/Uplink/sear.ogg
    damage:
      types:
        Heat: 18
  - type: DamageOtherOnHit
    damage:
      types:
        Heat: 18
  - type: ImperialAntimagic
  - type: UplinkSyndieTome
  - type: UseDelay
    delay: 3

# /obj/item/storage/box/syndie_kit/cutouts
- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: ImperialUplinkCutoutsKit
  name: набор адаптивных картонных фигур
  description: Три картонные фигуры с покрытием, не дающим им выцветать, и мелок для смены их облика.
  components:
  - type: Storage
    grid:
    - 0,0,5,3
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ImperialCardboardCutout
          amount: 3
        - id: CrayonRed
  - type: Sprite
    layers:
    - state: box_of_doom

- type: entity
  parent: BaseItem
  id: ImperialCardboardCutout
  name: картонная фигура
  description: Вырезанная из картона фигура в полный рост. Мелком можно перерисовать облик.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/cutout.rsi
    layers:
    - state: icon
      map: ["base"]
  - type: Item
    size: Small
  - type: UplinkCardboardCutout
    states: [ "#FFFFFF", "#C3A87A", "#8E5F3A", "#E0B990", "#5A3A26", "#BDBDBD" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.UplinkCutoutVisuals.State:
        base:
          "#FFFFFF": { color: "#FFFFFF" }
          "#C3A87A": { color: "#C3A87A" }
          "#8E5F3A": { color: "#8E5F3A" }
          "#E0B990": { color: "#E0B990" }
          "#5A3A26": { color: "#5A3A26" }
          "#BDBDBD": { color: "#BDBDBD" }
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# /obj/item/storage/briefcase/launchpad
- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialUplinkLaunchpadBriefcase
  name: кейс
  description: Обычный кейс. Используйте в руке, чтобы развернуть телепад.
  suffix: Телепад
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/launchpad.rsi
    state: briefcase
  - type: Item
    size: Large
  - type: UplinkLaunchpadBriefcase

- type: entity
  parent: BaseStructure
  id: ImperialUplinkLaunchpad
  name: телепад
  description: Площадка, телепортирующая предметы и людей на расстояние до 8 тайлов. Альт-клик — сложить в кейс.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/launchpad.rsi
    drawdepth: FloorObjects
    state: pad
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: UplinkLaunchpad

- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialUplinkLaunchpadRemote
  name: папка
  description: "Самая обычная папка. Используйте в руке — откроется пульт телепада."
  suffix: Пульт телепада
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Stealth/origami.rsi
    state: folder
  - type: Item
    size: Small
  - type: UplinkLaunchpadRemote
  - type: UserInterface
    interfaces:
      enum.UplinkLaunchpadUiKey.Key:
        type: UplinkLaunchpadBoundUserInterface

- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: ImperialUplinkLaunchpadKit
  name: набор кейса-телепада
  description: Кейс с телепадом и пульт, замаскированный под папку.
  components:
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,5,3
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ImperialUplinkLaunchpadBriefcase
        - id: ImperialUplinkLaunchpadRemote
  - type: Sprite
    layers:
    - state: box_of_doom

