  color: "#3C5133"
  contrabandSeverity: Syndicate
  metabolisms:
    Bloodstream:
      metabolismRate: 0.008
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 0.075
      # Быстро выводит лекарства.
      - !type:UplinkAdjustReagentGroup
        group: Medicine
        amount: -2.5

- type: reagent
  id: Spewium
  name: reagent-name-spewium
  group: Toxins
  desc: reagent-desc-spewium
  physicalDesc: reagent-physical-desc-putrid
  flavor: terrible
  color: "#2F6617"
  contrabandSeverity: Syndicate
  metabolisms:
    Bloodstream:
      effects:
      - !type:Vomit
        probability: 0.15
      - !type:UplinkAdjustReagentGroup
        group: Toxins
        amount: -0.25
        exclude: Spewium
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Spewium
          min: 29
        probability: 0.04
        damage:
          types:
            Poison: 10
            Bloodloss: 10

