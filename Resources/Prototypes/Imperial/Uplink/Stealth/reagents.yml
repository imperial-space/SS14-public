# Яды из «Набора ядов» и «Плотоядной крови» TG (modules/reagents/chemistry/reagents/toxin_reagents.dm).
# Скорость метаболизма TG: rate * REAGENTS_METABOLISM (0.2 ед. за 2 с) → rate * 0.1 ед./с.
# Урон TG toxpwr за тик (REM = 0.5) → toxpwr * 0.5 в секунду.

- type: reagent
  id: Polonium
  name: reagent-name-polonium
  group: Toxins
  desc: reagent-desc-polonium
  physicalDesc: reagent-physical-desc-glowing
  flavor: metallic
  color: "#787878"
  contrabandSeverity: Syndicate
  metabolisms:
    Bloodstream:
      metabolismRate: 0.0125
      effects:
      - !type:HealthChange
        damage:
          types:
            Radiation: 2

- type: reagent
  id: Venom
  name: reagent-name-venom
  group: Toxins
  desc: reagent-desc-venom
  physicalDesc: reagent-physical-desc-viscous
  flavor: bitter
  color: "#F0FFF0"
  contrabandSeverity: Syndicate
  metabolisms:
    Bloodstream:
      metabolismRate: 0.025
      effects:
      - !type:HealthChange
        damage:
          types:
            Blunt: 2
            Poison: 1
      # С шансом 8% за тик распадается в гистамин.
      - !type:AdjustReagent
        probability: 0.04
        reagent: Histamine
        amount: 7
      - !type:AdjustReagent
        probability: 0.04
        reagent: Venom
        amount: -1.1

- type: reagent
  id: Fentanyl
  name: reagent-name-fentanyl
  group: Toxins
  desc: reagent-desc-fentanyl
  physicalDesc: reagent-physical-desc-nondescript
  flavor: bitter
  color: "#64916E"
  contrabandSeverity: Syndicate
  metabolisms:
    Bloodstream:
      metabolismRate: 0.05
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 0.5
            Cellular: 1.5
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: 4
        type: Update
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Fentanyl
          max: 28
        effectProto: StatusEffectForcedSleeping
        time: 4
        type: Update

- type: reagent
  id: Anacea
  name: reagent-name-anacea
  group: Toxins
  desc: reagent-desc-anacea
  physicalDesc: reagent-physical-desc-nondescript
