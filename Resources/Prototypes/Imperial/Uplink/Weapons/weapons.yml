# Оружие аплинка TG: пистолет Макарова, пистолет Donksoft, Ансем, револьверы Синдиката, смарт-SMG Abielle, силовой кулак.

- type: entity
  parent: [ BaseWeaponPistol, BaseSyndicateContraband ]
  id: ImperialWeaponPistolMakarov
  name: пистолет Макарова
  description: Маленький, легко скрываемый пистолет под патрон 9 мм. Ствол с резьбой под глушитель.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Weapons/makarov.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - state: suppressor
      map: ["suppressor"]
      visible: false
      offset: 0.3125,-0.03125
  - type: UplinkSuppressible
  - type: GenericVisualizer
    visuals:
      enum.UplinkSuppressorVisuals.Suppressed:
        suppressor:
          True: { visible: true }
          False: { visible: false }
  - type: Gun
    fireRate: 4
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: ImperialMagazine9mm
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - ImperialMagazine9mm
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - ImperialCartridge9mm

- type: entity
  parent: ImperialWeaponPistolMakarov
  id: ImperialWeaponPistolAnsem
  name: пистолет Ансем
  description: Духовный наследник Макарова — или кто-то просто уронил его в ведро с краской. Под патрон 10 мм.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Weapons/ansem.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - state: suppressor
      map: ["suppressor"]
      visible: false
      offset: 0.375,0
  - type: UplinkSuppressible
  - type: GenericVisualizer
    visuals:
      enum.UplinkSuppressorVisuals.Suppressed:
        suppressor:
          True: { visible: true }
          False: { visible: false }
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: ImperialMagazine10mm
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - ImperialMagazine10mm
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - ImperialCartridge10mm

# Игрушечный пистолет с бунтовыми дротиками: стреляет прямо из магазина.
- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialWeaponPistolDonksoft
  name: пистолет Foam Force
  description: Маленький, легко скрываемый игрушечный пистолет. Для детей от 8 лет. Заряжен бунтовыми дротиками.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Weapons/donksoft.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: toy
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Clothing
    sprite: Objects/Weapons/Guns/Pistols/viper.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: Gun
    fireRate: 4
    clumsyProof: true
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/syringe_gun.ogg
  - type: MagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: ImperialMagazineDonksoft
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - ImperialMagazineDonksoft
        whitelistFailPopup: gun-magazine-whitelist-fail
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: AmmoCounter
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  parent: [ BaseWeaponRevolver, BaseSyndicateContraband ]
  id: ImperialWeaponRevolverSyndicate
  name: револьвер .357
  description: Подозрительный револьвер Синдиката. Жестоко простой, 7 камор под .357 Магнум.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Weapons/revolver.rsi
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 2
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
      params:
        volume: 2.25
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - ImperialCartridge357
      - ImperialSpeedLoader357
    proto: ImperialCartridge357
    capacity: 7
    chambers: [ True, True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null, null ]
    soundEject:
      path: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg

- type: entity
  parent: ImperialWeaponRevolverSyndicate
  id: ImperialWeaponRevolverSyndicateNuke
  name: револьвер Синдиката
  description: Модернизированный Waffle Corp револьвер Синдиката. 7 жестоких выстрелов .357 Магнум. Классика оперативников, улучшенная для современной эпохи.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Weapons/revolver_syndie.rsi

- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialWeaponSmartgun
  name: смарт-ПП Abielle
  description: "Старый эксперимент с «умным» оружием: пули доворачивают к цели, в которую целился стрелок. Наведение работает, но почти без ствола разброс безумный."
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Weapons/smartgun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Normal
    shape:
    - 0,0,2,1
  - type: Clothing
    sprite: Objects/Weapons/Guns/SMGs/c20r.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    # spread = 40: каждая пуля уходит на ±0–20°, burst_size = 4, burst_delay = 0.1 с.
    minAngle: 40
    maxAngle: 40
    fireRate: 10
    selectedMode: Burst
    shotsPerBurst: 4
    availableModes:
    - Burst
    # c160smart: speed 0.5 против 1.25 у обычной пули.
    projectileSpeed: 16
    soundGunshot:
      collection: ImperialSmartgunShoot
  - type: UplinkSmartgun
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/smg_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: ImperialMagazineSmart
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
          - ImperialMagazineSmart
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - ImperialCartridgeSmart
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: AmmoCounter
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialPowerFist
  name: силовой кулак
  description: Металлическая перчатка с поршневым тараном на внешнем газе — для лишней «силы» в ударе. Гаечный ключ меняет силу клапана, баллон вставляется и вынимается как в слот.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Weapons/powerfist.rsi
    state: icon
  - type: Item
    size: Normal
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Blunt: 4
    soundHit:
      path: /Audio/Weapons/punch1.ogg
  - type: PowerFist
  - type: ItemSlots
    slots:
      gas_tank:
        name: Баллон
        priority: 1
        whitelist:
          components:
          - GasTank
  - type: ContainerContainer
    containers:
      gas_tank: !type:ContainerSlot

# ─── Кейсы (code/game/objects/items/storage/toolboxes/weapons.dm) ───

# /obj/item/storage/toolbox/guncase — кейс ядерщиков: оружие и три магазина.
- type: entity
  abstract: true
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialUplinkGunCaseBase
  name: оружейный кейс
  description: Оружейный кейс. На крышке выбита кроваво-красная буква «S».
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Weapons/guncase.rsi
    state: icon
  - type: Item
    size: Huge
    sprite: Imperial/Uplink/Weapons/guncase.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,5
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: StaticPrice
    price: 100

# /obj/item/storage/toolbox/guncase/traitor — кейс агента с бомбой уничтожения улик.
- type: entity
  abstract: true
  parent: ImperialUplinkGunCaseBase
  id: ImperialUplinkGunCaseTraitorBase
  description: Оружейный кейс. На крышке выбита кроваво-красная буква «S». Внутри под пластиковым клапаном виден странный переключатель.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Weapons/guncase_traitor.rsi
    layers:
    - state: icon
      map: ["base"]
  - type: Item
    size: Large
    sprite: Imperial/Uplink/Weapons/guncase_traitor.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,5,2
  - type: UplinkEvidenceBomb
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.UplinkEvidenceBombVisuals.Exploding:
        base:
          True: { state: exploding }
          False: { state: icon }

