# /obj/item/gun/ballistic/automatic/smartgun: firing_sound_list.
- type: soundCollection
  id: ImperialSmartgunShoot
  files:
  - /Audio/Imperial/Uplink/Smartgun/smartgun_shoot_1.ogg
  - /Audio/Imperial/Uplink/Smartgun/smartgun_shoot_2.ogg
  - /Audio/Imperial/Uplink/Smartgun/smartgun_shoot_3.ogg

# /obj/effect/temp_visual/smartgun_target: голографическое перекрестие на 0.25 с.
- type: entity
  id: ImperialSmartgunReticle
  name: перекрестие смарт-ПП
  description: Голографическое перекрестие. Наверное, пора бежать.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Weapons/smartgun_reticle.rsi
    state: launchpad_pull
    drawdepth: Effects
    shader: unshaded
  - type: TimedDespawn
    lifetime: 0.25
  - type: Tag
    tags:
    - HideContextMenu
