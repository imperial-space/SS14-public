# Особые боеприпасы ядерщиков TG (ammo_nuclear) поверх калибров сборки:
# C-20r → .35 auto, L6 → .30 rifle, M-90gl → .20 rifle, AMSR → .60 anti-materiel.

# ─── C-20r: бронебойные и экспансивные ───

- type: entity
  parent: BaseBullet
  id: ImperialBulletPistolAP
  name: бронебойная пуля (.35 auto)
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: piercing
  - type: Projectile
    damage:
      types:
        Piercing: 16
  - type: UplinkProjectile
    armorPenetration: 0.5

- type: entity
  parent: BaseBullet
  id: ImperialBulletPistolHP
  name: экспансивная пуля (.35 auto)
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 27
  - type: UplinkProjectile
    weakAgainstArmor: true

- type: entity
  parent: BaseCartridgePistol
  id: ImperialCartridgePistolAP
  name: бронебойный патрон (.35 auto)
  components:
  - type: CartridgeAmmo
    proto: ImperialBulletPistolAP
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#d9d9d9"

- type: entity
  parent: BaseCartridgePistol
  id: ImperialCartridgePistolHP
  name: экспансивный патрон (.35 auto)
  components:
  - type: CartridgeAmmo
    proto: ImperialBulletPistolHP
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#ff9900"

- type: entity
  parent: MagazinePistolSubMachineGun
  id: ImperialMagazineSmgAP
  name: магазин ПП (.35 auto, бронебойные)
  description: Дополнительный магазин для C-20r. Бронебойные патроны слабее против небронированных целей, но пробивают защитное снаряжение.
  components:
  - type: BallisticAmmoProvider
    proto: ImperialCartridgePistolAP

- type: entity
  parent: MagazinePistolSubMachineGun
  id: ImperialMagazineSmgHP
  name: магазин ПП (.35 auto, экспансивные)
  description: Дополнительный магазин для C-20r. Экспансивные патроны наносят больше урона, но бесполезны против брони.
  components:
  - type: BallisticAmmoProvider
    proto: ImperialCartridgePistolHP

