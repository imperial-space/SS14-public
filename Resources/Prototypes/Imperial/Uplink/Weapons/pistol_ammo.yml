# ─── Спидлоадеры .357 ───

- type: entity
  abstract: true
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialBaseSpeedLoader357
  name: спидлоадер (.357)
  description: Семь патронов .357 Магнум для револьвера Синдиката. Когда очень нужно, чтобы много чего умерло.
  components:
  - type: Tag
    tags:
    - ImperialSpeedLoader357
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - ImperialCartridge357
    proto: ImperialCartridge357
    capacity: 7
  - type: Item
    size: Tiny
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: Sprite
    sprite: Imperial/Uplink/Weapons/ammo.rsi
    layers:
    - state: 357-0
      map: [ "enum.GunVisualLayers.Base" ]
    - state: 357-7
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: "357"
    steps: 8
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: ImperialBaseSpeedLoader357
  id: ImperialSpeedLoader357

- type: entity
  parent: ImperialBaseSpeedLoader357
  id: ImperialSpeedLoader357Phasic
  name: спидлоадер (.357, фазовые)
  description: Семь фазовых патронов .357. Пули из «призрачного свинца» проходят почти сквозь любой неорганический материал. Название обманчиво — свинца в них нет вовсе!
  components:
  - type: BallisticAmmoProvider
    proto: ImperialCartridge357Phasic
  - type: Sprite
    color: "#c9b0ff"

- type: entity
  parent: ImperialBaseSpeedLoader357
  id: ImperialSpeedLoader357Heartseeker
  name: спидлоадер (.357, «сердцеискатели»)
  description: Семь патронов .357 «сердцеискатель», которые сами доворачивают к цели. Не промахнитесь с «сердцеискателем»!
  components:
  - type: BallisticAmmoProvider
    proto: ImperialCartridge357Heartseeker
  - type: Sprite
    color: "#ffb0d0"

