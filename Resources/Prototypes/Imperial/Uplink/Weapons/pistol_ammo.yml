# Фазовая: проходит сквозь стены, двери, машины и столы — задевает только живых.
- type: entity
  parent: BaseBullet
  id: ImperialBullet357Phasic
  name: фазовая пуля (.357)
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Weapons/projectiles.rsi
    layers:
    - state: gaussphase
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Piercing: 20
    ignoreResistances: true
  - type: UplinkProjectile
    phasing: true

- type: entity
  parent: BaseBullet
  id: ImperialBullet357Heartseeker
  name: пуля «сердцеискатель» (.357)
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Weapons/projectiles.rsi
    layers:
    - state: gauss
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Piercing: 29
  - type: UplinkHomingProjectile
    turnSpeed: 720

- type: entity
  parent: BaseBullet
  id: ImperialBulletSmart
  name: умная пуля (.160 Smart)
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Weapons/projectiles.rsi
    layers:
    - state: smartgun
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Piercing: 5
  - type: UplinkHomingProjectile
    # homing_turn_speed = 5° на полклетки = 10° на клетку при 16 клетках/с; homing_inaccuracy 4–10 px.
    turnSpeed: 160
    inaccuracyMin: 0.125
    inaccuracyMax: 0.3125

