# (Pointless) Badassery: uplink_items/badass.dm.

# ── Карты Синдиката (toy/cards/deck/syndicate) ──

- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: ImperialSyndicateCardDeck
  name: подозрительная колода карт
  description: Колода игральных карт космического класса. Они кажутся необычно жёсткими.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Badass/cards.rsi
    layers:
    - state: full
      map: ["deck"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.UplinkCardDeckVisuals.State:
        deck:
          full: { state: full }
          half: { state: half }
          low: { state: low }
          empty: { state: empty }
  - type: Item
    size: Small
  - type: UplinkCardDeck
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Slash: 5
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 10

- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: ImperialSyndicateCard
  name: карта
  description: Игральная карта из колоды Синдиката. Край у неё подозрительно острый.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Badass/cards.rsi
    state: card
  - type: Item
    size: Tiny
  - type: UplinkCard
  - type: MeleeWeapon
    damage:
      types:
        Slash: 5
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 10

