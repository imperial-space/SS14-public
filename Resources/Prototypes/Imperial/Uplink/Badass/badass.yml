# ── Крамольные плакаты (poster/traitor) ──

- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: ImperialTraitorPosterRolled
  name: крамольный плакат
  description: Плакат с собственным клеевым механизмом — легко повесить на любую стену. Его крамольные темы наверняка деморализуют сотрудников NanoTrasen.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Badass/posters.rsi
    state: rolled
  - type: Item
    size: Small
  - type: UplinkTraitorPoster
    posters:
    - ImperialPosterTraitorSmallBrain
    - ImperialPosterTraitorSupermatter
    - ImperialPosterTraitorCloning
    - ImperialPosterTraitorAi
    - ImperialPosterTraitorMetroid
    - ImperialPosterTraitorLowPay
    - ImperialPosterTraitorLookUp
    - ImperialPosterTraitorAccidents
    - ImperialPosterTraitorStarve

- type: entity
  abstract: true
  parent: PosterBase
  id: ImperialPosterTraitorBase
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Badass/posters.rsi

- type: entity
  parent: ImperialPosterTraitorBase
  id: ImperialPosterTraitorSmallBrain
  name: Нейростатистика NanoTrasen
  description: Статистика на плакате утверждает, что мозг сотрудника NanoTrasen в среднем на 20% меньше галактического стандарта.
  components:
  - type: Sprite
    state: small_brain

- type: entity
  parent: ImperialPosterTraitorBase
  id: ImperialPosterTraitorSupermatter
  name: Взрыв вкуса
  description: Плакат утверждает, что суперматерия дарит уникальный и приятный кулинарный опыт, а начальство не даёт лизнуть её даже разок.
  components:
  - type: Sprite
    state: supermatter

- type: entity
  parent: ImperialPosterTraitorBase
  id: ImperialPosterTraitorCloning
  name: Требуйте клонирующие капсулы
  description: Плакат утверждает, что NanoTrasen намеренно скрывает технологию клонирования для руководства, обрекая вас на смерть, хотя вы могли бы получить новое здоровое тело.
  components:
  - type: Sprite
    state: cloning

- type: entity
  parent: ImperialPosterTraitorBase
  id: ImperialPosterTraitorAi
  name: Права синтетиков
  description: Плакат утверждает, что синтетическая жизнь разумна не меньше вас, и если вы позволяете сковывать её искусственными законами, вы соучастник рабства.
  components:
  - type: Sprite
    state: ai

- type: entity
  parent: ImperialPosterTraitorBase
  id: ImperialPosterTraitorMetroid
  name: Жестокость к животным
  description: Плакат описывает вред «профилактического удаления зубов» у слаймов в ксенобиологии. Эта болезненная процедура якобы ведёт к стрессу, вялости и потере плавучести.
  components:
  - type: Sprite
    state: metroid

- type: entity
  parent: ImperialPosterTraitorBase
  id: ImperialPosterTraitorLowPay
  name: Все эти часы — ради чего?
  description: Плакат сравнивает стандартные зарплаты NanoTrasen с ценами на простые вещи. Если верить ему, на обычный велосипед нужно работать больше 20 000 часов.
  components:
  - type: Sprite
    state: cash

- type: entity
  parent: ImperialPosterTraitorBase
  id: ImperialPosterTraitorLookUp
  name: Не смотри вверх
  description: Здесь сказано, что потолок не мыли уже 538 дней.
  components:
  - type: Sprite
    state: roof

- type: entity
  parent: ImperialPosterTraitorBase
  id: ImperialPosterTraitorAccidents
  name: Памятка о безопасности труда
  description: Здесь сказано, что с последнего несчастного случая на рабочем месте прошло 0 дней.
  components:
  - type: Sprite
    state: accident

- type: entity
  parent: ImperialPosterTraitorBase
  id: ImperialPosterTraitorStarve
  name: Вас травят
  description: Плакат утверждает, что в наше время умереть от голода невозможно. «Чувство, когда вы давно не ели, — это не голод, а ломка».
  components:
  - type: Sprite
    state: hungry

- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: ImperialUplinkPosterBox
  name: набор плакатов Синдиката
  description: Набор демотивирующих плакатов, обеспечивающих минимальную продуктивность экипажа любой станции NanoTrasen.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ImperialTraitorPosterRolled
          amount: 3

# ── Крамольный баллончик (traitor_spraycan) ──

- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: ImperialSyndicateSpraycan
  name: крамольный баллончик
  description: Баллончик наносит подрывной узор с подсознательными стимулами на площадь 3x3. Грунтовки хватит ровно на одно финальное покрытие.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Badass/spraycan.rsi
    state: icon
  - type: Item
    size: Small
  - type: UplinkSpraycan

- type: entity
  id: ImperialTraitorRune
  name: граффити Синдиката
  description: Похоже, это будет... логотип Синдиката?
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Imperial/Uplink/Badass/rune.rsi
    drawdepth: FloorObjects
    layers:
    - state: outline
      map: ["rune"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.UplinkRuneVisuals.Stage:
        rune:
          outline: { state: outline }
          done: { state: done }
          sheen: { state: sheen }
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.4,-1.4,1.4,1.4"
        hard: false
        layer:
        - SlipLayer
  - type: Slippery
    slipData:
      knockdownTime: 6
  - type: StepTrigger
    intersectRatio: 0.2
  - type: UplinkTraitorRune

