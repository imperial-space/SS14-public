      storagebase: !type:AllSelector
        children:
        - id: Emag
        - id: AccessBreaker
        - id: ImperialSleepyPen
        - id: ImperialUplinkBottleCyanide
        - id: ChameleonProjector
        - id: ImperialWeaponRevolverSyndicate
