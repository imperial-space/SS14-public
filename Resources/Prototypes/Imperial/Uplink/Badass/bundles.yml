# ── Подкрепления (reinforcements) ──

- type: entity
  parent: ReinforcementRadio
  id: ImperialReinforcementRadioSyndicateCyborgMedical
  name: рация вызова киборга-медика Синдиката
  description: Вызовите боевого медицинского киборга. Наступательный потенциал невелик, но поддержка с лихвой это окупает.
  suffix: ЯО
  components:
  - type: GhostRole
    name: ghost-role-information-syndicate-cyborg-medical-name
    description: ghost-role-information-syndicate-cyborg-description
    rules: ghost-role-information-silicon-rules
    mindRoles:
    - MindRoleGhostRoleSilicon
    raffle:
      settings: default
    job: Borg
  - type: GhostRoleMobSpawner
    prototype: PlayerBorgSyndicateMedicalBattery

- type: entity
  parent: ReinforcementRadio
  id: ImperialReinforcementRadioSyndicateCyborgSaboteur
  name: рация вызова саботажного киборга Синдиката
  description: Вызовите обтекаемого инженерного киборга со скрытными модулями. Проектор хамелеона позволяет ему выдать себя за киборга NanoTrasen.
  suffix: ЯО
  components:
  - type: GhostRole
    name: ghost-role-information-syndicate-cyborg-saboteur-name
    description: ghost-role-information-syndicate-cyborg-description
    rules: ghost-role-information-silicon-rules
    mindRoles:
    - MindRoleGhostRoleSilicon
    raffle:
      settings: default
    job: Borg
  - type: GhostRoleMobSpawner
    prototype: PlayerBorgSyndicateSaboteurBattery

- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: ImperialEd209Beacon
  name: маяк ED-209 Синдиката
  description: Одноразовый маяк для быстрой доставки подкреплений на поле боя.
  components:
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: old-radio
  - type: Item
    size: Small
  - type: SpawnItemsOnUse
    items:
    - id: ImperialSyndicateEd209
