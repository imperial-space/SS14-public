        - id: Telecrystal1

- type: entity
  parent: [ClothingBackpackDuffelSyndicate, BaseSyndicateContraband]
  id: ImperialUplinkSabotageBag
  name: вещмешок диверсанта
  description: Три заряда C-4, два X-4 и шесть сигнализаторов.
