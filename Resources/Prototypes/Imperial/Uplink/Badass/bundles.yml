      path: /Audio/Effects/sparks4.ogg

- type: entity
  parent: [ BaseSimpleMob, MobCombat, MobRobotic ]
  id: ImperialSyndicateEd209
  name: ED-209(+1) Синдиката
  description: Погодите, этот красный? Это не к добру... правда?
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/Uplink/Badass/ed209.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: icon
  - type: DamageStateVisuals
    states:
      Alive:
        Base: icon
      Dead:
        Base: off
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      250: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
    showOverlays: false
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
      collection: MetalThud
    damage:
      types:
        Blunt: 15
        Structural: 60
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.5
  - type: BasicEntityAmmoProvider
    proto: BulletLightRifle
    capacity: 1
    count: 1
  - type: Gun
    fireRate: 2
    useKey: false
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/lmg.ogg
  - type: Tag
    tags:
    - DoorBumpOpener
    - Unimplantable
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg

