  components:
  - type: SpawnEntityTableOnTrigger
    keysIn:
    - timer
    table: !type:AllSelector
      children:
      - id: MobCarp
        amount: 5

# ── Ящики излишков (bundles_tc/surplus) ──

- type: entity
  parent: [CrateSyndicate, BaseSyndicateContraband]
  id: ImperialUplinkSurplusCrate
  name: ящик излишков Синдиката
  description: Пыльный ящик из глубин склада Синдиката. Внутри случайные предметы на 40 ТК.
  components:
  - type: UplinkSurplusCrate
    value: 40

- type: entity
  parent: [CrateBaseWeldable, BaseSyndicateContraband]
  id: ImperialUplinkUnitedSurplusCrate
  name: объединённый ящик излишков
  description: Блестящий большой ящик с хитрым замком и защитой от взлома. Открыть его можно только ключом объединённого ящика. Внутри случайные предметы на 100 ТК.
  components:
  - type: Icon
    sprite: Imperial/Uplink/Badass/syndicrate.rsi
    state: closed
  - type: Sprite
    sprite: Imperial/Uplink/Badass/syndicrate.rsi
    offset: 0,0.25
    layers:
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
  - type: EntityStorageVisuals
    stateDoorOpen: open
    stateDoorClosed: closed
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: UplinkSurplusCrate
    value: 100
    united: true

- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: ImperialSyndicrateKey
  name: ключ объединённого ящика
  description: Устройство со змеиной эмблемой, способное разделиться на два ключа. Открывает один объединённый ящик излишков.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Badass/syndicrate.rsi
    state: key
  - type: Item
    size: Tiny
  - type: UplinkSyndicrateKey

# ── Наборы ядерных оперативников ──

- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: ImperialUplinkCyberImplantsBox
  name: коробка кибернетических имплантов
  description: Гладкая прочная коробка.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Badass/boxes.rsi
    layers:
    - state: cyber_implants
  - type: Item
    size: Small
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,5,3
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ImperialAutosurgeonXrayEyes
        - id: ImperialAutosurgeonCnsRebooter
        - id: ImperialAutosurgeonReviver

- type: entity
  parent: [ClothingBackpackDuffelSyndicateMedical, BaseSyndicateContraband]
