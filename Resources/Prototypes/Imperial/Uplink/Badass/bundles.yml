  name: медицинский набор
  description: Большой вещмешок с медицинским снаряжением, игрушечным оружием Donksoft, коробкой усиленных дротиков и магнитными ботинками.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingShoesBootsMagSyndie
        - id: ImperialMedkitTacticalPremium
        - id: ImperialWeaponPistolDonksoft
        - id: ImperialBoxFoamRiot

- type: entity
  parent: [ClothingBackpackDuffelSyndicate, BaseSyndicateContraband]
  id: ImperialUplinkFirestarterBundle
  name: набор поджигателя спецназа
  description: Вещмешок с элитным скафандром, автоматическим пистолетом, двумя зажигательными магазинами, мини-бомбой и стимулятором. И бутылкой водки от товарища Бориса.
  components:
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,9,5
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingOuterHardsuitSyndieElite
        - !type:NestedSelector
          tableId: SyndicateHardsuitExtrasEntityTable
        - id: WeaponPistolViper
        - id: MagazinePistolIncendiary
          amount: 2
        - id: DrinkVodkaBottleFull
        - id: Stimpack
        - id: SyndieMiniBomb

- type: entity
  parent: BaseSubdermalImplant
  id: ImperialInductionImplant
  name: имплант ядерного оперативника
  description: Регистрирует носителя как члена команды ядерных оперативников Синдиката.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
  - type: UplinkInductionImplant

- type: entity
  parent: BaseImplantOnlyImplanterSyndi
  id: ImperialInductionImplanter
  name: имплантер (ядерный оперативник)
  description: Стерильный автоматический имплантер. Сбоку крошечная, но разборчивая наклейка — «НЕ УСТРОЙСТВО ДЛЯ ПРОМЫВКИ МОЗГОВ».
  components:
  - type: Implanter
    implant: ImperialInductionImplant

- type: entity
  parent: ImperialUplinkSyndiKitBase
  id: ImperialUplinkInductionKit
  name: набор вступления в Синдикат
  description: Всё, что нужно, чтобы представить нового товарища Синдикату и всем его льготам.
