# Позиции аплинка TG для профессий (code/modules/uplink/uplink_items/job.dm).

# /obj/item/toy/eightball/haunted
- type: entity
  parent: BaseItem
  id: ImperialHauntedEightball
  name: шар-восьмёрка
  description: Шар судьбы. Задайте вопрос вслух и встряхните — духи ответят.
  suffix: Проклятый
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Roles/items.rsi
    state: eightball
  - type: Item
    size: Small
  - type: UplinkHauntedEightball

# /obj/item/storage/box/syndie_kit/mail_counterfeit
- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: ImperialUplinkMailCounterfeitKit
  name: набор подделки почты GLA
  description: Пять устройств для подделки почты NT.
  components:
  - type: Storage
    grid:
    - 0,0,5,3
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ImperialMailCounterfeitDevice
        amount: 5
  - type: Sprite
    layers:
    - state: box_of_doom

# /obj/item/firing_pin/clown/ultra
- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialClownPin
  name: ультрасмешной боёк
  description: Вставьте в оружие (кликните им по оружию) — стрелять смогут только клоуны и неуклюжие, а каждый выстрел гудит.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Roles/items.rsi
    state: pin
  - type: Item
    size: Tiny
  - type: UplinkClownPin

- type: entity
  parent: ImperialClownPin
  id: ImperialClownPinSelfDestruct
  name: суперультрасмешной боёк
  description: Как ультрасмешной боёк, только оружие взрывается в руках не-клоуна.
  components:
  - type: UplinkClownPin
    selfDestruct: true

# /obj/item/mmi/syndie
- type: entity
  parent: [ MMI, BaseSyndicateContraband ]
  id: ImperialSyndieMMI
  name: ИИМ Синдиката
  description: ИИМ, модифицированный так, чтобы киборг с ним служил Синдикату без повреждения интерфейса криптографическим секвенсором.
  components:
  - type: UplinkSyndieMmi

# /obj/item/storage/box/syndie_kit/ez_clean
- type: entity
  parent: [ CleanerGrenade, BaseSyndicateContraband ]
  id: ImperialEzCleanGrenade
  name: граната EZ Clean
  description: Граната с фирменной формулой Waffle Corp. Отмывает всё вокруг и разъедает кислотой всех, кто рядом.
  components:
  - type: SmokeOnTrigger
    keysIn:
    - timer
    duration: 15
    spreadAmount: 50
    smokePrototype: Foam
    solution:
      reagents:
      - ReagentId: SpaceCleaner
        Quantity: 20
      - ReagentId: FluorosulfuricAcid
        Quantity: 10

- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: ImperialUplinkEzCleanBox
  name: набор гранат EZ Clean
  description: Три гранаты EZ Clean.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: ImperialEzCleanGrenade
        amount: 3
  - type: Sprite
    layers:
    - state: box_of_doom
    - state: flashbang

# /obj/item/reverse_bear_trap
- type: entity
  parent: [ ClothingHeadBase, BaseSyndicateContraband ]
  id: ImperialReverseBearTrap
  name: обратный медвежий капкан
  description: Гениальное устройство для казни, надеваемое (или насильно надеваемое) на голову. Ударьте им человека без головного убора — через 3 секунды капкан защёлкнется, и через минуту челюсти раскроются.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Roles/beartrap.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: Imperial/Uplink/Roles/beartrap.rsi
  - type: Clothing
    sprite: Imperial/Uplink/Roles/beartrap.rsi
    slots:
    - HEAD
    quickEquip: false
  - type: UplinkReverseBearTrap

# /obj/item/gun/syringe/dna
- type: entity
  parent: [ LauncherSyringe, BaseSyndicateContraband ]
  id: ImperialDnaSyringeGun
  name: модифицированный шприцемёт
  description: Шприцемёт, стреляющий ДНК-инжекторами вместо обычных шприцев.
  components:
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,0
    whitelist:
      components:
      - DnaInjector
  - type: UplinkDnaSyringeGun

# /obj/item/gun/magic/hook
- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialMeatHook
  name: мясной крюк
  description: Жестокий тесак на длинной цепи. Притягивает людей к вам.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Roles/hook.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: Imperial/Uplink/Roles/hook.rsi
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 18
  - type: Gun
    fireRate: 0.25
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Imperial/Uplink/batonextend.ogg
  - type: BasicEntityAmmoProvider
    proto: ImperialBulletMeatHook
    capacity: 1
    count: 1
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 4

- type: entity
  parent: BaseBullet
  id: ImperialBulletMeatHook
  name: крюк
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Roles/hook.rsi
    layers:
    - state: projectile
  - type: Projectile
    damage:
      types:
        Piercing: 20
    soundHit:
      path: /Audio/Effects/gib1.ogg
  - type: StaminaDamageOnCollide
    damage: 20
  - type: UplinkProjectile
    armorPenetration: 0.6
  - type: UplinkHookProjectile

# /obj/item/storage/box/syndie_kit/moltobeso
- type: reagent
  id: Moltobeso
  name: reagent-name-moltobeso
  group: Foods
  desc: reagent-desc-moltobeso
  physicalDesc: reagent-physical-desc-saucey
  flavor: savory
  color: "#BB2A2A"
  metabolisms:
    Digestion:
      effects:
      - !type:SatiateHunger
        factor: -2

- type: entity
  parent: BaseChemistryBottleFilled
  id: ImperialMoltobesoBottle
  name: соус Molt'Obeso
  description: Фирменный соус Molt'Obeso. Пробуждает голод, заставляя есть больше, и усиливает усвоение калорий.
  components:
  - type: Label
    currentLabel: reagent-name-moltobeso
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: Moltobeso
          Quantity: 30

# /obj/item/storage/box/syndie_kit/rebarxbowsyndie
- type: Tag
  id: ImperialCartridgeRebar

- type: entity
  parent: BaseBullet
  id: ImperialBulletRebar
  name: арматура
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Roles/rebarxbow.rsi
    layers:
    - state: rebar
  - type: Projectile
    damage:
      types:
        Piercing: 45
  - type: UplinkProjectile
    armorPenetration: 0.2

- type: entity
  parent: [ BaseCartridge, BaseSyndicateContraband ]
  id: ImperialCartridgeRebar
  name: заточенная арматура
  description: Заточенный арматурный стержень для арбалета.
  components:
  - type: Tag
    tags:
    - ImperialCartridgeRebar
  - type: CartridgeAmmo
    proto: ImperialBulletRebar
    deleteOnSpawn: true
  - type: Sprite
    sprite: Imperial/Uplink/Roles/rebarxbow.rsi
    layers:
    - state: rebar
      map: [ "enum.AmmoVisualLayers.Base" ]

- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialRebarCrossbowSyndie
  name: арматурный арбалет Синдиката
  description: Куда более профессиональная версия самодельного инженерного арбалета. Магазин на 3 выстрела, быстрая зарядка и лучшие боеприпасы.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Roles/rebarxbow.rsi
    state: base
  - type: Item
    size: Large
    sprite: Imperial/Uplink/Roles/rebarxbow.rsi
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/energycrossbow_shoot.ogg
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - ImperialCartridgeRebar
    proto: ImperialCartridgeRebar
    capacity: 3
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container

- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: ImperialUplinkRebarCrossbowKit
  name: набор арматурного арбалета Синдиката
  description: Арбалет и запас заточенной арматуры.
  components:
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,5,3
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ImperialRebarCrossbowSyndie
        - id: ImperialCartridgeRebar
          amount: 6
  - type: Sprite
    layers:
    - state: box_of_doom

# /obj/item/reagent_containers/hypospray/medipen/magillitis
- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialMagillitisInjector
  name: автоинъектор сыворотки магиллитиса
  description: Одноразовый автоинъектор с экспериментальной сывороткой, вызывающей стремительный рост мышц у Hominidae.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    state: medipen
    color: "#7FFF00"
  - type: Item
    size: Tiny
  - type: UplinkPolymorphInjector
    polymorph: ImperialMagillitisGorilla

- type: polymorph
  id: ImperialMagillitisGorilla
  configuration:
    entity: MobGorilla
    forced: true
    transferName: true
    transferDamage: false
    inventory: Drop
    revertOnCrit: false
    revertOnDeath: true

# /obj/item/food/monkeycube/gorilla
- type: entity
  parent: MonkeyCube
  id: ImperialGorillaCube
  name: кубик гориллы
  description: Кубик гориллы от Waffle Corp. Ешь много — стань большим. Внимание — может регидратироваться от воды.
  components:
  - type: Rehydratable
    possibleSpawns:
    - MobGorilla

# /obj/item/disk/surgery/brainwashing
- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialBrainwashDevice
  name: программа «промывки мозгов»
  description: Диск с процедурой промывки мозгов. Используйте на спящем или бессознательном человеке, чтобы внушить ему задачу.
  components:
  - type: Sprite
    sprite: Objects/Misc/cd.rsi
    state: icon
    color: "#E04CE0"
  - type: Item
    size: Tiny
  - type: UplinkBrainwashDevice

# /obj/item/disk/surgery/advanced_plastic_surgery
- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: ImperialPlasticSurgeryDevice
  name: программа продвинутой пластической хирургии
  description: Пиратская копия коллекционной программы. Кликните по образцу, чтобы запомнить облик, затем — по спящему человеку, чтобы придать ему этот облик и имя.
  components:
  - type: Sprite
    sprite: Objects/Misc/cd.rsi
    state: icon
    color: "#E0C04C"
  - type: Item
    size: Tiny
  - type: UplinkPlasticSurgery

