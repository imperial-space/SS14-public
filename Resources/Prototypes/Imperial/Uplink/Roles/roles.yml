  - type: Unremoveable
    deleteOnDrop: true

- type: entity
  parent: ImperialAutosurgeonBase
  id: ImperialAutosurgeonLaserArm
  suffix: Лазерная рука
  components:
  - type: Implanter
    implant: ImperialLaserArmImplant

