# /obj/item/sbeacondrop/clownbomb
- type: entity
  parent: SyndicateBomb
  id: ImperialClownBomb
  name: бомба клоуна
  description: Уморительное устройство, способное на масштабные розыгрыши.
  components:
  - type: Sprite
    sprite: Structures/Machines/bomb.rsi
    color: "#FFE0FF"
    layers:
    - state: syndicate-bomb
    - state: syndicate-bomb-active
      visible: false
      map: [ "primed" ]
    - state: syndicate-bomb-wires
      visible: false
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: Explosive
    explosionType: Default
    totalIntensity: 0
    intensitySlope: 1
    maxIntensity: 1
    canCreateVacuum: false
  - type: SpawnEntityTableOnTrigger
    keysIn:
    - timer
    table: !type:AllSelector
      children:
      - id: ClusterBananaPeel
        amount: 4
      - id: FoodPieBananaCream
        amount: 10
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound:
      path: /Audio/Items/bikehorn.ogg

# /obj/vehicle/sealed/car/clowncar
- type: entity
  parent: BaseImperialVehicleRideable
  id: ImperialClownCar
  name: машина клоуна
  description: Совершенный транспорт для любого достойного клоуна! Тараньте всех встречных и запихивайте их внутрь. Альт-клик — выпустить пленников.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Roles/clowncar.rsi
    layers:
    - state: icon
  - type: ImperialVehicle
    autoAnimate: false
    hideRider: true
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5
    acceleration: 2.0
    useHand: false
    hornSound:
      path: /Audio/Items/bikehorn.ogg
  - type: Strap
    buckleOffset: "0,0"
    maxBuckleDistance: 1
    position: Stand
  - type: UplinkClownCar
  - type: ContainerContainer
    containers:
      clowncar_victims: !type:Container
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

