# /obj/item/storage/box/syndie_kit/mimery
- type: entity
  parent: BaseItem
  id: ImperialMimeryBookWall
  name: руководство по продвинутой мимике, том 1
  description: Учит возводить невидимые стены 3×1. Работает только для мимов.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Roles/items.rsi
    state: mimebook
  - type: Item
    size: Small
  - type: UplinkMimeryBook
    action: ActionImperialMimeWall

- type: entity
  parent: BaseItem
  id: ImperialMimeryBookGun
  name: руководство по продвинутой мимике, том 2
  description: Учит стрелять пулями из пальцев. Работает только для мимов.
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Roles/items.rsi
    state: mimebook
  - type: Item
    size: Small
  - type: UplinkMimeryBook
    action: ActionImperialFingerGun

- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: ImperialUplinkMimeryBox
  name: набор «Продвинутая мимика»
  description: Классическая двухтомная серия о том, как отточить мастерство мима.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ImperialMimeryBookWall
        - id: ImperialMimeryBookGun
  - type: Sprite
    layers:
    - state: box_mime

- type: entity
  parent: BaseAction
  id: ActionImperialMimeWall
  name: Невидимая блокада
  description: Возвести невидимую стену 3×1.
  components:
  - type: Action
    useDelay: 30
    icon: { sprite: Imperial/Uplink/Roles/items.rsi, state: mimebook }
  - type: InstantAction
    event: !type:UplinkMimeWallEvent

- type: entity
  parent: BaseAction
  id: ActionImperialFingerGun
  name: Пистолет из пальцев
  description: Достать незримый пистолет на три выстрела.
  components:
  - type: Action
    useDelay: 30
    icon: { sprite: Imperial/Uplink/Roles/items.rsi, state: mimebook }
  - type: InstantAction
    event: !type:UplinkFingerGunEvent

- type: entity
  parent: BaseItem
  id: ImperialMimeFingerGun
  name: пистолет из пальцев
  description: Его не видно, но он стреляет.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Uplink/Roles/items.rsi
    state: mimebook
    visible: false
  - type: Item
    size: Tiny
  - type: Unremoveable
    deleteOnDrop: true
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: null
  - type: BasicEntityAmmoProvider
    proto: BulletPistol
    capacity: 3
    count: 3
  - type: TimedDespawn
    lifetime: 30

# /obj/item/autosurgeon/syndicate/laser_arm
