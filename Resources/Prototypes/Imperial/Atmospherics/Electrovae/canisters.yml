- type: entity
  parent: GasCanisterBrokenBase
  id: ElectrovaeCanisterBroken
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/Imperial/Gases/Electrovae/canister.rsi
    state: electrovae-1

- type: entity
