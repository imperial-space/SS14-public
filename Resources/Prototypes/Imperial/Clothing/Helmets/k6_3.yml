    size: Normal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.75
        Heat: 0.75
        Shock: 0.75
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: HideLayerClothing
    slots:
