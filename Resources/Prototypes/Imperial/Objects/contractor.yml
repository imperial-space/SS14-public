# Контрактник Синдиката 1 в 1 с SS13 (code/modules/antagonists/traitor/contractor).

- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: ContractorUplink
  name: contractor tablet
  description: A syndicate tablet running the Syndicate Contract Uplink program.
  components:
  - type: ContractorUplink
  - type: Sprite
    sprite: Imperial/contractor/uplink/uplink.rsi
    state: icon
  - type: Icon
    sprite: Imperial/contractor/uplink/uplink.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Imperial/contractor/uplink/uplink.rsi
  - type: UserInterface
    interfaces:
      enum.ContractorUplinkUiKey.Key:
        type: ContractorUplinkBoundUserInterface
  - type: ActivatableUI
    key: enum.ContractorUplinkUiKey.Key

# closet/supplypod/extractionpod
- type: entity
  parent: BaseStructureDynamic
  id: ContractorExtractionPod
  name: syndicate extraction pod
  description: A specialised pod for transporting targets to the Syndicate holding facility.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    noRot: true
    sprite: Imperial/contractor/pod.rsi
    drawdepth: Mobs
    layers:
    - state: darkpod
      map: ["enum.StorageVisualLayers.Base"]
    - state: darkpod_door
      map: ["enum.StorageVisualLayers.Door"]
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: darkpod
    stateDoorClosed: darkpod_door
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: EntityStorage
    capacity: 1
    openOnMove: false
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
  - type: PointLight
    radius: 2
    energy: 1.5
    color: "#ff3030"
  - type: ContractorExtractionPod

# Метка посадки капсулы.
- type: entity
  id: ContractorExtractionPodLanding
  name: extraction pod landing zone
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Imperial/contractor/pod.rsi
    state: pod_glow_red
    drawdepth: FloorObjects
    shader: unshaded
  - type: PointLight
    radius: 2.5
    energy: 2
    color: "#ff3030"
  - type: TimedDespawn
    lifetime: 5

- type: entity
  parent: [Stunbaton, BaseSyndicateContraband]
  id: ContractorStunbaton
  name: contractor baton
  description: A compact, specialised baton assigned to Syndicate contractors. Applies light electrical shocks to targets.
  components:
  - type: Sprite
    sprite: Imperial/contractor/baton/stunbaton.rsi
    layers:
    - state: stunbaton_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Item
    sprite: Imperial/contractor/baton/stunbaton.rsi
    heldPrefix: off
    size: Normal
  - type: Clothing
    sprite: Imperial/contractor/baton/stunbaton.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Stunbaton
    energyPerUse: 50
  - type: StaminaDamageOnHit
    damage: 55

- type: entity
  parent: [ClothingOuterHardsuitSyndie, BaseSyndicateContraband]
  id: ClothingOuterHardsuitContractor
  name: contractor space suit
  description: A specialised black and gold space suit that's quicker, and more compact than its standard Syndicate counterpart.
  components:
  - type: Sprite
    sprite: Imperial/contractor/hardsuit/hardsuit.rsi
  - type: Clothing
    sprite: Imperial/contractor/hardsuit/hardsuit.rsi
  - type: Item
    size: Normal
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitContractor

- type: entity
  parent: [ClothingHeadHelmetHardsuitSyndie, BaseSyndicateContraband]
  id: ClothingHeadHelmetHardsuitContractor
  name: contractor helmet
  description: A specialised black and gold helmet that's more compact than its standard Syndicate counterpart.
  components:
  - type: Sprite
    sprite: Imperial/contractor/hardsuit/helmet.rsi
  - type: Clothing
    sprite: Imperial/contractor/hardsuit/helmet.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET

- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: ContractorFlippoLighter
  name: contractor flippo lighter
  description: A rugged lighter stamped for field contractors.
  components:
  - type: Sprite
    sprite: Imperial/contractor/lighter/zippo.rsi
    layers:
    - state: icon
      map: [ "base" ]
    - state: open
      map: [ "open" ]
      visible: false
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/Items/Lighters/zippo_open.ogg
      params:
        volume: -5
    soundDeactivate:
      path: /Audio/Items/Lighters/zippo_close.ogg
      params:
        volume: -5
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        open:
          True: { visible: true }
          False: { visible: false }
        base:
          True: { visible: false }
          False: { visible: true }
  - type: ToggleableVisuals
    spriteLayer: open
  - type: IgnitionSource
    ignited: false
  - type: ItemToggleHot
  - type: ItemToggleSize
    activatedSize: Small
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Heat: 1
  - type: Item
    size: Tiny
    sprite: Imperial/contractor/lighter/zippo.rsi
  - type: PointLight
    enabled: false
    netsync: false
    radius: 1.2
    color: orange
  - type: ItemTogglePointLight
  - type: UseDelay
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
      types:
        Blunt: 1

# pinpointer/crew/contractor: навсегда привязывается к первому взявшему, точность minimum_range = 25.
- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: ContractorPinpointer
  name: contractor pinpointer
  description: A handheld tracking device that points to crew without needing suit sensors at the cost of accuracy.
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    noRot: true
    sprite: Imperial/contractor/pinpointer/pinpointer.rsi
    layers:
    - state: pinpointer-syndicate
      map: [ "enum.PinpointerLayers.Base" ]
    - state: pinonnull
      map: [ "enum.PinpointerLayers.Screen" ]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: Imperial/contractor/pinpointer/pinpointer.rsi
    state: pinpointer-syndicate
  - type: Item
    size: Small
    sprite: Imperial/contractor/pinpointer/pinpointer.rsi
  - type: ContractorPinpointer
  - type: Pinpointer
    updateTargetName: false
    canRetarget: false
    reachedDistance: 1.5
    closeDistance: 10
    mediumDistance: 24
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PinpointerVisuals.IsActive:
        enum.PinpointerLayers.Screen:
          True: { visible: True }
          False: { visible: False }
      enum.PinpointerVisuals.TargetDistance:
        enum.PinpointerLayers.Screen:
          Unknown: { state: pinonnull }
          Reached: { state: pinondirect }
          Close: { state: pinonclose }
          Medium: { state: pinonmedium }
          Far: { state: pinonfar }
  - type: AnimationPlayer

- type: entity
  id: ContractorPinpointerMarker
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
  - type: Physics
    bodyType: Static
    canCollide: false

# paper/contractor_guide
- type: entity
  id: PaperContractorGuide
  parent: Paper
  name: contractor guide
  components:
  - type: Paper
    content: contractor-guide-content

# box/syndicate/contractor_loadout
- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: BoxContractorLoadout
  name: standard loadout
  description: Supplied to Syndicate contractors, providing their specialised space suit and chameleon uniform.
  components:
  - type: Sprite
    layers:
    - state: box_of_doom
  - type: Item
    size: Large
  - type: Storage
    grid:
    - 0,0,9,7
    maxItemSize: Normal
  - type: StorageFill
    contents:
    - id: ClothingOuterHardsuitContractor
    - id: ClothingUniformJumpsuitChameleon
    - id: ClothingMaskGasChameleon
    - id: AgentIDCard
    - id: ClothingEyesGlassesThermal
    # Содержимое ящика Синдиката: сам ящик в SS14 не помещается в коробку.
    - id: Crowbar
    - id: Wrench
    - id: Screwdriver
    - id: Wirecutter
    - id: Welder
    - id: Multitool
    - id: ClothingHandsGlovesCombat
    - id: RadioJammer
    - id: CigPackSyndicate
    - id: ContractorFlippoLighter

# box/syndicate/contract_kit
- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: BoxContractorKit
  name: contract kit
  description: Supplied to Syndicate contractors.
  components:
  - type: Sprite
    layers:
    - state: box_of_doom
  - type: Item
    size: Huge
  - type: Storage
    grid:
    - 0,0,7,5
    maxItemSize: Large
  - type: StorageFill
    contents:
    - id: ContractorUplink
    - id: BoxContractorLoadout
    - id: ContractorStunbaton
    - id: PaperContractorGuide

# box/contractor/fulton_extraction
- type: entity
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: BoxContractorExtraction
  name: fulton extraction kit
  description: A box containing a beacon and a fulton extraction pack.
  components:
  - type: Sprite
    layers:
    - state: box_of_doom
  - type: Storage
    grid:
    - 0,0,5,4
    maxItemSize: Normal
  - type: StorageFill
    contents:
    - id: FultonBeacon
    - id: Fulton

# antag_spawner/loadout/contractor
- type: entity
  parent: ReinforcementRadio
  id: ContractorReinforcementRadio
  name: contractor support beacon
  description: A beacon that calls in a Syndicate support agent to assist a contractor.
  components:
  - type: GhostRole
    name: ghost-role-information-contractor-partner-name
    description: ghost-role-information-contractor-partner-description
    rules: ghost-role-information-syndicate-reinforcement-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: MobHumanContractorPartner

- type: entity
  parent: MobHumanSyndicateAgent
  id: MobHumanContractorPartner
  name: syndicate support unit
  components:
  - type: Loadout
    prototypes: [ ContractorPartnerGear ]
    roleLoadout: [ RoleSurvivalSyndicate ]

# outfit/contractor_partner
- type: startingGear
  id: ContractorPartnerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitChameleon
    outerClothing: ClothingOuterChameleon
    back: ClothingBackpackChameleon
    id: ChameleonPDA
    shoes: ClothingShoesChameleonNoSlips
    ears: ClothingHeadsetChameleon
    mask: ClothingMaskGasChameleon
    pocket1: CigPackSyndicate
    pocket2: ContractorFlippoLighter
  inhand:
  - ToolboxSyndicateFilled
  storage:
    back:
    - UplinkImplanter
