# X-4 из TG (code/game/objects/items/grenades/plastic.dm, /obj/item/grenade/c4/x4):
# направленный пробивной заряд — безопасен для поставившего, но не для того, кто по ту сторону стены.
- type: entity
  name: заряд X-4
  description: Кумулятивный фугасный пробивной заряд. Безопасен для пользователя и совсем не безопасен для стены.
  parent: [BasePlasticExplosive, BaseSyndicateContraband]
  id: X4
  components:
  - type: Sprite
    sprite: Imperial/Objects/Weapons/Bombs/X4Bomb.rsi
    state: icon
    layers:
    - state: icon
      map: ["base"]
  - type: Item
    sprite: Imperial/Objects/Weapons/Bombs/X4Bomb.rsi
  - type: TriggerOnActivate
  - type: TriggerOnSignal
  - type: TriggerOnStuck
    keyOut: stuck
  - type: ToggleTriggerCondition
    keys:
    - stuck
    toggleVerb: toggle-trigger-condition-stick-verb
    toggleOn: toggle-trigger-condition-stick-on
    toggleOff: toggle-trigger-condition-stick-off
  - type: TimerTrigger
    keysIn:
    - trigger
    - stuck
    delay: 10
    delayOptions: [10, 30, 60, 120, 300]
    initialBeepDelay: 0
    beepSound: /Audio/Machines/Nuke/general_beep.ogg
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: Explosive
    explosionType: DemolitionCharge
    totalIntensity: 600
    intensitySlope: 10
    maxIntensity: 100
    canCreateVacuum: false
  - type: UplinkDirectionalCharge
  - type: StaticPrice
    price: 1000
