- type: entity
  parent: BaseActionImperialChangeling
  id: ActionImperialChangelingFakeDeath
  components:
  - type: Action
    checkCanInteract: false
    checkConsciousness: false
    icon:
      sprite: Imperial/Changeling/actions.rsi
      state: fake_death
  - type: InstantAction
    event: !type:ImperialChangelingPowerActionEvent
      power: ImperialChangelingFakeDeath

# /datum/action/antag_info: «Открыть информацию о генокраде».
- type: entity
  parent: BaseAction
  id: ActionImperialChangelingInfo
  components:
  - type: Action
    checkCanInteract: false
    checkConsciousness: false
    icon:
      sprite: Imperial/Changeling/actions.rsi
      state: round_end
    background:
      sprite: Imperial/Changeling/actions.rsi
      state: bg_default_full
  - type: InstantAction
    event: !type:ImperialChangelingInfoActionEvent {}
