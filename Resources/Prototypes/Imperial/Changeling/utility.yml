# /datum/reagent/medicine/changelingadrenaline
- type: reagent
  id: ImperialChangelingAdrenaline
  name: reagent-name-imperial-changeling-adrenaline
  group: Medicine
  desc: reagent-desc-imperial-changeling-adrenaline
  physicalDesc: reagent-physical-desc-energizing
  flavor: sharp
  color: "#C1151D"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2
      effects:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 3
        type: Remove
      - !type:ModifyKnockdown
        time: 3
        type: Remove
      - !type:ModifyStatusEffect
        effectProto: StatusEffectForcedSleeping
        time: 3
        type: Remove
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStimulantsStamina
        time: 3
      - !type:GenericStatusEffect
        key: Adrenaline
        component: IgnoreSlowOnDamage
        time: 3
      - !type:Jitter
      # overdose_threshold = 30
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: ImperialChangelingAdrenaline
          min: 30
        damage:
          types:
            Poison: 0.5

# /obj/effect/mob_spawn/ghost_role/spider/bloody: кладка, из которой вылупится паук.
- type: entity
  id: ImperialChangelingSpiderEggs
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Imperial/Changeling/spider_eggs.rsi
    state: eggs
    drawdepth: FloorObjects
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        hard: false
        mask:
        - ItemMask
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: GhostRole
    name: imperial-changeling-spider-role-name
    description: imperial-changeling-spider-role-desc
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: short
  - type: GhostRoleMobSpawner
    prototype: MobGiantSpider

# /mob/living/basic/headslug
- type: entity
  parent: [SimpleMobBase, BaseMobAnimal]
  id: ImperialChangelingHeadslug
  components:
  - type: Sprite
    drawdepth: SmallMobs
    sprite: Imperial/Changeling/headslug.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: headslug
  - type: DamageStateVisuals
    states:
      Alive:
        Base: headslug
      Dead:
        Base: headslug_dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 50
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 4
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 5
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: CombatMode
  - type: VentCrawler
  - type: ImperialChangelingHeadslug

