# Мутации генокрада: /datum/action/changeling/weapon/* и /suit/* (mutations.dm).

- type: imperialChangelingPower
  id: ImperialChangelingArmBladePower
  name: imperial-changeling-armblade-name
  description: imperial-changeling-armblade-desc
  helpText: imperial-changeling-armblade-help
  icon: arm_blade
  category: Combat
  chemicalCost: 20
  dnaCost: 2
  reqHuman: true
  action: ActionImperialChangelingArmBlade

- type: entity
  parent: BaseActionImperialChangeling
  id: ActionImperialChangelingArmBlade
  components:
  - type: Action
    icon:
      sprite: Imperial/Changeling/actions.rsi
      state: arm_blade
  - type: InstantAction
    event: !type:ImperialChangelingPowerActionEvent
      power: ImperialChangelingArmBladePower

