        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - Impassable
        - LowImpassable
        layer:
        - SmallMobLayer

- type: entity
  id: BlobTile
  parent: BaseBlobStructure
  name: клетка Блоба
  description: Пульсирующая клетка расползающейся биомассы.
  components:
  - type: Sprite
    layers:
    - map: [ "enum.BlobVisualLayers.Base" ]
      state: blob
  - type: Icon
    sprite: Imperial/blob/blob.rsi
    state: blob
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: BlobTileShield
  parent: BaseBlobStructure
  name: прочная клетка Блоба
  description: Более плотная и устойчивая масса биомассы.
  components:
