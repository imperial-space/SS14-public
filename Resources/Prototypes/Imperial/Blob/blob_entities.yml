- type: entity
  id: ClothingHeadHelmetBlob
  parent: ClothingHeadHelmetBase
  name: панцирь Блоба
  description: Затвердевшая масса биомассы, принявшая форму защиты для головы.
  components:
  - type: Unremoveable
  - type: Sprite
    sprite: Imperial/blob/helmet.rsi
    state: blobhat
  - type: Clothing
    sprite: Imperial/blob/helmet.rsi
    equippedState: blobhat
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.85
        Heat: 0.9

- type: entity
  id: MobBlobSpore
  parent: SimpleMobBase
  name: спора Блоба
  description: Плавающая спора Блоба.
  components:
  - type: CombatMode
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 7
  - type: BlobMob
  - type: BlobSpore
  - type: PressureImmunity
  - type: IntrinsicRadioTransmitter
    channels:
    - Common
    - Blob
    - BlobHive
  - type: ActiveRadio
    channels:
    - Common
    - Blob
    - BlobHive
  - type: IntrinsicRadioReceiver
  - type: Sprite
    sprite: Imperial/blob/blob.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: blobpod
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.1
        density: 30
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: blobpod
      Dead:
        Base: blob_spore_temp
  - type: NpcFactionMember
    factions:
    - Blob
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Imperial/blob/sound_effects_attackblob.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Blunt: 4
        Poison: 2
  - type: MobThresholds
    thresholds:
      0: Alive
      25: Dead
  - type: Stamina
    critThreshold: 25
    animationThreshold: 5
  - type: HTN
    rootTask:
      task: BlobSporeCompound

- type: entity
  id: MobBlobbernaut
  parent: [ SimpleMobBase, MobCombat ]
  name: блоббернаут
  description: Огромная и подвижная масса боевой биомассы.
  components:
  - type: BlobMob
  - type: Blobbernaut
  - type: PressureImmunity
  - type: IntrinsicRadioTransmitter
    channels:
    - Common
    - Blob
    - BlobHive
  - type: ActiveRadio
    channels:
    - Common
    - Blob
    - BlobHive
  - type: IntrinsicRadioReceiver
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/blob/blob.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: blobbernaut
      color: "#6bcf6b"
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 120
        mask:
        - Impassable
        - HighImpassable
        - MidImpassable
        - LowImpassable
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 4.5
  - type: DamageStateVisuals
    states:
      Alive:
        Base: blobbernaut
      Critical:
        Base: blobbernaut_dead
      Dead:
        Base: blobbernaut_dead
  - type: Damageable
    damageContainer: Biological
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Critical
      250: Dead
  - type: Stamina
    critThreshold: 150
  - type: Bloodstream
    bloodReagents:
      reagents:
      - ReagentId: Slime
        Quantity: 30
    bloodMaxVolume: 30
  - type: NpcFactionMember
    factions:
    - Blob
  - type: GhostRole
    name: blob-ghost-role-blobbernaut-name
    description: blob-ghost-role-blobbernaut-desc
    rules: ghost-role-component-default-rules
    reregister: false
  - type: GhostTakeoverAvailable
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Imperial/blob/sound_effects_blobattack.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      groups:
        Brute: 18
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: htnCompound
  id: BlobSporeCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: OrderedTargets
        - !type:HTNCompoundTask
          task: MeleeAttackOrderedTargetCompound
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound