# Блоб 1:1 с SS13 (code/modules/antagonists/blob). Значения — из blob_defines.dm.

# obj/structure/blob
- type: entity
  id: BaseBlobStructure
  parent: BaseStructure
  abstract: true
  name: blob
  description: A thick wall of writhing tendrils.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Imperial/blob/blob.rsi
    drawdepth: BelowMobs
    noRot: false
    layers:
    - state: blob
      map: [ "enum.BlobVisualLayers.Base" ]
  - type: Appearance
  - type: BlobVisuals
    mode: Structure
  - type: BlobStructure
  - type: Damageable
  - type: Reactive
    groups:
      Extinguish: [ Touch ]
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 60
        hard: true
        layer:
        - BlobImpassable
        - BulletImpassable

# blob/normal
- type: entity
  id: BlobNormal
  parent: BaseBlobStructure
  name: normal blob
  components:
  - type: BlobStructure
    structureType: Normal
    maxIntegrity: 25
    initialIntegrity: 21
    healthRegen: 1
    bruteResist: 0.25
    baseState: blob

# blob/shield
- type: entity
  id: BlobStrong
  parent: BaseBlobStructure
  name: strong blob
  description: A solid wall of slightly twitching tendrils.
  components:
  - type: Sprite
    layers:
    - state: blob_shield
      map: [ "enum.BlobVisualLayers.Base" ]
  - type: BlobStructure
    structureType: Strong
    maxIntegrity: 150
    healthRegen: 2
    bruteResist: 0.25
    pointReturn: 4
    atmosBlock: true
    baseState: blob_shield
    armor:
      Fire: 90
      Acid: 90
      Laser: 25
  - type: Airtight
    noAirWhenFullyAirBlocked: false
  - type: PointLight
    radius: 2
    energy: 0.6
    color: "#ffffff"

# blob/shield/reflective
- type: entity
  id: BlobReflective
  parent: BlobStrong
  name: reflective blob
  description: A solid wall of slightly twitching tendrils with a reflective glow.
  components:
  - type: Sprite
    layers:
    - state: blob_glow
      map: [ "enum.BlobVisualLayers.Base" ]
  - type: BlobStructure
    structureType: Reflective
    maxIntegrity: 150
    healthRegen: 2
    bruteResist: 0.25
    pointReturn: 8
    atmosBlock: true
    baseState: blob_glow
    armor:
      Fire: 90
      Acid: 90
      Laser: 25
  # RICOCHET_SHINY: лазеры рикошетят с шансом 80%.
  - type: Reflect
    reflects:
    - Energy
    reflectProb: 0.8
    spread: 90

# blob/special/core
- type: entity
  id: BlobCore
  parent: BaseBlobStructure
  name: blob core
  description: A huge, pulsating yellow mass.
  components:
  - type: Sprite
    layers:
    - state: blank_blob
      map: [ "enum.BlobVisualLayers.Base" ]
    - state: blob
      map: [ "enum.BlobVisualLayers.Blob" ]
    - state: blob_core_overlay
      map: [ "enum.BlobVisualLayers.Overlay" ]
  - type: BlobStructure
    structureType: Core
    maxIntegrity: 400
    healthRegen: 0
    bruteResist: 0.5
    pointReturn: -1
    ignoreSyncMesh: true
    claimRange: 12
    pulseRange: 4
    expandRange: 3
    strongReinforceRange: 1
    baseState: blank_blob
    armor:
      Fire: 75
      Acid: 90
  - type: ContainerContainer
    containers:
      blob_debris: !type:Container
  - type: PointLight
    radius: 2
    energy: 0.6
    color: "#ffffff"

# blob/special/node
- type: entity
  id: BlobNode
  parent: BaseBlobStructure
  name: blob node
  description: A large, pulsating yellow mass.
  components:
  - type: Sprite
    layers:
    - state: blank_blob
      map: [ "enum.BlobVisualLayers.Base" ]
    - state: blob
      map: [ "enum.BlobVisualLayers.Blob" ]
    - state: blob_node_overlay
      map: [ "enum.BlobVisualLayers.Overlay" ]
  - type: BlobStructure
    structureType: Node
    maxIntegrity: 200
    healthRegen: 3
    bruteResist: 0.5
    pointReturn: 25
    ignoreSyncMesh: true
    claimRange: 10
    pulseRange: 3
    expandRange: 2
    baseState: blank_blob
    armor:
      Fire: 65
      Acid: 90
      Laser: 25
  - type: PointLight
    radius: 2
    energy: 0.6
    color: "#ffffff"

# blob/special/factory
- type: entity
  id: BlobFactory
  parent: BaseBlobStructure
  name: factory blob
  description: A thick spire of tendrils.
  components:
  - type: Sprite
    layers:
    - state: blob_factory
      map: [ "enum.BlobVisualLayers.Base" ]
  - type: BlobStructure
    structureType: Factory
    maxIntegrity: 200
    healthRegen: 1
    bruteResist: 0.5
    pointReturn: 25
    maxSpores: 3
    baseState: blob_factory
    armor:
      Fire: 80
      Acid: 70
      Laser: 25
  - type: PointLight
    radius: 2
    energy: 0.6
    color: "#ffffff"

# blob/special/resource
- type: entity
  id: BlobResource
  parent: BaseBlobStructure
  name: resource blob
  description: A thin spire of slightly swaying tendrils.
  components:
  - type: Sprite
    layers:
    - state: blob_resource
      map: [ "enum.BlobVisualLayers.Base" ]
  - type: BlobStructure
    structureType: Resource
    maxIntegrity: 60
    healthRegen: 1
    bruteResist: 0.5
    pointReturn: 15
    baseState: blob_resource
    armor:
      Fire: 80
      Acid: 70
      Laser: 25
  - type: PointLight
    radius: 2
    energy: 0.6
    color: "#ffffff"

# Эффекты

- type: entity
  id: BaseBlobEffect
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/blob/blob.rsi
    drawdepth: Effects
    noRot: false
  - type: Appearance
  - type: BlobVisuals
    mode: Tint
  - type: TimedDespawn
    lifetime: 0.6

# temp_visual/blob
- type: entity
  id: BlobAttackEffect
  parent: BaseBlobEffect
  components:
  - type: BlobAttackEffect
  - type: Sprite
    state: blob_attack
  - type: TimedDespawn
    lifetime: 0.6

# flick("blob_resource_glow")
- type: entity
  id: BlobResourceGlowEffect
  parent: BaseBlobEffect
  components:
  - type: Sprite
    drawdepth: BelowMobs
    state: blob_resource_glow
  - type: TimedDespawn
    lifetime: 3.6

# temp_visual/heal
- type: entity
  id: BlobHealEffect
  parent: BaseBlobEffect
  components:
  - type: Sprite
    state: heal
  - type: TimedDespawn
    lifetime: 1.5

# temp_visual/emp: empdisable, случайное направление, 1 с.
- type: entity
  id: BlobEmpEffect
  parent: BaseBlobEffect
  components:
  - type: Sprite
    state: empdisable
  - type: TimedDespawn
    lifetime: 1

# temp_visual/explosion/fast (alpha 150).
- type: entity
  id: BlobExplosionFastEffect
  parent: BaseBlobEffect
  components:
  - type: Sprite
    sprite: Imperial/blob/effects96.rsi
    state: explosionfast
    color: "#ffffff96"
  - type: BlobVisuals
    mode: Structure
  - type: TimedDespawn
    lifetime: 0.4

# Мигание вен умирающего блоббернаута (flick_overlay_view, сдвиг оттенка на 180°).
- type: entity
  id: BlobbernautVeinsFlashEffect
  parent: BaseBlobEffect
  components:
  - type: Sprite
    drawdepth: Mobs
    state: blobbernaut_veins
  - type: TimedDespawn
    lifetime: 2

- type: entity
  id: BlobbernautProduceEffect
  parent: BaseBlobEffect
  components:
  - type: Sprite
    drawdepth: Mobs
    state: blobbernaut_produce
  - type: TimedDespawn
    lifetime: 1

- type: entity
  id: BlobbernautDeathEffect
  parent: BaseBlobEffect
  components:
  - type: Sprite
    drawdepth: Mobs
    state: blobbernaut_death
  - type: TimedDespawn
    lifetime: 1.2

# Оверманд (mob/eye/blob)

- type: entity
  id: MobBlobOvermind
  parent:
  - Incorporeal
  - BaseMob
  name: Blob Overmind
  description: The overmind. It controls the blob.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Ghosts
    sprite: Imperial/blob/blob.rsi
    layers:
    - state: marker
      shader: unshaded
  - type: Appearance
  - type: BlobVisuals
    mode: Tint
  - type: Input
    context: "ghost"
  - type: ContentEye
    maxZoom: 1.44,1.44
  - type: Eye
    drawFov: false
  - type: Examiner
    skipChecks: true
  - type: BlobOvermind
  - type: ShowAntagIcons
  - type: Speech
    speechVerb: Default
  - type: NpcFactionMember
    factions:
    - Blob
  - type: PointLight
    netsync: false
    radius: 5
    energy: 1
    color: "#00231d"
    castShadows: false
  - type: UserInterface
    interfaces:
      enum.BlobOvermindUiKey.Reroll:
        type: BlobOvermindBoundUserInterface
      enum.BlobOvermindUiKey.Nodes:
        type: BlobOvermindBoundUserInterface

# Кнопки HUD (screen_objects/blob.dm)

- type: entity
  parent: BaseMentalAction
  id: ActionBlobJumpToCore
  name: Jump to Core
  description: Moves your camera to your blob core. Before placement — attempt to place your blob core at this location.
  components:
  - type: Action
    icon:
      sprite: Imperial/blob/blob.rsi
      state: ui_tocore
  - type: InstantAction
    event: !type:BlobJumpToCoreActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionBlobJumpToNode
  name: Jump to Node
  description: Moves your camera to a selected blob node.
  components:
  - type: Action
    icon:
      sprite: Imperial/blob/blob.rsi
      state: ui_tonode
  - type: InstantAction
    event: !type:BlobJumpToNodeActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionBlobCreateResource
  name: Produce Resource Blob (40)
  description: Produces a resource blob for 40 resources. Resource blobs will give you resources every few seconds.
  components:
  - type: Action
    icon:
      sprite: Imperial/blob/blob.rsi
      state: ui_resource
  - type: InstantAction
    event: !type:BlobCreateResourceActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionBlobCreateNode
  name: Produce Node Blob (50)
  description: Produces a node blob for 50 resources. Node blobs will expand and activate nearby resource and factory blobs.
  components:
  - type: Action
    icon:
      sprite: Imperial/blob/blob.rsi
      state: ui_node
  - type: InstantAction
    event: !type:BlobCreateNodeActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionBlobCreateFactory
  name: Produce Factory Blob (60)
  description: Produces a factory blob for 60 resources. Factory blobs will produce spores every few seconds.
  components:
  - type: Action
    icon:
      sprite: Imperial/blob/blob.rsi
      state: ui_factory
  - type: InstantAction
    event: !type:BlobCreateFactoryActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionBlobCreateBlobbernaut
  name: Produce Blobbernaut (40)
  description: Produces a strong, smart blobbernaut from a factory blob for 40 resources. The factory blob used will become fragile and unable to produce spores.
  components:
  - type: Action
    icon:
      sprite: Imperial/blob/blob.rsi
      state: ui_blobbernaut
  - type: InstantAction
    event: !type:BlobCreateBlobbernautActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionBlobReadaptStrain
  name: Readapt Strain
  description: Allows you to choose a new strain from 6 random choices for 40 resources. The first reroll and one every 4 minutes are free.
  components:
  - type: Action
    icon:
      sprite: Imperial/blob/blob.rsi
      state: ui_chemswap
  - type: InstantAction
    event: !type:BlobReadaptStrainActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionBlobRelocateCore
  name: Relocate Core (80)
  description: Swaps a node and your core for 80 resources.
  components:
  - type: Action
    icon:
      sprite: Imperial/blob/blob.rsi
      state: ui_swap
  - type: InstantAction
    event: !type:BlobRelocateCoreActionEvent

# datum/action/innate/blobpop
- type: entity
  parent: BaseMentalAction
  id: ActionBlobPop
  name: Pop
  description: Unleash the blob!
  components:
  - type: Action
    icon:
      sprite: Imperial/blob/blob.rsi
      state: blob
  - type: InstantAction
    event: !type:BlobPopActionEvent

# Миньоны (basic/blob_minions)

- type: entity
  id: MobBlobBase
  parent:
  - BaseSimpleMob
  - MobCombat
  abstract: true
  components:
  - type: Sprite
    sprite: Imperial/blob/blob.rsi
    drawdepth: Mobs
  - type: Appearance
  - type: BlobVisuals
    mode: Tint
  - type: BlobMob
  - type: NpcFactionMember
    factions:
    - Blob
  - type: CombatMode
    isInCombatMode: true
  - type: PressureImmunity
  - type: Speech
    speechVerb: Default
  - type: HTN
    rootTask:
      task: ImperialBlobMobCompound
    blackboard:
      NavSmash: !type:Bool
        true
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcPunch
    soundHit:
      path: /Audio/Imperial/blob/genhit1.ogg
    damage:
      types:
        Blunt: 4

# spore/minion
- type: entity
  id: MobBlobSpore
  parent: MobBlobBase
  name: blob spore
  description: A floating, fragile spore.
  components:
  - type: Sprite
    layers:
    - state: blobpod
  - type: BlobMob
    mobType: Spore
    deathCloudSize: 1
  - type: BlobSporeLatch
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 3.5
  - type: MovementIgnoreGravity
  - type: CanMoveInAir
  - type: FloatingVisuals
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 20
        mask:
        - Impassable
        - HighImpassable
        layer:
        - FlyingMobLayer
  - type: MeleeWeapon
    attackRate: 0.5
    soundHit:
      path: /Audio/Imperial/blob/genhit1.ogg

# spore/minion/weak
- type: entity
  id: MobBlobSporeWeak
  parent: MobBlobSpore
  name: fragile blob spore
  components:
  - type: BlobMob
    mobType: WeakSpore
    deathCloudSize: 0
  - type: MobThresholds
    thresholds:
      0: Alive
      15: Dead

# spore/independent
- type: entity
  id: MobBlobSporeIndependent
  parent: MobBlobSpore
  components:
  - type: Sprite
    layers:
    - state: blobpod_independent
  - type: BlobMob
    mobType: IndependentSpore
    deathCloudSize: 1
    factoryBound: false
  - type: GhostRole
    name: blob-ghost-role-independent-name
    description: blob-ghost-role-independent-desc
    rules: ghost-role-information-antagonist-rules
  - type: GhostTakeoverAvailable

# blobbernaut/minion
- type: entity
  id: MobBlobbernaut
  parent: MobBlobBase
  name: blobbernaut
  description: A hulking, mobile chunk of blobmass.
  components:
  - type: Sprite
    noRot: false
    layers:
    - state: blobbernaut
      map: [ "enum.BlobVisualLayers.Base", "enum.DamageStateVisualLayers.Base" ]
    - state: blobbernaut_veins
      map: [ "enum.BlobVisualLayers.Veins" ]
    - state: blobbernaut_eyes
      map: [ "enum.BlobVisualLayers.Eyes" ]
      shader: unshaded
  - type: BlobVisuals
    mode: Blobbernaut
  - type: BlobMob
    mobType: Blobbernaut
    deathCloudSize: -1
  - type: DamageStateVisuals
    states:
      Alive:
        Base: blobbernaut
      Dead:
        Base: blobbernaut_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: Damageable
    damageModifierSet: ImperialBlobbernaut
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 200
        mask:
        - Impassable
        - HighImpassable
        - MidImpassable
        - LowImpassable
        layer:
        - MobLayer
  - type: MeleeWeapon
    attackRate: 1.25
    soundHit:
      path: /Audio/Imperial/blob/blobattack.ogg

- type: damageModifierSet
  id: ImperialBlobbernaut
  coefficients:
    Blunt: 0.5
    Slash: 0.5
    Piercing: 0.5

# Опрос призраков на блоббернаута (20 секунд).
- type: entity
  id: SpawnPointGhostBlobbernaut
  parent: MarkerBase
  categories: [ HideSpawnMenu, Spawner ]
  name: blobbernaut spawn point
  components:
  - type: GhostRole
    name: blob-ghost-role-blobbernaut-name
    description: blob-ghost-role-blobbernaut-desc
    rules: ghost-role-information-antagonist-rules
  - type: GhostRoleMobSpawner
    prototype: MobBlobbernaut
  - type: Sprite
    sprite: Imperial/blob/blob.rsi
    layers:
    - state: blobbernaut

# midround/from_ghosts/blob
- type: entity
  id: SpawnPointGhostBlobOvermind
  parent: MarkerBase
  categories: [ HideSpawnMenu, Spawner ]
  name: blob overmind spawn point
  components:
  - type: GhostRole
    name: blob-ghost-role-overmind-name
    description: blob-ghost-role-overmind-desc
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleBlob
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: MobBlobOvermind
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - sprite: Imperial/blob/blob.rsi
      state: blob_core

# AI: заражение (споры), затем travel_to_point/and_clear_target, затем ближний бой.
- type: htnCompound
  id: ImperialBlobMobCompound
  branches:
  # Споры: добраться до человека в крите и забраться ему на голову (главный приоритет).
  - tasks:
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: BlobInfectTarget
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        targetKey: BlobInfectTarget
        rangeKey: BlobInfectRange
        removeKeyOnFinish: false
  - tasks:
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: BlobRallyPoint
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        targetKey: BlobRallyPoint
        removeKeyOnFinish: true
  - tasks:
    - !type:HTNCompoundTask
      task: MeleeCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

# Панцирь заражённого спорой.
- type: entity
  id: ClothingHeadHelmetBlob
  parent: ClothingHeadHelmetBase
  name: blob carapace
  description: A hardened mass of biomass shaped into head protection.
  components:
  - type: Unremoveable
  - type: Sprite
    sprite: Imperial/blob/helmet.rsi
    state: blobhat
  - type: Clothing
    sprite: Imperial/blob/helmet.rsi
    equippedState: blobhat
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.85
        Heat: 0.9
