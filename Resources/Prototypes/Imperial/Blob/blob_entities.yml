- type: entity
  id: BaseBlobStructure
  parent: BaseStructure
  abstract: true
  name: blob structure
  description: A dense growth of hostile biomass.
  components:
  - type: BlobStructure
  - type: Appearance
  - type: BlobVisuals
  - type: Damageable
    damageContainer: Biological
  - type: Sprite
    sprite: Imperial/blob/blob.rsi
    tags:
    - BypassInteractionRangeChecks
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        hard: true
        mask:
        - MachineMask
        layer:
        - BlobTileLayer

- type: entity
  id: BlobOvermindController
  categories: [ HideSpawnMenu ]
  components:
  - type: UserInterface
    interfaces:
      enum.BlobChemicalMenuBuiKey.Key:
        type: BlobChemicalBui
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Imperial/blob/blob.rsi
    layers:
    - state: blob
      visible: false
  - type: Unremoveable
    deleteOnDrop: false

- type: entity
  parent:
  - Incorporeal
  - BaseMob
  id: MobBlobOvermind
  name: сознание Блоба
  description: Бестелесное сознание, направляющее рост Блоба.
  categories: [ HideSpawnMenu ]
  components:
  - type: Input
    context: "ghost"
  - type: ContentEye
    maxZoom: 1.44,1.44
  - type: Eye
    drawFov: false
  - type: Examiner
    skipChecks: true
  - type: BlobOvermind
  - type: ShowAntagIcons
  - type: ShowElectrocutionHUD
  - type: Speech
  - type: IntrinsicRadioTransmitter
    channels:
    - Blob
    - BlobHive
  - type: ActiveRadio
    channels:
    - Blob
    - BlobHive
  - type: IntrinsicRadioReceiver
  - type: NpcFactionMember
    factions:
    - Blob
  - type: Tag
    tags:
    - BypassInteractionRangeChecks
  - type: PointLight
    netsync: false
    enabled: true
    radius: 4
    energy: 2
    color: "#6bcf6b"
    castShadows: false
  - type: Sprite
    sprite: Imperial/blob/blob.rsi
    layers:
    - state: marker
      shader: unshaded

- type: entity
  parent: BaseMentalAction
  id: ActionBlobAttack
  name: blob-action-attack-name
  description: blob-action-attack-desc
  components:
  - type: Action
    useDelay: 0.5
    icon:
      sprite: Imperial/blob/blob.rsi
      state: ui_help
  - type: TargetAction
