# cryogenic_poison/on_mob_life: 0.25 brute/burn/tox в секунду.
- type: reagent
  id: BlobCryogenicPoisonChem
  name: reagent-name-blob-cryogenic-poison-chem
  group: Toxins
  desc: reagent-desc-blob-cryogenic-poison-chem
  flavor: bitter
  physicalDesc: reagent-physical-desc-viscous
  color: "#8BA6E9"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        ignoreResistances: true
        damage:
          types:
            Blunt: 0.25
            Heat: 0.25
            Poison: 0.25

