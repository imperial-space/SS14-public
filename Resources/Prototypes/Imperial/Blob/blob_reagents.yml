# Реагенты блоба (datum/reagent/blob). Касание облаком спор действует как атака штамма.

- type: reagent
  id: BlobBlazingOil
  name: reagent-name-blob-blazing-oil
  group: Toxins
  desc: reagent-desc-blob-blazing-oil
  flavor: bitter
  physicalDesc: reagent-physical-desc-viscous
  color: "#B68D00"
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:BlobStrainExposure
        strain: BlobBlazingOil

