# midround/from_living/blob: член экипажа становится носителем (Pop, авто через 6 минут).
- type: entity
  id: Blob
  parent: BaseGameRule
  components:
  - type: BlobRule
    startAsCarrier: true
    greetSoundNotification:
      path: /Audio/Imperial/blob/blobalert.ogg
    winningInfectedStationTiles: 400
  - type: GameRule
    minPlayers: 20
    delay:
      min: 300
      max: 480
  - type: AntagSelection
    agentName: blob-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Blob ]
      min: 1
      max: 1
      playerRatio: 20
      lateJoinAdditional: false
      blacklist:
        components:
        - AntagImmune
      mindRoles:
      - MindRoleBlob

# midround/from_ghosts/blob: оверманд-призрак в случайной точке станции.
- type: entity
  id: BlobVentSpawn
  parent: BaseGameRule
  components:
  - type: BlobRule
    startAsCarrier: false
    spawnGhostRoleAtVentOnStart: true
    ghostRoleSpawnerPrototype: SpawnPointGhostBlobOvermind
    winningInfectedStationTiles: 400
  - type: StationEvent
    weight: 4
    earliestStart: 55
    minimumPlayers: 40
    duration: null
    maxOccurrences: 1
    reoccurrenceDelay: 120
