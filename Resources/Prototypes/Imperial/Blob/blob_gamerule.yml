- type: entity
  id: Blob
  parent: BaseGameRule
  components:
  - type: BlobRule
    startingChemical: Sorium
    startAsCarrier: true
    winningInfectedStationTiles: 350
    gammaThreshold: 250
    victoryCheckInterval: 5
  - type: GameRule
    minPlayers: 20
    delay:
      min: 300
      max: 480
  - type: AntagSelection
    agentName: blob-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Blob ]
      min: 1
      max: 1
      playerRatio: 20
      lateJoinAdditional: false
      blacklist:
        components:
        - AntagImmune
      mindRoles:
      - MindRoleBlob

- type: entity
  id: BlobVentSpawn
  parent: BaseGameRule
  components:
  - type: BlobRule
    startingChemical: Sorium
    startAsCarrier: false
    spawnGhostRoleAtVentOnStart: true
    ghostRoleSpawnerPrototype: SpawnPointGhostBlobMouse
    winningInfectedStationTiles: 350
    gammaThreshold: 250
    victoryCheckInterval: 5
  - type: StationEvent
    weight: 4
    earliestStart: 55
    minimumPlayers: 40
    duration: null
    maxOccurrences: 1
    reoccurrenceDelay: 120

- type: entity
  categories: [ HideSpawnMenu, Spawner ]
  parent: BaseAntagSpawner
  id: SpawnPointGhostBlobMouse
  components:
  - type: GhostRole
    name: blob-ghost-role-mouse-name
    description: blob-ghost-role-mouse-desc
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleBlob
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: MobBlobMouse
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - sprite: Imperial/blob/blob.rsi
      state: blobpod