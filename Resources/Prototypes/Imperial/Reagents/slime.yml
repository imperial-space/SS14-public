# ---------- Black plasma: продвинутый мутагенный токсин ---------------------

- type: reagent
  id: AdvancedMutationToxin
  name: reagent-name-advanced-mutation-toxin
  group: Toxins
  desc: reagent-desc-advanced-mutation-toxin
  physicalDesc: reagent-physical-desc-glowing
  flavor: bitter
  color: "#003300"
