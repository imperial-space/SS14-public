  physicalDesc: reagent-physical-desc-cold
  flavor: bitter
  color: "#5C85D6"
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: -2

# ---------- Bluespace water: зелье телепортации ----------------------------

