  - !type:PlantAdjustMutationLevel
    amount: 3
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Radiation: 6

# ---------- LightPink plasma: зелье разума -----------------------------------

- type: reagent
  id: MindPotion
  name: reagent-name-mind-potion
  group: Medicine
  desc: reagent-desc-mind-potion
  physicalDesc: reagent-physical-desc-neural
  flavor: sweet
  color: "#FF99CC"
  metabolisms:
    Medicine:
      effects:
      - !type:SatiateHunger
        factor: -5
      - !type:SatiateThirst
        factor: -5
      - !type:MovementSpeedModifier
        walkSpeedModifier: 1.15
        sprintSpeedModifier: 1.2

