# =============================================================================
# Xenobiology: Slime Reagents
# Реагенты, получаемые из экстрактов ксено-слаймов (SS13 xenobiology).
# =============================================================================

# ---------- Grey plasma: катализатор роста серого слайма --------------------

- type: reagent
  id: XenoSlimeGrowthFactor
  name: reagent-name-xeno-slime-growth-factor
  group: Medicine
  desc: reagent-desc-xeno-slime-growth-factor
  physicalDesc: reagent-physical-desc-slimy
  flavor: sweet
  color: "#808080"

# ---------- Purple plasma: стероид слайма -----------------------------------

- type: reagent
  id: SlimeSteroid
  name: reagent-name-slime-steroid
  group: Medicine
  desc: reagent-desc-slime-steroid
  physicalDesc: reagent-physical-desc-slimy
  flavor: bitter
  color: "#8000FF"
  metabolisms:
    Medicine:
      effects:
      - !type:MovementSpeedModifier
        walkSpeedModifier: 1.3
        sprintSpeedModifier: 1.4

# ---------- Blue blood: стабилизатор слаймов --------------------------------

- type: reagent
  id: SlimeStabilizer
  name: reagent-name-slime-stabilizer
  group: Medicine
  desc: reagent-desc-slime-stabilizer
  physicalDesc: reagent-physical-desc-slimy
  flavor: odorless
  color: "#0080FF"

# ---------- DarkBlue water: зелье охлаждения --------------------------------

- type: reagent
  id: CoolingPotion
  name: reagent-name-cooling-potion
