# * CMD hardsuit

- type: entity
  parent: [ ClothingOuterHardsuitBase ]
  id: ClothingOuterCMDHardsuitArmorTrivium
  name: trivium-cmd-hardsuit-name
  description: trivium-cmd-hardsuit-desc
  suffix: SideTrivium
  components:
  - type: Sprite
    sprite: Imperial/NEGODAY/Tarvos/Trivium/triviumCMDHardsuit.rsi
  - type: Clothing
    sprite: Imperial/NEGODAY/Tarvos/Trivium/triviumCMDHardsuit.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.55
        Slash: 0.55
        Piercing: 0.55
        Heat: 0.55
        Radiation: 0.5
        Caustic: 0.7
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 0.9
  - type: HeldSpeedModifier
    walkModifier: 1.0
    sprintModifier: 0.9
  - type: ToggleableClothing
    clothingPrototype: ClothingHelmetCMDHardsuitTrivium
  - type: Speech
    speechSounds: Pai
  - type: StaminaResistance
    damageCoefficient: 0.5 

- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHelmetCMDHardsuitTrivium
  name: trivium-cmd-hardsuit-helmet-name
  description: trivium-cmd-hardsuit-helmet-desc
  components:
  - type: BreathMask
  - type: Sprite
    sprite: Imperial/NEGODAY/Tarvos/Trivium/triviumCMDHardsuitHelmet.rsi
  - type: Clothing
    sprite: Imperial/NEGODAY/Tarvos/Trivium/triviumCMDHardsuitHelmet.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.85
  - type: PointLight
    color: white
    radius: 6
    energy: 4
  - type: ToggleableLightVisuals
    clothingVisuals:
      head:
      - state: on-equipped-HELMET

