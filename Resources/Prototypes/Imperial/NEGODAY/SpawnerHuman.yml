- type: entity
  parent: MobHuman
  id: EventHumanSkillsTTSGhostrole
  name: spawn event human
  suffix: skills, TTS, ghostrole
  components:
    - type: AntagImmune
    - type: RandomHumanoidAppearance
      randomizeName: true
    - type: CrewSkills
      skills:
        - skillBotany #Base
        - skillBaseMed
        - skillBaseConstraction
        - skillCooking  #Easy
        - skillBartending
        - skillHacking
        - skillInstrumentation #Medium
        - skillMaintenance
        - skillMediumConstruction
        - skillMediumBotany
        - skillBasicAtmos
        - skillMedicalEquipment
        - skillPharmacology
        - skillPiloting #Hard
        - skillAtmos
        - skillHardInstrumentation
        - skillRobotics
        - skillResearch
        - skillPharmaceuticals
        - skillShooting
        - skillSurgery
        - skillNeuroSurgery
    - type: GhostRole
      name: ghostrole-event-name
      description: ghostrole-event-allskills-desc
      rules: ghostrole-event-rules
      raffle:
        settings: short
    - type: Damageable
      damageContainer: BiologicalMemetical
      damageModifierSet: Infernal
    - type: ShowJobIcons
    - type: ShowMindShieldIcons

