# * CMD hardsuit

- type: entity
  parent: [ ClothingOuterHardsuitBase ]
  id: ClothingOuterCMDHardsuitArmorUSSPEvent
  name: ussp-cmd-hardsuit-name
  description: ussp-cmd-hardsuit-desc
  suffix: Event, SideUSSP
  components:
  - type: Sprite
    sprite: Imperial/NEGODAY/Tarvos/USSP/usspCMDHardsuit.rsi
  - type: Clothing
    sprite: Imperial/NEGODAY/Tarvos/USSP/usspCMDHardsuit.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.55
        Slash: 0.55
        Piercing: 0.45
        Heat: 0.55
        Radiation: 0.5
        Caustic: 0.7
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 0.9
  - type: HeldSpeedModifier
    walkModifier: 1.0
    sprintModifier: 0.9
  - type: ToggleableClothing
    clothingPrototype: ClothingHelmetCMDHardsuitUSSPEvent
  - type: Speech
    speechSounds: Pai
  - type: StaminaResistance
    damageCoefficient: 0.5

- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHelmetCMDHardsuitUSSPEvent
  name: ussp-cmd-hardsuit-helmet-name
  description: ussp-cmd-hardsuit-helmet-desc
  components:
  - type: BreathMask
  - type: Sprite
    sprite: Imperial/NEGODAY/Tarvos/USSP/usspCMDHardsuitHelmet.rsi
  - type: Clothing
    sprite: Imperial/NEGODAY/Tarvos/USSP/usspCMDHardsuitHelmet.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.85
  - type: PointLight
    color: orange
    radius: 6
    energy: 4
  - type: ToggleableLightVisuals
    clothingVisuals:
      head:
      - state: on-equipped-HELMET

