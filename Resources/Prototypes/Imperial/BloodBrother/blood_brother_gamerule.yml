- type: entity
  id: BloodBrother
  parent: BaseGameRule
  components:
  - type: GameRule
    minPlayers: 15
    delay:
      min: 240
      max: 420
  - type: BloodBrotherRule
    greetSoundNotification: /Audio/Imperial/blood_brother/blood_brothers_intro.ogg
  # datum/team/brother_team: общий бюджет пробуждений и набор целей команды.
  - type: BloodBrotherTeam
    brothersLeft: 2
    extraBrotherChance: 0.1
    baseObjectiveAmount: 2
    hijackChance: 0.1
  - type: AntagSelection
    agentName: blood-brother-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ BloodBrother ]
      min: 2
      max: 2
      playerRatio: 15
      lateJoinAdditional: false
      blacklist:
        components:
        - AntagImmune
      mindRoles:
      - MindRoleBloodBrother
