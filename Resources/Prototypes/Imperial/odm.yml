- type: entity
  id: OdmHookAnchor
  name: odm anchor
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    visible: false
    noRot: false
    sprite: Objects/Weapons/Guns/Launchers/grappling_gun.rsi
    layers:
    - state: hook

- type: entity
  parent: BaseItem
  id: ClothingBackOdmGear
  name: odm-gear-name
  description: odm-gear-desc
  components:
  - type: Item
    size: Huge
    shape:
    - 0,0,1,1
  - type: Sprite
    sprite: Objects/Tanks/Jetpacks/mini.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Tanks/Jetpacks/mini.rsi
    slots:
    - Back
  - type: OdmGear
    currentGas: 100
    maxGas: 100
    hookRange: 12
    reelSpeed: 7.5
    pullForce: 5200
    gasUsage: 0.34
    gasUsageIdle: 0.08
    impactMinimumSpeed: 8
    impactDamageFactor: 1.35
    impactStunSeconds: 1.5
  - type: StaticPrice
    price: 4500