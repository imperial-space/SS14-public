# =====================================================================
# Блюспейс-артиллерия 1 в 1 с SS13 (code/modules/station_goals/bsa.dm)
# =====================================================================

- type: stationGoal
  id: StationGoalBSA
  text: station-goal-bsa

# ────────────── Части: генератор, фьюзор, ствол ──────────────

- type: entity
  id: ImperialBSAPartBase
  parent: [ BaseMachine, ConstructibleMachine ]
  abstract: true
  components:
  - type: Sprite
    sprite: Imperial/bsa/parts.rsi
    noRot: true
  - type: Rotatable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong

- type: entity
  id: ImperialBSABack
  parent: ImperialBSAPartBase
  name: Bluespace Artillery Generator
  description: Generates cannon pulse. Needs to be linked with a fusor.
  components:
  - type: Sprite
    state: back
  - type: Machine
    board: ImperialBSABackCircuitboard
  - type: BSAPart
    kind: Back

- type: entity
  id: ImperialBSAFront
  parent: ImperialBSAPartBase
  name: Bluespace Artillery Bore
  description: Do not stand in front of cannon during operation. Needs to be linked with a fusor.
  components:
  - type: Sprite
    state: front
  - type: Machine
    board: ImperialBSAFrontCircuitboard
  - type: BSAPart
    kind: Front

- type: entity
  id: ImperialBSAMiddle
  parent: ImperialBSAPartBase
  name: Bluespace Artillery Fusor
  description: Contents classified by Nanotrasen Naval Command. Needs to be linked with the other BSA parts using a multitool.
  components:
  - type: Sprite
    state: middle
  - type: Machine
    board: ImperialBSAMiddleCircuitboard
  - type: BSAPart
    kind: Middle

# ────────────── Собранная пушка ──────────────

- type: entity
  id: ImperialBSACannonBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: Imperial/bsa/cannon.rsi
    drawdepth: Objects
    noRot: true
  - type: ApcPowerReceiver
    powerLoad: 2000
  - type: ExtensionCableReceiver
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: ImperialBSACannonWest
  parent: ImperialBSACannonBase
  name: Bluespace Artillery
  description: Long range bluespace artillery.
  components:
  - type: Sprite
    state: cannon_west
    offset: -0.953,-0.3125
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-6.45,-0.45,4.45,0.45"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: BSACannon
    west: true
    top: ImperialBSACannonTopWest
    splash: ImperialBSASplashWest

- type: entity
  id: ImperialBSACannonEast
  parent: ImperialBSACannonBase
  name: Bluespace Artillery
  description: Long range bluespace artillery.
  components:
  - type: Sprite
    state: cannon_east
    offset: 1.047,-0.3125
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-4.45,-0.45,6.45,0.45"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: BSACannon
    west: false
    top: ImperialBSACannonTopEast
    splash: ImperialBSASplashEast

# Верхний слой пушки поверх мобов (top_layer).
- type: entity
  id: ImperialBSACannonTopWest
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: Imperial/bsa/cannon.rsi
    state: top_west
    offset: -0.953,-0.3125
    drawdepth: OverMobs
    noRot: true
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: ImperialBSACannonTopEast
  parent: ImperialBSACannonTopWest
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: top_east
    offset: 1.047,-0.3125

# ────────────── Консоль ──────────────

- type: entity
  id: ImperialBSAConsole
  parent: BaseComputer
  name: bluespace artillery control
  description: Controls the bluespace artillery.
  components:
  - type: Sprite
    sprite: Imperial/bsa/parts.rsi
    layers:
    - map: [ "computerLayerBody" ]
      state: control
  - type: GenericVisualizer
    visuals: {}
  - type: ApcPowerReceiver
    needsPower: false
  - type: Computer
    board: ImperialBSAConsoleCircuitboard
  - type: BSAConsole
  - type: ActivatableUI
    key: enum.BSAConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.BSAConsoleUiKey.Key:
        type: BSABoundUserInterface
  - type: PointLight
    enabled: false

# ────────────── Эффекты ──────────────

- type: entity
  id: ImperialBSABeam
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/bsa/beam.rsi
    state: bsa_beam
    drawdepth: Effects
    noRot: false
    shader: unshaded
  - type: TimedDespawn
    lifetime: 5
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: ImperialBSASplashWest
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/bsa/splash.rsi
    state: beam_splash_w
    drawdepth: Effects
    shader: unshaded
  - type: TimedDespawn
    lifetime: 5
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: ImperialBSASplashEast
  parent: ImperialBSASplashWest
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: beam_splash_e

- type: entity
  id: ImperialBSAImpact
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/bsa/shot.rsi
    state: bsa_impact_ex
    offset: 0,1
    drawdepth: Effects
    noRot: true
    shader: unshaded
  - type: TimedDespawn
    lifetime: 1
  - type: Tag
    tags:
    - HideContextMenu

# temp_visual/point: подсвечивает клетки, мешающие развёртыванию.
- type: entity
  id: ImperialBSABlockedMarker
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Interface/Misc/pointing.rsi
    state: pointing
    drawdepth: Overlays
    noRot: true
  - type: TimedDespawn
    lifetime: 2
  - type: Tag
    tags:
    - HideContextMenu

# ────────────── Платы ──────────────

- type: entity
  id: ImperialBSABackCircuitboard
  parent: BaseMachineCircuitboard
  name: Bluespace Artillery Generator machine board
  components:
  - type: Sprite
    state: command
  - type: MachineBoard
    prototype: ImperialBSABack
    stackRequirements:
      Manipulator: 5
      Cable: 2

- type: entity
  id: ImperialBSAFrontCircuitboard
  parent: BaseMachineCircuitboard
  name: Bluespace Artillery Bore machine board
  components:
  - type: Sprite
    state: command
  - type: MachineBoard
    prototype: ImperialBSAFront
    stackRequirements:
      Manipulator: 5
      Cable: 2

- type: entity
  id: ImperialBSAMiddleCircuitboard
  parent: BaseMachineCircuitboard
  name: Bluespace Artillery Fusor machine board
  components:
  - type: Sprite
    state: command
  - type: MachineBoard
    prototype: ImperialBSAMiddle
    stackRequirements:
      Plasma: 20
      Cable: 2

- type: entity
  id: ImperialBSAConsoleCircuitboard
  parent: BaseComputerCircuitboard
  name: Bluespace Artillery Controls computer board
  components:
  - type: Sprite
    state: cpu_command
  - type: ComputerBoard
    prototype: ImperialBSAConsole

# ────────────── Снабжение ──────────────

- type: entity
  id: ImperialBSAGuidePaper
  parent: Paper
  name: Bluespace Artillery (BSA) Assembly Instructions
  components:
  - type: Paper
    content: bsa-guide-paper-content

- type: entity
  parent: CrateEngineeringSecure
  id: ImperialCrateBSA
  name: bluespace artillery parts crate
  description: The pride of Nanotrasen Naval Command.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ImperialBSAGuidePaper
        - id: ImperialBSAFrontCircuitboard
        - id: ImperialBSAMiddleCircuitboard
        - id: ImperialBSABackCircuitboard
        - id: ImperialBSAConsoleCircuitboard

- type: cargoProduct
  id: ImperialBSAParts
  icon:
    sprite: Imperial/bsa/parts.rsi
    state: middle
  product: ImperialCrateBSA
  cost: 6000
  category: cargoproduct-category-name-engineering
  group: market
