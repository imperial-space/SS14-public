- type: entity
  parent: BaseStructure
  id: ImperialManufacturingStorageBox
  name: производственный ящик хранения
  description: По сути, просто ящик. Принимает ресурсы, если закреплён. Достать что-то по одному можно только машиной, иначе высыпется всё сразу.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Rotatable
    rotateWhileAnchored: true
  - type: InteractionOutline
  - type: Anchorable
    delay: 2
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Imperial/Manufacturing/machines.rsi
    noRot: true
    layers:
    - state: box
      map: [ "base" ]
  - type: Appearance
  - type: ContainerContainer
  - type: ImperialManufacturing
    kind: StorageBox
  - type: Construction
    graph: ImperialManufacturingStorageBox
    node: box
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 10
            max: 10
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: constructionGraph
  id: ImperialManufacturingStorageBox
  start: start
  graph:
  - node: start
    edges:
    - to: box
      steps:
      - material: Steel
        amount: 10
        doAfter: 2
  - node: box
    entity: ImperialManufacturingStorageBox

- type: construction
  id: ImperialManufacturingStorageBox
  graph: ImperialManufacturingStorageBox
  startNode: start
  targetNode: box
  category: construction-category-machines
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  conditions:
  - !type:TileNotBlocked
