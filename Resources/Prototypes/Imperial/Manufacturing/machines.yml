# Производственные линии TG (code/modules/manufactorio).

- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: ImperialManufacturingUnloader
  name: производственный разгрузчик ящиков
  description: Разгружает поданные в него ящики (и ящики для руды), выбрасывая пустой ящик вбок, а содержимое — вперёд. Мультитулом можно сменить сторону выдачи ящика.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Imperial/Manufacturing/unloader.rsi
    noRot: true
    layers:
    - state: unloader-corner
      map: [ "base" ]
  - type: Appearance
  - type: Machine
    board: ImperialManufacturingUnloaderBoard
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: ImperialManufacturing
    kind: Unloader
    powerCost: 2000

