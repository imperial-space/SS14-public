# Вирусная еда и мутации культур 1 в 1 с SS13 (recipes/others.dm).

- type: reaction
  id: VirusFood
  reactants:
    Water:
      amount: 1
    Milk:
      amount: 1
    UnstableMutagen:
      amount: 1
  products:
    VirusFood: 3

- type: reaction
  id: MutagenicAgar
  reactants:
    UnstableMutagen:
      amount: 1
    VirusFood:
      amount: 1
  products:
    MutagenicAgar: 1

- type: reaction
  id: SucroseAgar
  reactants:
    Sugar:
      amount: 1
    MutagenicAgar:
      amount: 1
  products:
    SucroseAgar: 2

- type: reaction
  id: VirusRations
  reactants:
    Synaptizine:
      amount: 1
    VirusFood:
      amount: 1
  products:
    VirusRations: 1

- type: reaction
  id: VirusPlasma
  reactants:
    Plasma:
      amount: 1
    VirusFood:
      amount: 1
  products:
    VirusPlasma: 1

- type: reaction
  id: WeakVirusPlasma
  reactants:
    Synaptizine:
      amount: 1
    VirusPlasma:
      amount: 1
  products:
    WeakVirusPlasma: 2

- type: reaction
  id: DecayingUraniumGel
  reactants:
    Uranium:
      amount: 1
    VirusFood:
      amount: 1
  products:
    DecayingUraniumGel: 1

- type: reaction
  id: UnstableUraniumGel
  reactants:
    Uranium:
      amount: 5
    VirusPlasma:
      amount: 1
  products:
    UnstableUraniumGel: 1

- type: reaction
  id: StableUraniumGel
  reactants:
    Gold:
      amount: 1
    UnstableUraniumGel:
      amount: 1
  products:
    StableUraniumGel: 1

# Мутации культуры: каждая еда даёт симптомы своего диапазона уровней.
- type: reaction
  id: DiseaseMixVirusFood
  impact: Medium
  reactants:
    VirusFood:
      amount: 1
      catalyst: true
    Blood:
      amount: 1
      catalyst: true
  effects:
  - !type:DiseaseMutate
    levelMin: 1
    levelMax: 2

- type: reaction
  id: DiseaseMixVirusRations
  impact: Medium
  reactants:
    VirusRations:
      amount: 1
      catalyst: true
    Blood:
      amount: 1
      catalyst: true
  effects:
