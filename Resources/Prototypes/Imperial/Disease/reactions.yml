# Удаление симптома: мутаген без вирусной еды.
- type: reaction
  id: DiseaseRemoveSymptom
  impact: Medium
  reactants:
    UnstableMutagen:
      amount: 1
      catalyst: true
    Blood:
      amount: 1
      catalyst: true
  effects:
  - !type:DiseaseMutate
    mode: Devolve
