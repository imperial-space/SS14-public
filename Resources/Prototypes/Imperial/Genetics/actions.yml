- type: geneticRecipe
  id: RecipeFirebreath
  first: MutationFire
  second: MutationInsulated
  result: MutationFirebreath

- type: geneticRecipe
  id: RecipeLaserEyes
  first: MutationThermal
  second: MutationRadioactive
