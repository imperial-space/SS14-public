- type: geneticRecipe
  id: RecipeDwarfism
  first: MutationGigantism
  second: MutationClumsy
  result: MutationDwarfism

- type: entity
  id: ActionGeneticVoid
  parent: ActionGeneticBase
  name: Convoke Void
  description: Pull yourself into a pocket of the void for a while, becoming invulnerable.
  components:
  - type: Action
    useDelay: 60
    icon:
      sprite: Imperial/Genetics/actions.rsi
      state: void_magnet
  - type: InstantAction
    event: !type:GeneticVoidActionEvent

- type: entity
  id: ImperialVoidHole
  name: hole in reality
  description: It's shaped an awful lot like a person.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Imperial/Genetics/actions.rsi
    state: void_magnet
    color: "#00000088"
  - type: ContainerContainer
    containers:
      void: !type:ContainerSlot
