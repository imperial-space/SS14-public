# Срывы при распаде ДНК (instability_meltdown.dm из SS13).

- type: polymorph
  id: ImperialGeneticMonkey
  configuration:
    entity: MobMonkey
    forced: true
    inventory: Drop
    transferName: true
    transferDamage: true
    revertOnCrit: false
    revertOnDeath: false
    allowRepeatedMorphs: false

- type: polymorph
