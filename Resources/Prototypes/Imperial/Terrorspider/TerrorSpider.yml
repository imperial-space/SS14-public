  id: LightImplantSpiderRusar
  name: Spawn web
  noSpawn: true
  components:
    - type: SubdermalImplant
      implantAction: ActionSpawnSpiderRusar

- type: entity
  id: ActionSpawnSpiderRusar
  name: Spawn web
  description: it spans the web. A little stronger than usual.
  noSpawn: true
  components:
  - type: Action
    useDelay: 2.5
    itemIconStyle: BigAction
    icon:
      sprite: Structures/floor_web.rsi
      state: full
  - type: InstantAction
    event: !type:TerrorSpiderSpawnWebActionEvent
      webPrototype: SpiderWebTerrorRusar

- type: entity
  id: ActionTerrorSpiderCocoon
  name: Cocoon
  description: Wrap a living target in cocoon.
  noSpawn: true
  components:
  - type: Action
    useDelay: 4
    itemIconStyle: BigAction
    icon:
      sprite: Imperial/TerrorSpider/effects.rsi
      state: cocoon_large3
  - type: TargetAction
    canTargetSelf: false
    range: 1
  - type: EntityTargetAction
    event: !type:TerrorSpiderCocoonActionEvent

- type: entity
  name: Knight terror
  parent: [ SimpleMobBases, MobCombat ]
  id: MobRusarSpider
  description: Fights the crew and protects other spiders. Thanks to its resilience, it creates space for the nest to expand.
  components:
  - type: TerrorSpiderCocoon
  - type: TerrorSpiderWebBuffReceiver
  - type: TerrorSpiderKnightGuard
    guardSpeedMultiplier: 0.8
  - type: TerrorSpiderKnightRage
    enragedSpeedMultiplier: 1
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: terror_red
      sprite: Imperial/TerrorSpider/Spider/rusar.rsi
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 130
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: terror_red
      Dead:
        Base: terror_red_dead
  - type: Butcherable
    spawned:
    - id: FoodMeatSpider
      amount: 2
  - type: CombatMode
  - type: MobThresholds
    thresholds:
      0: Alive
      220: Dead
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Piercing: 15
        Structural: 60
  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 30
  - type: SolutionRegeneration
    solution: melee
    generated:
      reagents:
      - ReagentId: Toxin
        Quantity: 1
  - type: MeleeChemicalInjector
    transferAmount: 0.75
    solution: melee
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-tarantula
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
  - type: NoSlip
  - type: Spider
    webPrototype: SpiderWebTerrorRusar
    webAction: TerrorWeedsRusarAction
    spawnsWebsAsNonPlayer: false
  - type: IgnoreSpiderWeb
  - type: Bloodstream
    bloodMaxVolume: 0
    bloodReagent: CopperBlood
  - type: Speech
    speechVerb: Arachnid
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
  - type: MovementSpeedModifier
    baseWalkSpeed : 2
    baseSprintSpeed : 3
  - type: SlowOnDamage
    speedModifierThresholds:
      200: 0.7
  - type: TerrorSpiderArmor
    bruteModifier: 0.75
    burnModifier: 1.25
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: PassiveDamage
    allowedStates:
    - Alive
    damageCap: 220
    damage:
      types:
        Poison: -1
      groups:
        Brute: -1
        Burn: -1


