  components:
  - type: Action
    icon: { sprite: Interface/Actions/actions_ai.rsi, state: camera_light }
  - type: InstantAction
    event: !type:TerrorSpiderRemoteViewActionEvent

- type: entity
  parent: ActionTerrorSpiderBase
  id: ActionTerrorSpiderRoyalJelly
  name: Lay Royal Jelly
  description: Secrete royal jelly for other spiders to eat. Costs 100 regeneration points.
  components:
  - type: Action
    icon: { sprite: Imperial/TerrorSpider/structures.rsi, state: spiderjelly }
  - type: InstantAction
    event: !type:TerrorSpiderRoyalJellyActionEvent

- type: entity
  parent: ActionTerrorSpiderBase
  id: ActionTerrorSpiderGatherSpiderlings
