    icon: { sprite: Structures/Piping/Atmospherics/vent.rsi, state: vent_welded }
  - type: InstantAction
    event: !type:TerrorSpiderVentSmashActionEvent

- type: entity
  parent: ActionTerrorSpiderBase
  id: ActionTerrorSpiderRemoteView
  name: Remote View
