# Пауки Ужаса 1 в 1 с Paradise (code/modules/mob/living/simple_animal/hostile/terror_spiders).
# Скорость игрока: speed 1 → 2.8 тайла/с, 2 → 2.2, 0.5 → 3.3, 0 → 4.

- type: npcFaction
  id: TerrorSpiders
  hostile:
  - NanoTrasen
  - Syndicate
  - Passive
  - PetsNT
  - Zombie
  - Revolutionary
  - AllHostile
  - SyndicateAgent
  - Wizard
  - Pirate
  - DeathSquad
  - RiotControlUnit
  - Dragon
  - Xenoborg
  - SimpleNeutral
  - SimpleHostile
  - Xeno

- type: radioChannel
  id: TerrorSpiderHive
  name: chat-radio-terror-spider-hive
  keycode: 'й'
  frequency: 8888
  color: "#a020f0"
  longRange: true

# --------------------------------------------------------------------------------
# Базовый паук
# --------------------------------------------------------------------------------

- type: entity
  abstract: true
  parent: [ BaseSimpleMob, MobAtmosStandard, MobRespirator, MobCombat, MobBloodstream, MobFlammable, BaseMobAnimal ]
  id: MobTerrorSpiderBase
  name: terror spider
  description: The generic parent of all other terror spider types. If you see this in-game, it is a bug.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/TerrorSpider/spiders.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: terror_red
  - type: DamageStateVisuals
    states:
      Alive:
        Base: terror_red
      Dead:
        Base: terror_red_dead
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 1000 # move_resist = MOVE_FORCE_STRONG
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Dead
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Piercing: 15
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.8
    baseSprintSpeed: 2.8
  - type: NpcFactionMember
    factions:
    - TerrorSpiders
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavPry: !type:Bool
        true
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-terror-spider-name
    description: terror-spider-summary-red
    rules: ghost-role-information-terror-spider-rules
    mindRoles:
    - MindRoleTerrorSpider
    raffle:
      settings: short
  - type: GhostTakeoverAvailable
  - type: TerrorSpider
  - type: Prying
    pryPowered: false
    speedModifier: 1.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Puller
    needsHands: false
  - type: NoSlip
  - type: IgnoreSpiderWeb
  - type: CombatMode
  - type: Speech
    speechVerb: Arachnid
    speechSounds: Arachnid
    allowedEmotes: [ 'Click', 'Chitter' ]
  - type: TypingIndicator
    proto: spider
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - TerrorSpiderHive
  - type: ActiveRadio
    channels:
    - TerrorSpiderHive
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: CopperBlood
        Quantity: 150
  - type: TemperatureDamage # heat_damage_per_tick = 5: «убей его огнём»
    heatDamageThreshold: 325
    coldDamageThreshold: 260
    coldDamage:
      types:
        Cold: 1
    heatDamage:
      types:
        Heat: 3.75
  - type: Butcherable
    spawned:
    - id: FoodMeatSpider
      amount: 2
  - type: UserInterface
    interfaces:
      enum.TerrorSpiderChoiceUiKey.Key:
        type: TerrorSpiderChoiceBoundUserInterface
  # sight = SEE_MOBS, lighting_alpha = LIGHTING_PLANE_ALPHA_MOSTLY_INVISIBLE
  - type: ThermalEntityVision
  - type: ImperialNightVision
  - type: Tag
    tags:
    - FootstepSound
    - StunImmune

