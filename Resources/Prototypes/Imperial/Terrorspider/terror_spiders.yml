  description: Pick up nearby spiderlings and carry them on your back.
  components:
  - type: Action
    icon: { sprite: Imperial/TerrorSpider/spiderling.rsi, state: spiderling }
  - type: InstantAction
    event: !type:TerrorSpiderGatherSpiderlingsActionEvent

- type: entity
  parent: ActionTerrorSpiderBase
  id: ActionTerrorSpiderIncubateEggs
  name: Incubate Eggs
  description: Warm the eggs under you, making them grow faster.
  components:
  - type: Action
    icon: { sprite: Imperial/TerrorSpider/structures.rsi, state: eggs }
  - type: InstantAction
    event: !type:TerrorSpiderIncubateEggsActionEvent

- type: entity
  parent: ActionTerrorSpiderBase
  id: ActionTerrorSpiderQueenNest
  name: Nest
  description: Settle down to lay eggs and smash walls, losing the ability to ventcrawl.
  components:
  - type: Action
    icon: { sprite: Imperial/TerrorSpider/spiders.rsi, state: terror_queen }
  - type: InstantAction
    event: !type:TerrorSpiderQueenNestActionEvent

- type: entity
  parent: ActionTerrorSpiderBase
  id: ActionTerrorSpiderHiveSense
  name: Hive Sense
  description: Sense the location and health of your whole brood.
  components:
  - type: Action
    icon: { sprite: Imperial/TerrorSpider/spiders.rsi, state: terror_purple }
  - type: InstantAction
    event: !type:TerrorSpiderHiveSenseActionEvent

- type: entity
  parent: ActionTerrorSpiderBase
  id: ActionTerrorSpiderQueenEggs
  name: Lay Queen Eggs
  description: Lay a cluster of terror spider eggs.
  components:
  - type: Action
    icon: { sprite: Imperial/TerrorSpider/structures.rsi, state: eggs }
  - type: InstantAction
    event: !type:TerrorSpiderQueenEggsActionEvent

- type: entity
  parent: ActionTerrorSpiderBase
  id: ActionTerrorSpiderEmpressLings
  name: Empress Spiderlings
  description: Spawn a swarm of spiderlings.
  components:
  - type: Action
    icon: { sprite: Imperial/TerrorSpider/spiderling.rsi, state: spiderling }
  - type: InstantAction
    event: !type:TerrorSpiderEmpressLingsActionEvent

- type: entity
  parent: ActionTerrorSpiderBase
  id: ActionTerrorSpiderEmpressErase
  name: Empress Erase Brood
  description: Burn out every lesser terror spider, egg and spiderling.
  components:
  - type: Action
    icon: { sprite: Imperial/TerrorSpider/structures.rsi, state: greenshatter }
  - type: InstantAction
    event: !type:TerrorSpiderEmpressEraseActionEvent

- type: entity
  parent: ActionTerrorSpiderBase
  id: ActionTerrorSpiderPrinceCharge
