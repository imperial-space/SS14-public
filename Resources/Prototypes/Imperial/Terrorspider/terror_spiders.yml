# --------------------------------------------------------------------------------

- type: entity
  id: TerrorEggCluster
  name: terror egg cluster
  description: A cluster of tiny spider eggs. They pulse with a strong inner life, and appear to have sharp thorns on the sides.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Imperial/TerrorSpider/structures.rsi
    state: eggs
    drawdepth: FloorObjects
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        layer:
        - SlipLayer
  - type: Damageable
    damageModifierSet: Wood
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Effects/gib1.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: TerrorEggCluster

- type: entity
  id: TerrorCocoon
  name: cocoon
  description: Something wrapped in silky spider web.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/TerrorSpider/structures.rsi
    drawdepth: Mobs
    layers:
    - map: [ "enum.TerrorSpiderVisuals.Stage" ]
      state: cocoon1
  - type: TerrorSpiderVisuals
    alive: [ cocoon1, cocoon2, cocoon3, cocoon_large1, cocoon_large2, cocoon_large3 ]
    dead: []
  - type: Appearance
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        layer:
        - MidImpassable
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ContainerContainer
    containers:
      cocoon: !type:Container
  - type: TerrorCocoon

- type: entity
  id: TerrorRoyalJelly
  name: royal jelly
  description: A pulsating mass of slime, jelly, blood, and or liquified human organs considered delicious and highly nutritious by terror spiders.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Imperial/TerrorSpider/structures.rsi
    state: spiderjelly
    drawdepth: FloorObjects
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        layer:
        - SlipLayer
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: TerrorRoyalJelly

- type: entity
  id: TerrorHealEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/TerrorSpider/structures.rsi
    state: heal
    drawdepth: Effects
    shader: unshaded
  - type: TimedDespawn
    lifetime: 1.4

