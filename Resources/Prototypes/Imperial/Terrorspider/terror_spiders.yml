# --------------------------------------------------------------------------------
# Паутина
# --------------------------------------------------------------------------------

- type: entity
  abstract: true
  id: TerrorWebBase
  name: terror web
  description: It's stringy and sticky!
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Imperial/TerrorSpider/structures.rsi
    drawdepth: WallMountedItems
    layers:
    - state: stickyweb1
      map: [ "web" ]
  - type: RandomSprite
    available:
    - web:
        stickyweb1: ""
        stickyweb2: ""
  - type: Appearance
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        layer:
        - MidImpassable
  - type: Damageable
    damageModifierSet: Wood
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Weapons/slash.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20 # две сварки или один выстрел лазера
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: TemperatureDamage
    heatDamage:
      types:
        Heat: 5
    coldDamage: {}
    coldDamageThreshold: 0
  - type: Temperature
  - type: Flammable
    fireSpread: true
    damage:
      types:
        Heat: 5
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
  - type: TerrorWeb

- type: entity
  parent: TerrorWebBase
  id: TerrorWeb
  categories: [ HideSpawnMenu ]

- type: entity
  parent: TerrorWebBase
  id: TerrorWebRed
  name: reinforced web
  description: This web is reinforced with extra strands, for added strength.
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: TerrorWebBase
  id: TerrorWebGray
  name: transparent web
  description: This web is partly transparent, making it harder to see, and easier to get caught by.
  components:
  - type: Sprite
    color: "#ffffff96"

- type: entity
  parent: TerrorWebBase
  id: TerrorWebGreen
  name: slimy web
  description: This web is partly composed of strands of green slime.
  components:
  - type: TerrorWeb
    ability: Green

- type: entity
  parent: TerrorWebBase
  id: TerrorWebBlack
  name: sinister web
  description: This web has beads of a dark fluid on its strands.
  components:
  - type: TerrorWeb
    ability: Black

- type: entity
  parent: TerrorWebBase
  id: TerrorWebWhite
  name: infested web
  description: This web is covered in hundreds of tiny, biting spiders - and their eggs.
  components:
  - type: TerrorWeb
    ability: White

- type: entity
  parent: TerrorWebBase
  id: TerrorWebPurple
  name: thick web
  description: This web is so thick, most cannot see beyond it.
  components:
  - type: Occluder
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: TerrorWebBase
  id: TerrorWebQueen
  name: airtight web
  description: This multi-layered web seems to be able to resist air pressure.
  components:
  - type: Airtight

- type: entity
  parent: TerrorWebBase
  id: TerrorWebMother
  name: mother web
  description: This web is coated in pheromones which prevent spiderlings from passing it.
  components:
  - type: TerrorWeb
    blocksSpiderlings: true
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        layer:
        - MidImpassable
      # Паучата упираются в паутину матери.
      spiderlings:
        hard: true
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        layer:
        - SmallMobLayer

