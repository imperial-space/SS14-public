# --------------------------------------------------------------------------------
# Действия
# --------------------------------------------------------------------------------

- type: entity
  abstract: true
  parent: BaseAction
  id: ActionTerrorSpiderBase
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 1

- type: entity
  parent: ActionTerrorSpiderBase
  id: ActionTerrorSpiderWeb
  name: Web
  description: Spin a terror web under yourself.
  components:
  - type: Action
    icon: { sprite: Imperial/TerrorSpider/structures.rsi, state: stickyweb1 }
  - type: InstantAction
    event: !type:TerrorSpiderWebActionEvent

- type: entity
  parent: ActionTerrorSpiderBase
  id: ActionTerrorSpiderWrap
  name: Wrap
  description: Wrap a corpse or object next to you in a cocoon.
  components:
  - type: Action
    icon: { sprite: Imperial/TerrorSpider/structures.rsi, state: cocoon_large1 }
  - type: InstantAction
    event: !type:TerrorSpiderWrapActionEvent

- type: entity
  parent: ActionTerrorSpiderBase
  id: ActionTerrorSpiderGreenEggs
  name: Lay Green Eggs
  description: Lay a cluster of eggs. Requires two wrapped corpses.
  components:
  - type: Action
    icon: { sprite: Imperial/TerrorSpider/structures.rsi, state: eggs }
  - type: InstantAction
    event: !type:TerrorSpiderGreenEggsActionEvent

- type: entity
  parent: ActionTerrorSpiderBase
