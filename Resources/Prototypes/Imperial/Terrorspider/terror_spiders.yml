    useDelay: 30
    icon: { sprite: Imperial/TerrorSpider/spiders.rsi, state: terror_allblack }
  - type: TargetAction
    range: 9
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:TerrorSpiderPrinceChargeActionEvent

