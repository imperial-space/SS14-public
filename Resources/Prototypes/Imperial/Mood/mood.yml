# Галлюцинации рассудка (hallucination/sanity): слуховые, как у черты «Паракузия».
- type: entity
  id: ImperialMoodHallucinations
  categories: [ HideSpawnMenu ]
  components:
  - type: Paracusia
    minTimeBetweenIncidents: 30
    maxTimeBetweenIncidents: 120
    maxSoundDistance: 7
    sounds:
      collection: Paracusia
