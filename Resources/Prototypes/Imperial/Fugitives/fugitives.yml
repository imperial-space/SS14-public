# Беглецы и охотники за беглецами TG (antagonists/fugitive, dynamic_ruleset_midround fugitives).

# ─── Роли ───

- type: antag
  id: ImperialFugitive
  name: roles-antag-imperial-fugitive-name
  antagonist: true
  setPreference: false
  objective: roles-antag-imperial-fugitive-objective

- type: antag
  id: ImperialFugitiveHunter
  name: roles-antag-imperial-fugitive-hunter-name
  antagonist: true
  setPreference: false
  objective: roles-antag-imperial-fugitive-hunter-objective

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleImperialFugitive
  components:
  - type: MindRole
    antagPrototype: ImperialFugitive
    roleType: TeamAntagonist
  - type: ImperialFugitiveRole

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleImperialFugitiveHunter
  components:
  - type: MindRole
    antagPrototype: ImperialFugitiveHunter
    roleType: TeamAntagonist
  - type: ImperialFugitiveHunterRole

# ─── Правило (мидраунд: weight 3, min_pop 20) ───

- type: entity
  parent: BaseGameRule
  id: ImperialFugitives
  components:
  - type: StationEvent
    weight: 3
    duration: null
    earliestStart: 20
    minimumPlayers: 20
    maxOccurrences: 1
  - type: ImperialFugitivesRule

# ─── Цели ───

- type: entity
  parent: BaseObjective
  id: ImperialFugitiveEvadeObjective
  name: Избегайте поимки охотниками за беглецами.
  description: Охотники уже в пути. Не попадитесь им в руки.
  components:
  - type: Objective
    issuer: objective-issuer-imperial-fugitive
    difficulty: 1
    unique: true
    icon:
      sprite: Imperial/Fugitives/Clothing/waldo_hat.rsi
      state: icon
  - type: ImperialFugitiveEvadeCondition

- type: entity
  parent: BaseObjective
  id: ImperialFugitiveCaptureObjective
  name: Захватите беглецов на станции и поместите их в блюспейс-устройство захвата на вашем корабле.
  description: Живыми или мёртвыми.
  components:
  - type: Objective
    issuer: objective-issuer-imperial-fugitive-hunter
    difficulty: 1
    unique: true
    icon:
      sprite: Imperial/Fugitives/machines.rsi
      state: capture
  - type: ImperialFugitiveCaptureCondition

# ─── Гост-роли ───

- type: entity
  parent: MobHuman
  id: ImperialMobFugitiveHuman
  categories: [ HideSpawnMenu ]
  components:
  - type: RandomHumanoidAppearance
    randomizeName: true
  - type: ImperialFugitivePending

- type: entity
  abstract: true
  parent: MarkerBase
  id: BaseImperialFugitiveSpawner
  components:
  - type: GhostRoleMobSpawner
    prototype: ImperialMobFugitiveHuman
  - type: GhostRole
    rules: ghost-role-information-antagonist-rules
    raffle:
      settings: short
  - type: ImperialFugitiveSpawner

- type: entity
  parent: BaseImperialFugitiveSpawner
  id: ImperialSpawnPointFugitive
  name: беглец
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: GhostRole
    name: imperial-fugitive-ghost-name
    description: imperial-fugitive-ghost-desc
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: short
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - sprite: Imperial/Fugitives/Clothing/waldo_hat.rsi
      state: icon

