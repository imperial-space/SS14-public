- type: entity
  parent: BaseItem
  id: ImperialInvisibilityInjector
  name: автоинъектор невидимости
  description: Автоинъектор со стабилизированным составом Сатурн-X. Создан для тактических операций скрытности — видимо, теми, кому было не стыдно ходить голышом.
