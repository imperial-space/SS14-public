# ─── Машины охотников (hunter_gear.dm) ───

- type: entity
  id: ImperialFugitiveCapture
  name: блюспейс-машина захвата
  description: Внутри она гораздо, ГОРАЗДО больше, чтобы безопасно перевозить заключённых. Перетащите заключённого на машину.
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Imperial/Fugitives/machines.rsi
    state: capture
    drawdepth: Objects
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ContainerContainer
    containers:
      imperial_fugitive_prison: !type:Container
  - type: ImperialFugitiveCapture

- type: entity
  parent: ImperialFugitiveCapture
  id: ImperialFugitiveCapturePsyker
  name: рекреационная камера псайкеров
  description: Перепрофилированная камера, успокаивающая пользователя громкими звуками и болезненными стимулами. Переоборудована для содержания заключённых — затягивает беглецов, оказавшихся рядом.
  components:
  - type: ImperialFugitiveCapture
    suckIn: true

- type: entity
  id: ImperialFugitiveLocator
  name: локатор целей
  description: Отслеживает сигнатуры целей за награду в вашем секторе. Никто толком не знает, как эта штука работает, но она найдёт того, кого вы ищете, где бы он ни скрывался.
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Imperial/Fugitives/machines.rsi
    state: locator
    drawdepth: Objects
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Speech
    speechVerb: Robotic
  - type: ImperialFugitiveLocator

# /obj/effect/forcefield/psychic
- type: entity
  id: ImperialPsychicForcefield
  name: психическое силовое поле
  description: Стена психической энергии, достаточно сильная, чтобы остановить движение предметов. Снаряды от неё рикошетят.
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    sprite: Imperial/Fugitives/items.rsi
    state: psychic
    drawdepth: Overdoors
    shader: unshaded
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Reflect
    reflectProb: 1
  - type: PointLight
    radius: 1.5
    energy: 0.5
    color: "#3a9bff"

- type: entity
  parent: ImperialPsychicForcefield
  id: ImperialPsychicForcefieldTemporary
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 10

