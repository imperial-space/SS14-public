# /obj/item/clothing/suit/space/hunter
- type: entity
  parent: ClothingOuterArmorBase
  id: ImperialClothingOuterHardsuitHunter
  name: костюм охотника за головами
  description: Специализированная броня охотника за головами. Изрядно потрёпана.
  components:
  - type: Sprite
    sprite: Imperial/Fugitives/Clothing/hunter_suit.rsi
  - type: Clothing
    sprite: Imperial/Fugitives/Clothing/hunter_suit.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.5
        Heat: 0.6
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1

