# ==============================================
#  Еретик — Игровое правило
# ==============================================

- type: entity
  id: HereticGameRule
  parent: BaseGameRule
  components:
  - type: GameRule
    minPlayers: 20
  - type: HereticRule
    maxHeretics: 1
    requiredSacrifices: 5
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Heretic ]
      min: 1
      max: 1
      playerRatio: 25
      briefing:
        text: heretic-role-greeting
        color: DarkRed
      startingGear: HereticStartingGear
      components:
      - type: Heretic
      mindRoles:
      - MindRoleHeretic
  - type: DynamicRuleCost
    cost: 200

# Масштабируемый вариант: 15-29 игроков = 1, 30-59 = 2-3, 60+ = 3-4 еретика
- type: entity
  id: HereticGameRuleScaled
  parent: BaseGameRule
  components:
  - type: GameRule
    minPlayers: 15
  - type: HereticRule
    maxHeretics: 4
    requiredSacrifices: 5
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Heretic ]
      min: 1
      playerRatio: 15
      maxRange:
        min: 3
        max: 4
      briefing:
        text: heretic-role-greeting
        color: DarkRed
      startingGear: HereticStartingGear
      components:
      - type: Heretic
      mindRoles:
      - MindRoleHeretic
  - type: DynamicRuleCost
    cost: 200
