# ==============================================
#  Еретик — Сущности
# ==============================================

# ─── Держатель BUI знаний (невидимый дочерний объект еретика) ───

- type: entity
  id: HereticKnowledgeHolder
  name: heretic-knowledge-holder
  categories: [ HideSpawnMenu ]
  components:
  - type: HereticKnowledgeHolder
  - type: UserInterface
    interfaces:
      enum.HereticInfoBuiKey.Key:
        type: HereticInfoBui
      enum.HereticTargetBuiKey.Key:
        type: HereticTargetBui
      enum.HereticFleshWeaveOrganBuiKey.Key:
        type: HereticFleshWeaveOrganBui
      enum.HereticLockShapeshiftUiKey.Key:
        type: HereticLockShapeshiftBui

# ─── Кружащийся клинок (Метка клинка / Яростная сталь) ───

- type: entity
  id: HereticOrbitingBlade
  name: heretic-orbiting-blade-name
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags:
      - HideContextMenu
  - type: Sprite
    sprite: Imperial/heretic/eldritch_fx.rsi
    state: dio_knife
    noRot: true
  - type: OrbitVisuals
  - type: HereticOrbitingBlade

# ─── Летящий клинок (Ярость клинков — бросок) ───

- type: entity
  parent: BaseBullet
  id: HereticThrownBlade
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: Imperial/heretic/eldritch_fx.rsi
    noRot: false
    layers:
    - state: dio_knife
      shader: unshaded
      rotation: 180
  - type: Projectile
    damage:
      types:
        Slash: 25
    armorPenetration: 100
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable

# ─── Руна трансмутации ───

- type: entity
  id: HereticTransmutationRune
  name: heretic-rune-name
  description: heretic-rune-desc
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: Imperial/heretic/effects_96.rsi
    state: transmutation_rune
    noRot: false
  - type: HereticRune
  - type: InteractionOutline
  - type: Clickable
  - type: UserInterface
    interfaces:
      enum.HereticRitualBuiKey.Key:
        type: HereticRitualBui

# ─── Разлом реальности (видим только еретикам) ───

- type: entity
  id: HereticRealityRift
  name: heretic-rift-name
  description: heretic-rift-desc
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: Imperial/heretic/eldritch_fx.rsi
    state: reality_smash
    noRot: true
  - type: Visibility
    layer: 32 # VisibilityFlags.HereticRift — only heretics can see this
  - type: HereticRealityRift
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.4
        hard: false
        layer:
        - MidImpassable

# ─── Брешь реальности (видна всем, нельзя поглотить) ───

- type: entity
  id: HereticRealityBreach
  name: heretic-breach-name
  description: heretic-breach-desc
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: Imperial/heretic/eldritch_fx.rsi
    state: pierced_illusion
    noRot: true
  - type: HereticRealityBreach
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.4
        hard: false
        layer:
        - MidImpassable

# ─── Печать Пакта ───

- type: entity
