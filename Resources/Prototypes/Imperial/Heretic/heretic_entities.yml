# ─── Стена ржавчины (Ржавая конструкция) ──────────────────────────────────

- type: entity
  parent: BaseStructureWall
  id: HereticRustWall
  name: ent-HereticRustWall
  components:
  - type: Sprite
    sprite: Structures/Walls/solid_rust.rsi
  - type: Icon
    sprite: Structures/Walls/solid_rust.rsi
    state: rgeneric
  - type: IconSmooth
    key: walls
    base: reinf_over
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam

