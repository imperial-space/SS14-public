# ─── Controllable формы для полиморфа ───

- type: entity
  parent: BaseControllable
  id: MobHereticLockRustWalker
  categories:
  - HideSpawnMenu
  components:
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 15
        mask:
        - Impassable
        - BlobImpassable
        - HighImpassable
        - LowImpassable
        layer:
        - MobLayer
        - MidImpassable
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.0
    baseSprintSpeed: 4.0
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    layers:
    - state: rust_walker_s
      sprite: Imperial/heretic/eldritch_mobs.rsi
  - type: InputMover
  - type: Damageable
    damageContainer: Biological
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: HereticRustWalker
  - type: ActionGrant
    actions:
    - ActionHereticRustWalkerAggressiveSpread
    - ActionHereticRustWalkerLesserPatrinsReach
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcClaw
    attackRate: 1.5
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Slash: 20
        Blunt: 5
  - type: CombatMode

