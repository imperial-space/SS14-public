# ─── Разрыв Замка ───

- type: entity
  id: HereticLockTear
  name: ent-HereticLockTear
  categories:
  - HideSpawnMenu
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: Effects
    sprite: Imperial/heretic/effects.rsi
    color: "#7B2FBE"
    layers:
    - state: void_conduit
      shader: unshaded
  - type: HereticLockTear
  - type: PointLight
    radius: 2.5
    energy: 2.0
    color: "#7B2FBE"
  - type: GhostRole
    name: heretic-lock-tear-ghost-role-name
    description: heretic-lock-tear-ghost-role-desc
    rules: ghost-role-component-default-rules
    makeSentient: true
    allowMovement: true
  - type: GhostRoleMobSpawner
    deleteOnSpawn: false
    availableTakeovers: 999
    prototype: MobHereticRustWalker
