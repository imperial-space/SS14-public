# ==============================================
#  Возвышение Замка — Шейпшифт и Разрыв
# ==============================================

# ─── Polymorph прототип ───

- type: polymorph
  id: HereticLockAscendedForm
  configuration:
    entity: MobHereticLockAscended
    transferName: true
    inventory: Drop
    revertOnDeath: true
    allowRepeatedMorphs: false
    forced: false

# ─── Форма возвышения (управляется игроком) ───

- type: entity
  parent: BaseControllable
  id: MobHereticLockAscended
  categories:
  - HideSpawnMenu
  components:
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 60
        mask:
        - Impassable
        - BlobImpassable
        - HighImpassable
        - LowImpassable
        layer:
        - MobLayer
        - MidImpassable
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.5
    baseSprintSpeed: 4.5
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/heretic/eldritch_mobs.rsi
    layers:
    - state: armsy_end
  - type: InputMover
  - type: Damageable
    damageContainer: Biological
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSlime
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcClaw
    attackRate: 1.5
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Slash: 22
        Blunt: 5
  - type: CombatMode
  - type: CosmosMarkImmune

# ─── Polymorph прототипы выбора формы ───

- type: polymorph
  id: HereticLockPolymorph_RustWalker
