- type: entity
  id: HereticAshSpirit
  suffix: "Еретик, существо"
  name: heretic-familiar-ash-spirit-name
  description: heretic-familiar-ash-spirit-desc
  parent:
  - BaseSimpleMob
  - MobCombat
  components:
  - type: HereticAshSpirit
  - type: GhostRole
    allowMovement: true
    makeSentient: true
    name: ghost-role-information-heretic-ash-spirit-name
    description: ghost-role-information-heretic-ash-spirit-description
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: ActionGrant
    actions:
    - ActionHereticAshSpiritShift
    - ActionHereticAshSpiritFlameOath
  - type: CombatMode
    isInCombatMode: true
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: ash_walker
      sprite: Imperial/heretic/eldritch_mobs.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: ash_walker
      Dead:
        Base: ash_walker
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Dead
  - type: NpcFactionMember
    factions:
    - HereticFamiliar
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 15
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.0
    baseSprintSpeed: 5.5
  - type: MeleeWeapon
    attackRate: 1.0
    hidden: true
    soundHit:
      collection: GenericHit
    damage:
      types:
        Slash: 17
  - type: Tag
    tags:
    - FootstepSound
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepAsteroid
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.0
  - type: ZombieImmune
  - type: NoSlip
  - type: PointLight
    color: "#ff8800"
    radius: 2.0
    softness: 1.5
    energy: 1.5

