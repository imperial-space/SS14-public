# ==============================================

# ─── Базовый клинок еретика ───

- type: entity
  abstract: true
  id: BaseHereticBlade
  suffix: "Еретик, клинок"
  name: heretic-blade-base-name
  description: heretic-blade-base-desc
  parent: BaseItem
  components:
  - type: Sprite
    sprite: Imperial/heretic/khopesh.rsi
    state: render
  - type: Item
    size: Normal
    sprite: Imperial/heretic/khopesh.rsi
  - type: MeleeWeapon
    attackRate: 1.5
    range: 1.5
    damage:
      types:
        Slash: 18
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Tag
    tags:
    - HereticBlade
    - HereticItem
  - type: HereticBladeWeapon

# ─── Расколотый клинок ───

- type: entity
  id: HereticBladeSundered
  parent: BaseHereticBlade
  name: heretic-blade-sundered-name
  description: heretic-blade-sundered-desc
  components:
  - type: Sprite
    sprite: Imperial/heretic/blade_sundered.rsi
    layers:
    - state: dark_blade
      map: [ "icon" ]
  - type: Item
    sprite: Imperial/heretic/blade_sundered_inhand.rsi
    heldPrefix: sundered_blade
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.HereticBladeSunderedVisuals.Infused:
        icon:
          True: { state: dark_blade_infused }
          False: { state: dark_blade }

