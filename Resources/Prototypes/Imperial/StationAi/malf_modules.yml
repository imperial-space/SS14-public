  name: Вернуться в ядро
  description: Покинуть ЛКП и вернуться в своё ядро, если оно цело.
  components:
  - type: Action
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: ai_core
  - type: InstantAction
    event: !type:ImperialMalfReturnToCoreActionEvent

# ─── Сущности ───
# mimic/copy/machine: облик берётся с машины, см. ImperialMalfMimicComponent.
- type: entity
  parent: [ SimpleMobBase, MobCombat ]
  id: ImperialMalfMachineMimic
  name: машина
  description: Она двигается.
  categories: [ HideSpawnMenu ]
  components:
  - type: ImperialMalfMimic
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Sprite
    drawdepth: Mobs
    sprite: Structures/Machines/VendingMachines/cola.rsi
    state: normal
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 1000
        mask:
        - MobMask
        layer:
        - MachineLayer
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcFist
    damage:
      types:
        Blunt: 15
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2.5

# /obj/machinery/transformer: лента, превращающая людей в киборгов.
- type: entity
  id: ImperialMalfRoboticFactory
  name: роботизированная фабрика
  description: Огромная машина, превращающая всё, что лежит на ленте, в киборгов. Выглядит недружелюбно.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Sprite
    drawdepth: FloorObjects
    layers:
    - sprite: Structures/conveyor.rsi
      state: conveyor_started_cw
      offset: -1,0
    - sprite: Structures/conveyor.rsi
      state: conveyor_started_cw
    - sprite: Structures/conveyor.rsi
      state: conveyor_started_cw
      offset: 1,0
    - sprite: Structures/Machines/recycling.rsi
      state: grinder-o0
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StrongMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# «Пилот-призрак» меха, захваченного ИИ.
- type: entity
  id: ImperialMalfMechProxy
