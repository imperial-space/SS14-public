    icon:
      sprite: Structures/Wallmounts/Lighting/emergency_light.rsi
      state: emergency_light_off
  - type: InstantAction
    event: !type:ImperialMalfEmergencyLightsActionEvent

- type: entity
  parent: BaseActionImperialMalf
  id: ActionImperialMalfReactivateCameras
  name: Перезапуск камер
  description: Включить отключённые камеры станции. Каждая камера тратит одно применение.
  components:
  - type: Action
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: reactivate_cameras
  - type: InstantAction
    event: !type:ImperialMalfReactivateCamerasActionEvent

- type: entity
  parent: BaseActionImperialMalfEntity
  id: ActionImperialMalfEmag
  name: Удалённый взлом
  description: Снять предохранители с выбранного устройства, как криптографическим секвенсором.
  components:
  - type: Action
    icon:
      sprite: Objects/Tools/emag.rsi
      state: icon
  # ИИ выбирает точку, сервер берёт подходящую сущность у места клика.
  - type: WorldTargetAction
    event: !type:ImperialMalfEmagActionEvent

- type: entity
  parent: BaseActionImperialMalfEntity
  id: ActionImperialMalfDominateMech
  name: Захват меха
  description: Выбросить пилота и взять мех под полный контроль.
  components:
  - type: Action
    icon:
      sprite: Objects/Specific/Mech/mecha.rsi
      state: ripley
  # ИИ выбирает точку, сервер берёт подходящую сущность у места клика.
  - type: WorldTargetAction
    event: !type:ImperialMalfDominateMechActionEvent

- type: entity
  parent: BaseActionImperialMalf
  id: ActionImperialMalfMechReturn
  name: Вернуться в ядро
  description: Покинуть захваченный мех.
  components:
  - type: Action
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: ai_core
  - type: InstantAction
    event: !type:ImperialMalfMechReturnActionEvent

- type: entity
  parent: BaseActionImperialMalf
  id: ActionImperialMalfVoiceChanger
  name: Изменение голоса
  description: Говорить чужим именем. Пустое имя — вернуть свой голос.
  components:
  - type: Action
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: voice_changer
  - type: InstantAction
    event: !type:ImperialMalfVoiceChangerActionEvent

- type: entity
  parent: BaseActionImperialMalf
  id: ActionImperialMalfRoll
  name: Перекатиться
  description: Опрокинуть ядро на соседнюю клетку, раздавив всех, кто там стоит.
  components:
  - type: Action
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: roll_over
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:ImperialMalfRollActionEvent

- type: entity
  parent: BaseActionImperialMalf
  id: ActionImperialMalfVendorTilt
  name: Опрокинуть автомат
  description: Обрушить торговый автомат рядом с выбранной клеткой прямо на неё.
  components:
  - type: Action
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: vendor_tilt
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:ImperialMalfVendorTiltActionEvent

- type: entity
  parent: BaseActionImperialMalf
  id: ActionImperialMalfDoomsday
  name: Устройство Судного дня
  description: Запустить устройство Судного дня. Через 450 секунд вся органическая жизнь на станции погибнет. Ядро должно уцелеть.
  components:
  - type: Action
    priority: -13
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: ai_malf_core
  - type: InstantAction
    event: !type:ImperialMalfDoomsdayActionEvent

- type: entity
  parent: BaseActionImperialMalfEntity
  id: ActionImperialMalfShunt
  name: Перенос в ЛКП
  description: Перенести своё ядро во взломанный ЛКП. Если ЛКП уничтожат — вы погибнете.
  components:
  - type: Action
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: ai_shell
  # ИИ выбирает точку, сервер берёт подходящую сущность у места клика.
  - type: WorldTargetAction
    event: !type:ImperialMalfShuntActionEvent

- type: entity
  parent: BaseActionImperialMalf
