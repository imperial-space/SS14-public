# ─── Действия модулей ───
- type: entity
  abstract: true
  parent: BaseAction
  id: BaseActionImperialMalf
  components:
  - type: Action
    priority: -10
    itemIconStyle: BigAction

- type: entity
  abstract: true
  parent: BaseActionImperialMalf
  id: BaseActionImperialMalfEntity
  components:
  - type: TargetAction
    checkCanAccess: false
    range: 0

- type: entity
  parent: BaseActionImperialMalf
  id: ActionImperialMalfLockdown
  name: Блокировка
  description: Закрыть, заблокировать и электрифицировать все шлюзы станции на 90 секунд.
  components:
  - type: Action
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: lockdown
  - type: InstantAction
    event: !type:ImperialMalfLockdownActionEvent

- type: entity
  parent: BaseActionImperialMalfEntity
  id: ActionImperialMalfOverrideMachine
  name: Оживить машину
  description: Через 5 секунд выбранная машина оживёт и нападёт на окружающих.
  components:
  - type: Action
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: override_machine
  # ИИ выбирает точку, сервер берёт подходящую сущность у места клика.
  - type: WorldTargetAction
    event: !type:ImperialMalfOverrideMachineActionEvent

- type: entity
  parent: BaseActionImperialMalfEntity
  id: ActionImperialMalfOverloadMachine
  name: Перегрузить машину
  description: Через 5 секунд выбранная машина взорвётся.
  components:
  - type: Action
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: overload_machine
  # ИИ выбирает точку, сервер берёт подходящую сущность у места клика.
  - type: WorldTargetAction
    event: !type:ImperialMalfOverloadMachineActionEvent

- type: entity
  parent: BaseActionImperialMalf
  id: ActionImperialMalfDestroyRcds
  name: Взорвать РЦД
  description: Подорвать все РЦД на станции, кроме установленных в киборгах.
  components:
  - type: Action
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: detonate_rcds
  - type: InstantAction
    event: !type:ImperialMalfDestroyRcdsActionEvent

- type: entity
  parent: BaseActionImperialMalf
  id: ActionImperialMalfBlackout
  name: Отключение света
  description: Перегрузить осветительные цепи станции, разбивая лампы.
  components:
  - type: Action
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: blackout
  - type: InstantAction
    event: !type:ImperialMalfBlackoutActionEvent

- type: entity
  parent: BaseActionImperialMalf
  id: ActionImperialMalfHonk
  name: Мегахонк
  description: Включить сирену на всех интеркомах станции, оглушая экипаж.
  components:
  - type: Action
    icon:
      sprite: Objects/Fun/bikehorn.rsi
      state: icon
  - type: InstantAction
    event: !type:ImperialMalfHonkActionEvent

- type: entity
  parent: BaseActionImperialMalf
  id: ActionImperialMalfFactory
  name: Роботизированная фабрика
  description: Построить фабрику киборгов там, куда смотрит ваш взгляд. Нужны три свободные клетки пола в ряд.
  components:
  - type: Action
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: robotic_factory
  - type: InstantAction
    event: !type:ImperialMalfFactoryActionEvent

- type: entity
  parent: BaseActionImperialMalfEntity
  id: ActionImperialMalfFlood
  name: Режим затопления
  description: Перевести воздушную тревогу в режим затопления, отключив все проверки давления.
  components:
  - type: Action
    icon:
      sprite: Structures/Wallmounts/air_monitors.rsi
      state: alarm2
  # ИИ выбирает точку, сервер берёт подходящую сущность у места клика.
  - type: WorldTargetAction
    event: !type:ImperialMalfFloodActionEvent

- type: entity
  parent: BaseActionImperialMalf
  id: ActionImperialMalfFireAlarms
  name: Отключить пожарную тревогу
  description: Пожарные тревоги перестанут замечать огонь, пожарные шлюзы откроются.
  components:
  - type: Action
    icon:
      sprite: Imperial/StationAi/malf.rsi
      state: break_fire_alarms
  - type: InstantAction
    event: !type:ImperialMalfFireAlarmsActionEvent

- type: entity
  parent: BaseActionImperialMalf
  id: ActionImperialMalfEmergencyLights
  name: Отключить аварийный свет
  description: Навсегда отключить аварийное освещение станции.
  components:
