# Кража для мага (/datum/objective/steal): те же предметы, что у предателя, но от Федерации волшебников.

- type: weightedRandom
  id: ImperialWizardObjectiveGroupSteal
  weights:
    ImperialWizardCaptainIDStealObjective: 1
    ImperialWizardCMOHyposprayStealObjective: 1
    ImperialWizardCMOCrewMonitorStealObjective: 1
    ImperialWizardRDHardsuitStealObjective: 1
    ImperialWizardNukeDiskStealObjective: 1
    ImperialWizardMagbootsStealObjective: 1
    ImperialWizardCorgiMeatStealObjective: 1
    ImperialWizardClipboardStealObjective: 1
    ImperialWizardKnuckleDustersStealObjective: 1
