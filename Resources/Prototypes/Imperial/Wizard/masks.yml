# Проклятые маски животных (clothing/masks/animal_masks.dm, GLOB.cursed_animal_masks).

- type: entity
  abstract: true
  parent: [ ClothingMaskBase, BaseMagicalContraband ]
  id: BaseImperialCursedMask
  components:
  - type: Unremoveable
    deleteOnDrop: false
  - type: ImperialCursedMask

- type: entity
  parent: BaseImperialCursedMask
  id: ImperialCursedMaskPig
  name: свиное лицо
  description: Похоже на маску свиньи, но если присмотреться — она срослась с лицом!
  components:
  - type: Sprite
    sprite: Imperial/Wizard/Masks/pig.rsi
  - type: Clothing
    sprite: Imperial/Wizard/Masks/pig.rsi
  - type: ImperialAnimalMask
    sounds: [ "Хрю!", "Иииииии!", "Хрю-хрю!" ]

- type: entity
  parent: BaseImperialCursedMask
