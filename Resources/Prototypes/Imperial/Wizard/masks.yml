  - type: ImperialAnimalMask
    sounds: [ "Ква!!", "Квааа!!", "КВААА!!", "КВААААА!!" ]
    altSounds: [ "ХУУУУУ!!", "КУРИМ!!", "Слезьте с меня!!", "КТО-НИБУДЬ, ОСТАНОВИТЕ МЕНЯ!!", "Мне плохо, мужик." ]
