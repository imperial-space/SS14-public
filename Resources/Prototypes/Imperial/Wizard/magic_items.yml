# Посохи и палочки мага TG (code/modules/projectiles/guns/magic).

- type: entity
  abstract: true
  parent: [ BaseItem, BaseMagicalContraband ]
  id: BaseImperialMagicStaff
  components:
  - type: Sprite
    sprite: Imperial/Wizard/staffs.rsi
  - type: Item
    size: Huge
    sprite: Imperial/Wizard/staffs.rsi
  - type: Gun
    fireRate: 1.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Imperial/Wizard/emitter.ogg
  - type: BasicEntityAmmoProvider
    proto: ImperialBoltNothing
    capacity: 6
    count: 6
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 8
  - type: ImperialMagicStaff

- type: entity
  abstract: true
  parent: [ BaseItem, BaseMagicalContraband ]
