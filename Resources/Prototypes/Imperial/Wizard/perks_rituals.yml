# /mob/living/basic/wizard_worm
- type: entity
  parent: [ SimpleMobBase, MobCombat ]
  id: ImperialWizardWorm
  name: магический червь
  description: Большой синий червь. Что будет, если сунуть руку ему в пасть?
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/Wizard/wizard_worm.rsi
    layers:
    - state: start
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: DamageStateVisuals
    states:
      Alive:
        Base: start
      Dead:
        Base: start
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - Wizard
  - type: MobThresholds
    thresholds:
      0: Alive
      800: Dead
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Blunt: 25
        Structural: 200
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: MovementAlwaysTouching
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer

- type: entity
  id: ImperialWizardWormSegment
  name: магический червь
  description: Большой синий червь.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/Wizard/wizard_worm.rsi
    state: mid
    noRot: false
  - type: Clickable
  - type: InteractionOutline

- type: entity
  parent: ImperialWizardWormSegment
  id: ImperialWizardWormTail
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: end

