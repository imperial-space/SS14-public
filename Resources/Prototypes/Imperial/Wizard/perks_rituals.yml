# Вырванное сердце (/datum/component/heart_eater).
- type: entity
  parent: BaseItem
  id: ImperialRippedHeart
  name: вырванное сердце
  description: Ещё тёплое. Пожиратель сердец знает, что с ним делать.
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: heart-on
  - type: Item
    size: Small
  - type: ImperialRippedHeart

# /datum/objective/survive (выживальщик после призыва оружия или магии).
- type: entity
  parent: BaseObjective
  id: ImperialSurvivalistObjective
  name: Выжить любой ценой
  description: Станция сошла с ума. Не расставайтесь с оружием и улетите на эвакуационном шаттле живым.
  components:
  - type: Objective
    issuer: objective-issuer-imperial-wizard
    difficulty: 1
    icon:
      sprite: Objects/Weapons/Guns/Pistols/viper.rsi
      state: icon
  - type: EscapeShuttleCondition
