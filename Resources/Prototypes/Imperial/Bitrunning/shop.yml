# ─── Заклинания дисков ───
- type: entity
  parent: BaseAction
  id: ActionBitrunningSummonCheese
  name: Призыв сыра
  description: Это заклинание создаёт кучу головок сыра. Что за чертовщина?
  components:
  - type: Action
    useDelay: 60
    icon:
      sprite: Objects/Consumable/Food/ingredients.rsi
      state: cheesewheel
  - type: InstantAction
    event: !type:BitrunningSummonCheeseActionEvent

- type: entity
  parent: BaseAction
  id: ActionBitrunningLesserHeal
  name: Малое исцеление
  description: Лечит небольшое количество грубого урона и ожогов.
  components:
  - type: Action
    useDelay: 10
    icon:
      sprite: Objects/Specific/Medical/firstaidkits.rsi
      state: firstaid
  - type: InstantAction
    event: !type:BitrunningLesserHealActionEvent

- type: entity
  parent: BaseAction
  id: ActionBitrunningLightningBolt
  name: Удар молнии
  description: Пускает молнию в выбранную цель.
  components:
  - type: Action
    useDelay: 15
    icon:
      sprite: Effects/lightning.rsi
      state: lightning_1
  - type: TargetAction
    range: 8
  - type: EntityTargetAction
    event: !type:BitrunningLightningBoltActionEvent

- type: entity
  parent: BaseAction
  id: ActionBitrunningPolymorphBear
  name: Облик белого медведя
  description: Превращает вас в огромного медведя.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Mobs/Animals/bear.rsi
      state: bear
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: BitrunningPolarBear

- type: polymorph
  id: BitrunningPolarBear
  configuration:
    entity: MobBearSpace
    forced: true
    inventory: Drop
    transferName: true
    transferDamage: true
    revertOnCrit: true
    revertOnDeath: true

# ─── Оборудование отдела через карго (на картах SS14 логова битраннеров нет) ───
- type: entity
  parent: BaseFlatpack
  id: BitrunningQuantumServerFlatpack
  name: флэтпак квантового сервера
  description: Флэтпак для сборки квантового сервера.
  components:
  - type: Flatpack
    entity: BitrunningQuantumServer

- type: entity
  parent: BaseFlatpack
  id: BitrunningQuantumConsoleFlatpack
  name: флэтпак квантовой консоли
  description: Флэтпак для сборки квантовой консоли. Ставится вплотную к серверу.
  components:
  - type: Flatpack
    entity: BitrunningQuantumConsole

- type: entity
  parent: BaseFlatpack
  id: BitrunningNetpodFlatpack
  name: флэтпак нетпода
  description: Флэтпак для сборки нетпода. Ставится не дальше 4 клеток от сервера.
  components:
  - type: Flatpack
    entity: BitrunningNetpod

- type: entity
  parent: BaseFlatpack
  id: BitrunningByteforgeFlatpack
  name: флэтпак байтфоржа
  description: Флэтпак для сборки байтфоржа. Ставится не дальше 4 клеток от сервера.
  components:
  - type: Flatpack
    entity: BitrunningByteforge

- type: entity
  parent: BaseFlatpack
  id: BitrunningVendorFlatpack
  name: флэтпак торгомата NexaCache
  description: Флэтпак для сборки торгомата снаряжения битраннеров.
  components:
  - type: Flatpack
    entity: BitrunningVendor

- type: entity
  parent: CrateGenericSteel
  id: CrateCargoBitrunningDen
  name: ящик оборудования битраннинга
  description: Квантовый сервер, консоль, четыре нетпода, байтфорж и торгомат NexaCache для логова битраннеров.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: BitrunningQuantumServerFlatpack
        - id: BitrunningQuantumConsoleFlatpack
        - id: BitrunningNetpodFlatpack
          amount: 4
        - id: BitrunningByteforgeFlatpack
        - id: BitrunningVendorFlatpack

- type: cargoProduct
  id: CargoBitrunningDen
  icon:
    sprite: Imperial/Bitrunning/machines.rsi
    state: qserver
  product: CrateCargoBitrunningDen
  cost: 3000
  category: cargoproduct-category-name-cargo
  group: ImperialCargo

# /datum/techweb_node/bitrunning: платы открываются исследованием «Технологии битрана».
- type: technology
  id: ImperialTgBitrunning
  name: imperial-tg-tech-bitrunning
  icon:
    sprite: Imperial/Bitrunning/machines.rsi
    state: netpod
  discipline: ImperialTgSupply
  tier: 3
  cost: 9000
  recipeUnlocks:
  - BitrunningRecipeByteforge
  - BitrunningRecipeQuantumConsole
  - BitrunningRecipeNetpod
  technologyPrerequisites:
  - ImperialTgGaming
  - ImperialTgAppliedBluespace

- type: latheRecipe
  parent: BaseCircuitboardRecipe
  id: BitrunningRecipeByteforge
  result: BitrunningByteforgeCircuitboard

- type: latheRecipe
  parent: BaseCircuitboardRecipe
  id: BitrunningRecipeQuantumConsole
  result: BitrunningQuantumConsoleCircuitboard

- type: latheRecipe
  parent: BaseCircuitboardRecipe
  id: BitrunningRecipeNetpod
  result: BitrunningNetpodCircuitboard

# /obj/item/disk/bitrunning/item/mini_uzi (побочная награда островной потасовки)
- type: entity
  parent: BitrunningDiskBase
  id: BitrunningDiskMiniUzi
  name: снаряжение битраннинга — мини-узи
  components:
  - type: BitrunningDisk
    options:
    - name: bitrunning-option-mini-uzi
      items: [ WeaponSubMachineGunDrozd ]

# /datum/supply_pack/bitrunning: заказы NexaCache рейсом. Рынок не подключён ни к одной консоли — товар только из торгомата.
- type: cargoMarket
  id: BitrunningOrders

- type: entity
  parent: CrateGenericSteel
  id: CrateBitrunningDelivery
  name: ящик доставки битраннинга
  description: Заказ из торгомата NexaCache.
  components:
  - type: BitrunningDeliveryCrate

- type: cargoProduct
  id: CargoBitrunningDelivery
  icon:
    sprite: Imperial/Bitrunning/machines.rsi
    state: vendor
  product: CrateBitrunningDelivery
  cost: 0
  category: cargoproduct-category-name-cargo
  group: BitrunningOrders
