# Битраннинг: торгомат NexaCache, товары за очки, диски-программы и заклинания (objects/vendor.dm, orders/*.dm, objects/disks.dm).

# /obj/machinery/computer/order_console/bitrunning
- type: entity
  id: BitrunningVendor
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: торгомат NexaCache
  description: НексаКэш(ТМ)! Сомнительно аутентичное снаряжение для цифрового сорвиголовы. Оплата очками битраннинга со счёта ID-карты.
  components:
  - type: BitrunningVendor
  - type: Sprite
    sprite: Imperial/Bitrunning/machines.rsi
    layers:
    - state: vendor
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ActivatableUI
    key: enum.BitrunningVendorUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.BitrunningVendorUiKey.Key:
        type: BitrunningVendorBoundUserInterface
  - type: Machine
    board: BitrunningVendorCircuitboard
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container

- type: entity
  id: BitrunningVendorCircuitboard
  parent: BaseMachineCircuitboard
  name: плата торгомата NexaCache
  description: Плата торгомата снаряжения битраннеров.
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: BitrunningVendor
    stackRequirements:
      Glass: 1
      Steel: 3
      Cable: 2

