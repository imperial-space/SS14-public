# Битраннинг: ящики домена, голо-лестница, метки карт, предметы аватара.

# /obj/structure/closet/crate/secure/bitrunning/encrypted
- type: entity
  parent: CrateGeneric
  id: BitrunningEncryptedCache
  name: зашифрованный ящик
  description: Для открытия требуется расшифровать данные в убежище — доставьте его на пульсирующую клетку.
  components:
  - type: Icon
    sprite: Imperial/Bitrunning/crate.rsi
    state: bitrunning
  - type: Sprite
    sprite: Imperial/Bitrunning/crate.rsi
    layers:
    - state: bitrunning
      map: ["enum.StorageVisualLayers.Door"]
    - state: bitrunning
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
  - type: EntityStorageVisuals
    stateDoorOpen: bitrunningopen
    stateDoorClosed: bitrunning
  - type: Lock
    locked: true
  - type: BitrunningEncryptedCache
  - type: Destructible
    thresholds: []

# /obj/structure/closet/crate/secure/bitrunning/decrypted
- type: entity
  parent: CrateGeneric
  id: BitrunningDecryptedCache
  name: расшифрованный ящик
  description: Скомпилирован из виртуального домена. Награда за успешное прохождение битрана.
  components:
  - type: Icon
    sprite: Imperial/Bitrunning/crate.rsi
    state: bitrunning
  - type: Sprite
    sprite: Imperial/Bitrunning/crate.rsi
    layers:
    - state: bitrunning
      map: ["enum.StorageVisualLayers.Door"]
    - state: bitrunning
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
  - type: EntityStorageVisuals
    stateDoorOpen: bitrunningopen
    stateDoorClosed: bitrunning
  - type: BitrunningDecryptedCache

# /obj/item/storage/lockbox/bitrunning/encrypted
- type: entity
  parent: BaseItem
  id: BitrunningEncryptedCuriosity
  name: зашифрованная диковинка
  description: Небольшой контейнер с зашифрованными данными. Доставьте его на клетку расшифровки, чтобы получить побочную награду.
  components:
  - type: Sprite
    sprite: Objects/Storage/boxes.rsi
    state: box_of_doom
  - type: Item
    size: Normal
  - type: BitrunningEncryptedCache
    main: false

# /obj/item/storage/lockbox/bitrunning/decrypted
- type: entity
  parent: BoxCardboard
  id: BitrunningDecryptedCuriosity
  name: расшифрованная диковинка
  description: Побочная награда виртуального домена.
  components:
  - type: Sprite
    sprite: Objects/Storage/boxes.rsi
    state: box_of_doom

# Сертификат о прохождении домена.
- type: entity
  parent: Paper
  id: BitrunningCertificate
  name: сертификат о прохождении домена
  categories: [ HideSpawnMenu ]

# /obj/structure/hololadder
- type: entity
  id: BitrunningHololadder
  name: голо-лестница
  description: Абстрактное представление средства отключения от виртуального пространства. Нажмите на неё или встаньте на неё, чтобы отключиться.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Imperial/Bitrunning/hololadder.rsi
    state: hololadder
    drawdepth: FloorObjects
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        hard: false
        mask:
        - ItemMask
        layer:
        - SlipLayer
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.2
  - type: InteractionOutline
  - type: BitrunningHololadder
  - type: PointLight
    radius: 1.5
    energy: 1
    color: "#6496FA"

# ─── Метки карт доменов (obj/effect/landmark/bitrunning/*) ───
- type: entity
  abstract: true
  parent: MarkerBase
  id: BitrunningMarkerBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Bitrunning/effects.rsi

- type: entity
  parent: BitrunningMarkerBase
  id: BitrunningMarkerHololadder
  name: точка голо-лестницы
  components:
  - type: Sprite
    state: hololadder
  - type: BitrunningLandmark
    kind: Hololadder

- type: entity
  parent: BitrunningMarkerBase
  id: BitrunningMarkerPermanentExit
  name: постоянный выход
  components:
  - type: Sprite
    state: perm_exit
  - type: BitrunningLandmark
    kind: PermanentExit

# Клетка-цель остаётся видимой: сюда несут ящик.
- type: entity
  id: BitrunningMarkerGoal
  name: клетка расшифровки
  description: Под вашим взглядом пол едва заметно пульсирует потоками закодированных данных. Эта часть локации предназначена для получения зашифрованных данных.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Imperial/Bitrunning/effects.rsi
    state: goal
    drawdepth: FloorTiles
  - type: Clickable
  - type: BitrunningLandmark
    kind: Goal

- type: entity
  parent: BitrunningMarkerBase
  id: BitrunningMarkerCache
  name: место зашифрованного ящика
  components:
  - type: Sprite
    state: crate
  - type: BitrunningLandmark
    kind: Cache

- type: entity
  parent: BitrunningMarkerBase
  id: BitrunningMarkerCuriosity
  name: место диковинки
  components:
  - type: Sprite
    state: crate
  - type: BitrunningLandmark
    kind: Curiosity

- type: entity
  parent: BitrunningMarkerBase
  id: BitrunningMarkerLootSignal
  name: таинственная аура
  components:
  - type: Sprite
    state: crate
  - type: BitrunningLandmark
    kind: LootSignal

- type: entity
  parent: BitrunningMarkerBase
  id: BitrunningMarkerMobSegment
  name: модульный сегмент мобов
  components:
  - type: Sprite
    state: mob_segment
  - type: BitrunningLandmark
    kind: MobSegment

- type: entity
  parent: BitrunningMarkerBase
  id: BitrunningMarkerCrateReplacer
  name: перемешиватель ящиков
  components:
  - type: Sprite
    state: crate
  - type: BitrunningLandmark
    kind: CrateReplacer

# /obj/item/bitrunning_host_monitor
- type: entity
  parent: BaseItem
  id: BitrunningHostMonitor
  name: монитор хоста
  description: Сложная электронная система, которая анализирует работоспособность соединения между хостом и аватаром. Используйте в руке.
  components:
  - type: Sprite
    sprite: Imperial/Bitrunning/host_monitor.rsi
    state: host_monitor
  - type: Item
    size: Tiny
  - type: Clothing
    slots: [ belt ]
  - type: BitrunningHostMonitor

# Свет без сети для доменов (маленькая лампа).
- type: entity
  parent: PoweredSmallLight
  id: AlwaysPoweredSmallLight
  suffix: Always Powered
  components:
  - type: ApcPowerReceiver
    needsPower: false

