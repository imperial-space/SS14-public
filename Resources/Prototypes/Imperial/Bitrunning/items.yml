# /datum/outfit/job/bitrunner для аватара (слоты ушей, очков, перчаток, карманов и костюма снимаются кодом).
- type: startingGear
  id: BitrunnerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitCargo
    shoes: ClothingShoesColorBlack
    back: ClothingBackpack

# /datum/outfit/job/miner
- type: startingGear
  id: BitrunningMinerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitSalvageSpecialist
    shoes: ClothingShoesBootsWork
    back: ClothingBackpackSalvage

# ─── Тревоги аватара ───
- type: alert
  id: BitrunningDomainComplete
  clickEvent: !type:BitrunningSafeDisconnectAlertEvent
  icons:
  - sprite: Imperial/Bitrunning/effects.rsi
    state: goal
  name: alerts-bitrunning-complete-name
  description: alerts-bitrunning-complete-desc

- type: alert
  id: BitrunningShutdown
  icons:
  - sprite: Imperial/Bitrunning/effects.rsi
    state: glitch
  name: alerts-bitrunning-shutdown-name
  description: alerts-bitrunning-shutdown-desc

- type: alert
  id: BitrunningCrowbar
  icons:
  - sprite: Imperial/Bitrunning/effects.rsi
    state: glitch
  name: alerts-bitrunning-crowbar-name
  description: alerts-bitrunning-crowbar-desc

- type: alert
  id: BitrunningIntegrity
  icons:
  - sprite: Imperial/Bitrunning/effects.rsi
    state: glitch
  name: alerts-bitrunning-integrity-name
  description: alerts-bitrunning-integrity-desc

- type: alert
  id: BitrunningThreat
  icons:
  - sprite: Imperial/Bitrunning/effects.rsi
    state: redshift
  name: alerts-bitrunning-threat-name
  description: alerts-bitrunning-threat-desc

# simple_bodycam аватара (BITRUNNER_CAMERA_NET): видна на развлекательных экранах, пока сервер транслирует.
# Без WirelessNetworkConnection: беспроводная сеть не режет пакеты между картами.
- type: entity
  id: BitrunningAvatarBodycam
  name: нательная камера битраннера
  categories: [ HideSpawnMenu ]
  components:
  - type: Eye
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: SurveillanceCameraEntertainment
    transmitFrequencyId: SurveillanceCamera
  - type: SurveillanceCamera
    networkSet: true
    nameSet: true
    useEntityNameAsCameraId: true
  - type: BitrunningBodycam

# ─── Цели аватара в домене (меню персонажа, пока подключён) ───
- type: entity
  abstract: true
  id: BitrunningObjectiveBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Objective
    issuer: bitrunning-objective-issuer
    difficulty: 0
    unique: false

- type: entity
  parent: BitrunningObjectiveBase
  id: BitrunningObjectiveCache
  name: Найдите зашифрованный тайник
  components:
  - type: Objective
    icon:
      sprite: Imperial/Bitrunning/crate.rsi
      state: bitrunning
  - type: BitrunningObjectiveCondition
    kind: Cache

- type: entity
  parent: BitrunningObjectiveBase
  id: BitrunningObjectiveDeliver
  name: Доставьте тайник в убежище
  components:
  - type: Objective
    icon:
      sprite: Imperial/Bitrunning/hololadder.rsi
      state: hololadder
  - type: BitrunningObjectiveCondition
    kind: Deliver

- type: entity
  parent: BitrunningObjectiveBase
  id: BitrunningObjectiveCuriosity
  name: Соберите диковинки (по желанию)
  components:
  - type: Objective
    icon:
      sprite: Objects/Storage/boxes.rsi
      state: box_of_doom
  - type: BitrunningObjectiveCondition
    kind: Curiosity
