# /obj/effect/heretic_rune/big
- type: entity
  id: BitrunningHereticRune
  name: руна трансмутации
  description: Сюда приносят тела. Ритуал требует жертв.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Imperial/heretic/effects_96.rsi
    state: transmutation_rune
    drawdepth: FloorTiles
  - type: Clickable
  - type: BitrunningSacrificeRune

# ─── Гост-роли актёров доменов (spawners.dm) ───
- type: entity
  abstract: true
  parent: MarkerBase
  id: BitrunningGhostRoleBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - sprite: Imperial/Bitrunning/effects.rsi
      state: glitch

# Пляжный бомж (дружелюбный), обычный человек-скелет.
- type: entity
  parent: MobSkeletonPerson
  id: BitrunningBeachBum
  name: виртуальный пляжный бомж
  suffix: Битраннинг
  components:
  - type: Loadout
    prototypes: [ BitrunningBeachBumGear ]

- type: startingGear
  id: BitrunningBeachBumGear
  equipment:
    jumpsuit: ImperialClothingUniformPantsJeans
    eyes: ClothingEyesGlassesSunglasses
    shoes: ClothingShoesMartialSandals
    pocket1: FoodPizzaMargheritaSlice

- type: entity
  parent: BitrunningGhostRoleBase
  id: BitrunningGhostRoleBeach
  name: спящий виртуальный пляжный бомж
  components:
  - type: GhostRole
    name: bitrunning-ghost-beach-name
    description: bitrunning-ghost-beach-desc
    rules: bitrunning-ghost-actor-rules
    raffle:
      settings: short
  - type: GhostRoleMobSpawner
    prototype: BitrunningBeachBum

