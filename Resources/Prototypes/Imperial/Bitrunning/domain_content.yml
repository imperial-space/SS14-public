# Содержимое доменов (virtual_domain/domains/*.dm, spawners.dm, outfits.dm, modular_mob_segment.dm).

# ─── Снаряжение аватаров (forced_outfit) ───

# /datum/outfit/beachbum_combat: случайное оружие выдаётся вторым слотом руки (упрощено до пистолета).
- type: startingGear
  id: BitrunningBeachbumCombatGear
  equipment:
    jumpsuit: ImperialClothingUniformPantsJeans
    shoes: ClothingShoesMartialSandals
    back: ClothingBackpack
  inhand:
  - WeaponPistolMk58

# /datum/outfit/echolocator
- type: startingGear
  id: BitrunningEcholocatorGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorBlack
    gloves: ClothingHandsGlovesFingerless
    shoes: ClothingShoesBootsJack
    outerClothing: ClothingOuterCoatJensen
    back: ClothingBackpack

# /datum/outfit/bitductor
- type: startingGear
  id: BitrunningAbductorGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorBlack
    gloves: ClothingHandsGlovesFingerless
    shoes: ClothingShoesBootsJack
    back: ClothingBackpack

# /datum/outfit/job/virtual_domain_iceclimber
- type: startingGear
  id: BitrunningIceClimberGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorGrey
    shoes: ClothingShoesBootsWinter
    back: ClothingBackpackDuffel

# /datum/outfit/virtual_domain_heretic (фокус и маска безумия — амулет Луны еретика)
- type: startingGear
  id: BitrunningHereticGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorBlack
    shoes: ClothingShoesBootsJack
    back: ClothingBackpack

# ─── Ложный экипаж еретической охоты (/mob/living/basic/fake_crewman) ───
- type: entity
  abstract: true
  parent: MobHuman
  id: BitrunningFakeCrewBase
  components:
  - type: RandomHumanoidAppearance
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - Passive
  - type: NPCRetaliation
    attackMemoryLength: 30
  - type: HTN
    rootTask:
      task: SimpleHumanoidHostileCompound
  - type: BitrunningSacrifice
    points: 1

- type: startingGear
  id: BitrunningFakeAssistantGear
  parent: PassengerGear
  inhand:
  - ToolboxMechanicalFilled

- type: entity
  parent: BitrunningFakeCrewBase
  id: BitrunningFakeCrewAssistant
  name: член экипажа
  description: Как делишки, космонавтик?
  components:
  - type: Loadout
    prototypes: [ BitrunningFakeAssistantGear ]

- type: startingGear
  id: BitrunningFakeDoctorGear
  parent: DoctorGear
  inhand:
  - Saw

- type: entity
  parent: BitrunningFakeCrewBase
  id: BitrunningFakeCrewMd
  name: врач
  components:
  - type: Loadout
    prototypes: [ BitrunningFakeDoctorGear ]

- type: startingGear
  id: BitrunningFakeSecGear
  parent: SecurityOfficerGear
  inhand:
  - CombatKnife

# fake_crewman/sec: сразу враждебен.
- type: entity
