  name: старший инженер
  components:
  - type: Loadout
    prototypes: [ BitrunningFakeCeGear ]
  - type: BitrunningSacrifice
    points: 3

- type: startingGear
  id: BitrunningFakeHosGear
  parent: HoSGear
  inhand:
  - Stunbaton

- type: entity
  parent: BitrunningFakeCrewBase
  id: BitrunningFakeCrewHos
