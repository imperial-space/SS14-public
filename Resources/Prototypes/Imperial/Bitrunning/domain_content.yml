# ─── Модульные группы мобов ───
- type: entity
  parent: MobHuman
  id: BitrunningRevolutionary
  name: революционер
  description: Требует прав от Нанотрейзен. Невыгодно.
  suffix: Битраннинг
  components:
  - type: RandomHumanoidAppearance
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHumanoidHostileCompound
  - type: Loadout
    prototypes: [ BitrunningFakeAssistantGear ]

- type: entity
  parent: MobHuman
  id: BitrunningAbductorAgent
  name: агент абдукторов
  suffix: Битраннинг
  components:
  - type: RandomHumanoidAppearance
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHumanoidHostileCompound
  - type: Loadout
    prototypes: [ BitrunningAbductorAgentGear ]

- type: startingGear
  id: BitrunningAbductorAgentGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorBlack
    shoes: ClothingShoesBootsJack
    outerClothing: ClothingOuterArmorBasic
  inhand:
  - Stunbaton

- type: bitrunningMobSegment
  id: BitrunningSegmentSyndicateTeam
  mobs: [ MobSyndicateFootsoldier, MobSyndicateFootsoldierPilot ]
  probability: 0.85

- type: bitrunningMobSegment
  id: BitrunningSegmentAbductorAgents
  mobs: [ BitrunningAbductorAgent ]
  probability: 0.85

- type: bitrunningMobSegment
  id: BitrunningSegmentRevolutionary
  mobs: [ BitrunningRevolutionary ]
  probability: 0.85

- type: bitrunningMobSegment
  id: BitrunningSegmentHivebots
  mobs: [ MobHivebot, MobHivebotRanged ]
  probability: 0.85

- type: bitrunningMobSegment
  id: BitrunningSegmentHivebotsStrong
  mobs: [ MobHivebotStrong, MobHivebotRanged ]
  probability: 0.85

# /datum/modular_mob_segment/deer — оленя в SS14 нет, вместо него козёл.
- type: bitrunningMobSegment
  id: BitrunningSegmentDeer
  mobs: [ MobGoat ]
  max: 1
  probability: 0.85
