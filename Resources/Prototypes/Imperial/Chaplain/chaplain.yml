# Броня капеллана (chaplainsuit_armor): melee 50, bullet 10, laser 10, acid 80.
- type: entity
  abstract: true
  parent: ClothingOuterBase
  id: ClothingOuterImperialChaplainArmorBase
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.9
        Heat: 0.9
        Caustic: 0.2

- type: entity
  abstract: true
  parent: ClothingHeadBase
  id: ClothingHeadImperialChaplainHelmetBase
