# Роль и снаряжение капеллана — перенос из SS13 (BandaStation: chaplain.dm, chaplain_costumes.dm,
# chaplain_divine_archer.dm, choice_beacon.dm). Выдаётся командой makechaplain.

- type: npcFaction
  id: ImperialHoly

- type: entity
  parent: BaseAction
  id: ActionImperialPray
  name: imperial-religion-pray-action-name
  description: imperial-religion-pray-action-desc
  components:
  - type: Action
    icon: /Textures/Interface/pray.svg.png
  - type: InstantAction
    event: !type:ImperialPrayActionEvent {}

# ─── Снаряжение ──────────────────────────────────────────────────────────────

- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackImperialCultpack
  name: trophy rack
  description: It's useful for both carrying extra gear and proudly declaring your insanity.
  components:
  - type: Sprite
    sprite: Imperial/Chaplain/Back/cultpack.rsi
    state: icon
  - type: Item
    sprite: Imperial/Chaplain/Back/cultpack.rsi
  - type: Clothing
    sprite: Imperial/Chaplain/Back/cultpack.rsi

- type: entity
  parent: BaseItem
  id: HolyArmamentsBeacon
  name: armaments beacon
  description: Summon a set of standard issue chaplain armaments, as dictated by I.C.R.A.
  components:
  - type: Sprite
    sprite: Imperial/Chaplain/Devices/armaments_beacon.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Imperial/Chaplain/Devices/armaments_beacon.rsi
  - type: HolyArmamentsBeacon
  - type: UserInterface
    interfaces:
      enum.HolyArmamentsUiKey.Key:
        type: HolyArmamentsBoundUserInterface
  - type: ActivatableUI
    key: enum.HolyArmamentsUiKey.Key
    inHandsOnly: true
    requireActiveHand: false

# Облачения из шкафа капеллана SS13 (в SS14 ChapDrobe не трогаем — отдельная коробка).
- type: entity
  parent: BoxCardboard
  id: BoxImperialChaplainVestments
  name: chaplain's vestments box
  description: A box with the chaplain's ceremonial vestments.
  components:
  - type: Item
    size: Huge
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,19,9
  - type: StorageFill
    contents:
    - id: ClothingOuterImperialHolidayPriest
    - id: ClothingOuterNunRobe
    - id: ClothingHeadHatHoodNunHood
    - id: ClothingOuterImperialHabit
    - id: ClothingOuterImperialBishopRobe
    - id: ClothingOuterImperialMonkHabit
    - id: ClothingOuterImperialMonkRobeEast
    - id: ClothingOuterImperialWhiteRobe
    - id: ClothingOuterClownPriest
    - id: ClothingOuterImperialShrinehand

