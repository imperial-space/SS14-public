# Нулевой стержень капеллана и все формы святого оружия — перенос из SS13 (BandaStation, chaplain_nullrod.dm).
# Использование стержня в руке открывает радиальное меню: в нём все прототипы с NullRodVariant (chaplainSpawnable).

# ─── Базы ────────────────────────────────────────────────────────────────────

- type: entity
  id: NullRodWeaponBase
  parent: BaseItem
  abstract: true
  components:
  - type: ImperialAntimagic
  - type: NullRodCultKillTracker
  - type: NullRodCore
    banes:
    - whitelist:
        components:
        - Revenant
        - CultConstruct
      damage:
        types:
          Holy: 25
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 18
    soundHit:
      collection: GenericHit
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 10
  - type: Item
    size: Tiny

# Острое оружие: режущий урон, можно разделывать туши.
- type: entity
  id: NullRodBladeBase
  parent: NullRodWeaponBase
  abstract: true
  components:
  - type: Sharp
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 18
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg

# Клейморы: 30% шанс отбить удар ближнего боя, носятся на спине или поясе.
- type: entity
  id: NullRodClaymoreBase
  parent: NullRodBladeBase
  abstract: true
  components:
  - type: NullRodBlock
    chance: 0.3
  - type: Item
    size: Large
  - type: Clothing
    quickEquip: false
    slots:
    - Back
    - Belt

# ─── Нулевой стержень ────────────────────────────────────────────────────────

- type: entity
  id: NullRod
  parent: NullRodWeaponBase
  name: null rod
  suffix: Chaplain
  components:
  - type: Sprite
    sprite: Imperial/priest/null/nullrod.rsi
    state: icon
  - type: Item
    size: Tiny
    sprite: Imperial/priest/null/nullrod.rsi
  - type: Clothing
    quickEquip: false
    slots:
    - Belt
  - type: NullRod
  - type: NullRodVariant
    menuDescription: null-rod-menu-desc-nullrod
  - type: UserInterface
    interfaces:
      enum.NullRodUiKey.Key:
        type: NullRodBoundUserInterface
  - type: ActivatableUI
    key: enum.NullRodUiKey.Key
    inHandsOnly: true
    requireActiveHand: false

