# ── Коллекционные карты (cardpack): пакет вскрывается на 6 карт ──

- type: entity
  parent: BaseItem
  id: ImperialTcgCard
  name: коллекционная карта
  description: "Карта из коллекционной карточной игры. Соберите их все!"
  components:
  - type: Sprite
    sprite: Imperial/Vending/Cards/tcg.rsi
    state: card
  - type: Item
    size: Tiny
  - type: UplinkCard

- type: entity
  parent: BaseItem
  id: ImperialTcgCardPackSeries1
  name: пакет коллекционных карт «Серия 1»
  description: "Шесть карт разной редкости из базового набора 2560 года. Соберите их все!"
  components:
  - type: Sprite
    sprite: Imperial/Vending/Cards/tcg.rsi
    state: pack_series1
  - type: Item
    size: Tiny
  - type: SpawnItemsOnUse
    items:
    - id: ImperialTcgCard
      amount: 6
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: ImperialTcgCardPackSeries1
  id: ImperialTcgCardPackResin
  name: пакет коллекционных карт «Смоляной рубеж»
