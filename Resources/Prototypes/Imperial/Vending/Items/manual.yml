# Предметы торгоматов TG, собранные вручную.

- type: Tag
  id: ImperialMagazineGyrojet

- type: Tag
  id: ImperialCartridgeGyrojet

# ── Гироджет (.75): самоходная ракета, 50 урона и лёгкий взрыв ──

- type: entity
  parent: CartridgeMagnum
  id: ImperialCartridgeGyrojet
  name: гироджет-ракета (.75)
  description: "Самоходная ракета калибра .75 для гироджет-пистолета."
  components:
  - type: CartridgeAmmo
    proto: ImperialBulletGyrojet
  - type: Tag
    tags:
    - ImperialCartridgeGyrojet

- type: entity
  parent: BulletWeakRocket
  id: ImperialBulletGyrojet
  name: гироджет-ракета
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 50

# ── Химикаты гидропоники ──

- type: entity
  parent: BaseChemistryBottleFilled
  id: ImperialChemistryBottleAmmonia
  suffix: ammonia
  components:
  - type: Label
    currentLabel: reagent-name-ammonia
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: Ammonia
          Quantity: 30

- type: entity
  parent: BaseChemistryBottleFilled
  id: ImperialChemistryBottleDiethylamine
  suffix: diethylamine
  components:
  - type: Label
    currentLabel: reagent-name-diethylamine
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: Diethylamine
          Quantity: 30

- type: entity
  parent: BaseChemistryBottleFilled
  id: ImperialChemistryBottleSaltpetre
  suffix: saltpetre
  components:
  - type: Label
    currentLabel: reagent-name-imperial-saltpetre
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: Saltpetre
          Quantity: 30

# Культура Волшебнитиса (reagent_containers/cup/bottle/wizarditis).
- type: entity
  parent: ImperialDiseaseBottle
  id: ImperialDiseaseBottleWizarditis
  name: пробирка с культурой Волшебнитиса
  description: "Небольшая пробирка. Содержит культуру Rinsonticus magicae в синтетической крови."
  components:
  - type: ImperialDiseaseCulture
    disease: DiseaseWizarditis

# ── Игральные карты (toy/cards): колода тянется в руку, карта переворачивается ──

- type: entity
  abstract: true
  parent: BaseItem
  id: ImperialPlayingCardBase
  name: карта
  description: "Игральная карта."
  components:
  - type: Item
    size: Tiny
  - type: UplinkCard

- type: entity
  abstract: true
  parent: BaseItem
  id: ImperialPlayingCardDeckBase
  components:
  - type: Sprite
    layers:
    - state: full
      map: ["deck"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.UplinkCardDeckVisuals.State:
        deck:
          full: { state: full }
          half: { state: half }
          low: { state: low }
          empty: { state: empty }
  - type: Item
    size: Small

- type: entity
  parent: ImperialPlayingCardBase
  id: ImperialPlayingCardNanotrasen
  components:
  - type: Sprite
    sprite: Imperial/Vending/Cards/deck_nanotrasen.rsi
