# cocaine (Banda): стимулятор из листьев коки, снимает оглушение, передозировка (20) бьёт по здоровью.
- type: reagent
  id: Cocaine
  name: reagent-name-imperial-cocaine
  group: Narcotics
  desc: reagent-desc-imperial-cocaine
  physicalDesc: reagent-physical-desc-powdery
  flavor: bitter
  color: "#ffffff"
  metabolisms:
    Bloodstream:
      effects:
      - !type:MovementSpeedModifier
        walkSpeedModifier: 1.15
        sprintSpeedModifier: 1.15
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 1.5
        type: Remove
      - !type:ModifyKnockdown
        time: 1.5
        type: Remove
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Cocaine
          min: 20
        damage:
          types:
            Poison: 1
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Cocaine
          min: 20
