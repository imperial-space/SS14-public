# grey_bull: бодрит, снимает сонливость, охлаждает.
- type: reagent
  id: GreyBull
  name: reagent-name-imperial-grey-bull
  parent: BaseSoda
  desc: reagent-desc-imperial-grey-bull
  physicalDesc: reagent-physical-desc-fizzy
  flavor: imperialgreybull
  color: "#EEFF00"
  metabolisms:
    Digestion:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:Jitter
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: 2
        type: Remove
      - !type:AdjustTemperature
        amount: -2500

# monkey_energy: как grey_bull, только сильнее трясёт.
- type: reagent
  id: MonkeyEnergy
  name: reagent-name-imperial-monkey-energy
  parent: BaseSoda
  desc: reagent-desc-imperial-monkey-energy
  physicalDesc: reagent-physical-desc-fizzy
  flavor: imperialmonkeyenergy
  color: "#f39b03"
  metabolisms:
    Digestion:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:Jitter
        amplitude: 20
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: 2
        type: Remove
      - !type:AdjustTemperature
        amount: -2500

# wellcheers: клонит в сон и понемногу лечит ушибы.
- type: reagent
  id: Wellcheers
  name: reagent-name-imperial-wellcheers
