  physicalDesc: reagent-physical-desc-fizzy
  flavor: imperialwellcheers
  color: "#762399"
  metabolisms:
    Digestion:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: 1.5
      - !type:HealthChange
        damage:
          groups:
            Brute: -0.75

