  parent: BaseItem
  name: pumpkin portal
  description: A swirling pumpkin portal
  components:
  - type: Sprite
    sprite: /Textures/Effects/portal.rsi
    layers:
    - state: portal-blue
  - type: Anchorable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.0,-0.5,1.0,0.5"
        layer: 1
        mask: 1
  - type: Tag
    tags:
    - Halloween
  - type: HalloweenPortal

