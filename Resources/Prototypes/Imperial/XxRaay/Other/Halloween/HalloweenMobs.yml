      Dead:
        Base: dead
  - type: MobThresholds
    thresholds:
      0: Alive
      65: Dead
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
  - type: Gun
    fireRate: 0.666
    useKey: false
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: RechargeBasicEntityAmmo
    showExamineText: false
    rechargeCooldown: 1.5
    rechargeSound: null
  - type: BasicEntityAmmoProvider
    proto: ProjectilePumpkinLaser
    capacity: 1
    count: 1

- type: entity
  id: ProjectilePumpkinLaser
  name: pumpkin laser
  parent: BulletLaser
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Heat: 7

