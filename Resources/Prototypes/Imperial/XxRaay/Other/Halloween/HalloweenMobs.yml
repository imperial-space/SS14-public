  parent: MobHalloweenBase
  name: crystal pumpkin
  description: Boo!
  components:
  - type: Sprite
    sprite: Imperial/XxRaay/halloween/Crystal.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: crystal
  - type: DamageStateVisuals
    states:
