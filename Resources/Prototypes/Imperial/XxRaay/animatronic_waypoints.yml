## FNAF Event Waypoints (ghost-visible only)
- type: entity
  id: animatronic_waypoint_base
  abstract: true
  name: Animatronic Waypoint
  suffix: XxRaay, FNAF
  components:
  - type: Transform
  - type: MetaData
  - type: Visibility
    layer: 2
  - type: Sprite
    noRot: true
    sprite: Objects/Misc/module.rsi
    state: cpu_super
    drawdepth: Effects
  - type: AnimatronicWaypoint

- type: entity
  id: animatronic_waypoint_wp1
  parent: animatronic_waypoint_base
  name: Animatronic Waypoint WP1
  components:
  - type: AnimatronicWaypoint
    waypointId: WP1
    displayName: WP1

