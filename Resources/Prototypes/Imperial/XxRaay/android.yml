- type: reagent
  id: Thirium
  name: reagent-name-thirium
  group: Toxins
  desc: reagent-desc-thirium
  physicalDesc: reagent-physical-desc-glowing
  flavor: metallic
  color: "#4d7ee7"
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 1
        conditions:
        - !type:MetabolizerTypeCondition
          type: Android
          shouldHave: false
    Medicine:
      effects:
      - !type:ModifyBloodLevel
        amount: 1.3
        conditions:
        - !type:MetabolizerTypeCondition
          type: Android
          shouldHave: true
      - !type:HealthChange
        damage:
          types:
            Blunt: -0.5
            Slash: -0.5
            Piercing: -0.5
        conditions:
        - !type:MetabolizerTypeCondition
          type: Android
          shouldHave: true

