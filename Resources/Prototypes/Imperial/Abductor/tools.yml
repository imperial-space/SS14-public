- type: entity
  parent: [ BaseCrowbar, BaseMajorContraband ]
  id: CrowbarAbductor
  name: high-tech crowbar
  description: Made out of metal more durable than anything Nanotrasen could dream of.
  components:
  - type: Sprite
    sprite: Imperial/Abductor/Tools/crowbar.rsi
    state: abductor
  - type: Tool
    speedModifier: 2
    qualities:
      - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: PhysicalComposition
    materialComposition:
      Steel: 300
      Plastic: 100
  - type: StaticPrice
    price: 100

- type: entity
  name: high-tech wirecutter
  parent: [ BaseItem, BaseMajorContraband]
  id: WirecutterAbductor
  description: Cuts through wires like a hot knife through butter.
  components:
  - type: Sprite
    sprite: Imperial/Abductor/Tools/wirecutters.rsi
    state: abductor
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/wirecutter_drop.ogg
  - type: Tag
    tags:
    - PlantSampleTaker
    - Wirecutter
  - type: MeleeWeapon
    wideAnimationRotation: -90
    damage:
      types:
        Piercing: 4
    attackRate: 2
    soundHit:
      path: "/Audio/Items/wirecutter.ogg"
  - type: Tool
    qualities:
      - Cutting
    useSound:
      path: /Audio/Items/wirecutter.ogg
  - type: Item
    sprite: Imperial/Abductor/Tools/wirecutters.rsi
    storedRotation: -90
  - type: ToolTileCompatible
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: StaticPrice
    price: 30

- type: entity
  name: high-tech screwdriver
  parent: [ BaseItem, BaseMajorContraband ]
  id: ScrewdriverAbductor
  description: More efficient than anything Nanotrasen could dream of. Not to be confused with a sonic screwdriver.
  components:
  - type: Sprite
    sprite: Imperial/Abductor/Tools/screwdriver.rsi
    state: abductor
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/screwdriver_drop.ogg
  - type: Tag
    tags:
    - Screwdriver
  - type: Item
    sprite: Imperial/Abductor/Tools/screwdriver.rsi
    storedRotation: -90
  - type: MeleeWeapon
    wideAnimationRotation: -90
    attackRate: 1
    damage:
      types:
        Piercing: 8
    soundHit:
      path: "/Audio/Weapons/bladeslice.ogg"
  - type: Tool
    qualities:
      - Screwing
    useSound:
      collection: Screwdriver
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: StaticPrice
    price: 30

- type: entity
  name: high-tech wrench
  parent: [ Wrench, BaseMajorContraband ]
  id: WrenchAbductor
  description: Can take a bolt off in a single turn. Not intended for melee combat.
  components:
  - type: Sprite
    sprite: Imperial/Abductor/Tools/wrench.rsi
    state: abductor
  - type: Item
    sprite: Imperial/Abductor/Tools/wrench.rsi
    storedRotation: 45
    heldPrefix: abductor
    storedSprite:
      sprite: Imperial/Abductor/Tools/wrench.rsi
      state: abductor
  - type: Tool
    speedModifier: 2
    qualities:
      - Anchoring
    useSound:
      path: /Audio/Items/ratchet.ogg
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: StaticPrice
    price: 22

- type: entity
  name: high-tech welding tool
  parent: [ Welder, BaseMajorContraband ]
  id: WelderAbductor
  description: "A highly advanced welder capable of producing infinite fuel."
  components:
  - type: Sprite
    sprite: Imperial/Abductor/Tools/welder.rsi
    state: abductor
  - type: SolutionContainerManager
    solutions:
      Welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 1000
        maxVol: 1000
  - type: PointLight
    enabled: false
    radius: 1.5
    color: lightblue
  - type: SolutionRegeneration
    solution: Welder
    generated:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 10
  - type: Tool
    speedModifier: 2.0
    useSound:
      collection: Welder
    qualities: Welding


- type: entity
  name: high-tech multitool
  parent: [BaseItem, BaseMajorContraband]
  id: MultitoolAbductor
  description: A highly advanced hacking tool capable of viewing wire functionality. Can be used as Cryptographic sequencer in its alternate mode.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/multitool_drop.ogg
  - type: Item
    size: Small
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Plastic: 100
  - type: StaticPrice
    price: 56
  - type: Sprite
    sprite: Imperial/Abductor/Tools/multitool.rsi
    state: abductor
    layers:
      - state: abductor
  - type: Clothing
    sprite: Imperial/Abductor/Tools/multitool.rsi
    quickEquip: false
    slots:
    - Belt
  - type: UserInterface
    interfaces:
      enum.NetworkConfiguratorUiKey.List:
        type: NetworkConfiguratorBoundUserInterface
      enum.NetworkConfiguratorUiKey.Configure:
        type: NetworkConfiguratorBoundUserInterface
      enum.NetworkConfiguratorUiKey.Link:
        type: NetworkConfiguratorBoundUserInterface
  - type: Tag
    tags:
      - Multitool
      - DoorElectronicsConfigurator

- type: entity
  parent: [ ClothingBeltUtility, BaseMajorContraband ]
  id: ClothingAbductorBelt
  name:  alien belt
  description: Can hold various OUR things.
  components:
  - type: Sprite
    sprite: Imperial/Abductor/Tools/belt.rsi
  - type: Clothing
    sprite: Imperial/Abductor/Tools/belt.rsi
