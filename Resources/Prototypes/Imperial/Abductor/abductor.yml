- type: entity
  parent: MobHuman
  id: AbductorSolo
  suffix: Abductors, GhostRole, AbductorSoli
  name: Solo Abductor
  components:
    - type: Sprite
      netsync: false
      sprite: Markers/imperial_jobs.rsi
      state: deathsquad-icon
    - type: GhostRole
      name: abductor-solo-name
      description: abductor-solo-desc
      rules: abductor-solo-rules
      mindRoles:
      - MindRoleGhostRoleSoloAntagonist
      raffle:
        settings: default
    - type: GhostRoleMobSpawner
      prototype: AbductorSolo
    - type: Loadout
      prototypes: [ AgentAbductorLoadout ]
    - type: AutoImplant
      implants:
      - FreedomImplant
      - DeathAcidifierImplant
    - type: NpcFactionMember
      factions:
      - SimpleHostile

