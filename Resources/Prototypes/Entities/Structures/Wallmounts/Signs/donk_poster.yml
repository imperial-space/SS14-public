- type: entity
  parent: PosterBase
  id: PosterDonk
  name: "Донк!"
  description: "На плакате изображен донк пакет с нимбом над ним.Так же, на плакате есть надпись под пакетом:'Донк заботится о Вас,роботяги! Выпив кружку кофе и закусив разогретым,хрустящим и вкуснейшим Донк пакетом, Вы зарядите себя на продуктивный день без утомления и без желания уволится и пойти прокрастинировать!Только здоровое и полезное питание,только Донк!'"
  components:
  - type: Sprite
    sprite: Imperial\DonkEvent\donk_poster.rsi
    state: donk

- type: entity
  parent: PosterDonk
  id: PosterDonkCent
  name: "Рекомендация от больших людей"
  description: "На плакате изображен головной убор сотрудника ЦентКомма и рядом с ней надпись:'Употребив сей продукт,могу с точностью сказать, что моя реакция на отчёты снизилась с получаса на целые три секунды, а энергии прибавилось как от кофе и Я перестал толстеть!-Оператор Центрального Коммандованния"
  components:
  - type: Sprite
    state: donkcentc


- type: entity
  parent: PosterDonk
  id: PosterDonkWaffles
  name: "Напоминание о здоровом питании"
  description: "Взглянув на постер,Вы видите надпись на табличке снизу постера:'Употребляя вафли,вы не то что не насыщаете организм полезными веществами,так еще и употребляете несытную еду!Хватит издевательства над собой!Ешьте полезную,сбалансированную и наполненную энергией еду!'"
  components:
  - type: Sprite
    state: waffles