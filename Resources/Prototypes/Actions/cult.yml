# ==============================================
#  Культ Нар'Си  Кнопки действий (Blood Spells)
#  Иконки: Imperial/cult/action.rsi
#  Фон (bg_cult): задний фон всех action
# ==============================================

#  Commune (Общение с культом) 

- type: entity
  parent: BaseAction
  id: ActionCultCommune
  name: cult-action-commune-name
  description: cult-action-commune-desc
  components:
  - type: Action
    icon:
      sprite: Imperial/cult/action.rsi
      state: cult_comms
    background:
      sprite: Imperial/cult/action.rsi
      state: bg_cult
    useDelay: 5
  - type: InstantAction
    event: !type:CultCommuneActionEvent

